l_english:
  # --- Journal entries: the Eternal Crusade and the Summoning Pact
  je_ova_eternal_crusade: "The Eternal Crusade"
  je_ova_eternal_crusade_reason: "The Demonic Empire still exists. Therefore, according to Lux Aeternae, the [concept_ova_summoning_pact] must continue. Simple enough, right? The awkward part is that the demons worship the Goddess of Light too. They merely call Her the Ash Throne, the Rent Sky, or the Hollow Void. The Church has no interest in discussing that detail. After all, every frightened ruler who pays to summon a Hero fills the treasury, and every Hero from another world becomes living proof that the Goddess favors the crusade. Peace would ruin the entire arrangement. Unsurprisingly, the Church has decided that peace can wait."
  je_ova_eternal_crusade_status_active: "[ROOT.GetCountry.MakeScope.Var('ova_lux_hero_count').GetValue|v0] Heroes from other worlds now fight beneath our banner. As long as they remain, the Radiant Crusade still has its miracles."
  je_ova_eternal_crusade_status_none: "There is no otherworldly Hero beneath our banner right now. The Church is already waiting for the next petition."
  je_ova_eternal_crusade_complete_tt: "The #b Demonic Empire#! ceases to exist"
  je_ova_eternal_crusade_fail_tt: "The #b Demonic Empire#! is recognized among the nations of the world, or the Church stands exposed before it"

  je_ova_hero_summoning: "A Hero from Another World"
  je_ova_hero_summoning_reason: "The Church has performed the impossible and torn open the boundary between worlds. On the other side, some ordinary person was living an ordinary life. Now they are here, carrying the title of [concept_ova_hero] whether they asked for it or not. Use that power well and they may seize provinces, win plunder, or even bring back the Demon Lord's head. Use it badly and they will die in a foreign world. The Church, of course, will simply find another kingdom willing to pay for the next summoning."
  je_ova_hero_summoning_status_none: "No Hero serves us yet. The Church has the ritual ready. Naturally, it is also waiting for our money."
  je_ova_hero_summoning_status_injured: "Our Hero, #b [ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName]#!, is wounded. Adventures will have to wait until they can stand properly again."
  je_ova_hero_summoning_status_secluded: "Our Hero, #b [ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName]#!, is shut away in training. For now, there is no dragging them onto another adventure."
  je_ova_hero_summoning_status_active: "Our Hero, #b [ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName]#!, is ready. Whether that is good news for our enemies is another matter."
  je_ova_hero_summoning_complete_tt: "The #b Demonic Empire#! ceases to exist"
  je_ova_hero_summoning_fail_tt: "#b Lux Aeternae#! ceases to exist, the #b Demonic Empire#! is recognized, or the Church stands exposed before the world"
  ova_hero_perform_summoning_tt: "Summon a Hero from another world (level 0)."
  ova_hero_perform_summoning_better_tt: "Summon a Hero from another world (level 15)."

  je_ova_demonic_dawn: "The Demonic Dawn"
  je_ova_demonic_dawn_reason: "Eighteen centuries ago, one sword-stroke ended the Goddess War. It also drowned a continent, split the sky, and left this land beneath the Outer Gods' final curse. Trees turned scarlet. Rivers shone like red glass. The people themselves changed until those across the sea began calling them demons. But changing shape did not mean abandoning the Goddess. The horned and shadow tribes were once human, and the winged folk carried Her teachings before the modern Church even existed. In living memory, Lucifer Noctis, the man humans call the Demon Lord and his own people call the Uniter, forced those scattered tribes into a single empire. His enemy is not the Goddess of Light. The Ash Throne, the Rent Sky, and the Hollow Void are all names for Her. His enemy is the crusade that keeps carving pieces out of his homeland. Bladewaste, Garlehold, Conneland, Ruina, Newhold, and every province taken by another summoned Hero are all wounds the empire intends to close."
  je_ova_demonic_dawn_status: "For now, the tribes stand together. As long as foreign crowns still hold demon land, they have no shortage of reasons to do so."
  je_ova_demonic_dawn_complete_tt: "The #b Demonic Empire#! is recognized among the nations of the world"
  je_ova_demonic_dawn_reclaim_tt: "Every state of the demon homeland (the Demonland strategic region) is held by the #b Demonic Empire#! or by a crown sworn to it as a subject"

  # --- Victoria's arc: nine chapters, then the choice
  je_ova_victoria_1: "The Girl Who Fell Into a War (I)"
  je_ova_victoria_1_reason: "Victoria was a schoolgirl in a peaceful world. Then, without warning, she fell into ours and was declared a [concept_ova_hero] before she had even finished figuring out where she was. Her power is real. Unfortunately, so is the fact that she is fourteen, terrified, and impossibly far from home. Throwing her straight onto a battlefield would be insane. First, give her somewhere to belong. Build a [concept_ova_champion_hall] and activate all three support wings: Martial Training, Scholarly Tutelage, and Patronage. A Hero may become a legend eventually. For now, she needs a roof, teachers, and people who will not immediately ask her to kill someone."
  je_ova_victoria_1_status: "Victoria is still getting used to a world with the wrong number of moons. At least the masons and clerks know what they are doing."
  je_ova_victoria_1_complete_tt: "A #b Champion Hall#! stands with all three support wings active (Martial Training, Scholarly Tutelage, and Patronage each switched off their base program)"

  je_ova_victoria_2: "Saint Christine's Academy (II)"
  je_ova_victoria_2_reason: "Apparently being summoned as a Hero is not enough. The Church also has a school for them. Saint Christine's Academy offers four full years of doctrine, etiquette, demon anatomy, combat training, and a mountain of homework that nobody mentioned during the summoning ceremony. Enroll Victoria and see her through graduation. She will complain. Frequently. Still, beneath all that complaining, there is something she has missed more than she expected: being a student among other students again."
  je_ova_victoria_2_status_waiting: "The admission letter is sitting on her desk. Saint Christine's Academy is waiting for its most troublesome famous first-year."
  je_ova_victoria_2_status_studying: "Victoria is away at the Academy, somewhere between doctrine lectures, duelling practice, and wondering why another world still has homework."
  je_ova_victoria_2_complete_tt: "#b Victoria#! graduates from Saint Christine's Academy (a four-year course, begun with the Academy decision)"

  je_ova_victoria_3: "The Wall (III)"
  je_ova_victoria_3_reason: "Sooner or later, every talented fighter runs into the same problem. Talent stops being enough. Victoria has reached that wall. The Academy taught her the forms, but forms alone will not carry her forever. Activate #b Intensive Training#! on the Champion page and put her under masters who care more about fixing her mistakes than praising the famous Hero. Renown can wait. First, she needs to break through."
  je_ova_victoria_3_status_idle: "Victoria trains alone before sunrise and tells herself it is enough. She knows perfectly well that it is not."
  je_ova_victoria_3_status_training: "From first light to the final bell, the training yard keeps ringing. Painful as it is, the wall is finally starting to crack."
  je_ova_victoria_3_complete_tt: "#b Intensive Training#! is active for our Champion"

  je_ova_victoria_4: "Across the Scarred Line (IV)"
  je_ova_victoria_4_reason: "The border is calling for a Hero, and the Church expects Victoria to answer. Send her on a [concept_ova_expedition] into the #b Demonic Empire#!. Until now, the war has mostly been sermons, maps, and reports written by people far from the fighting. Seeing it herself will be different. Much different. Somewhere beyond the scarred border, fate is also preparing a meeting that no Church briefing bothered to mention."
  je_ova_victoria_4_status_home: "Victoria is still at the palace. The front remains something she has only heard about."
  je_ova_victoria_4_status_marching: "Victoria is marching into the demon lands beneath our banner. Whatever waits there, she will not come home seeing the war quite the same way."
  je_ova_victoria_4_complete_tt: "On a [concept_ova_expedition] into the #b Demonic Empire#!, #b Victoria#! meets the girl with the grey wings"

  je_ova_victoria_5: "The Ledger of Light (V)"
  je_ova_victoria_5_reason: "Victoria came back from the front with two things stuck in her head: the wounded, and a smiling clerk holding an invoice book. That combination is difficult to forget. Unfortunately, the Church does not open its records to an unknown foundling just because she asks nicely. Once Victoria is important enough to be admitted, send her through the veterans' wards and counting-houses. There, the holy war becomes numbers on a page. And numbers have a bad habit of revealing who is getting rich."
  je_ova_victoria_5_status_unknown: "The doors are still politely closed. The ledgers, by remarkable coincidence, are always somewhere else."
  je_ova_victoria_5_status_searching: "Victoria is famous enough now that fewer people can tell her to leave. So she has started reading the war like an accountant would."
  je_ova_victoria_5_complete_tt: "#b Victoria#! reads the Church's ledger"

  je_ova_victoria_6: "The Dusk Country (VI)"
  je_ova_victoria_6_reason: "Her doubts are no longer vague. Now Victoria wants answers. Send her on another [concept_ova_expedition] into the #b Demonic Empire#!. Each time she crosses the scarred border, the grey-winged girl finds her again. At first, their meetings were little more than temporary truces. Somehow, without either of them noticing when it happened, they have started looking more like friendship. If Victoria keeps going back, eventually the mysterious girl may even trust her with a name."
  je_ova_victoria_6_status_home: "There is no expedition into the Demonic Empire right now. Until Victoria returns, the dusk country keeps both its secrets and its strange new friendship."
  je_ova_victoria_6_status_marching: "Victoria has crossed into the dusk country again. This time, someone on the other side is actually waiting for her."
  je_ova_victoria_6_complete_tt: "On a further [concept_ova_expedition] into the #b Demonic Empire#!, the winged girl tells #b Victoria#! her name, freely given"

  je_ova_victoria_7: "The Midnight Archive (VII)"
  je_ova_victoria_7_reason: "The grey-winged girl's people sing the same hymns as the Church. They pray. They laugh. They give each other ordinary names. None of that fits what Victoria was taught. So she decides to check the oldest source she can find. Beneath the great cathedral is an archive holding texts from before generations of copyists 'corrected' them. Getting inside is another matter. An old archivist can be persuaded to misplace a key for one night, provided Victoria has enough [concept_ova_renown] to make the risk worthwhile. In other words, first become famous. Then bribe a priest and read forbidden books by candlelight. Hero work has become strangely complicated."
  je_ova_victoria_7_status_waiting: "The archive is still locked. More importantly, the archivist has not yet been given a reason to forget where he put the key."
  je_ova_victoria_7_status_reading: "Victoria is reading by candlelight in a room that very definitely was not meant for her."
  je_ova_victoria_7_complete_tt: "#b Victoria#! finds the word the copyists changed"

  je_ova_victoria_8: "The Long Road Back (VIII)"
  je_ova_victoria_8_reason: "The hidden page answers one question and creates several worse ones. The only place left to look is the dusk country itself. Keep sending Victoria on [concept_ova_expedition]s into the #b Demonic Empire#!. Officially, nothing has changed. She is still a Hero of Lysna, still carrying a sword into enemy territory, and still very good at defeating the empire's soldiers. Yet between skirmishes, something strange is happening. The black-glass court has learned her face. The grey-winged girl has become a real friend. And that friend, as it turns out, is not some ordinary soldier at all. She has a title, a father seated on an obsidian throne, and an invitation no human Hero was ever supposed to receive."
  je_ova_victoria_8_status_home: "Victoria is home between campaigns, restless as ever. Apparently the dusk country is not finished with her. She is not finished with it either."
  je_ova_victoria_8_status_marching: "Victoria is fighting in the dusk country again. By day she is still the empire's enemy. Off the battlefield, its court is starting to wonder whether the sermons got her wrong."
  je_ova_victoria_8_complete_tt: "Campaigning on [concept_ova_expedition]s into the #b Demonic Empire#!, #b Victoria#! receives an invitation no human has ever received"

  je_ova_victoria_9: "The Vault of Feathers (IX)"
  je_ova_victoria_9_reason: "The invitation is written on grey paper and sealed with a single feather. Aurelia is asking Victoria to enter the one place beneath the Obsidian Court where no human has ever been allowed: the Vault of Feathers. All Victoria has to do is accept. Deep below the court, names cover the walls beside the feathers of those who once carried them. There, Aurelia intends to explain everything from the beginning. Once Victoria hears the full truth, there will be no returning to the comfortable version of the world she knew before. A girl summoned from another world will have to decide what the word Hero actually means."
  je_ova_victoria_9_status_waiting: "The feather-sealed invitation is still sitting by Victoria's mirror. The only thing delaying the answer is Victoria herself."
  je_ova_victoria_9_status_inside: "Victoria has entered the Vault of Feathers. Aurelia has started at the very beginning."
  je_ova_victoria_9_complete_tt: "#b Victoria#! learns the whole truth (the hour of the Hero follows soon after)"

  je_ova_victoria_fail_tt: "#b Victoria#! has fallen, or the #b Radiant Crusade#! is no longer a living cause"
  je_ova_victoria_chain_fail_tt: "#b Victoria#! has fallen, the #b Demonic Empire#! has ceased to exist, or the #b Radiant Crusade#! is no longer a living cause, before her story could end"
  je_ova_victoria_2_fail_tt: "#b Victoria#! has fallen, the #b Demonic Empire#! or #b Saint Christine Academy#! has ceased to exist, or the #b Radiant Crusade#! is no longer a living cause, before her story could end"

  # --- The Dawn aftermath (rebellion path; these run on AUR, the Concord Aurorae)
  je_ova_dawn_1: "The War of the Dawn"
  je_ova_dawn_1_reason: "Victoria told the truth to the world. The world responded by starting a civil war. The marches followed her, while the old crown kept the capital, the Church's blessing, and the imperial name. Naturally, it also called Victoria a traitor and a puppet of heretics. Now there are two crowns claiming one realm, and this is not the sort of dispute that ends with a strongly worded letter. The Demonic Empire stands behind the new dawn. The Church stands behind the old lie. Finish the war and make sure Victoria's choice survives it."
  je_ova_dawn_1_status_war: "The old crown is still fighting beneath the imperial banner. Until that changes, the new dawn is only a promise."
  je_ova_dawn_1_status_quiet: "The old crown has finally run out of strength, or at least reasons to keep firing. The guns are cooling."
  je_ova_dawn_1_complete_tt: "The #b old crown#! of Lysna is annexed, at truce with us, or reconciled"

  je_ova_dawn_2: "Old Wounds, Open Air"
  je_ova_dawn_2_reason: "Exposing the lie did not magically erase the years people spent believing it. Separate benches still exist. Some shopkeepers still refuse customers with grey wings. Old laws still treat the winged folk as enemies because that was easier than admitting the truth. A proclamation cannot fix all of that overnight. Move beyond #b Racial Segregation#! and begin changing the country itself. The dawn only means something if ordinary people can actually live beneath it."
  je_ova_dawn_2_status: "The law still carries the shape of the old fear. Rewriting the words is only the first part."
  je_ova_dawn_2_complete_tt: "We adopt #b Cultural Exclusion#! or a more tolerant citizenship law"

  je_ova_dawn_3: "A Nation of Two Peoples"
  je_ova_dawn_3_reason: "The war is over, or at least quiet. The worst of the old laws are gone. In the marches where frightened colonies once stood, humans and winged folk are now trying to build one country together. It was supposed to be impossible. That makes succeeding all the more important. Raise this new nation to #b Great Power#! status and force the rest of the world to treat the dawn as something more than a temporary accident."
  je_ova_dawn_3_status: "The new dawn has survived. Now comes the troublesome part: making the rest of the world take it seriously."
  je_ova_dawn_3_complete_tt: "We become a #b Great Power#!"

  # --- Buttons
  ova_hero_summon_button: "Summon a Hero"
  ova_hero_summon_button_desc: "Petition the Church of the Goddess to tear the veil between worlds and draw forth a [concept_ova_hero] to champion our cause against the Demonic Empire."
  ova_hero_summon_effect_tt: "Pay Lux Aeternae for the summoning rite"
  ova_hero_crusade_required_tt: "The Radiant Crusade must still be a living cause"

  ova_victoria_ward_button: "Walk the Wards"
  ova_victoria_ward_button_desc: "Send Victoria down to the veterans' wards and the counting-houses behind them, and let her see what the crusade costs when nobody is composing a hymn about it. The Church receives Heroes, not foundlings: she must stand at #b Level 20#! before those doors open for her."
  ova_victoria_ward_effect_tt: "Victoria goes looking for the war's arithmetic"
  ova_victoria_ward_level_tt: "Victoria must be a Champion of at least #b Level 20#!: the wards do not open their books for a nobody"

  ova_victoria_archive_button: "Bribe the Archivist"
  ova_victoria_archive_button_desc: "Pay a tired old cleric to lose his keys for one night, so Victoria may read the Church's first editions before the copyists tidied them. He does not risk his post for nobodies: her [concept_ova_renown] must stand at #b 30#! or better. Costs #v @money![GetPlayer.MakeScope.ScriptValue('money_amount_multiplier_small')|0]#!, quietly, to a man who will spend it on wine."
  ova_victoria_archive_effect_tt: "Pay for one night alone with the oldest books"
  ova_victoria_archive_renown_tt: "Victoria's [concept_ova_renown] must be at least #b 30#!: the archivist does not lose his keys for a nobody"

  ova_victoria_vault_button: "Answer the Invitation"
  ova_victoria_vault_button_desc: "The wing-sealed letter offers Victoria the one thing no treaty ever has: the whole truth, told by a friend, in the Vault of Feathers beneath the Obsidian Court. Send her. Once she has heard it all, the girl from another world will decide what a Hero is for, and nothing about that decision will be small."
  ova_victoria_vault_effect_tt: "Victoria descends into the Vault of Feathers. What she learns there cannot be unlearned."

  # --- Decisions
  ova_hero_petition_summoning_decision: "Petition for a Hero"
  ova_hero_petition_summoning_decision_desc: "Join the Church's [concept_ova_summoning_pact] ourselves. In exchange for coin and deference to Lux Aeternae, we may summon our own [concept_ova_hero] from another world to champion us against the Demonic Empire, or simply against whichever neighbor the Church deems heretic enough this season."
  ova_hero_petition_relations_tt: "Our relations with Lux Aeternae must not be too poor"

  ova_hero_renounce_summonings_decision: "Renounce the Summonings"
  ova_hero_renounce_summonings_decision_desc: "Break faith with Lux Aeternae. No more Heroes will be summoned in our name, and the Church will not soon forgive the insult, but neither shall we go on paying its tithe for a war of its choosing."

  ova_hero_academy_decision: "Enroll at Saint Christine's Academy"
  ova_hero_academy_decision_desc: "Send our [concept_ova_hero] to Saint Christine's Academy, the Church's own finishing school for Heroes: a full #b four-year#! course of lectures, duels, and doctrine that leaves them wiser, if not always wiser about the right things. They will be away from court, and from every battlefield, until they graduate."

  ova_hero_war_brokerage_decision: "Broker the War"
  ova_hero_war_brokerage_decision_desc: "We need summon no Hero of our own to profit from the [concept_ova_eternal_crusade]. Arm both sides quietly enough and the war that must never end becomes the business that never stops paying, though the Demonic Empire will notice whose foundries fill its enemies' arsenals."

  # --- Game concepts
  concept_ova_hero: "Hero"
  concept_ova_hero_desc: "A Hero is an otherworlder [concept_ova_champion], summoned rather than chosen, born of the Church's rite rather than raised from our own people. They earn extra Renown for the wonder of their origin, and only a Hero may be sent campaigning against the Demonic Empire even without a shared border, where a mundane Champion could never make landfall."
  concept_ova_summoning_pact: "The Summoning Pact"
  concept_ova_summoning_pact_desc: "The pact binding a nation to Lux Aeternae's summoning rites: a petition decision, a [concept_ova_hero] drawn from another world at a price paid to the Church, and a renounce decision for those who tire of the arrangement. While bound, mundane Champion selection is closed. Only the Church's chosen may serve."
  concept_ova_eternal_crusade: "The Eternal Crusade"
  concept_ova_eternal_crusade_desc: "Lux Aeternae's holy war against the Demonic Empire, which the Church has no intention of ever letting end. While it endures: prestige for every living Hero summoned anywhere in the world, an unbreakable covenant locking the Radiant Crusade power bloc together, and no shortage of crowned heads willing to pay for one more miracle. It dies the day the world recognizes the empire it was raised to destroy, or the day the Church's oldest secret walks into the daylight."

  # --- War of the Dawn (rebellion path war goal + diplomatic play)
  ova_war_of_the_dawn: "The War of the Dawn"
  dp_ova_restoration: "$war_goal_ova_restoration_type_name$"
  dp_ova_restoration_tooltip: "#header Start a $dp_ova_restoration$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_ova_restoration_desc$"
  dp_ova_restoration_desc: "The sundering of Lysna admits no treaty and no half-measure: two crowns claim one realm, and the war ends only when one of them owns the whole of it, as a civil war ends."
  war_goal_ova_restoration_type_name: "Reunite the Sundered Realm"
  war_goal_ova_restoration_type_desc: "One realm, two crowns, and room for only one of them: the winner annexes the loser outright."
  war_goal_ova_restoration: "Reunite the Sundered Realm"
  war_goal_ova_restoration_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] annexes [WAR_GOAL_DRAFT.GetTarget.GetName] outright, reuniting the sundered realm beneath a single crown."
  war_goal_ova_restoration_sway_desc: "Try to win [WAR_GOAL_DRAFT.GetHolder.GetName] to your side by letting it reunite the sundered realm beneath its own crown."

  # --- AI strategies (loc beyond the spec's explicit list, matching vanilla
  # --- ai_strategy_*/_desc convention so diplomatic-acceptance tooltips and
  # --- the AI strategy debug list do not show a raw key)
  ai_strategy_ova_radiant_crusader: "Radiant Crusade"
  ai_strategy_ova_radiant_crusader_desc: "[COUNTRY.GetName] presses the Church's holy war against the Demonic Empire."
  ai_strategy_ova_demonic_reclamation: "Demonic Reclamation"
  ai_strategy_ova_demonic_reclamation_desc: "[COUNTRY.GetName] means to reclaim every border march the colonizers planted on demon land."
  ai_strategy_ova_loyalist_restoration: "Imperial Restoration"
  ai_strategy_ova_loyalist_restoration_desc: "[COUNTRY.GetName] fights to drag the seceded marches back beneath the old imperial crown."
  ai_strategy_ova_dawn_concord: "The Dawn Concord"
  ai_strategy_ova_dawn_concord_desc: "[COUNTRY.GetName] defends the dawn Victoria proclaimed, keeps faith with the Demonic Empire, and will not bow to the old crown again."

  # --- Religion-gated mundane champion selection: a light_orthodoxy nation must
