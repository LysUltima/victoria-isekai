 je_colonial_administration_button_expand_beastland_wild_desc: "We currently hold lands in [SCOPE.sStateRegion('beastland_wild_region_scope').GetStrategicRegion.GetName] that would be better administered by our colonial subject. If we have more than one colonial [concept_subject] in this [concept_strategic_region], they will be merged together."
