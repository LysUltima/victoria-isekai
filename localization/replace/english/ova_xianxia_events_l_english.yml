l_english:
  # --- .1 A Destined One Appears
  ova_xianxia.1.t: "A Destined One Appears"
  ova_xianxia.1.desc: "A youth stands at the mountain gate on whom the whole sky seems to lean. The gatekeepers cannot say why, only that they felt it before he spoke a word. The elders come out one by one, read the omens five different ways, and agree on nothing except that he is [concept_ova_destined_one], and that whichever sect turns such a one away will be a cautionary tale within the decade."
  ova_xianxia.1.flavor: "The heavens do not explain themselves. They simply drop a boy at a gate and wait to see what the sect does with him."
  ova_xianxia.1.a: "He hears a voice that counts the days."
  ova_xianxia.1.b: "He carries a little cauldron of no known make."
  ova_xianxia.1.c: "His ring speaks with the voice of a dead patriarch."
  ova_xianxia.1.d: "He weeps at gates he has never entered before."
  ova_xianxia.1.e: "He claims he has read how all of this ends."
  ova_xianxia.1.f: "Turn the omen away - the sect walks its own path."
  # --- .3 The Blood Lotus Blooms
  ova_xianxia.3.t: "The Blood Lotus Blooms"
  ova_xianxia.3.d: "The Matriarch of the Blood Lotus addresses the Covenant from her seat of woven bone and crimson petal: the Jade Throne rots on its cushion of borrowed years, and the lotus, patient as it has always been, drinks. Ghost Mountain, Shadow Fiend, and Nine Nether bow their heads and drink with her."
  ova_xianxia.3.f: "Every forbidden dao was named forbidden by someone else's law. The Blood Lotus has never much cared whose."
  ova_xianxia.3.a: "The Covenant drinks deep."
  # --- .4 The Mandate of the Jade Throne
  ova_xianxia.4.t: "The Mandate of the Jade Throne"
  ova_xianxia.4.d: "The Feng court proclaims, in the old formal script that has not changed in three dynasties, the suppression of the demonic path root and stem. Six sworn sects raise their banners at the reading. The carrion hills answer with silence, which is its own kind of reply."
  ova_xianxia.4.f: "A mandate is easy to proclaim. The lotus has survived a great many proclamations."
  ova_xianxia.4.a: "The court proclaims suppression."
  # --- .5 The Sects Take Sides
  ova_xianxia.5.t: "The Sects Take Sides"
  ova_xianxia.5.d: "Word reaches every hall, righteous and demonic alike, that the old quarrel between the Jade Throne and the carrion hills has stopped being a quarrel and started being [concept_ova_dao_war]. Elders who once debated the matter over tea now debate it over sword racks."
  ova_xianxia.5.f: "The jianghu has survived a hundred small wars. It has never once agreed on how many of them counted."
  ova_xianxia.5.a: "The sect takes its place in the dao war."
  # --- .10 The First Check-In
  ova_xianxia.10.t: "The First Check-In"
  ova_xianxia.10.d: "A voice that belongs to no throat he can find announces itself inside his skull, flat and unbothered, as if reading from a ledger: Day One. Reward: one spirit stone. He sits very still for a long moment, then goes looking for a place to spend it."
  ova_xianxia.10.f: "Most cultivators bleed for their first breakthrough. He got a receipt."
  ova_xianxia.10.a: "Accept the reward, and wait for Day Two."
  # --- .11 The Cauldron Wakes
  ova_xianxia.11.t: "The Cauldron Wakes"
  ova_xianxia.11.d: "The little cauldron - the pawnshop swore it was a fake, a curio, worth less than the copper it was cast from - swallows a chipped, rust-pitted sword he feeds it on a dare. It returns the blade an hour later, keener than anything in the sect armory and faintly warm to the touch."
  ova_xianxia.11.f: "No known make, the pawnshop had said. They were more correct than they knew."
  ova_xianxia.11.a: "Feed it something else, carefully this time."
  # --- .12 The Ring Speaks
  ova_xianxia.12.t: "The Ring Speaks"
  ova_xianxia.12.d: "A voice as dry as old parchment complains, from somewhere inside the plain iron ring on his finger, that modern sword manuals are written by people who have clearly never held a sword. He argues back before he thinks better of it. The ring seems pleased that he argued."
  ova_xianxia.12.f: "A dead patriarch's remnant soul makes for a demanding teacher. It also makes for the only teacher who has actually met the enemy he is training for."
  ova_xianxia.12.a: "Listen to the old man scold."
  # --- .13 Three Elders Not Yet Dead
  ova_xianxia.13.t: "Three Elders Not Yet Dead"
  ova_xianxia.13.d: "He kneels at the ancestral hall, out of long habit rather than any rite the sect taught him, and names three elders who have not yet died in this turning of the wheel - naming them with the particular care of a man checking a list he has read before and hopes, quietly, to change."
  ova_xianxia.13.f: "He died once at the end of this war. He would rather not watch these three die again along the way."
  ova_xianxia.13.a: "Keep the list, and say nothing more."
  # --- .14 What Chapter Is This
  ova_xianxia.14.t: "What Chapter Is This"
  ova_xianxia.14.d: "He asks a passing disciple, with careful casualness, what season this is and how long the sect master has held his seat - doing sums under his breath the whole time. When the numbers land, he goes pale and says nothing for the rest of the day."
  ova_xianxia.14.f: "He has read this book before. He did not expect to wake up inside chapter one."
  ova_xianxia.14.a: "Say nothing, and start reading the world instead."
  # --- .15 The Arrogant Young Master (chapter 2 beat)
  ova_xianxia.15.t: "The Arrogant Young Master"
  ova_xianxia.15.d: "A silk-robed young master of a greater clan crosses the market square, sneers at the newly issued inner-court robes, and demands - loudly, for the benefit of an audience - that our Destined One kneel and apologize for existing above his station. Face is a currency in the jianghu, and the young master has just tried to spend some of ours."
  ova_xianxia.15.f: "There is a particular kind of young master who exists, narratively speaking, to be humbled in a market square. This one has never read a story in his life."
  ova_xianxia.15.a: "Let him taste the floor."
  ova_xianxia.15.b: "Swallow the insult - for now."
  # --- .16 The Outer-Disciple Tournament (chapter 1 beat)
  ova_xianxia.16.t: "The Outer-Disciple Tournament"
  ova_xianxia.16.d: "The outer courtyard holds its yearly tournament, a churn of bruised pride and broken practice swords where every outer disciple gets one chance a year to be noticed by someone who matters. He is entered before he can decline."
  ova_xianxia.16.f: "Half the sect's legends started on this exact dirt. So did most of its forgotten failures."
  ova_xianxia.16.a: "Let him compete."
  ova_xianxia.16.b: "Keep him training instead."
  # --- .17 The Jealous Senior Brother (chapter 1 beat)
  ova_xianxia.17.t: "The Jealous Senior Brother"
  ova_xianxia.17.d: "The former first disciple, quietly demoted in all but title since the newcomer arrived, arranges what will be called, afterward, an accident at the sword cliffs. The stone that gives way beneath his junior's foot was loosened days in advance."
  ova_xianxia.17.f: "Jealousy in the jianghu rarely announces itself. It just loosens one particular stone, on one particular cliff, and waits."
  ova_xianxia.17.a: "Turn it back on him."
  ova_xianxia.17.b: "Let the elders hush it up."
  # --- .18 The Herb-Garden Incident (chapter 1 final beat)
  ova_xianxia.18.t: "The Herb-Garden Incident"
  ova_xianxia.18.d: "Assigned to the humblest chore in the sect - watering the herb garden - he empties something from his golden finger onto a withered spirit-root out of pure absent-mindedness. It blooms for the first time in a century, and the head gardener has to be physically restrained from weeping."
  ova_xianxia.18.f: "Every cheat eventually reveals itself over something this small. A voice, a cauldron, a ring, a memory, a book - none of them care whether the audience is watching."
  ova_xianxia.18.a: "Let the gardener sell the harvest."
  # --- .19 Whispers in the Sect (chapter 2 beat)
  ova_xianxia.19.t: "Whispers in the Sect"
  ova_xianxia.19.d: "The talk in the halls has a shape now: too fast, too lucky, too favored, for a disciple with his station and his years. Nobody says cheat out loud. Everybody is thinking it."
  ova_xianxia.19.f: "The jianghu forgives almost anything except being envied without explanation."
  ova_xianxia.19.a: "Let the sect master silence the talk."
  ova_xianxia.19.b: "Let envy sharpen him instead."
  # --- .20 The Check-In Jackpot (chapter 3 archetype rung)
  ova_xianxia.20.t: "The Check-In Jackpot"
  ova_xianxia.20.d: "The voice in his skull announces, with what might almost be pride, a festival bonus: one thousand consecutive days checked in, unbroken, and the reward reflects it. He has to sit down for a moment before he can process the number."
  ova_xianxia.20.f: "A thousand days of showing up is not, strictly speaking, a virtue. It is, apparently, a jackpot."
  ova_xianxia.20.a: "Claim the festival reward."
  # --- .21 The Cauldron Eats a Spirit Sword (chapter 3 archetype rung)
  ova_xianxia.21.t: "The Cauldron Eats a Spirit Sword"
  ova_xianxia.21.d: "A visiting elder's prized spirit blade, laid down for a moment at a banquet table, vanishes into the little cauldron before anyone can stop it. What comes back out, an hour of increasingly awkward silence later, is unmistakably the same sword and unmistakably better than it was."
  ova_xianxia.21.f: "There is no polite way to explain that your pet cauldron just ate a guest's family heirloom and improved it."
  ova_xianxia.21.a: "Return the improved blade."
  ova_xianxia.21.b: "Keep it, and apologize profusely."
  # --- .22 The Grandpa Remembers a Cave (chapter 3 archetype rung)
  ova_xianxia.22.t: "The Grandpa Remembers a Cave"
  ova_xianxia.22.d: "The ring hums, unprompted, as he passes near the northern cliffs one evening - the old patriarch remembering, across however many centuries separate them, a cache he sealed there in a life the sect has no record of. The seal breaks at a word only the ring seems to know."
  ova_xianxia.22.f: "A dead man's hoard is only a legend until someone with the right memory happens to be standing nearby."
  ova_xianxia.22.a: "Claim the old cache."
  # --- .23 The Granary He Remembered (chapter 3 archetype rung)
  ova_xianxia.23.t: "The Granary He Remembered"
  ova_xianxia.23.d: "He begs the sect stewards to move the grain stores a full month before any cloud promises rain, let alone a wind thick enough with locusts to strip a valley bare. Half the hall thinks him touched. He has not yet been wrong about anything."
  ova_xianxia.23.f: "In his first life, this granary burned with the harvest still inside it. He would rather not watch that happen twice."
  ova_xianxia.23.a: "Heed him, and move the grain."
  ova_xianxia.23.b: "Ignore him - the sky looks clear enough."
  # --- .24 The Chapter He Read (chapter 3 archetype rung)
  ova_xianxia.24.t: "The Chapter He Read"
  ova_xianxia.24.d: "He recognizes this exact banquet, this exact seating chart, down to the exact placement of the wine jars - chapter three hundred and forty-one, in the book this world was apparently built from. Someone at this table dies tonight, if the chapter holds."
  ova_xianxia.24.f: "He has read the book. He has never had to find out, until now, whether the book still applies."
  ova_xianxia.24.a: "Act on the plot as written."
  ova_xianxia.24.b: "Test whether the plot still holds."
  # --- .25 Day Seven (chapter 1 archetype rung, type 1)
  ova_xianxia.25.t: "Day Seven"
  ova_xianxia.25.d: "Seven days checked in, and the flat voice in his skull marks the occasion with its first streak bonus: a pouch of spirit stones that simply appears in his sleeve, warm as a stolen bun. He spends the evening deciding whether to be terrified or delighted, and settles, sensibly, on both."
  ova_xianxia.25.f: "The sect teaches that fortune must be earned drop by drop. The System teaches that fortune keeps office hours."
  ova_xianxia.25.a: "Sign in again tomorrow."
  # --- .26 The Practice Sword (chapter 1 archetype rung, type 2)
  ova_xianxia.26.t: "The Practice Sword"
  ova_xianxia.26.d: "Every outer disciple is issued the same practice sword: blunt, pitted, older than the instructor. His spends one night beside the little cauldron and comes back balanced like a calligrapher's brush. The weapons steward turns it over four times and finally asks, in a very small voice, where the rust went."
  ova_xianxia.26.f: "The cauldron does not explain what it refines or why. It simply disapproves of rust."
  ova_xianxia.26.a: "Practice harder, before anyone asks more questions."
  # --- .27 Midnight Corrections (chapter 1 archetype rung, type 3)
  ova_xianxia.27.t: "Midnight Corrections"
  ova_xianxia.27.d: "At midnight, in the breathing exercise every outer disciple performs badly, the ring interrupts: wrong. Again. Wrong. The seventeenth correction lands, his meridians open a width of one hair further than the manual says is possible, and the dry old voice permits itself one syllable of satisfaction."
  ova_xianxia.27.f: "The sect's manual was written for ten thousand disciples. The ring's corrections are written for exactly one."
  ova_xianxia.27.a: "Again, then. From the beginning."
  # --- .28 The Names of Winter (chapter 1 archetype rung, type 4)
  ova_xianxia.28.t: "The Names of Winter"
  ova_xianxia.28.d: "He tells the sect physician, quietly, which two woodcutters in the mortal village will be caught by the first avalanche of the season, and on which slope. He is a first-year outer disciple. The physician humors him and posts a warning sign anyway. The avalanche arrives on schedule; the woodcutters do not."
  ova_xianxia.28.f: "Foreknowledge spends most of its time being too small to boast about. Two names, one slope, one winter."
  ova_xianxia.28.a: "Heed whatever lists he keeps."
  ova_xianxia.28.b: "Coincidence. The mountain is full of avalanches."
  # --- .29 Chapter Twelve (chapter 1 archetype rung, type 5)
  ova_xianxia.29.t: "Chapter Twelve"
  ova_xianxia.29.d: "He recognizes the sequence the moment the stewards assign him to the manure detail: this is the humble-chores montage, chapter twelve, the part readers skim. He does the chores anyway, flawlessly, because he also remembers what the diligent background disciple in this chapter grows up to become."
  ova_xianxia.29.f: "Everyone skims the training chapters. He is the only person alive who knows they were the important ones."
  ova_xianxia.29.a: "Do the chores. Wait for chapter thirteen."
  # --- .30 The Yearly Check-In
  ova_xianxia.30.t: "The Yearly Check-In"
  ova_xianxia.30.d: "The System announces its annual settlement on schedule, as it always does: a flat, ledger-toned accounting of a year's worth of simply showing up, followed by a reward it never quite explains the reasoning behind."
  ova_xianxia.30.f: "Other cultivators chase enlightenment through blood, pill, and tribulation. He fills out an attendance record."
  ova_xianxia.30.a: "Claim it."
  # --- .40 The Banquet of a Hundred Sects (chapter 3 beat)
  ova_xianxia.40.t: "The Banquet of a Hundred Sects"
  ova_xianxia.40.d: "Every chair at the grand banquet is a small trap and every toast a probe, a hundred sects testing a hundred others under the cover of rice wine and courtesy. His cup is refilled rather more often than the etiquette strictly requires."
  ova_xianxia.40.f: "Face is given and lost faster at a banquet like this than in any duel. The wine only makes the arithmetic harder to follow."
  ova_xianxia.40.a: "Give face where face is due."
  ova_xianxia.40.b: "Humiliate a boastful core disciple with three words."
  # --- .41 The Clan Demands Satisfaction (chapter 4 beat)
  ova_xianxia.41.t: "The Clan Demands Satisfaction"
  ova_xianxia.41.d: "The slapped young master's grand-elder arrives at the gate with gifts balanced in one hand and, quite visibly, a coffin carried behind him in the other - a courtesy that is also, unmistakably, a threat. Years have passed since that day in the market square. The clan's memory, evidently, has not."
  ova_xianxia.41.f: "A grand-elder who brings a coffin to a negotiation has already decided how he expects it to go. He is not always right."
  ova_xianxia.41.a: "The Destined One answers the duel."
  ova_xianxia.41.b: "Pay reparations instead."
  # --- .42 A Dao Companion (chapter 5 beat)
  ova_xianxia.42.t: "A Dao Companion"
  ova_xianxia.42.d: "A sword cultivator who once fought him to an exhausted standstill seeks him out again after all these years, blade still sheathed, and proposes - plainly, without the courting rituals the elders would prefer - that they walk what remains of the road together. Above Soul Formation, the road is short and the company thin."
  ova_xianxia.42.f: "Some dao companions are chosen for lineage. This one was chosen because nobody else ever made him work that hard."
  ova_xianxia.42.a: "Accept."
  ova_xianxia.42.b: "The dao of the heart can wait."
  # --- .43 Poison in the Wine (chapter 4 beat)
  ova_xianxia.43.t: "Poison in the Wine"
  ova_xianxia.43.d: "An infiltrator of the enemy path slips something colorless into the victory toast, timed for the exact moment every eye in the hall is on the cup rather than the pourer. Whatever happens next happens very quickly."
  ova_xianxia.43.f: "The jianghu has a saying about poisoned wine: it only works once per drinker, and only if nobody at the table remembers the smell."
  ova_xianxia.43.a: "The ring flares."
  ova_xianxia.43.b: "He sweats it out through his meridians."
  ova_xianxia.43.c: "The taster dies in his place."
  # --- .44 The Auction of the Nameless Relic (pool)
  ova_xianxia.44.t: "The Auction of the Nameless Relic"
  ova_xianxia.44.d: "A rusted hairpin, filthy and unremarkable, comes up on the auction block with no provenance the appraisers can agree on. Most of the hall has already lost interest and moved on to the next lot."
  ova_xianxia.44.f: "Nobody in the room can appraise the hairpin. One of them, quietly, already knows exactly what chapter it belongs to."
  ova_xianxia.44.a: "Buy it at any price."
  ova_xianxia.44.b: "Bid modestly."
  ova_xianxia.44.c: "Let it pass."
  # --- .45 Rumor of a Secret Realm (pool)
  ova_xianxia.45.t: "Rumor of a Secret Realm"
  ova_xianxia.45.d: "A wandering cultivator, three cups deep at the sect teahouse, swears a fold of spirit-rich land has opened somewhere in the domain - a secret realm, sealed since some forgotten age, waiting for a [concept_ova_destined_one] with the nerve to enter it."
  ova_xianxia.45.f: "Every generation has a secret realm rumor. Most of them are lies. This sect can, if it dares, go find out which kind this one is."
  ova_xianxia.45.a: "Note the rumor for later."
  # --- .50 Duel of Destinies
  ova_xianxia.50.t: "Duel of Destinies"
  ova_xianxia.50.d: "Word arrives, carried by a courier who plainly enjoyed delivering it: another sect hosts a Destined One of its own, and that Destined One has taken an interest in ours. Two protagonists, the jianghu has always said, cannot share one sky for long."
  ova_xianxia.50.f: "The heavens rarely explain why they scatter more than one hero across the same generation. They have never once apologized for it either."
  ova_xianxia.50.a: "Heaven decides."
  ova_xianxia.50.b: "Exchange pointers only."
  # --- .51 The Rivals Provocation
  ova_xianxia.51.t: "The Rivals Provocation"
  ova_xianxia.51.d: "The rival Destined One humiliates our envoys openly at a border market, a calculated insult meant to be seen and repeated - his face grows a little larger with every retelling, and ours shrinks to match."
  ova_xianxia.51.f: "Face lost at a border market travels faster than any courier. By nightfall every teahouse in the jianghu has heard some version of it."
  ova_xianxia.51.a: "Answer in kind."
  ova_xianxia.51.b: "Endure."
  # --- .52 An Accord Between Protagonists
  ova_xianxia.52.t: "An Accord Between Protagonists"
  ova_xianxia.52.d: "Rather than crossing blades, the two Destined Ones meet quietly over wine at a neutral teahouse and find, to the visible relief of both retinues, that they would rather not be the reason the other dies before his story finishes."
  ova_xianxia.52.f: "Two protagonists sharing one sky is supposed to be a tragedy waiting to happen. Sometimes it is just two tired young cultivators who would rather have an ally."
  ova_xianxia.52.a: "An accord."
  ova_xianxia.52.b: "There is only one protagonist."
  # --- .55 Skirmish at the Carrion Hills
  ova_xianxia.55.t: "Skirmish at the Carrion Hills"
  ova_xianxia.55.d: "Border blades clash again where the qi of the land has long since run foul, neither side willing to hold the carrion hills and neither willing to let the other have them uncontested. It is a small fight. It is never only a small fight."
  ova_xianxia.55.f: "The carrion hills earned their name from a war nobody now living remembers starting. They have been earning it again ever since."
  ova_xianxia.55.a: "Reinforce."
  ova_xianxia.55.b: "Cede the hills."
  # --- .56 The Listener in the Walls
  ova_xianxia.56.t: "The Listener in the Walls"
  ova_xianxia.56.d: "A spy of the enemy path is caught, at last, crouched behind a false panel in the sect archive with three months of correspondence copied in a careful, patient hand. The question of what to do with him falls, as it always does, to whoever found him first."
  ova_xianxia.56.f: "Every archive worth guarding eventually grows a listener in its walls. The trick is finding him before he finds everything worth hearing."
  ova_xianxia.56.a: "Execute."
  ova_xianxia.56.b: "Turn him."
  # --- .57 The Blood Cavalry Raids
  ova_xianxia.57.t: "The Blood Cavalry Raids"
  ova_xianxia.57.d: "The Covenant's blood cavalry rides at moonless dark, corpse-pale banners trailing, and falls on a righteous sect's outer villages before the watch fires can even be lit. The night runs red, and the survivors are left to carry word of it home."
  ova_xianxia.57.f: "The demonic path has never needed daylight to do its work. It has simply never much cared for the sight of what it leaves behind."
  ova_xianxia.57.a: "Let the blood cavalry ride home in triumph."
  # --- .58 The Righteous Expedition Musters
  ova_xianxia.58.t: "The Righteous Expedition Musters"
  ova_xianxia.58.d: "Incense burns before the war shrines and oaths are spoken again, sect banner beside imperial banner, before an expedition musters to press the war back toward the carrion hills. Old rivalries are set aside for exactly as long as the incense burns."
  ova_xianxia.58.f: "An alliance of rivals still points its blades outward, for now. That has always been enough to matter."
  ova_xianxia.58.a: "Contribute blades."
  ova_xianxia.58.b: "Prayers only."
  # --- .60 The Secret Realms Heart
  ova_xianxia.60.t: "The Secret Realms Heart"
  ova_xianxia.60.d: "The fold of spirit-rich land holds exactly what the rumor promised and more: a chamber untouched since whatever age sealed it, its treasures waiting patiently for someone with the nerve to actually walk in and take them."
  ova_xianxia.60.f: "Not every secret realm rumor is a lie. This one, at least, told the truth."
  ova_xianxia.60.a: "Take the realms heart."
  # --- .61 The Secret Realms Teeth
  ova_xianxia.61.t: "The Secret Realms Teeth"
  ova_xianxia.61.d: "The fold of spirit-rich land bites back before it gives anything up - a ward, a trap, a guardian beast none of the old records mentioned. He crawls out of the realm bruised, humbled, and, notably, alive."
  ova_xianxia.61.f: "Survival teaches lessons no manual bothers to write down. This one is usually written in bruises."
  ova_xianxia.61.a: "Crawl out and recover."
  # --- .62 The Heavenly Tribulation
  ova_xianxia.62.t: "The Heavenly Tribulation"
  ova_xianxia.62.d: "The sky above the mountain turns the color of a bruise on a cloudless afternoon, and nine layers of lightning stack silently above the peak - the sign the old texts call [concept_ova_heavenly_tribulation]. He must stand in the open and answer it, or let the sign pass him by. Whatever he forged and whatever he gathered, he carries into the circle now."
  ova_xianxia.62.f: "The heavens do not ask twice. A tribulation refused rarely offers itself again."
  ova_xianxia.62.a: "He steps into the open."
  # --- .63 The Realm Breaks Open (chapter completion celebration)
  ova_xianxia.63.t: "The Realm Breaks Open"
  ova_xianxia.63.d: "It happens the way the manuals promise and the way nothing else in life does: a wall that stood for years is simply not there one morning. Qi moves through channels that did not exist the night before, the courtyard smells briefly of rain on hot stone, and the elders, who have seen many breakthroughs, still stop what they are doing to watch this one."
  ova_xianxia.63.f: "Every realm is a door. The jianghu measures a cultivator not by the doors ahead of him, but by the sound the last one made when it opened."
  ova_xianxia.63.a: "Incense for the ancestors, and back to work."
  # --- .64 The Grand Competition
  ova_xianxia.64.t: "The Grand Competition"
  ova_xianxia.64.d: "The gates are thrown open and every sect, wandering cultivator, and hungry junior in the jianghu descends on the grounds to compete for glory and face. It costs a season of treasury to stage properly. A well-run competition is remembered for a generation."
  ova_xianxia.64.f: "Half the jianghu's rivalries were born at competitions exactly like this one. So were most of its unlikely friendships."
  ova_xianxia.64.a: "Host the competition."
  # --- .65 The Gate of Heaven Opens
  ova_xianxia.65.t: "The Gate of Heaven Opens"
  ova_xianxia.65.d: "What is left when the thunder finally clears is not quite a man and not yet a god - something in between, standing very still at the center of a scorched circle of stone, looking at his own hands as though they belonged to someone else. The sect kneels. The mountain, for once, says nothing at all."
  ova_xianxia.65.f: "Every tale of ascension ends the same way it begins: with someone standing very still, wondering what comes next."
  ova_xianxia.65.a: "Let him stand, and let the tale close."
  # --- .66 The Half-Worn Jade Slip (secret manual decision)
  ova_xianxia.66.t: "The Half-Worn Jade Slip"
  ova_xianxia.66.d: "The jade slip arrives wrapped in three layers of silk and one of skepticism: half its strokes worn to nothing, its title lost, its price outrageous. Whatever manual it once held was written by someone whose realm the appraisers refuse to guess at out loud. The missing half is the whole problem, and the whole prize."
  ova_xianxia.66.f: "Every sect library has one shelf of manuals nobody can read. Every century or so, somebody reads one."
  ova_xianxia.66.a: "The cauldron refines the slip itself, and the strokes return."
  ova_xianxia.66.b: "The grandpa knew the author. He is still annoyed with him."
  ova_xianxia.66.c: "The Reader has read the unabridged edition."
  ova_xianxia.66.d2: "A hundred nights of study, the honest way."
  # --- .67 Forging the Natal Weapon
  ova_xianxia.67.t: "Forging the Natal Weapon"
  ova_xianxia.67.d: "Star-iron on the anvil, spirit-vein fire in the forge pit, and seven days in which nobody in the sect sleeps properly. On the seventh night the blade drinks his core fire and takes its first breath with a sound like a bell rung underwater. It will answer no other hand as long as he lives."
  ova_xianxia.67.f: "A cultivator who means to argue with the heavens should not do it holding borrowed steel."
  ova_xianxia.67.a: "The cauldron does the smelting, and does it better."
  ova_xianxia.67.b: "Seven days at the star-forge, the old way."
  # --- .68 Treasures Against the Thunder
  ova_xianxia.68.t: "Treasures Against the Thunder"
  ova_xianxia.68.d: "The buyers return from every auction house in the jianghu with the strangest shopping list the stewards have ever settled: lightning-ward talismans by the bundle, a beam of thunder-bathed wood, and a cracked turtle shell the appraisers swear predates the sect itself. Piled together in the treasury, the lot of it hums faintly before every storm."
  ova_xianxia.68.f: "The heavens count what a challenger carries into the open. They have never once been impressed by empty hands."
  ova_xianxia.68.a: "He remembers where a lightning-ward is buried."
  ova_xianxia.68.b: "The System, unprompted, marks the price down."
  ova_xianxia.68.c: "Pay what the auction houses ask."
  # --- .70 The Lotus Devours the Sun
  ova_xianxia.70.t: "The Lotus Devours the Sun"
  ova_xianxia.70.d: "The Jade Throne is a planter now, and something red and patient grows in it. The nine righteous banners are folded away or burned outright, and the carrion hills, for the first time in living memory, are not the frontier - they are the center."
  ova_xianxia.70.f: "The lotus never promised the world it would be kind if it won. Nobody who bowed to it ever expected that it would be."
  ova_xianxia.70.a: "The Covenant claims its throne."
  # --- .71 The Orthodox Dawn
  ova_xianxia.71.t: "The Orthodox Dawn"
  ova_xianxia.71.d: "The lotus burns at last, root and stem, and the carrion hills fall quiet for the first time in a generation. By nightfall the victory banquet has already dissolved into nine sects arguing cheerfully about precedence at the high table."
  ova_xianxia.71.f: "Orthodoxy restored turns out to look, from the inside, a great deal like nine old rivals squabbling over the good seats."
  ova_xianxia.71.a: "Let the sects argue over precedence."
  # --- .72 The Destined One Falls
  ova_xianxia.72.t: "The Destined One Falls"
  ova_xianxia.72.d: "The heavens misdeal sometimes. He falls, as any cultivator can fall, and the tale the whole jianghu had begun telling about him stops mid-sentence, unfinished, with the ending nobody had planned for."
  ova_xianxia.72.f: "Not every story earns its ending. This one just earns a quiet hall, and a great deal of grief that has nowhere left to go."
  ova_xianxia.72.a: "Mourn him, and carry on."
  # --- .80 The Streak Unbroken
  ova_xianxia.80.t: "The Streak Unbroken"
  ova_xianxia.80.d: "Sat down and asked plainly what the voice shows him now, he closes his eyes, listens to a tally only he can hear, and reports back - spirit stones banked, insight earned, or some fame quest quietly completed without anyone noticing it had started."
  ova_xianxia.80.f: "He answers slowly, and not always to the sect's liking. The ledger in his head does not care what anyone wants to hear."
  ova_xianxia.80.a: "Hear the tally."
  # --- .81 Feeding the Cauldron
  ova_xianxia.81.t: "Feeding the Cauldron"
  ova_xianxia.81.d: "Asked what his little cauldron shows him now, he shrugs and offers to simply feed it something and see. The elders, against their better judgment, agree to watch."
  ova_xianxia.81.f: "It has never once explained how it refines what it eats. It has also never once been wrong about what comes out worth more."
  ova_xianxia.81.a: "Feed it the treasury dross."
  ova_xianxia.81.b: "Feed it something dangerous."
  # --- .82 The Grandpas Lesson
  ova_xianxia.82.t: "The Grandpas Lesson"
  ova_xianxia.82.d: "Asked what the ring shows him now, he sighs, because the old patriarch is already scolding him for a stance he has not even taken yet. One lesson later, delivered in a voice that has not softened in several centuries, he understands considerably more than he did an hour ago."
  ova_xianxia.82.f: "A dead man's patience runs longer than a living man's, if only because he has nothing left to spend it on but teaching."
  ova_xianxia.82.a: "Take the lesson."
  # --- .83 Consulting His Memories
  ova_xianxia.83.t: "Consulting His Memories"
  ova_xianxia.83.d: "Asked what he remembers of the years still to come, he sits with it a while before answering - sometimes a name, sometimes a number, sometimes only the shape of a war he has already lived through once."
  ova_xianxia.83.f: "Foreknowledge is not the same as certainty. He has learned, the hard way, that the second life does not always run parallel to the first."
  ova_xianxia.83.a: "Listen to what he remembers."
  # --- .84 Consulting the Plot
  ova_xianxia.84.t: "Consulting the Plot"
  ova_xianxia.84.d: "Asked what chapter this is, he thinks about it longer than usual before answering - the book he read is starting, in small and larger ways, to diverge from what actually happens here."
  ova_xianxia.84.f: "He preempts a face-slapping scene before it happens. The book is wrong about this world now. He writes his own chapter instead."
  ova_xianxia.84.a: "Consult the plot."
  # --- .85 The Hundred-Year Settlement (chapter 5 archetype rung, type 1)
  ova_xianxia.85.t: "The Hundred-Year Settlement"
  ova_xianxia.85.d: "The voice announces, with unusual ceremony, a settlement it has apparently been saving: the accumulated interest of every day ever checked in, compounded. The reward manifests in the treasury courtyard over the course of an afternoon and requires two additional storehouses. The stewards stop asking questions somewhere around the third cartload."
  ova_xianxia.85.f: "Diligence, it turns out, was the real cultivation all along. The System has been keeping the receipts."
  ova_xianxia.85.a: "Accept the settlement with a straight face."
  # --- .86 The Tribulation Elixir (chapter 5 archetype rung, type 2)
  ova_xianxia.86.t: "The Tribulation Elixir"
  ova_xianxia.86.d: "Fed a decade of hoarded rarities in a single night, the little cauldron labors until dawn and produces exactly one pill: pearl-white, thunder-scented, and humming with something that makes every hair on every arm in the room stand up. The old alchemists agree on what it must be, and refuse to say the name out loud indoors."
  ova_xianxia.86.f: "A tribulation elixir cannot stop the lightning. It can only make sure there is still someone standing where the lightning aimed."
  ova_xianxia.86.a: "Seal the pill against the day of thunder."
  # --- .87 The Last Borrowing (chapter 5 archetype rung, type 3)
  ova_xianxia.87.t: "The Last Borrowing"
  ova_xianxia.87.d: "Assassins of the enemy path come for him on a moonless night, and for the space of thirty breaths it is not the boy who answers them - the ring flares, the old patriarch borrows his body one final time, and three centuries of swordsmanship walk the courtyard in a junior disciple's robes. Afterward the ring is quieter than it has ever been, as if the effort spent something that does not come back."
  ova_xianxia.87.f: "The old man taught him everything in scoldings and corrections. The last lesson he taught in person."
  ova_xianxia.87.a: "Carry what the old man left."
  # --- .88 The Edge of Memory (chapter 5 archetype rung, type 4)
  ova_xianxia.88.t: "The Edge of Memory"
  ova_xianxia.88.d: "He wakes one morning and realizes he has outlived his own first life: from this day forward, nothing that happens has happened before. The maps in his head end here, at the edge of a country he died before reaching. He tells no one, and stands a long while at the window, watching a future he has never read."
  ova_xianxia.88.f: "The Returner's gift was never the memory. It was the fifty years of practice at surviving without one."
  ova_xianxia.88.a: "Walk into the unwritten years."
  # --- .89 The Final Chapter (chapter 5 archetype rung, type 5)
  ova_xianxia.89.t: "The Final Chapter"
  ova_xianxia.89.d: "He turns the last page he ever read - the book was still being serialized when he left that other world, and its final chapter ends exactly here, mid-scene, on an unresolved cliffhanger he has been dreading for years. Whatever happens next, no reader anywhere knows it. He finds, to his surprise, that he is smiling."
  ova_xianxia.89.f: "He spent half a life afraid of the plot. The plot, it turns out, was afraid of running out first."
  ova_xianxia.89.a: "Write the next chapter by living it."
  # --- .100 Sweeping the Ten Thousand Steps (chapter 1 opener)
  ova_xianxia.100.t: "Sweeping the Ten Thousand Steps"
  ova_xianxia.100.d: "The newest outer disciple is issued one broom, one set of grey robes, and ten thousand stone steps that must be swept before dawn bell. Somewhere around the four-thousandth step, between one breath and the next, he feels it for the first time: a thin silver thread of qi, moving when he moves. He sweeps the remaining six thousand steps without noticing them at all."
  ova_xianxia.100.f: "Every immortal in every record began as somebody's broom-holder. The records are strangely quiet about the brooms."
  ova_xianxia.100.a: "Breathe in. Hold. Sweep."
  # --- .101 Robes of the Inner Court (chapter 2 opener)
  ova_xianxia.101.t: "Robes of the Inner Court"
  ova_xianxia.101.d: "The promotion ceremony is brief, because the sect has performed it ten thousand times, and singular, because it has never once performed it this early. Grey robes are exchanged for white, a courtyard of outer disciples watches with expressions worth studying, and an elder who once assigned him manure duty now addresses him, with visible effort, as junior brother."
  ova_xianxia.101.f: "Inner robes come with a stipend, a sword rack, and a precise count of everyone who was passed over to make room."
  ova_xianxia.101.a: "Wear the white robes plainly."
  # --- .102 The Tribute Road (chapter 2 final beat)
  ova_xianxia.102.t: "The Tribute Road"
  ova_xianxia.102.d: "His first duty outside the mountain gate: escorting the sect's spirit-stone tribute along the gorge road, where the escort is traditionally the least interesting thing in the caravan. The ambush comes at the narrowest point, as ambushes do, and for the first time in his life there is no elder standing behind him - only the wagons, the ravine, and whatever he has actually learned."
  ova_xianxia.102.f: "The jianghu does not examine disciples in courtyards. It examines them in gorges, without warning, and grades harshly."
  ova_xianxia.102.a: "He stands in the pass."
  ova_xianxia.102.b: "Buy the raiders off and keep the wagons moving."
  # --- .103 A Cave on the Spirit Vein (chapter 3 opener)
  ova_xianxia.103.t: "A Cave on the Spirit Vein"
  ova_xianxia.103.d: "A golden core entitles its bearer to what every disciple covets and few ever see: a cave dwelling drilled into the spirit vein itself, where the qi runs thick enough to taste and one night of meditation is worth a month in the outer courts. The previous occupant left three centuries ago, by ascending. The sect considers this an encouraging precedent."
  ova_xianxia.103.f: "Real estate in the jianghu obeys exactly one law: the closer to the vein, the longer the waiting list of people willing to duel for it."
  ova_xianxia.103.a: "Seal the door. Begin the long sit."
  # --- .104 The Sword Tablet (chapter 3 final beat)
  ova_xianxia.104.t: "The Sword Tablet"
  ova_xianxia.104.d: "The sword tablet in the rear court has stood silent for three generations: a slab of black stone into which some departed master sealed a single unnamed sword intent, waiting for a junior able to hear it. Ten thousand disciples have bowed to it and walked away with nothing. When our Destined One bows, the frost on the stone melts upward."
  ova_xianxia.104.f: "Sword intent cannot be taught, bought, or stolen. It can only be recognized, the way one lightning bolt recognizes another."
  ova_xianxia.104.a: "He bows, and listens until the stone falls silent."
  ova_xianxia.104.b: "Walk past it. His own dao comes first."
  # --- .105 The Soul Steps Free (chapter 4 opener)
  ova_xianxia.105.t: "The Soul Steps Free"
  ova_xianxia.105.d: "The nascent soul steps free of the flesh for the first time in the meditation hall: a small translucent figure, seated in the air a hand-width above his crown, regarding the assembled elders with his own eyes. Sects a thousand li away will hear of this within the month. Several of them will begin, quietly, to reconsider their manners."
  ova_xianxia.105.f: "Below Nascent Soul, the jianghu debates a cultivator's prospects. Above it, the jianghu debates his intentions."
  ova_xianxia.105.a: "Let the soul look. Let the jianghu talk."
  # --- .106 Banners at the Carrion Hills (chapter 4 final beat)
  ova_xianxia.106.t: "Banners at the Carrion Hills"
  ova_xianxia.106.d: "The dao war stops being something recited in dispatches: the sect's own banner marches for the carrion hills, and every eye in the column keeps drifting to the Nascent Soul walking unarmored at its head. Whichever path he serves, the arithmetic of the other side has just acquired a new and unwelcome line."
  ova_xianxia.106.f: "Wars in the jianghu are counted in banners, in blades, and in the one number that overrules both: how many realms walk ahead of the drum."
  ova_xianxia.106.a: "He leads the vanguard."
  ova_xianxia.106.b: "Hold him back from the line."
  # --- .107 The Heavens Take Notice (chapter 5 opener)
  ova_xianxia.107.t: "The Heavens Take Notice"
  ova_xianxia.107.d: "The omens begin small and refuse to stop: incense smoke bends toward him regardless of the wind, spirit beasts kneel at forty paces, and the mountain's oldest bell rings once, untouched, when he crosses the ancestral bridge. The archivists page through records eight hundred years deep for a precedent and close the ledgers looking thoughtful."
  ova_xianxia.107.f: "The heavens watch every cultivator. The trouble begins when a cultivator notices them watching."
  ova_xianxia.107.a: "Let the omens accumulate."
  # --- .108 The Ancestor Leaves Seclusion (chapter 5 final beat)
  ova_xianxia.108.t: "The Ancestor Leaves Seclusion"
  ova_xianxia.108.d: "The founding ancestor has not left the forbidden peak in sixty years. He comes down its steps at dawn, older than the sect's oldest records and visibly annoyed about the staircase, to deliver one sentence to one junior: the thunder that is coming for you has already chosen its day. Prepare, or do not. Then he climbs back up, complaining about the steps the entire way."
  ova_xianxia.108.f: "When a man who has outlived four dynasties interrupts his seclusion to warn you about the weather, it is not about the weather."
  ova_xianxia.108.a: "Prepare."
  # --- .109 The Sky Like a Bruise (chapter 6, the omens gather)
  ova_xianxia.109.t: "The Sky Like a Bruise"
  ova_xianxia.109.d: "It begins as the old texts said it would: the sky above the mountain darkening on cloudless days, the color of a week-old bruise, and every lightning rod in the mortal towns below singing thinly at dusk. The tribulation has chosen its challenger. All that remains undecided is the day, and the heavens are keeping that to themselves."
  ova_xianxia.109.f: "Nine bolts, the texts say. They disagree about everything else, and every author who could have settled the argument stopped writing at eight."
  ova_xianxia.109.a: "Watch the sky, and be ready."
