  ai_strategy_ova_righteous_path: "Righteous Path"
  ai_strategy_ova_righteous_path_desc: "[COUNTRY.GetName] presses the dao war against the Blood Lotus Covenant."
  ai_strategy_ova_demonic_path: "Demonic Path"
  ai_strategy_ova_demonic_path_desc: "[COUNTRY.GetName] means to drown the Jade Throne of Great Feng beneath the lotus."

