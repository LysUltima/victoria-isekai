l_english:
  # --- Prologue
  ova_rey.1.t: "A Hero for the Republic"
  ova_rey.1.d: "The summoning circle finally goes quiet. Katzenburg had prepared itself for a saint, or perhaps some legendary general. Instead, a young man in strange otherworld clothes steps out of the fading light and blinks at the marble hall. Then he notices the ears. Then the tails. His expression brightens far too quickly. The ministers have barely finished asking his name before John Paradox looks around and asks the question apparently most important to him: are all the young women in this republic this beautiful?"
  ova_rey.1.f: "So this is another world. More importantly, it has beastgirls. The ministers immediately begin to worry."
  ova_rey.1.a: "Well then, let us begin."

  # --- KATZENBURG: Nasira, the desert-cat merchant heiress
  ova_rey.10.t: "The Cat Who Names Her Price"
  ova_rey.10.d: "John’s first real encounter in Katzenburg is with Nasira al-Sahra, owner of the richest stall in the grand bazaar. Silver-tipped cat ears, a merchant’s smile, and eyes that have already judged the quality of his coat. He points at a trinket. She names a price. John stares at her. Even someone from another world can recognize robbery when he hears it. Nasira’s tail flicks once as she waits to see whether the famous Hero is clever enough to survive a simple purchase."
  ova_rey.10.f: "Apparently, this is not shopping. It is a duel with coins."
  ova_rey.10.a: "Haggle her down with a merchant’s nerve."
  ova_rey.10.b: "Praise the merchant princess and her wares."
  ova_rey.10.c: "Just pay the robbery price and smile."

  ova_rey.11.t: "A Ledger by Lamplight"
  ova_rey.11.d: "Nasira insists everything is fine. The ledgers say otherwise. A rival cartel is slowly choking her out of the spice routes, and she is far too proud to admit that she is losing. John finds her well past midnight with books piled around her, ink on her fingers, and her ears drooping despite every effort to keep them upright. She does not look up when he enters. More importantly, she does not tell him to leave."
  ova_rey.11.f: "For Nasira, that last part is practically a request for help."
  ova_rey.11.a: "Help her outmaneuver the cartel, fairly and cleverly."
  ova_rey.11.b: "Quietly lend her the coin she will not ask for."
  ova_rey.11.c: "Tell her the numbers can wait until morning."

  ova_rey.12.t: "The Rooftops of the Bazaar"
  ova_rey.12.d: "John learns something important about catkin that afternoon. When there is a perfectly good street below, Nasira naturally chooses the rooftops. She leads him across the warm tiles of the bazaar at a pace that says she is absolutely certain the soft otherworlder will fall behind. Then he does not. Nasira glances back, laughs, and immediately speeds up. The chase continues across half of Katzenburg."
  ova_rey.12.f: "It is the first laugh John has heard from her that did not end with a price."
  ova_rey.12.a: "Chase her across the tiles, leap for leap."
  ova_rey.12.b: "Wait below with a lantern and her favorite sweets."
  ova_rey.12.c: "Remind her that heiresses do not scale rooftops."

  ova_rey.13.t: "The Caravan Ambush"
  ova_rey.13.d: "The caravan is halfway through the dunes when the bandits strike. Too many blades. Too few guards. Nasira plants herself in front of the wagons with a dagger in hand and a look that suggests she intends to argue with mathematics itself. Unfortunately, even a merchant heiress cannot negotiate ten swords into becoming three. Then she notices John moving beside her."
  ova_rey.13.f: "A business partner is easy to praise over wine. A partner who stands beside you when the knives come out is something else."
  ova_rey.13.a: "Put yourself between her and the blades."
  ova_rey.13.b: "Save the caravan and its goods first, then her."
  ova_rey.13.c: "Let her fight; she has claws, after all."

  ova_rey.14.t: "What the Ledger Never Priced"
  ova_rey.14.d: "The spice routes are safe again. The rival cartel is broken. Money is flowing so freely that Nasira should, by every reasonable standard, be delighted. Instead, she pours John a cup of something expensive and becomes strangely quiet. At last she asks what he actually wants from her. It cannot be money. He has had enough chances to take that already. Nasira looks genuinely troubled by the existence of a man she cannot put a price on."
  ova_rey.14.f: "A merchant can handle greed. Sincerity is much harder to calculate."
  ova_rey.14.a: "Tell her the truth: some things you would never sell."
  ova_rey.14.b: "Offer her a partnership, sealed with a handshake."
  ova_rey.14.c: "Deflect with a joke about interest rates."

  ova_rey.15.t: "The Auction War"
  ova_rey.15.d: "A star-sapphire the size of a plum appears at auction, and Nasira wants it badly enough that even John can tell. Unfortunately, her old rivals want it too. The bids rise. Then rise again. Nasira’s smile remains perfect while her coin and patience disappear at roughly the same speed. She would sooner bite through her own tongue than ask John to spend money on her. Her ears, however, keep turning toward him."
  ova_rey.15.f: "She is not asking for help. Her ears are doing a terrible job of respecting that decision."
  ova_rey.15.a: "Win the relic she covets and lay it in her hands."
  ova_rey.15.b: "Talk the rival down so the price never climbs."
  ova_rey.15.c: "Outbid the rival for yourself and gift it to no one."

  ova_rey.16.t: "The Silent Partner"
  ova_rey.16.d: "One evening, Nasira places a ledger on the table between them. Not the public book. The real one. Every hidden route, every private margin, every debt she has concealed even from allies. She pushes it toward John without explaining herself. A merchant does not hand someone the true ledger unless she trusts them with the knife at her throat. John understands that much. Nasira pretends very hard that this is merely business."
  ova_rey.16.f: "For a woman who measures everything in coin, this is about as defenseless as she knows how to be."
  ova_rey.16.a: "Hand the ledger back unread and tell her you trust her."
  ova_rey.16.b: "Audit it together and tighten every loose thread."
  ova_rey.16.c: "Skim the accounts for what her cartel is truly worth."

  ova_rey.17.t: "The Last Ledger"
  ova_rey.17.d: "At the end of the trading season, Nasira sits beneath a lamp balancing her books while John dozes across from her. She reaches one familiar account, adds the column, frowns, and adds it again. Something is wrong. After several minutes she finally realizes what it is. At some point, without noticing, she stopped charging John for anything at all. Worse, she cannot remember when."
  ova_rey.17.f: "The woman who can balance a caravan ledger to the last copper has found one account that refuses to make sense."
  ova_rey.17.a: "Notice she has stopped charging you at all, and say so."
  ova_rey.17.b: "Settle the season’s accounts fairly, to the copper."
  ova_rey.17.c: "Pocket the balance she forgot to charge you."

  ova_rey.18.t: "The Price of Her Heart"
  ova_rey.18.d: "Nasira closes the ledger. That alone is enough to make the room feel serious. She folds her hands, looks directly at John, and says she has finally calculated the one price she cannot bargain lower, avoid, or convince herself not to pay. Her ears go perfectly still. Then she waits for him to understand what she is offering."
  ova_rey.18.f: "For once, Nasira is done counting."
  ova_rey.18.a: "Let her name her price: him."
  ova_rey.18.b: "Take her paw across the ledger and promise the rest."
  ova_rey.18.c: "Seal it as she would: a contract, and a kiss to sign it."

  ova_rey.19.t: "The Silk-Whiskered Bride"
  ova_rey.19.d: "For the first time anyone in Katzenburg can remember, Nasira al-Sahra closes her stall in the middle of the season. The sign she hangs outside reads GONE COURTING. By sunset, her ledgers, half her wardrobe, several locked chests, and one extremely satisfied merchant heiress have all moved into John’s household. The bazaar spends the next week discussing nothing else."
  ova_rey.19.f: "One state down. Four remain. John appears to have mistaken romance for a national campaign."
  ova_rey.19.a: "One down. Onward."

  # --- WELPENSTADT: Bruna, the dogkin guard-captain
  ova_rey.20.t: "The Captain at the Gate"
  ova_rey.20.d: "At the gate of Welpenstadt, John meets Captain Bruna Falk. She is dogkin, disciplined, painfully earnest, and clearly fighting a lifelong war against a tail that wants to wag whenever she is pleased. She checks John’s papers once. Then twice. Then a third time, just to be safe. Everything about her says she wants to trust the summoned Hero immediately. Everything about her uniform says she absolutely will not."
  ova_rey.20.f: "Bruna’s loyalty is difficult to earn. That is precisely why it is worth earning."
  ova_rey.20.a: "Pass her inspection to the letter, then salute her back."
  ova_rey.20.b: "Bring her honest guard a round of good ale."
  ova_rey.20.c: "Pull rank and wave the paperwork away."

  ova_rey.21.t: "The Long Night Watch"
  ova_rey.21.d: "The frost is vicious that night, and Bruna is standing the north wall alone. Of course she is. She would never order a subordinate to take a watch she was unwilling to stand herself. John climbs the steps carrying two steaming mugs and no believable reason for being there. Bruna turns, sees him, and manages to keep her expression perfectly professional. Her tail gives her away half a second earlier."
  ova_rey.21.f: "The captain’s face is disciplined. The captain’s tail has no such training."
  ova_rey.21.a: "Stand the whole watch beside her, hour for hour."
  ova_rey.21.b: "Bring her a warm cloak and keep her company a while."
  ova_rey.21.c: "Order her to rest and take the watch yourself."

  ova_rey.22.t: "The Sparring Yard"
  ova_rey.22.d: "Bruna invites John to the sparring yard. The word invite is generous. By the time he understands what is happening, half the watch has gathered around the ring and their captain is already rolling her shoulders with a grin. Part of this is a test of the Hero’s strength. The other part is much simpler. Bruna likes fighting strong people, and she has been waiting all week for an excuse."
  ova_rey.22.f: "She takes everything seriously, including having fun."
  ova_rey.22.a: "Meet her at full strength and lose gracefully on purpose."
  ova_rey.22.b: "Fight her honestly and win, then help her up."
  ova_rey.22.c: "Decline; a hero does not brawl with the watch."

  ova_rey.23.t: "The Riot in the Kennelward"
  ova_rey.23.d: "A grain shortage turns ugly in the poorest ward of Welpenstadt. By dusk, a crowd is pressing against a locked warehouse and Bruna stands between them and the doors. Her orders are clear. So is the hunger on the other side of her shield. For perhaps the first time since John met her, the captain looks uncertain. Then she looks at him, as if a Hero from another world might know what the right answer is supposed to be."
  ova_rey.23.f: "One bad decision here will hurt more than the riot itself."
  ova_rey.23.a: "Stand at her shoulder and hold the line without a drop of blood."
  ova_rey.23.b: "Disperse the mob yourself and spare her the choice."
  ova_rey.23.c: "Tell her to crack down hard and be done with it."

  ova_rey.24.t: "Off Duty at Last"
  ova_rey.24.d: "John almost fails to recognize Bruna without armor. Off duty, the terrifying captain becomes a young woman who does not seem to know what to do with her hands. She talks too quickly. Then apologizes for talking too quickly. Then talks even faster to fill the silence. Apparently, facing rioters is easier than spending an evening alone with one man."
  ova_rey.24.f: "Without the uniform, Bruna has nowhere to hide how nervous she is."
  ova_rey.24.a: "Walk her home the long way and let her talk about nothing."
  ova_rey.24.b: "Gift her a new whistle for the watch, engraved."
  ova_rey.24.c: "Ask her, awkwardly, about promotion paperwork."

  ova_rey.25.t: "The Deserter’s Trial"
  ova_rey.25.d: "One of Bruna’s youngest recruits ran during the riot. Now the boy sits in a cell awaiting judgment. The law is simple. Unfortunately, people are not. He is nineteen, terrified, ashamed, and trying not to cry in front of his captain. Bruna has written harsher orders without blinking. This time, the pen refuses to move."
  ova_rey.25.f: "She can enforce the law. That does not mean she can stop caring about the person underneath it."
  ova_rey.25.a: "Stand for the frightened boy and pay his debt yourself."
  ova_rey.25.b: "Help her weigh the law and the mercy of it, together."
  ova_rey.25.c: "Tell her to make an example and move on."

  ova_rey.26.t: "The Parade Review"
  ova_rey.26.d: "The republic sends an inspector, and Bruna spends a month turning the town watch into something that could survive inspection by the gods themselves. On the morning of the review, every buckle shines and every formation is perfect. Bruna is still visibly tense. Oddly enough, she seems less worried about the inspector than about whether John is watching."
  ova_rey.26.f: "Apparently, one Hero’s opinion has become more frightening than an official review."
  ova_rey.26.a: "Stand in the ranks with her watch and drill as one of them."
  ova_rey.26.b: "Praise the watch loudly and let her take the credit."
  ova_rey.26.c: "Review the ranks like a general and note every fault."

  ova_rey.27.t: "The Oath Stone"
  ova_rey.27.d: "Above Welpenstadt stands an old grey stone where dogkin have sworn their loyalties for a thousand years. Bruna brings John there at dusk and then becomes unusually bad at explaining why. Her hand rests on the worn surface. She looks at the stone, then at John, then back at the stone. The meaning is not exactly subtle."
  ova_rey.27.f: "A dogkin does not bring someone to the Oath Stone by accident."
  ova_rey.27.a: "Lay your hand on the old stone beside hers and mean it."
  ova_rey.27.b: "Ask her to teach you the words first."
  ova_rey.27.c: "Call it a quaint custom and stand aside."

  ova_rey.28.t: "A Faithful Heart"
  ova_rey.28.d: "Bruna approaches John in full parade posture, as though she is about to deliver a military report. She gets through perhaps two sentences before abandoning the attempt. Quietly, she says she has spent her whole life guarding gates, streets, soldiers, and people. If John will allow it, she would like to spend the rest of that life guarding one particular man. Her tail is completely still while she waits."
  ova_rey.28.f: "Bruna gives her loyalty once. She does not know how to give only part of it."
  ova_rey.28.a: "Accept the truest guard in the republic."
  ova_rey.28.b: "Pin your own badge over her heart and answer yes."
  ova_rey.28.c: "Swear it back to her at the oath stone, watch and all."

  ova_rey.29.t: "The Captain’s Vow"
  ova_rey.29.d: "Captain Bruna Falk hands her duty roster to a lieutenant who is too shocked to speak, turns on her heel, and marches directly to John’s household. Within an hour she has inspected the doors, criticized the locks, reorganized the night watch, and declared herself responsible for the Hero’s security. Apparently, this is what Bruna considers moving in with someone."
  ova_rey.29.f: "Two states down. The republic has begun to notice a pattern."
  ova_rey.29.a: "Two down. Onward."

  # --- BARENBERG: Ursla, the bearkin mountain smith
  ova_rey.30.t: "The Smith Who Bends Iron"
  ova_rey.30.d: "The great forge of Barenberg belongs to Ursla Steinfell, a bearkin standing a full head taller than John. Their first meeting lasts perhaps thirty seconds before she takes a cooling iron bar and bends it straight with her bare hands, apparently to establish the terms of conversation. John applauds. Ursla immediately goes pink all the way to her ears and growls that she has no time for useless court dandies."
  ova_rey.30.f: "The mountain’s strongest smith is unexpectedly weak against sincere praise."
  ova_rey.30.a: "Take up the second hammer and work the forge with her."
  ova_rey.30.b: "Commission the grandest blade she has ever been asked for."
  ova_rey.30.c: "Stare, because she is very large and very strong."

  ova_rey.31.t: "The Arm-Wrestle at the Alehouse"
  ova_rey.31.d: "In Barenberg, friendship is apparently settled by arm wrestling. Ursla has never lost. Naturally, this means John is seated across from her before he has even finished his drink. She plants one enormous elbow on the table and grins down at him while the whole alehouse gathers around to watch the summoned Hero humiliate himself."
  ova_rey.31.f: "Ursla respects strength. She also respects someone who can lose without making excuses."
  ova_rey.31.a: "Go all out and hold her arm to a proud, roaring draw."
  ova_rey.31.b: "Lose cheerfully and buy the whole hall a round."
  ova_rey.31.c: "Win with an otherworld trick and gloat."

  ova_rey.32.t: "The Climb to the Cinder Peak"
  ova_rey.32.d: "Ursla knows a path above the forge-smoke where the entire mountain range turns gold at sunrise. She has never shown it to anyone. This fact is mentioned only after she has already invited John. Before he can question that, she throws both packs over one shoulder and starts climbing. Apparently, carrying his share is not open for discussion."
  ova_rey.32.f: "She acts as though the invitation means nothing. The fact that nobody else has ever received one suggests otherwise."
  ova_rey.32.a: "Match her pace up the mountain and watch the dawn together."
  ova_rey.32.b: "Let her carry the packs, since she insists, and thank her."
  ova_rey.32.c: "Complain about the cold the whole way up."

  ova_rey.33.t: "The Cave-In"
  ova_rey.33.d: "The mine gives a deep, ugly groan. Then the gallery comes down. Workers are trapped behind a fallen beam while Ursla braces it with both arms, teeth clenched, buying seconds with raw strength. Even she cannot hold it forever. She looks sideways. John is the only person close enough to help."
  ova_rey.33.f: "Admiring someone’s strength is easy. Becoming the person they trust enough to lean on is different."
  ova_rey.33.a: "Hold the fallen beam with her, shoulder to shoulder, till all are out."
  ova_rey.33.b: "Dig the miners free while she braces the roof."
  ova_rey.33.c: "Shout for the crews and organize from safety."

  ova_rey.34.t: "Soft Words, Hard Hands"
  ova_rey.34.d: "The forge is almost dark when Ursla finally says it. She has always been too tall. Too broad. Too strong. Men praise her work, challenge her strength, and slap her shoulder like another smith. Nobody has ever looked at her as someone they might want to hold. So, eventually, she stopped expecting it. She keeps her eyes on the coals while speaking and refuses to look at John."
  ova_rey.34.f: "The strongest hands in Barenberg have never once been held gently."
  ova_rey.34.a: "Tell her that gentle is not the opposite of strong."
  ova_rey.34.b: "Forge her a ring at her own anvil while she sleeps."
  ova_rey.34.c: "Awkwardly compliment her grip strength."

  ova_rey.35.t: "The Masterwork"
  ova_rey.35.d: "Ursla begins the masterwork that will decide her name among the smiths: a sword folded again and again until even the other masters stop counting. At the final pour, her hands shake. Not from weakness. From knowing one mistake will ruin months of work. She needs another pair of hands, and there is only one person in the forge she trusts enough to touch the piece with her."
  ova_rey.35.f: "Ursla has never shared the final step of a masterwork. Until now."
  ova_rey.35.a: "Steady the great tongs with her through the last pour."
  ova_rey.35.b: "Fetch and pump and keep the fire perfect for a day."
  ova_rey.35.c: "Buy the finished piece and put your own name to it."

  ova_rey.36.t: "The Mountain Feast"
  ova_rey.36.d: "The bearfolk feast like they do everything else: loudly enough to shake the mountain. Ursla drags John into a hall full of roaring songs, enormous barrels, and relatives built like siege engines. Her entire clan watches the little otherworlder with open curiosity. Ursla pretends not to care whether he fits in. She fails almost immediately."
  ova_rey.36.f: "Being loved by one bear apparently comes with several hundred additional bears."
  ova_rey.36.a: "Match the mountain drink for drink and song for song."
  ova_rey.36.b: "Toast her clan and learn every rowdy name."
  ova_rey.36.c: "Slip out early and let the bears roar without you."

  ova_rey.37.t: "The Quiet Forge"
  ova_rey.37.d: "Late at night, when the great forge has gone quiet, John finds Ursla working alone at a small private anvil. The piece under her hammer is delicate, almost fragile, and she covers it too late for him not to notice. Usually she would bark at anyone else to leave. Instead, she shifts on the bench and silently makes room beside her."
  ova_rey.37.f: "The loudest woman on the mountain keeps her real self in very quiet places."
  ova_rey.37.a: "Just sit in the warm dark and watch her work, saying nothing."
  ova_rey.37.b: "Ask her to teach you the one secret she keeps."
  ova_rey.37.c: "Pry after the trick worth a fortune in any market."

  ova_rey.38.t: "Tempered Together"
  ova_rey.38.d: "Ursla takes a breath deep enough to work a bellows and announces that she is terrible at speeches. Then, proving the point, she asks John in the bluntest words possible whether a man could really stand being loved by a woman strong enough to carry him over one shoulder. Afterward she braces herself like someone waiting for a hammer blow."
  ova_rey.38.f: "She can forge steel without fear. Asking one question turns out to be much harder."
  ova_rey.38.a: "Answer by letting her lift you off your feet."
  ova_rey.38.b: "Take her huge hand in both of yours and hold on."
  ova_rey.38.c: "Forge the rings together, one at each anvil."

  ova_rey.39.t: "The Mountain’s Bride"
  ova_rey.39.d: "Ursla forges her own wedding ring. Naturally, she does. Then she sizes a second ring for a hand much smaller than hers, picks John up before he can protest, and carries the laughing Hero through Barenberg on one shoulder while the whole mountain roars its approval. Ursla’s face is red. Her smile is enormous. She does not put him down for quite some time."
  ova_rey.39.f: "Three states down. At this point even the scandalized people are starting to enjoy the story."
  ova_rey.39.a: "Three down. Onward."

  # --- HASENHAFEN: Lieselotte, the rabbitkin harvest maiden
  ova_rey.40.t: "The Girl Among the Clover"
  ova_rey.40.d: "Outside Hasenhafen, John finds a rabbitkin girl gathering berries in a field of clover. Lieselotte Klee notices the stranger, startles so badly that she nearly bolts, then remembers her manners halfway through the first step. After several seconds of visible internal struggle, she returns and offers him a shy handful of berries as an apology."
  ova_rey.40.f: "The gentlest girl in the republic is also extremely easy to scare away."
  ova_rey.40.a: "Kneel in the field and help her bring in the harvest."
  ova_rey.40.b: "Praise the finest crop in all Hasenhafen."
  ova_rey.40.c: "Startle at how fast a frightened rabbit can bolt."

  ova_rey.41.t: "Baking Day"
  ova_rey.41.d: "Lieselotte has invited John into her kitchen. Judging by how carefully everything has been arranged, she has probably been preparing for this invitation since last week. The room smells of honey and fresh bread. She ties an apron around him with trembling paws, touches his hand over the dough, and lets out a tiny sound she immediately pretends never happened."
  ova_rey.41.f: "She practiced asking him here in the mirror. The actual event is going much worse for her heart."
  ova_rey.41.a: "Ruin your hands in the dough and let her laugh at you."
  ova_rey.41.b: "Bring rare honey from the capital for her recipe."
  ova_rey.41.c: "Eat everything and forget to compliment the baker."

  ova_rey.42.t: "The Spring Fair"
  ova_rey.42.d: "The spring fair fills Hasenhafen with ribbons, music, stalls, and far too many people for Lieselotte’s comfort. After being separated from John twice, she gathers her courage and slips one paw into his hand so they will not lose each other again. Then she realizes what she has done. Her face turns bright red. She still does not let go."
  ova_rey.42.f: "For Lieselotte, holding hands in public may be more daring than charging a battlefield."
  ova_rey.42.a: "Win her the ribbon at every stall until her arms are full."
  ova_rey.42.b: "Dance with her under the maypole till she is dizzy."
  ova_rey.42.c: "Lecture her about the economics of festival stalls."

  ova_rey.43.t: "The Flood on the Weir"
  ova_rey.43.d: "The spring melt breaks the weir. Water pours into the low fields, carrying fences, tools, and the entire year’s harvest with it. Children and livestock are still trapped below. Lieselotte, the girl who normally jumps at a loud greeting, does not run. She wades straight into the water and begins shouting orders to the village. Then she turns to John and asks him to stand with her."
  ova_rey.43.f: "Sometimes the people who are afraid most often are the ones who understand courage best."
  ova_rey.43.a: "Carry the little ones to high ground while she rallies the village."
  ova_rey.43.b: "Dam the breach yourself with sandbags and stubbornness."
  ova_rey.43.c: "Tell her the harvest is a loss and to save herself."

  ova_rey.44.t: "Under the Harvest Moon"
  ova_rey.44.d: "The fields survive. The barns are full. Under the harvest moon, Lieselotte admits something she has believed about herself since childhood: she is the frightened one. The girl who hesitates, stammers, and runs. Yet whenever John is beside her, somehow her legs stop shaking. She does not understand why. Looking at her expression, John probably does."
  ova_rey.44.f: "Tonight is the first time Lieselotte says the word brave while talking about herself."
  ova_rey.44.a: "Tell her that brave and timid can be the same brave heart."
  ova_rey.44.b: "Give her a pressed four-leaf clover you kept all season."
  ova_rey.44.c: "Ask, too directly, why she trembles so much."

  ova_rey.45.t: "The Market Day"
  ova_rey.45.d: "Lieselotte grows the best produce in Hasenhafen. Unfortunately, selling it requires speaking loudly to strangers. By midday, her stall is still full while bolder merchants have nearly sold out. John finds her hiding behind a mountain of vegetables, eyes wet, unable to force out a single sales call. This is not a problem he can simply solve for her. It is one she needs to discover she can solve herself."
  ova_rey.45.f: "She does not need someone to rescue her from the market. She needs someone beside her while she finds her own voice."
  ova_rey.45.a: "Buy nothing, but stay all day until she is calling prices herself."
  ova_rey.45.b: "Stand at her elbow and gently coax her voice out."
  ova_rey.45.c: "Take over the stall and sell the lot in an hour."

  ova_rey.46.t: "The Lantern Walk"
  ova_rey.46.d: "On the eve of harvest, Hasenhafen sets paper lanterns on the river. One lantern, one wish. Lieselotte presses a folded one into John’s hands and immediately refuses to explain what she wrote on it. Her ears turn pink. Then pinker. At that point, the mystery becomes somewhat less difficult."
  ova_rey.46.f: "A river full of wishes drifts past. Lieselotte’s is walking beside her."
  ova_rey.46.a: "Set your lantern on the water beside hers and make one wish."
  ova_rey.46.b: "Light the whole village’s lanterns for the children."
  ova_rey.46.c: "Explain the physics of why the lanterns float."

  ova_rey.47.t: "The Warren Gathering"
  ova_rey.47.d: "Lieselotte finally brings John home. Home, in this case, means a rabbitkin warren containing enough aunts, cousins, grandparents, children, and distant relations to qualify as a small army. They are all almost as shy as she is. They are also watching John with desperate hope that he will fit into the family. Lieselotte stands beside him with both paws clenched, offering the whole of her world at once."
  ova_rey.47.f: "Courting one rabbitkin apparently means being adopted by an entire nervous civilization."
  ova_rey.47.a: "Sit on the floor with the little ones and let them climb you."
  ova_rey.47.b: "Bring gifts enough for the whole enormous family."
  ova_rey.47.c: "Impress the elders with talk of the wider world."

  ova_rey.48.t: "A Gentle Yes"
  ova_rey.48.d: "Lieselotte twists the edge of her apron until it nearly becomes rope. She starts the sentence once. Stops. Tries again. Stops again. At last she gathers every scrap of courage she owns and asks whether John might possibly, if it is not too troublesome, want to stay with her forever. Then she squeezes her eyes shut as if awaiting execution."
  ova_rey.48.f: "It is barely louder than a whisper. For Lieselotte, it may be the bravest thing she has ever said."
  ova_rey.48.a: "Let her whisper it into your collar so no one else can hear."
  ova_rey.48.b: "Cup her face and answer for her, softly."
  ova_rey.48.c: "Let the whole warren hear it, so she never has to say it twice."

  ova_rey.49.t: "The Harvest Bride"
  ova_rey.49.d: "Lieselotte Klee walks into John’s household on his arm with a wreath of clover in her hair. She does not bolt once. Behind them comes what appears to be the entire population of Hasenhafen carrying baskets, gifts, food, and tearful advice. Lieselotte looks overwhelmed, happy, and safer than John has ever seen her."
  ova_rey.49.f: "Four states down. Only the foxes remain. Naturally, the clever ones are last."
  ova_rey.49.a: "Four down. One to go."

  # --- FUSCHTAL: Fenna, the foxkin scholar
  ova_rey.50.t: "The Fox Who Asks the Riddles"
  ova_rey.50.d: "The scholar everyone mentions in Fuschtaal is Fenna Rotwald, a russet foxkin with a sharp smile and a sharper habit of testing people. She greets the famous Hero with no bow, no compliment, and one deliberately irritating riddle. Her tail curls neatly around her ankles while she waits. Clearly, she expects the celebrated otherworlder to disappoint her."
  ova_rey.50.f: "Fenna has never met a puzzle she could not eventually solve. She assumes men work the same way."
  ova_rey.50.a: "Answer her riddle with a sharper riddle of your own."
  ova_rey.50.b: "Admit you are stumped and ask her to teach you."
  ova_rey.50.c: "Guess wildly and wrong, with great confidence."

  ova_rey.51.t: "The Midnight Library"
  ova_rey.51.d: "Fenna allows John into the great library after midnight, officially to settle a scholarly wager. The wager is finished within an hour. Neither of them leaves. They spend the rest of the night trading books, arguments, obscure facts, and bits of knowledge from two different worlds across a lamp-lit table. Fenna keeps asking questions as though she is merely studying him."
  ova_rey.51.f: "She is absolutely gathering information. Enjoying his company is, according to Fenna, unrelated."
  ova_rey.51.a: "Trade her a secret of your own world for one of hers."
  ova_rey.51.b: "Read to her until the lamp gutters out."
  ova_rey.51.c: "Fall asleep on the books she wanted to discuss."

  ova_rey.52.t: "The Game of Wits"
  ova_rey.52.d: "Fenna challenges John to a strategy game she has never lost. Halfway through, he notices she is cheating. A few turns later, he realizes she knows he noticed. Fenna’s smile widens. Apparently, being caught was part of the entertainment. By then the game itself has become much less important than seeing which of them will admit what is happening first."
  ova_rey.52.f: "A fox does not flirt directly. That would make things far too easy."
  ova_rey.52.a: "Let her think she is winning, then reveal you saw it all."
  ova_rey.52.b: "Play earnestly and cede a graceful loss."
  ova_rey.52.c: "Accuse her, correctly, of cheating."

  ova_rey.53.t: "The Forbidden Chapter"
  ova_rey.53.d: "Fenna’s curiosity finally takes her somewhere cleverness cannot save her. Deep inside a sealed archive, something old answers when she opens the wrong chapter. The shelves close in. The dark moves. For once, Fenna has no trick prepared. Then John is already stepping between her and whatever she awakened."
  ova_rey.53.f: "There is a reason some doors are locked. Scholars usually learn this immediately after opening them."
  ova_rey.53.a: "Stand between her and the thing that answered her research."
  ova_rey.53.b: "Burn the dangerous manuscript before it costs her."
  ova_rey.53.c: "Tell her that her curiosity has gone too far."

  ova_rey.54.t: "Behind the Clever Smile"
  ova_rey.54.d: "After the archive, Fenna’s usual smile does not come back right away. She is shaken, grateful, and clearly annoyed about being both. At last she admits that riddles are safer than honest answers. A riddle can be redirected. A straight answer gives someone a place to hurt you. Then she asks what John thinks of the woman underneath all that cleverness."
  ova_rey.54.f: "It may be the first question Fenna has ever asked without hiding another question inside it."
  ova_rey.54.a: "Tell her you like the truths she hides more than the tricks."
  ova_rey.54.b: "Give her a puzzle box that opens to a question."
  ova_rey.54.c: "Try, and fail, to out-riddle her again."

  ova_rey.55.t: "The Cartographer’s Puzzle"
  ova_rey.55.d: "Fenna finds an old map covered in ciphers that generations of scholars failed to crack. Naturally, she stops sleeping. By midnight the map is spread across a table between her and John, books piled around them, both arguing over the same impossible symbols. For once, Fenna seems less interested in proving she can solve it alone than in having his mind beside hers while she tries."
  ova_rey.55.f: "For Fenna, sharing a puzzle may be more intimate than sharing a secret."
  ova_rey.55.a: "Chase the map’s ending at her side, wherever it leads."
  ova_rey.55.b: "Solve the last cipher for her and let her write it up."
  ova_rey.55.c: "Sell the decoded map to a treasure-hunter for a fortune."

  ova_rey.56.t: "The Debate"
  ova_rey.56.d: "A visiting scholar with an enormous reputation decides to humiliate Fenna in public debate. One famous name against one young foxkin should be easy. Fenna knows that. She also refuses to retreat an inch. Her chin lifts. Her answers sharpen. She does not ask John for help, because asking for help is exactly the sort of thing she hates doing when she needs it most."
  ova_rey.56.f: "Fenna would rather lose alone than admit she wanted someone beside her. John has learned not to believe her on that point."
  ova_rey.56.a: "Feed her the one fact that wins it and let her land the blow."
  ova_rey.56.b: "Take the podium and argue her case beside her."
  ova_rey.56.c: "Win the crowd for yourself with an otherworld flourish."

  ova_rey.57.t: "The Observatory"
  ova_rey.57.d: "Fenna invites John to the old observatory because she supposedly needs a second pair of eyes for the star charts. The excuse survives perhaps ten minutes. The night is cold, the stars are clear, and for once the woman who always has a clever answer seems content to sit in silence. Several hours pass before either of them remembers the telescope."
  ova_rey.57.f: "The cleverest woman in the vale brought him here and then somehow ran out of things to say."
  ova_rey.57.a: "Trade one true thing for each star, until dawn."
  ova_rey.57.b: "Name the constellations of your world against hers."
  ova_rey.57.c: "Chart the sky properly and forget she is beside you."

  ova_rey.58.t: "The One Riddle She Cannot Solve"
  ova_rey.58.d: "Fenna announces that she has one final riddle for John. The setup is elaborate. The delivery is perfect. Then, halfway through, she stops and admits there is no clever answer. The riddle is simply why she cannot stop thinking about one particular man from another world. Her ears dip. Her tail goes rigid. She was hoping, apparently, that he might solve this one for her."
  ova_rey.58.f: "For once, Fenna has no answer hidden up her sleeve."
  ova_rey.58.a: "Give her the answer: it was always going to be you."
  ova_rey.58.b: "Let her win this one, and lose your heart on purpose."
  ova_rey.58.c: "Answer her riddle with a ring, and no words at all."

  ova_rey.59.t: "The Vixen’s Answer"
  ova_rey.59.d: "Fenna Rotwald closes the great library, packs one trunk with books the librarians would probably prefer remain locked up, and arrives at John’s household with the explanation that Fuschtaal has simply run out of interesting riddles. It would be more convincing if her tail were not wagging hard enough to betray the entire argument."
  ova_rey.59.f: "Five states. Five hearts. John has somehow completed the strangest route through republican politics imaginable."
  ova_rey.59.a: "Five down. All of them."

  # --- Shared endings
  ova_rey.80.t: "She Moves On"
  ova_rey.80.d: "Sometimes, no matter how many conversations, favors, and almost-moments pile up, the feeling never becomes love. The season turns. She tells John kindly that she hopes he finds what he is looking for, then returns to her own life. There is no dramatic fight. No villain. No curse to break. Just two people whose story did not become that kind of story."
  ova_rey.80.f: "Not every route ends in romance. Even a summoned Hero has to learn that and keep walking."
  ova_rey.80.a: "Wish her well, and move on."

  ova_rey.78.t: "The Hero Falls"
  ova_rey.78.d: "It is not supposed to end like this. Summoned Heroes are the people who survive impossible odds, defeat monsters, and come home at the last second. John Paradox does none of those things this time. He is simply gone. The women who loved him are left with memories, unfinished promises, and a story that stops far earlier than anyone expected. Across the republic, the banners are lowered."
  ova_rey.78.f: "Plot armor is only real until the story proves otherwise."
  ova_rey.78.a: "A grievous loss."

  ova_rey.90.t: "A President for a New Reyorn"
  ova_rey.90.d: "John Paradox came to Reyorn with what sounded like the stupidest possible ambition: court a beastfolk daughter from every state. Somehow, the joke became politics. Katzenburg’s cat merchants, Welpenstadt’s dogkin guard, Barenberg’s bearfolk, Hasenhafen’s rabbitkin, and Fuschtaal’s fox scholars now all have someone in John’s household whom they call their own. The councils look at the otherworlder, look at the coalition he accidentally built through romance, and arrive at an absurdly logical conclusion. They ask him to run for president. Every bride whose heart he truly won will bring her people into the founding cultures of the new Reyorn."
  ova_rey.90.f: "Apparently, there are many roads to national unity. Nobody expected this one."
  ova_rey.90.a: "A quiet inauguration, and a home full of many peoples."
  ova_rey.90.b: "A grand festival of every fur and feather in the republic."
  ova_rey.90.c: "Stand as First Citizen, the hero the beastfolk chose."

  ova_rey.91.t: "The Paradox Republic"
  ova_rey.91.d: "John Paradox takes the presidential chair with his wives beside him and a republic reshaped around the peoples who followed them there. Historians will later produce very serious books explaining how an otherworlder united Reyorn through diplomacy, symbolism, coalition-building, and cultural integration. This is all technically true. It is also a complicated way of saying that John fell in love with the country one woman at a time."
  ova_rey.91.f: "A Hero was summoned to save the republic. Instead, he somehow romanced it into becoming a new one."
  ova_rey.91.a: "Long live the Paradox Republic."
