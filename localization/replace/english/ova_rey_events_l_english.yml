l_english:
  # ===================================================================
  # Reyorn harem storyline (John Paradox) - event text. Isekai
  # light-novel voice, curly apostrophes, never em dashes. Defs:
  # events/ova_rey_events.txt. Heroine names are hardcoded here.
  # Eight dates per girl (X0-X7), a button-fired confession (X8) and a
  # won event (X9) per decade block.
  # ===================================================================

  # --- Prologue
  ova_rey.1.t: "A Hero for the Republic"
  ova_rey.1.d: "The summoning circle of Katzenburg was meant to call a saint or a general. What steps out of the light, blinking, is a young man in strange otherworld clothes who looks around the marble hall, takes in the beastfolk ministers with their ears and tails, and grins as though every birthday has come at once. He introduces himself as John Paradox, and asks, before anything else, whether the young ladies of the republic are always this lovely."
  ova_rey.1.f: "The ministers exchange a look. The republic has its hero. Heaven help the republic."
  ova_rey.1.a: "Well then, let us begin."

  # --- KATZENBURG: Nasira, the desert-cat merchant heiress
  ova_rey.10.t: "The Cat Who Names Her Price"
  ova_rey.10.d: "The richest stall in the grand bazaar of Katzenburg belongs to Nasira al-Sahra, a desert-cat with silver-tipped ears, a merchant’s smile, and eyes that have already added up the cut of John’s coat and found it wanting. She names a price for the trinket he was admiring that is frankly robbery, and waits, tail flicking, to see what the otherworlder is made of."
  ova_rey.10.f: "Every deal she has ever won began exactly like this."
  ova_rey.10.a: "Haggle her down with a merchant’s nerve."
  ova_rey.10.b: "Praise the merchant princess and her wares."
  ova_rey.10.c: "Just pay the robbery price and smile."

  ova_rey.11.t: "A Ledger by Lamplight"
  ova_rey.11.d: "A rival cartel is squeezing Nasira out of the spice routes, and she is too proud to say she is losing. John finds her past midnight, surrounded by ledgers, ears drooping."
  ova_rey.11.f: "She does not look up. She does not tell him to leave, either."
  ova_rey.11.a: "Help her outmaneuver the cartel, fairly and cleverly."
  ova_rey.11.b: "Quietly lend her the coin she will not ask for."
  ova_rey.11.c: "Tell her the numbers can wait until morning."

  ova_rey.12.t: "The Rooftops of the Bazaar"
  ova_rey.12.d: "Cats, it turns out, take the high road. Nasira leads John a merry chase across the sun-warmed tiles of the bazaar rooftops, laughing over her shoulder, certain no soft otherworlder can keep up."
  ova_rey.12.f: "It is the first time he has heard her laugh without a sale attached."
  ova_rey.12.a: "Chase her across the tiles, leap for leap."
  ova_rey.12.b: "Wait below with a lantern and her favorite sweets."
  ova_rey.12.c: "Remind her that heiresses do not scale rooftops."

  ova_rey.13.t: "The Caravan Ambush"
  ova_rey.13.d: "Bandits hit Nasira’s caravan in the dunes at dusk, blades out, more than the guards can hold. She stands her ground over her goods with a dagger and a snarl, but there are too many."
  ova_rey.13.f: "This is the moment a merchant learns what her partners are truly worth."
  ova_rey.13.a: "Put yourself between her and the blades."
  ova_rey.13.b: "Save the caravan and its goods first, then her."
  ova_rey.13.c: "Let her fight; she has claws, after all."

  ova_rey.14.t: "What the Ledger Never Priced"
  ova_rey.14.d: "The routes are safe, the cartel is broken, the caravans run gold again. Nasira pours two cups of something expensive and asks John, with unusual quiet, what he actually wants from all this, since it plainly is not money."
  ova_rey.14.f: "She has never been able to price a man who does not want her money."
  ova_rey.14.a: "Tell her the truth: some things you would never sell."
  ova_rey.14.b: "Offer her a partnership, sealed with a handshake."
  ova_rey.14.c: "Deflect with a joke about interest rates."

  ova_rey.15.t: "The Auction War"
  ova_rey.15.d: "A star-sapphire the size of a plum comes to auction, and Nasira wants it with a hunger she cannot hide, but so does the rival cartel that has never let her win. The bidding climbs like a fever, and she is running out of coin and pride at once."
  ova_rey.15.f: "She would never ask him to spend a copper on her. She is praying he does anyway."
  ova_rey.15.a: "Win the relic she covets and lay it in her hands."
  ova_rey.15.b: "Talk the rival down so the price never climbs."
  ova_rey.15.c: "Outbid the rival for yourself and gift it to no one."

  ova_rey.16.t: "The Silent Partner"
  ova_rey.16.d: "One evening Nasira sets the whole book of her cartel’s secrets on the table between them, every route and margin and hidden debt, and pushes it toward John without a word. A merchant does not show anyone her true ledger. She is showing him."
  ova_rey.16.f: "It is the most naked thing a woman like her knows how to do."
  ova_rey.16.a: "Hand the ledger back unread and tell her you trust her."
  ova_rey.16.b: "Audit it together and tighten every loose thread."
  ova_rey.16.c: "Skim the accounts for what her cartel is truly worth."

  ova_rey.17.t: "The Last Ledger"
  ova_rey.17.d: "The trading season closes, and Nasira sits balancing her accounts by lamplight, John dozing across from her. She adds a column twice, frowns, and realizes she has quietly stopped charging him for anything at all, and cannot for her life work out when that began."
  ova_rey.17.f: "The heiress who prices everything has found the one entry she cannot make balance."
  ova_rey.17.a: "Notice she has stopped charging you at all, and say so."
  ova_rey.17.b: "Settle the season’s accounts fairly, to the copper."
  ova_rey.17.c: "Pocket the balance she forgot to charge you."

  ova_rey.18.t: "The Price of Her Heart"
  ova_rey.18.d: "Nasira sets down her ledger, folds her hands, and says that she has, at last, calculated the one price she cannot talk herself out of paying. She looks at John and waits, ears very still, for him to be brave enough to hear it."
  ova_rey.18.f: "For once in her life the merchant heiress has stopped counting."
  ova_rey.18.a: "Let her name her price: him."
  ova_rey.18.b: "Take her paw across the ledger and promise the rest."
  ova_rey.18.c: "Seal it as she would: a contract, and a kiss to sign it."

  ova_rey.19.t: "The Silk-Whiskered Bride"
  ova_rey.19.d: "Nasira al-Sahra closes her stall in the grand bazaar for the first time in living memory, hangs a sign that reads GONE COURTING, and moves her ledgers, her fortune, and her heart into the hero’s household. Katzenburg has never seen its merchant princess look so scandalously happy."
  ova_rey.19.f: "One state won. Four to go, and John is only getting started."
  ova_rey.19.a: "One down. Onward."

  # --- WELPENSTADT: Bruna, the dogkin guard-captain
  ova_rey.20.t: "The Captain at the Gate"
  ova_rey.20.d: "The gate of Welpenstadt is held by Captain Bruna Falk, a dogkin with a wagging honesty she keeps sternly leashed on duty. She inspects John’s papers three times, ears sharp, and clearly wants very badly to trust the strange hero and refuses to do so on principle."
  ova_rey.20.f: "Loyalty like hers is not given lightly. That is rather the point of it."
  ova_rey.20.a: "Pass her inspection to the letter, then salute her back."
  ova_rey.20.b: "Bring her honest guard a round of good ale."
  ova_rey.20.c: "Pull rank and wave the paperwork away."

  ova_rey.21.t: "The Long Night Watch"
  ova_rey.21.d: "A hard frost, a longer night, and Bruna alone on the north wall because she would never ask a subordinate to stand a watch she would not. John climbs up with two mugs and no particular excuse."
  ova_rey.21.f: "Her tail betrays her a half-second before her face does."
  ova_rey.21.a: "Stand the whole watch beside her, hour for hour."
  ova_rey.21.b: "Bring her a warm cloak and keep her company a while."
  ova_rey.21.c: "Order her to rest and take the watch yourself."

  ova_rey.22.t: "The Sparring Yard"
  ova_rey.22.d: "Bruna challenges John to the sparring yard, half to test the hero and half for the sheer joy of a good bout. The whole watch gathers to watch their captain take the measure of the otherworlder."
  ova_rey.22.f: "She fights like she means everything, because she does."
  ova_rey.22.a: "Meet her at full strength and lose gracefully on purpose."
  ova_rey.22.b: "Fight her honestly and win, then help her up."
  ova_rey.22.c: "Decline; a hero does not brawl with the watch."

  ova_rey.23.t: "The Riot in the Kennelward"
  ova_rey.23.d: "A grain shortage sparks an ugly crowd in the poorest ward of Welpenstadt. Bruna stands between the mob and a locked warehouse, torn between her orders and her people, and looks to John for what a hero would do."
  ova_rey.23.f: "The wrong word here breaks something in her that no apology mends."
  ova_rey.23.a: "Stand at her shoulder and hold the line without a drop of blood."
  ova_rey.23.b: "Disperse the mob yourself and spare her the choice."
  ova_rey.23.c: "Tell her to crack down hard and be done with it."

  ova_rey.24.t: "Off Duty at Last"
  ova_rey.24.d: "A rare evening with the captain out of her armor. Bruna is shy without the uniform to hide behind, and talks too fast about nothing at all, the way people do when the something is too big to say."
  ova_rey.24.f: "Off duty, she is younger, and softer, and terrified he will notice."
  ova_rey.24.a: "Walk her home the long way and let her talk about nothing."
  ova_rey.24.b: "Gift her a new whistle for the watch, engraved."
  ova_rey.24.c: "Ask her, awkwardly, about promotion paperwork."

  ova_rey.25.t: "The Deserter’s Trial"
  ova_rey.25.d: "A green recruit of Bruna’s watch broke and ran during the riot, and now sits in her cells awaiting judgement. The law is plain and hard; the boy is nineteen and terrified, and Bruna cannot make her hand write the sentence."
  ova_rey.25.f: "She would rather take the lash herself than be the one to break him."
  ova_rey.25.a: "Stand for the frightened boy and pay his debt yourself."
  ova_rey.25.b: "Help her weigh the law and the mercy of it, together."
  ova_rey.25.c: "Tell her to make an example and move on."

  ova_rey.26.t: "The Parade Review"
  ova_rey.26.d: "The republic sends an inspector, and Bruna has drilled her watch for a month to shine for him. On the morning of the review she is stiff with nerves, wanting more than she will admit for John to see what she has built out of a ragged town guard."
  ova_rey.26.f: "She has never in her life cared what one particular onlooker thought. Until now."
  ova_rey.26.a: "Stand in the ranks with her watch and drill as one of them."
  ova_rey.26.b: "Praise the watch loudly and let her take the credit."
  ova_rey.26.c: "Review the ranks like a general and note every fault."

  ova_rey.27.t: "The Oath Stone"
  ova_rey.27.d: "There is an old grey stone above Welpenstadt where dogkin have sworn their loyalties for a thousand years, and Bruna brings John to it at dusk, unable to quite say why. Her hand rests on the worn granite, and she watches to see what his will do."
  ova_rey.27.f: "A dogkin does not bring you to the oath stone lightly, or twice."
  ova_rey.27.a: "Lay your hand on the old stone beside hers and mean it."
  ova_rey.27.b: "Ask her to teach you the words first."
  ova_rey.27.c: "Call it a quaint custom and stand aside."

  ova_rey.28.t: "A Faithful Heart"
  ova_rey.28.d: "Bruna comes to John at parade rest, as though reporting for duty, and then abandons the posture entirely. She says she has guarded a great many things in her life, and would like, if he will have her, to guard one man for the rest of it."
  ova_rey.28.f: "A dogkin gives her loyalty exactly once, and means it forever."
  ova_rey.28.a: "Accept the truest guard in the republic."
  ova_rey.28.b: "Pin your own badge over her heart and answer yes."
  ova_rey.28.c: "Swear it back to her at the oath stone, watch and all."

  ova_rey.29.t: "The Captain’s Vow"
  ova_rey.29.d: "Captain Bruna Falk hands her watch-roster to a startled lieutenant, marches straight to the hero’s household, and posts herself there as its first and fiercest defender. She has never in her life been so off duty or so on."
  ova_rey.29.f: "Two states won. The republic is beginning to talk."
  ova_rey.29.a: "Two down. Onward."

  # --- BARENBERG: Ursla, the bearkin mountain smith
  ova_rey.30.t: "The Smith Who Bends Iron"
  ova_rey.30.d: "The great forge of Barenberg belongs to Ursla Steinfell, a bearkin a full head taller than John, who bends a cooling bar straight with her bare hands to make a point and then goes pink to the ears when he applauds. She growls that she has no time for court dandies."
  ova_rey.30.f: "The bigger the bear, it is said, the softer the heart she guards."
  ova_rey.30.a: "Take up the second hammer and work the forge with her."
  ova_rey.30.b: "Commission the grandest blade she has ever been asked for."
  ova_rey.30.c: "Stare, because she is very large and very strong."

  ova_rey.31.t: "The Arm-Wrestle at the Alehouse"
  ova_rey.31.d: "Barenberg settles its friendships at the arm-wrestling table, and Ursla has never lost. She plants her elbow, grins down at John, and dares the hero of the republic to embarrass himself in front of the whole mountain."
  ova_rey.31.f: "She respects exactly two things: honest strength and honest defeat."
  ova_rey.31.a: "Go all out and hold her arm to a proud, roaring draw."
  ova_rey.31.b: "Lose cheerfully and buy the whole hall a round."
  ova_rey.31.c: "Win with an otherworld trick and gloat."

  ova_rey.32.t: "The Climb to the Cinder Peak"
  ova_rey.32.d: "Ursla knows a place above the smoke where the whole range turns gold at dawn, and she has never shown it to a soul. She shoulders both packs before John can argue and starts up the mountain, pretending the invitation was nothing."
  ova_rey.32.f: "She would carry the mountain itself if it meant he kept climbing."
  ova_rey.32.a: "Match her pace up the mountain and watch the dawn together."
  ova_rey.32.b: "Let her carry the packs, since she insists, and thank her."
  ova_rey.32.c: "Complain about the cold the whole way up."

  ova_rey.33.t: "The Cave-In"
  ova_rey.33.d: "A gallery collapses with a shift down the seam, and miners are trapped behind a fallen beam that even Ursla cannot hold alone for long. She braces it, teeth bared, and there is exactly one pair of hands nearby."
  ova_rey.33.f: "Strength is easy to admire. Strength you can lean on is another thing."
  ova_rey.33.a: "Hold the fallen beam with her, shoulder to shoulder, till all are out."
  ova_rey.33.b: "Dig the miners free while she braces the roof."
  ova_rey.33.c: "Shout for the crews and organize from safety."

  ova_rey.34.t: "Soft Words, Hard Hands"
  ova_rey.34.d: "By the banked forge, Ursla admits, very quietly, that she has always been too big and too strong for anyone to want to hold, and has stopped expecting otherwise. She will not look at John while she says it."
  ova_rey.34.f: "The strongest hands in Barenberg, and no one has ever simply held them."
  ova_rey.34.a: "Tell her that gentle is not the opposite of strong."
  ova_rey.34.b: "Forge her a ring at her own anvil while she sleeps."
  ova_rey.34.c: "Awkwardly compliment her grip strength."

  ova_rey.35.t: "The Masterwork"
  ova_rey.35.d: "Ursla attempts the piece of her life, a sword folded a thousand times that will make or break her name among the smiths. At the final pour her hands are shaking with the weight and the wanting, and she needs a second pair she can trust absolutely."
  ova_rey.35.f: "She has never let another soul touch a masterwork at the last. She lets him."
  ova_rey.35.a: "Steady the great tongs with her through the last pour."
  ova_rey.35.b: "Fetch and pump and keep the fire perfect for a day."
  ova_rey.35.c: "Buy the finished piece and put your own name to it."

  ova_rey.36.t: "The Mountain Feast"
  ova_rey.36.d: "The bearfolk throw a feast that shakes the peak, all roaring song and barrels the size of men, and Ursla drags John into the middle of it half-daring him to keep up with her enormous, rowdy clan. They are watching to see if the little otherworlder breaks."
  ova_rey.36.f: "To be loved by a bear is to be loved by the whole loud mountain of them."
  ova_rey.36.a: "Match the mountain drink for drink and song for song."
  ova_rey.36.b: "Toast her clan and learn every rowdy name."
  ova_rey.36.c: "Slip out early and let the bears roar without you."

  ova_rey.37.t: "The Quiet Forge"
  ova_rey.37.d: "Late, with the mountain asleep, Ursla works alone at the small anvil that is hers and no one else’s, shaping something delicate she will not show. She does not send John away when he comes in, only makes room on the bench beside her."
  ova_rey.37.f: "The loud bear is loudest so no one hears how quiet the real her is."
  ova_rey.37.a: "Just sit in the warm dark and watch her work, saying nothing."
  ova_rey.37.b: "Ask her to teach you the one secret she keeps."
  ova_rey.37.c: "Pry after the trick worth a fortune in any market."

  ova_rey.38.t: "Tempered Together"
  ova_rey.38.d: "Ursla takes a breath like a bellows, says she is no good at speeches, and asks John plainly whether a man could stand to be loved by someone who could carry him over one shoulder. She braces, as if for a blow, for his answer."
  ova_rey.38.f: "She has forged a thousand things and never once dared forge this."
  ova_rey.38.a: "Answer by letting her lift you off your feet."
  ova_rey.38.b: "Take her huge hand in both of yours and hold on."
  ova_rey.38.c: "Forge the rings together, one at each anvil."

  ova_rey.39.t: "The Mountain’s Bride"
  ova_rey.39.d: "Ursla Steinfell bangs out a wedding-ring on her own anvil, sizes it for a hand far smaller than hers, and carries the laughing hero through Barenberg on one shoulder while the whole mountain cheers. She has never smiled so wide."
  ova_rey.39.f: "Three states won. Halfway, and the republic is scandalized and delighted."
  ova_rey.39.a: "Three down. Onward."

  # --- HASENHAFEN: Lieselotte, the rabbitkin harvest maiden
  ova_rey.40.t: "The Girl Among the Clover"
  ova_rey.40.d: "In a clover field outside Hasenhafen, John comes upon Lieselotte Klee, a rabbitkin harvest maiden with a basket on her arm and a start in her step, who very nearly bolts at the sight of a stranger before her manners catch her. She offers him a shy handful of berries by way of apology."
  ova_rey.40.f: "The gentlest heart in the republic, and the easiest to frighten off."
  ova_rey.40.a: "Kneel in the field and help her bring in the harvest."
  ova_rey.40.b: "Praise the finest crop in all Hasenhafen."
  ova_rey.40.c: "Startle at how fast a frightened rabbit can bolt."

  ova_rey.41.t: "Baking Day"
  ova_rey.41.d: "Lieselotte’s little kitchen smells of honey and warm bread, and she has, with enormous courage, invited the hero to help. She ties an apron on him with trembling paws and tries not to squeak when their hands meet over the dough."
  ova_rey.41.f: "She has practiced this invitation in the mirror for a week."
  ova_rey.41.a: "Ruin your hands in the dough and let her laugh at you."
  ova_rey.41.b: "Bring rare honey from the capital for her recipe."
  ova_rey.41.c: "Eat everything and forget to compliment the baker."

  ova_rey.42.t: "The Spring Fair"
  ova_rey.42.d: "The spring fair fills the Hasenhafen green with ribbons and fiddles. Lieselotte, greatly daring, slips her paw into John’s so as not to lose him in the crowd, and then goes crimson and refuses to let go."
  ova_rey.42.f: "For a shy girl, a crowded fair is the boldest possible declaration."
  ova_rey.42.a: "Win her the ribbon at every stall until her arms are full."
  ova_rey.42.b: "Dance with her under the maypole till she is dizzy."
  ova_rey.42.c: "Lecture her about the economics of festival stalls."

  ova_rey.43.t: "The Flood on the Weir"
  ova_rey.43.d: "The spring melt breaches the weir and the low fields begin to drown, children and livestock and the whole harvest at risk. Lieselotte, of all people, does not run; she wades in, calling the village to order, and looks to John to stand with her."
  ova_rey.43.f: "The timid ones, when it truly matters, are so often the bravest of all."
  ova_rey.43.a: "Carry the little ones to high ground while she rallies the village."
  ova_rey.43.b: "Dam the breach yourself with sandbags and stubbornness."
  ova_rey.43.c: "Tell her the harvest is a loss and to save herself."

  ova_rey.44.t: "Under the Harvest Moon"
  ova_rey.44.d: "The fields are saved and the barns are full. Under a huge harvest moon, Lieselotte confesses she has always thought of herself as the frightened one, the one who runs, and cannot understand why she feels brave whenever John is near."
  ova_rey.44.f: "She has never once described herself as brave until tonight."
  ova_rey.44.a: "Tell her that brave and timid can be the same brave heart."
  ova_rey.44.b: "Give her a pressed four-leaf clover you kept all season."
  ova_rey.44.c: "Ask, too directly, why she trembles so much."

  ova_rey.45.t: "The Market Day"
  ova_rey.45.d: "Lieselotte has the finest produce in Hasenhafen and cannot make herself call out a single price, shrinking behind her own stall while louder sellers steal her custom. John finds her nearly in tears over a full cart and an empty purse."
  ova_rey.45.f: "She does not need a rescuer. She needs someone to believe she can do it herself."
  ova_rey.45.a: "Buy nothing, but stay all day until she is calling prices herself."
  ova_rey.45.b: "Stand at her elbow and gently coax her voice out."
  ova_rey.45.c: "Take over the stall and sell the lot in an hour."

  ova_rey.46.t: "The Lantern Walk"
  ova_rey.46.d: "On the eve of the harvest, the village floats paper lanterns down the slow river, one wish to a light. Lieselotte shyly presses a folded lantern into John’s hands and will not tell him what she wished, though her ears go pink enough to guess."
  ova_rey.46.f: "A whole river of small bright wishes, and hers is standing right beside her."
  ova_rey.46.a: "Set your lantern on the water beside hers and make one wish."
  ova_rey.46.b: "Light the whole village’s lanterns for the children."
  ova_rey.46.c: "Explain the physics of why the lanterns float."

  ova_rey.47.t: "The Warren Gathering"
  ova_rey.47.d: "Lieselotte gathers the courage to bring John home to a warren of rabbitkin kin beyond counting, aunts and cousins and a tumbling heap of little ones, all of them shy as she is and desperate to like him. It is the whole of her world, held out in two trembling paws."
  ova_rey.47.f: "To marry a rabbit is to be adopted, wholesale, by a very large and very nervous family."
  ova_rey.47.a: "Sit on the floor with the little ones and let them climb you."
  ova_rey.47.b: "Bring gifts enough for the whole enormous family."
  ova_rey.47.c: "Impress the elders with talk of the wider world."

  ova_rey.48.t: "A Gentle Yes"
  ova_rey.48.d: "Lieselotte twists her apron into knots, gathers every scrap of courage a rabbitkin owns, and manages to ask John whether he might, possibly, if it is not too much trouble, want to stay with her always. She squeezes her eyes shut and waits."
  ova_rey.48.f: "It is the bravest thing she has ever done, and it is barely a whisper."
  ova_rey.48.a: "Let her whisper it into your collar so no one else can hear."
  ova_rey.48.b: "Cup her face and answer for her, softly."
  ova_rey.48.c: "Let the whole warren hear it, so she never has to say it twice."

  ova_rey.49.t: "The Harvest Bride"
  ova_rey.49.d: "Lieselotte Klee walks into the hero’s household on John’s arm without bolting once, a wreath of clover in her hair and a whole village of Hasenhafen trailing behind with baskets of gifts. She has never felt so brave or so safe."
  ova_rey.49.f: "Four states won. One vale of foxes left, and it will not be so easy."
  ova_rey.49.a: "Four down. One to go."

  # --- FUSCHTAL: Fenna, the foxkin scholar
  ova_rey.50.t: "The Fox Who Asks the Riddles"
  ova_rey.50.d: "The scholar of Fuschtal is Fenna Rotwald, a russet foxkin who greets the famous hero not with a bow but with a riddle, tail curled around her ankles, watching to see whether the otherworlder is as clever as he is celebrated. She rather expects to be disappointed."
  ova_rey.50.f: "She has never met a puzzle, or a man, she could not eventually read."
  ova_rey.50.a: "Answer her riddle with a sharper riddle of your own."
  ova_rey.50.b: "Admit you are stumped and ask her to teach you."
  ova_rey.50.c: "Guess wildly and wrong, with great confidence."

  ova_rey.51.t: "The Midnight Library"
  ova_rey.51.d: "Fenna keeps the vale’s great library, and works it best by lamplight. She lets John in after hours, ostensibly to settle a scholarly wager, and spends the night trading knowledge with him across a table of open books."
  ova_rey.51.f: "She is fishing for what he knows. She is careful not to notice she enjoys it."
  ova_rey.51.a: "Trade her a secret of your own world for one of hers."
  ova_rey.51.b: "Read to her until the lamp gutters out."
  ova_rey.51.c: "Fall asleep on the books she wanted to discuss."

  ova_rey.52.t: "The Game of Wits"
  ova_rey.52.d: "Fenna proposes a game of strategy she has never lost, all feints and hidden stones. Halfway through, John realizes she is cheating with breathtaking artistry, and that she knows he has realized, and is delighted."
  ova_rey.52.f: "A fox flirts the way a fox does everything: sideways, and to win."
  ova_rey.52.a: "Let her think she is winning, then reveal you saw it all."
  ova_rey.52.b: "Play earnestly and cede a graceful loss."
  ova_rey.52.c: "Accuse her, correctly, of cheating."

  ova_rey.53.t: "The Forbidden Chapter"
  ova_rey.53.d: "Fenna’s curiosity leads her too deep into a sealed archive, and something in the old dark answers her. Cornered among the shelves, cleverness for once no use to her, she finds John already moving to put himself in the way."
  ova_rey.53.f: "The one riddle a scholar forgets: some doors are locked for the asker’s sake."
  ova_rey.53.a: "Stand between her and the thing that answered her research."
  ova_rey.53.b: "Burn the dangerous manuscript before it costs her."
  ova_rey.53.c: "Tell her that her curiosity has gone too far."

  ova_rey.54.t: "Behind the Clever Smile"
  ova_rey.54.d: "Rattled and grateful and hating both, Fenna lets the teasing mask slip for once. She admits she hides behind riddles because a straight answer can be used against you, and asks John, warily, what he makes of the fox underneath."
  ova_rey.54.f: "It is the first entirely honest sentence she has said to him."
  ova_rey.54.a: "Tell her you like the truths she hides more than the tricks."
  ova_rey.54.b: "Give her a puzzle box that opens to a question."
  ova_rey.54.c: "Try, and fail, to out-riddle her again."

  ova_rey.55.t: "The Cartographer’s Puzzle"
  ova_rey.55.d: "Fenna finds a moth-eaten map webbed with ciphers no scholar has cracked in a century, and cannot sleep until it is solved. She spreads it between herself and John at midnight, and for once wants his mind beside hers more than she wants to win alone."
  ova_rey.55.f: "The greatest compliment a fox can pay is to share the puzzle instead of hoarding it."
  ova_rey.55.a: "Chase the map’s ending at her side, wherever it leads."
  ova_rey.55.b: "Solve the last cipher for her and let her write it up."
  ova_rey.55.c: "Sell the decoded map to a treasure-hunter for a fortune."

  ova_rey.56.t: "The Debate"
  ova_rey.56.d: "A pompous visiting scholar means to humiliate Fenna before the whole vale, and for all her cleverness she is one voice against a famous name. She lifts her chin and refuses to back down, and does not ask for help, which is precisely when she needs it most."
  ova_rey.56.f: "She would rather lose alone than be seen to want rescuing. He knows better."
  ova_rey.56.a: "Feed her the one fact that wins it and let her land the blow."
  ova_rey.56.b: "Take the podium and argue her case beside her."
  ova_rey.56.c: "Win the crowd for yourself with an otherworld flourish."

  ova_rey.57.t: "The Observatory"
  ova_rey.57.d: "High in the vale’s old observatory, Fenna charts the turning stars, and invites John up on the pretext of needing a second pair of eyes. The night is long and cold and full of quiet, and neither of them says a word about the telescope for hours."
  ova_rey.57.f: "The cleverest woman in two worlds, and she brought him here to run out of clever things to say."
  ova_rey.57.a: "Trade one true thing for each star, until dawn."
  ova_rey.57.b: "Name the constellations of your world against hers."
  ova_rey.57.c: "Chart the sky properly and forget she is beside you."

  ova_rey.58.t: "The One Riddle She Cannot Solve"
  ova_rey.58.d: "Fenna lays out her final riddle, and then confesses the trick of it: she has no answer, because the riddle is why she cannot stop thinking about a certain otherworlder, and she was rather hoping he might solve it for her."
  ova_rey.58.f: "The cleverest woman in two worlds, entirely out of clever things to say."
  ova_rey.58.a: "Give her the answer: it was always going to be you."
  ova_rey.58.b: "Let her win this one, and lose your heart on purpose."
  ova_rey.58.c: "Answer her riddle with a ring, and no words at all."

  ova_rey.59.t: "The Vixen’s Answer"
  ova_rey.59.d: "Fenna Rotwald closes the great library of Fuschtal, packs one trunk of her most dangerous books, and arrives at the hero’s household claiming she has simply run out of riddles worth staying for. Her tail, traitorously, will not stop wagging."
  ova_rey.59.f: "Five states courted. Every heart he set out to win, won. Now what?"
  ova_rey.59.a: "Five down. All of them."

  # --- Shared endings
  ova_rey.80.t: "She Moves On"
  ova_rey.80.d: "The season turns, and the courtship never quite caught fire. She wishes John well with a kindness that stings worse than anger would, and goes back to her own life. Somewhere in the next state, another story is already waiting to begin."
  ova_rey.80.f: "Not every heart is won. A hero learns, and rides on."
  ova_rey.80.a: "Wish her well, and move on."

  ova_rey.78.t: "The Hero Falls"
  ova_rey.78.d: "Against all the odds a summoned hero is supposed to defy, John Paradox is gone. The women who loved him, and the many more who might have, are left to mourn a story cut off in its first act. The republic lowers its banners."
  ova_rey.78.f: "Even plot armor is only a story, and stories can end."
  ova_rey.78.a: "A grievous loss."

  ova_rey.90.t: "A President for a New Reyorn"
  ova_rey.90.d: "John Paradox set out to charm a beastfolk daughter of every state, and somehow ended by uniting the republic in his own household. The cat merchants of Katzenburg, the dogkin guard of Welpenstadt, the bearfolk of Barenberg, the rabbitkin of Hasenhafen, the foxfolk of Fuschtal: every people whose daughter he won now names the otherworlder their own. The councils, half exasperated and half adoring, ask him to stand for the presidency. Every bride he truly won will bring her whole nation into the founding cultures of Reyorn."
  ova_rey.90.f: "It is, everyone agrees, the strangest path to high office in living memory."
  ova_rey.90.a: "A quiet inauguration, and a home full of many peoples."
  ova_rey.90.b: "A grand festival of every fur and feather in the republic."
  ova_rey.90.c: "Stand as First Citizen, the hero the beastfolk chose."

  ova_rey.91.t: "The Paradox Republic"
  ova_rey.91.d: "President John Paradox takes the chair of Reyorn with a household of wives at his side and a republic remade in their image, its founding peoples as many as the hearts he won. The historians will argue for centuries about how a summoned hero conquered a nation entirely by falling in love with it. John, for his part, considers the whole thing a resounding success."
  ova_rey.91.f: "A hero from another world, and the republic he loved into being."
  ova_rey.91.a: "Long live the Paradox Republic."
