l_english:
  # --- .1 A Beggar at the Gate
  ova_murim.1.t: "Three Days at the Gate"
  ova_murim.1.d: "The young man outside the mountain gate has been there for three days. His clothes are thin and he has nothing with him but a travel bundle. He accepts water, refuses to leave, and gives the same answer whenever the gate disciples question him. He wants to take the outer-disciple trial. On the third morning, one of the guards finally notices that his breathing is still as steady as it was on the first."
  ova_murim.1.f: "The gate disciples stop laughing at him on the third morning."
  ova_murim.1.a: "Open the gate."
  ova_murim.1.b: "Turn him away."
  # --- .2 A Place in Hwasan
  ova_murim.2.t: "The Hwasan Trial Register"
  ova_murim.2.d: "At Hwasan, the same young man is found sweeping fallen plum petals from the steps before sunrise. A gatekeeper tells him applicants are supposed to wait below the lower terrace. He bows, returns the broom, and goes down without complaint. When the trial register is brought out later that morning, the gatekeeper quietly adds one more name."
  ova_murim.2.f: "He has not entered the sect yet, but the gatekeeper already remembers his face."
  ova_murim.2.a: "Open the gate."
  ova_murim.2.b: "Turn him away."
  # --- .3 Last Place in the East Yard
  ova_murim.3.t: "An Ordinary Result"
  ova_murim.3.d: "Kang Jin-woo's entrance trial is ordinary. His internal energy is nothing worth remarking on, his forms are clean but plain, and his sparring record sits in the middle of the board. Still, the instructors keep glancing his way. He never overreaches. He never panics. Even when he loses, the bout somehow ends before his opponent can press him too far. After the yard empties, an instructor finds a practice post cracked beneath its straw wrapping. No one admits to breaking it."
  ova_murim.3.f: "His name goes down near the bottom of the accepted list. One instructor circles it anyway."
  ova_murim.3.a: "Keep him in the east yard."
  # --- .4 The Heavenly Demon Rises
  ova_murim.4.t: "The Heavenly Demon Rises"
  ova_murim.4.d: "Drums sound from the five mountains north of the passes. Branch halls recall their disciples, storehouses are opened, and veteran masters return to their posts. The Orthodox elders know what such preparations mean. Amita, Gonryun, Jongnam, the Moyong Clan, and Gaebang once stood where the Cult's strongholds stand now. The south has not forgotten how those names disappeared."
  ova_murim.4.f: "The northern passes have been quiet for years. They are quiet no longer."
  ova_murim.4.a: "Let the faithful drill."
  # --- .5 The Banner of the Alliance
  ova_murim.5.t: "The Banner of the Alliance"
  ova_murim.5.d: "Eight banners rise over Hwasan. Paeng stands beside Tang, Namgung beside Jegal, and old rivals swear the alliance oath once more. No one pretends the grudges between them have vanished. They have simply agreed that the Heavenly Demon Sect comes first. Until the [concept_ova_murim_war] is settled, none of the eight will be left to face the north alone."
  ova_murim.5.f: "The oath is spoken cleanly. The looks exchanged afterward are less friendly."
  ova_murim.5.a: "Renew the oath."
  # --- .10 The Spy in the Inner Hall
  ova_murim.10.t: "The Spy in the Inner Hall"
  ova_murim.10.d: "Jin-woo asks the archive steward for a private meeting and lays three copied sutra pages on the table. Certain characters have been written with too much pressure. Read together, they form the names of supply routes. The handwriting belongs to an outer-hall deacon. A watch is placed on him, and two nights later he is caught passing a letter over the rear wall."
  ova_murim.10.f: "Jin-woo says the brushwork bothered him. The steward decides not to ask why he looked so closely in the first place."
  ova_murim.10.a: "Deal with him quietly."
  ova_murim.10.b: "Put him before the hall."
  # --- .11 The Flood He Read in the Sky
  ova_murim.11.t: "The Flood Marker"
  ova_murim.11.d: "While passing through the valley, Jin-woo notices the river already touching an old flood marker. The sky is clear, but meltwater is still coming down from the upper ridges and damp has begun to seep through two retaining walls. He returns to the sect and asks that the riverside granaries be emptied before the spring rain arrives. Several elders call it unnecessary work. The millers start moving grain that same afternoon."
  ova_murim.11.f: "When the first heavy rain comes, the millers send Jin-woo a jar of wine."
  ova_murim.11.a: "Move the grain uphill."
  ova_murim.11.b: "Leave the granaries where they are."
  # --- .16 Rumors from the Training Yard
  ova_murim.16.t: "Rumors in the Training Yard"
  ova_murim.16.d: "Stories about Jin-woo begin spreading through the training yard. One junior swears he saw him catch a falling roof beam with one hand. Another insists Jin-woo crossed half the yard before a thrown knife reached the wall. A third calls both of them liars; Jin-woo lost to a Second-Rate disciple the next morning. The arguments grow louder. Jin-woo keeps attending practice at the same rank as before."
  ova_murim.16.f: "The disciples cannot agree on how strong he is. Jin-woo seems perfectly content with that."
  ova_murim.16.a: "Shield him."
  ova_murim.16.b: "Let them talk."
  # --- .12 The Manual Under the Waterfall
  ova_murim.12.t: "The Manual Under the Waterfall"
  ova_murim.12.d: "A ruined waystation near an old waterfall bears the weathered crest of a saber school destroyed two generations ago. Jin-woo spends most of the afternoon examining the masonry and the channels cut to carry rainwater away. Behind a stone where the spray never reaches, he finds a sealed niche. A damaged saber manual lies inside."
  ova_murim.12.f: "The elders praise his luck. The escort disciples who watched him search say it did not look much like luck."
  ova_murim.12.a: "Study the manual."
  # --- .13 Poison in the Patriarch Cup
  ova_murim.13.t: "Poison in the Patriarch Cup"
  ova_murim.13.d: "The patriarch raises his teacup. Jin-woo moves. The cup shatters against the floor, and a moment later the food taster collapses across the table. The hall erupts. Jin-woo says he smelled something bitter in the steam. The physician cannot confirm that anyone should have noticed it from so far away."
  ova_murim.13.f: "Most people remember the poison, but the senior masters remember how quickly Jin-woo reached the patriarch."
  ova_murim.13.a: "Raise Jin-woo's standing."
  ova_murim.13.b: "Investigate first."
  # --- .15 Silver Behind the Drill Hall
  ova_murim.15.t: "Silver Behind the Drill Hall"
  ova_murim.15.d: "Repairs beneath the old drill hall uncover a section of foundation that does not match the building records. Jin-woo tells the workers to stop until the treasurer arrives. Behind the wall is an old emergency store with silver bars, sealed deeds, and a rusted strongbox. The oldest war ledger mentions such a reserve, but none of the later ledgers say where it was hidden."
  ova_murim.15.f: "The treasurer spends the rest of the day checking old records and muttering about lazy predecessors."
  ova_murim.15.a: "Bank the fortune."
  # --- .14 The Prodigy of the East Yard
  ova_murim.14.t: "The Prodigy of the East Yard"
  ova_murim.14.d: "A young applicant is rejected because her family has no standing. Jin-woo, watching from the edge of the yard, asks the examiners to let her demonstrate once more. Her internal cultivation is crude, but her footwork forces a senior disciple to reset his stance twice. Jin-woo puts his own name behind her admission. That makes refusing considerably harder."
  ova_murim.14.f: "The girl enters as an outer disciple. The examining elder pretends the second test was his idea."
  ova_murim.14.a: "Take her in."
  ova_murim.14.b: "The rolls are full."
  # --- .30 The War Council
  ova_murim.30.t: "The War Council"
  ova_murim.30.d: "The war council has argued over the northern roads for two days. Jin-woo finally moves three markers on the map and explains his reasoning: captured supply lists, the width of the mountain roads, fodder, and the Cult's habits in earlier border clashes. His plan leaves one pass nearly empty. The generals object until a scout arrives to report that the Cult has already withdrawn from it."
  ova_murim.30.f: "After that, the generals argue with him more quietly."
  ova_murim.30.a: "Study the map."
  # --- .31 The Ten Great Demons
  ova_murim.31.t: "The Ten Great Demons"
  ova_murim.31.d: "One of the Cult's Ten Great Demons has advanced too far from his supporting forces. Jin-woo asks permission to cut him off before the armies meet. The council offers an escort. He refuses it. Two days later he returns alone, his sleeve torn and the commander's token wrapped in bloodstained cloth. When an elder asks how the duel went, Jin-woo answers, 'It was troublesome.'"
  ova_murim.31.f: "No one in the hall laughs at the answer."
  ova_murim.31.a: "Let him go."
  ova_murim.31.b: "Keep him with the army."
  # --- .32 Assassins in the Night
  ova_murim.32.t: "Assassins in the Night"
  ova_murim.32.d: "Cult assassins cross the outer wall before dawn. Jin-woo comes into the courtyard barefoot with a borrowed sword. The alarm bell has barely sounded once when two attackers are already down. By the time the guards surround the courtyard, his sword has slowed again to the same plain, economical movements they know from daily practice."
  ova_murim.32.f: "Later, the guards argue over the first two exchanges. None of their versions match."
  ova_murim.32.a: "Leave the courtyard to Jin-woo."
  ova_murim.32.b: "Call the guards in force."
  # --- .33 The Traitor Elder
  ova_murim.33.t: "The Traitor Elder"
  ova_murim.33.d: "Grain meant for the northern stockades keeps disappearing. Jin-woo follows the false seals from one ledger to another until they lead to a senior elder whose reputation has never been questioned. The man has been buying safe passage for his family. In return, he promised to open a side gate when the Cult attacks."
  ova_murim.33.f: "The hall is silent when the ledgers are laid out. The elder does not deny the handwriting."
  ova_murim.33.a: "Expose him now."
  ova_murim.33.b: "Feed him false maps."
  # --- .34 The Artifact Caravan
  ova_murim.34.t: "The Artifact Caravan"
  ova_murim.34.d: "Sama couriers report a merchant caravan on the salt road traveling with far too many guards. Jin-woo compares the report with news of missing Cult relics and asks for the road maps. There is one bend where heavy wagons must slow before a steep climb. The council marks it for an ambush."
  ova_murim.34.f: "The Sama supplied the rumor. Jin-woo supplied the place to use it."
  ova_murim.34.a: "Burn it."
  ova_murim.34.b: "Sell the schedule to the Sama brokers."
  # --- .35 A Letter From the Heavenly Demon
  ova_murim.35.t: "A Letter From the Heavenly Demon"
  ova_murim.35.d: "A black iron needle is found buried in the council chamber door. A sealed letter hangs from it. The red seal belongs to Demon Mountain. The message contains only a few lines: 'Kang Jin-woo. You have hidden your claws well. Come north when you tire of showing them to my servants.'"
  ova_murim.35.f: "Several elders read the letter twice. Jin-woo reads it once."
  ova_murim.35.a: "Burn the letter."
  ova_murim.35.b: "Answer it."
  # --- .39 The Mountain Broken (Reckoning epilogue)
  ova_murim.39.t: "The Mountain Broken"
  ova_murim.39.d: "The Reckoning ends with the Heavenly Demon Sect broken. Its five strongholds fall, and old Orthodox lineages begin returning to lands they had abandoned generations ago. The names Amita, Gonryun, Jongnam, Moyong, and Gaebang are raised openly again. Jin-woo, who took his own seat by force, now commands a victorious mountain. Many obey him. Far fewer claim to understand him."
  ova_murim.39.f: "The war ends. The whispers about Jin-woo do not."
  ova_murim.39.a: "Let the mountain fall."
  # --- .50 The Empty Cot
  ova_murim.50.t: "The Empty Cot"
  ova_murim.50.d: "A routine count in one of the Cult's outer barracks turns up an empty bunk. The missing disciple appears on no transfer list, punishment record, or burial register. Such a report would normally stop with a hall master. Instead, it reaches the Heavenly Demon. He reads the name, draws one line beneath it, and sends the paper back."
  ova_murim.50.f: "The clerk who carried the report down the mountain does not know why the Heavenly Demon cared."
  ova_murim.50.a: "Note it, and wait."
  # --- .51 The Tribute Demand
  ova_murim.51.t: "The Tribute Demand"
  ova_murim.51.d: "Cult collectors arrive in the border valleys with new quotas for rice and iron. The villages have already paid once this season. The garrisons still demand more before the mountain roads worsen. Some local commanders want the stores filled even if the peasants have to borrow grain for winter."
  ova_murim.51.f: "The collectors call it tribute. The villagers use less respectful words after they leave."
  ova_murim.51.a: "Squeeze harder."
  ova_murim.51.b: "Ease the levy this season."
  # --- .52 The Blood Cavalry Rides
  ova_murim.52.t: "The Blood Cavalry Rides"
  ova_murim.52.d: "Red banners appear in the passes before dawn. The Blood Cavalry breaks through the first watch line and reaches the valley settlements before the nearest Orthodox garrison can gather. By the time the alarm bells carry south, smoke is already rising behind the riders."
  ova_murim.52.f: "Along the border, people know that marching song even when they cannot see the banners."
  ova_murim.52.a: "Let the raid run its course."
  # --- .53 The Demon Academy
  ova_murim.53.t: "The Demon Academy"
  ova_murim.53.d: "Another class graduates from the halls beyond the passes. Some are sent to martial units, others to counting houses, courier offices, and provincial posts. The Heavenly Demon Sect has ruled territory for too long to believe swords are the only way to take a mountain."
  ova_murim.53.f: "Not every disciple of the Demonic Path carries a blade."
  ova_murim.53.a: "The sword scripture."
  ova_murim.53.b: "The coin scripture."
  # --- .54 Doubt in the Lower Halls
  ova_murim.54.t: "Doubt in the Lower Halls"
  ova_murim.54.d: "Bad news from the passes reaches the lower halls faster than the elders can contain it. Disciples whisper that the Orthodox Alliance is stronger than expected and that several masters said to be unbeatable have already fallen. The talk has not become open dissent yet."
  ova_murim.54.f: "A junior disciple is whipped for repeating the rumor. By evening, twice as many people know it."
  ova_murim.54.a: "Purge the doubters."
  ova_murim.54.b: "Let them talk themselves out."
  # --- .55 Skirmish at the Passes
  ova_murim.55.t: "Skirmish at the Passes"
  ova_murim.55.d: "Orthodox scouts and a Cult patrol clash near the old boundary stones. It should have ended as another small fight in the high passes, but both sides begin calling for reinforcements. By nightfall, a skirmish could become a battle."
  ova_murim.55.f: "The watch commanders have seen this happen before."
  ova_murim.55.a: "Reinforce the line."
  ova_murim.55.b: "Trade space for time."
  # --- .56 An Infiltrator Caught
  ova_murim.56.t: "An Infiltrator Caught"
  ova_murim.56.d: "A servant is caught passing a sealed note to a mule driver outside the rear gate. His room contains copied supply tallies and guard rotations written in code. He has worked in the household for three years without drawing suspicion."
  ova_murim.56.f: "Three quiet years buy a great deal of trust. One bad letter can spend it all."
  ova_murim.56.a: "Execute him."
  ova_murim.56.b: "Turn him."
  # --- .60 The Manual Found
  ova_murim.60.t: "The Manual Found"
  ova_murim.60.d: "Weeks of following rumors through abandoned schools and old escort roads finally lead to something real: a damaged manual bearing the seal of a lineage thought extinct. Water has ruined several pages, but the core breathing method and most of the forms remain readable."
  ova_murim.60.f: "The senior instructors lock the training room before opening the first page."
  ova_murim.60.a: "Study it thoroughly."
  # --- .61 Qi Deviation
  ova_murim.61.t: "Qi Deviation"
  ova_murim.61.d: "During closed-door cultivation, internal energy rushes into the wrong meridians. The practitioner cannot stop the circulation and begins coughing blood before the attendants can break the door. Physicians and senior disciples work through the night to prevent permanent damage."
  ova_murim.61.f: "No one speaks of the next breakthrough until the pulse settles."
  ova_murim.61.a: "Rest and recover."
  # --- .64 The Grand Tournament
  ova_murim.64.t: "The Grand Tournament"
  ova_murim.64.d: "Tournament drums sound for several weeks. Sect disciples, clan heirs, wandering martial artists, and nameless hopefuls crowd the grounds beneath their banners. Old grudges come with them. At least here there are judges, rules, and a stage large enough to settle most of them without drawing blood in an alley."
  ova_murim.64.f: "By the second day, three private challenges have already been reported to the judges."
  ova_murim.64.a: "Host the tournament."
  # --- .65 The Spy Purge
  ova_murim.65.t: "The Spy Purge"
  ova_murim.65.d: "A search of the servants' quarters, courier ledgers, and outer-hall storerooms uncovers several Cult informants. It also uncovers smugglers, gamblers, secret lovers, and enough unrelated wrongdoing to keep the disciplinary hall busy for a month. The elders must decide how much further to push."
  ova_murim.65.f: "Once people start opening locked boxes, they rarely find only what they were looking for."
  ova_murim.65.a: "A thorough purge."
  ova_murim.65.b: "Limit the search to proven leads."
  # --- .70 The Murim Kneels
  ova_murim.70.t: "The Murim Kneels"
  ova_murim.70.d: "One Orthodox banner after another is destroyed, subjugated, or stripped of the land that kept it alive. When the last force capable of challenging the north collapses, messengers climb Demon Mountain with the reports. The Heavenly Demon listens to each one and orders the victory drums sounded once."
  ova_murim.70.f: "The sound carries far down the northern valleys."
  ova_murim.70.a: "Accept the mandate of the north."
  # --- .71 The Banner Holds
  ova_murim.71.t: "The Banner Holds"
  ova_murim.71.d: "The Heavenly Demon Sect is broken. Its surviving branches retreat beyond the passes, submit to the victors, or scatter into the gangho. For the first time in living memory, the eight Orthodox banners can lower their war footing without expecting a northern army behind the next ridge."
  ova_murim.71.f: "That night, several mountain gates remain open after sunset."
  ova_murim.71.a: "Let the banners stand down."
  # --- .72 The Death of Kang Jin-woo
  ova_murim.72.t: "The Death of Kang Jin-woo"
  ova_murim.72.d: "Kang Jin-woo dies before the war is finished. The first messenger is sent back because no one believes him. The second brings Jin-woo's sword. His room contains little worth dividing: a few clothes, old notes, medicine, and a handful of objects whose owners recognize them only after his death."
  ova_murim.72.f: "By the funeral, the stories about him have already grown larger than they were when he lived."
  ova_murim.72.a: "Mourn him properly."
  # --- .73 The Calamity Arrives (chapter fail: the Cult has mastered the murim)
  ova_murim.73.t: "The Calamity Arrives"
  ova_murim.73.d: "The defenses Jin-woo spent years strengthening fall one after another. Six Orthodox banners are gone, or five mountain seats now fly the Cult's colors. He remains on the wall after the last messenger leaves. Those nearby cannot tell whether he is surprised, angry, or simply tired."
  ova_murim.73.f: "No one asks him what he intends to do next."
  ova_murim.73.a: "Endure what comes."
  # --- .80 The Road North (final-battle opener)
  ova_murim.80.t: "The Road North"
  ova_murim.80.d: "Jin-woo begins putting his affairs in order. Old debts are paid, instructions are left with the Champion Hall, and a sword he rarely wears in public is taken apart and polished piece by piece. When the elders finally ask, he points north. The armies can break the outer strongholds. Someone still has to climb Demon Mountain and face the Heavenly Demon. Jin-woo asks to go."
  ova_murim.80.f: "For years people wondered what he was saving his strength for. No one asks that question now."
  ova_murim.80.a: "Let him make ready."
  # --- .81 The Ten Thousand Steps
  ova_murim.81.t: "The Ten Thousand Steps"
  ova_murim.81.d: "A black stone stair climbs Demon Mountain from the outer gate to the high temple. Jin-woo ascends beneath a white challenge banner. Cult disciples line the road but do not interfere; even the Demonic Path observes the rules of a formal life-and-death duel. Near the summit, Jin-woo stops lowering his presence. The disciples closest to the stair go pale and step back."
  ova_murim.81.f: "It is the first time many of them realize the rumors were too small, not too large."
  ova_murim.81.a: "Climb."
  # --- .82 The Duel of Life and Death (the final battle)
  ova_murim.82.t: "The Duel of Life and Death"
  ova_murim.82.d: "The high temple is cleared before the duel. Only the Heavenly Demon and Kang Jin-woo remain inside. Those below hear the first collision like thunder under the mountain. After that, there are only fragments: roof tiles blown into the valley, a stair split down the middle, pines cut flat across a ridge, and sword scars gouged into black stone. At sunset, one figure walks out through the smoke."
  ova_murim.82.f: "No witness sees the whole duel. The mountain is enough of a witness."
  ova_murim.82.a: "Wait for the one who comes down."
  # --- .84 The Sword That Came Down the Mountain (good-ending epilogue)
  ova_murim.84.t: "The Sword That Came Down the Mountain"
  ova_murim.84.d: "With Demon Mountain defeated, the five old Orthodox names return to the north: Amita, Gonryun, Jongnam, Moyong, and Gaebang. Jin-woo survives the war and, to everyone's surprise, returns to an ordinary routine whenever the murim allows it. He judges tournaments, argues with physicians, and teaches only what he chooses to teach. Questions about the summit usually receive a change of subject."
  ova_murim.84.f: "There are more than a hundred versions of the final duel. Jin-woo has never corrected one."
  ova_murim.84.a: "Let them sing."

  # ==================== The Eight Banners arc (.100-.143) ====================
  # --- SOR: Seok Hye-gang, the iron monk (sworn brother)
  ova_murim.100.t: "The Monk at the Flooded Ford"
  ova_murim.100.d: "The spring melt has washed out the bridge on the road to Sorim. A broad-shouldered monk stands in the river carrying travelers across one by one while younger disciples shout from the bank. Jin-woo watches for a moment, leaves his sword with the baggage, and steps into the water. Seok Hye-gang laughs, points at an old woman waiting on the bank, and tells him to start with her."
  ova_murim.100.f: "They exchange names only after the last traveler is across."
  ova_murim.100.a: "Cross together."
  ova_murim.101.t: "A Beast in the Ravine"
  ova_murim.101.d: "A spirit beast driven down by the flood corners the two men in a narrow ravine. There is only one path out, and it is barely wide enough for a single fighter to hold. Hye-gang steps into it without hesitation. Jin-woo is close enough to grab his shoulder before the beast charges."
  ova_murim.101.f: "The monk looks back once. That is all the time they have."
  ova_murim.101.a: "Step into the gap."
  ova_murim.101.b: "Let Hye-gang hold it."
  ova_murim.102.t: "The Pill of Nine Revolutions"
  ova_murim.102.d: "Inside the beast's lair they find a sealed jade bottle. Sorim's monks identify the pill within as a Pill of Nine Revolutions. Hye-gang has been stuck below his next realm for decades. One pill could break that wall. Jin-woo says nothing while the others look between the bottle and the two men."
  ova_murim.102.f: "Hye-gang laughs first and tells Jin-woo not to look at him like that."
  ova_murim.102.a: "Give the pill to Hye-gang."
  ova_murim.102.b: "Keep the pill."
  ova_murim.103.t: "Sworn Beneath the Bell"
  ova_murim.103.d: "Beneath Sorim's great bell, Seok Hye-gang offers the oath of sworn brotherhood. He does not ask about Jin-woo's cultivation, his past, or the stories following him through the gangho. He says he has seen enough. The wine is poured, the oath is spoken, and the bell is struck once."
  ova_murim.103.f: "Half the valley hears the bell before anyone outside the temple knows what happened."
  ova_murim.103.a: "Swear brotherhood."
  ova_murim.103.b: "Refuse the oath."
  # --- PAE: Paeng Ha-ran, the saber heiress, She-Bear of Hobuk (companion)
  ova_murim.104.t: "The Saber That Roars"
  ova_murim.104.d: "A border clash turns into an ambush until Paeng Ha-ran tears through the Cult's center with her saber and opens a road for the wounded. Jin-woo arrives with the relief force after the worst of the fighting. He finds the Hobuk heiress sitting on a broken shield with blood on one sleeve, loudly asking which of the newcomers is the disciple everyone has been talking about."
  ova_murim.104.f: "When Jin-woo steps forward, Ha-ran looks him up and down and says, 'You?'"
  ova_murim.104.a: "Meet the She-Bear of Hobuk."
  ova_murim.105.t: "The Rearguard at the Bridge"
  ova_murim.105.d: "The retreat reaches a narrow bridge while wounded men are still crossing. Ha-ran turns back before anyone gives the order. The Paeng disciples follow as if this is the most natural thing in the world. Jin-woo stops beside the bridge and looks once at the enemy coming through the trees."
  ova_murim.105.f: "The Paeng have too many ancestors who died at bridges. Ha-ran seems ready to add another."
  ova_murim.105.a: "Stand beside Ha-ran."
  ova_murim.105.b: "Leave the bridge to the Paeng."
  ova_murim.106.t: "The Saber Spirit Wakes"
  ova_murim.106.d: "During cultivation, Ha-ran's clan saber art turns violent inside her meridians. Her sword arm locks and blood runs from her fingertips. Jin-woo recognizes the pattern quickly enough to guide her breathing and force the stray energy back into its proper route. The distorted circulation also exposes a variation of the saber art normally hidden from outsiders."
  ova_murim.106.f: "Ha-ran is in too much pain to notice where Jin-woo is looking."
  ova_murim.106.a: "Stabilize her qi."
  ova_murim.106.b: "Watch the deviant saber form."
  ova_murim.107.t: "Blood Mixed Beneath the Sabers"
  ova_murim.107.d: "Before the old sabers in the Paeng ancestral shrine, Ha-ran cuts her palm and holds out her hand. The Paeng ride with those they have bled beside, she says. Since they have already done that, there is no reason to keep pretending this is a temporary alliance. Her grandmother watches from the steps and, for once, keeps quiet."
  ova_murim.107.f: "The shrine keeper notices the blood on the floor before anyone else does."
  ova_murim.107.a: "Accept the blood oath."
  ova_murim.107.b: "Refuse the oath."
  # --- TAN: Tang So-yeol, the poison maiden (companion)
  ova_murim.108.t: "A Gift of Three Poisons"
  ova_murim.108.d: "Tang So-yeol receives Jin-woo with three cups of tea. Everyone at the table knows the custom. He studies the color, smells the steam, and drinks each cup without reaching for an antidote. He names the first two poisons at once. The third makes him pause. When he asks whether So-yeol changed the usual formula herself, her eyes narrow."
  ova_murim.108.f: "For the first time that evening, So-yeol looks interested rather than bored."
  ova_murim.108.a: "Ask for the recipe."
  ova_murim.109.t: "The Antidote She Could Not Finish"
  ova_murim.109.d: "So-yeol has spent years rebuilding the Tang clan's lost hundred-herb antidote from damaged notes. Jin-woo points out that two herbs are being heated the same way despite reacting differently. The revised medicine looks right, but no physician will call it complete without a living test. By clan custom, a servant would be used."
  ova_murim.109.f: "So-yeol reaches for the servant bell. Jin-woo reaches for the bowl."
  ova_murim.109.a: "Drink the antidote himself."
  ova_murim.109.b: "Say nothing about the flaw."
  ova_murim.110.t: "The Venom in Her Own Veins"
  ova_murim.110.d: "A rival poisoner catches So-yeol with a venom even the Tang physicians cannot name. Her pulse grows weaker while the healers search for an answer. Only one prepared dose of a broad antidote remains. It would strengthen Jin-woo's own poison resistance as well."
  ova_murim.110.f: "The physician holds out the vial. No one in the room misunderstands the choice."
  ova_murim.110.a: "Give So-yeol the antidote."
  ova_murim.110.b: "Keep it for Jin-woo."
  ova_murim.111.t: "Tang Comes to the Table"
  ova_murim.111.d: "So-yeol arrives at the household gate with a mule train of medicine jars, three locked chests, and an inventory long enough to sour the quartermaster's mood. She explains that Jin-woo's handling of poisons is reckless, his dispensary is inadequate, and someone competent has to correct both problems."
  ova_murim.111.f: "She is given one shelf. By winter, she has taken a room."
  ova_murim.111.a: "Welcome her, and count the jars later."
  ova_murim.111.b: "Turn the mule train away."
  # --- NAM: Namgung Wol-hee, the proud young mistress (companion)
  ova_murim.112.t: "The Young Mistress Demands a Duel"
  ova_murim.112.d: "Namgung Wol-hee arrives in imperial blue and presents a formal writ of challenge. The rumors around Jin-woo's rise, she says, have become embarrassing enough that the Namgung clan has decided to test them directly. Her manners are flawless. So are the insults hidden inside them."
  ova_murim.112.f: "The seal on the challenge is genuine. So is the smile she wears while handing it over."
  ova_murim.112.a: "Accept the challenge."
  ova_murim.113.t: "The Duel She Must Not Lose"
  ova_murim.113.d: "The duel looks even to most of the crowd. The older masters stop believing that after a dozen exchanges. Jin-woo has begun arriving half a step early to every opening, then withdrawing before he can finish it. Wol-hee notices too. Her sword grows sharper each time he gives ground."
  ova_murim.113.f: "By the twentieth exchange, the people closest to the stage are no longer sure which of them is being tested."
  ova_murim.113.a: "Keep the duel close."
  ova_murim.113.b: "End the duel now."
  ova_murim.114.t: "Shoulder to Shoulder at the Pass"
  ova_murim.114.d: "Blood Cavalry outriders strike while Namgung wounded are still below the pass. Wol-hee takes charge of the evacuation and sends everyone she can spare down the mountain. Someone still has to hold the stone stair above them. Jin-woo stands at the top of it while the enemy officer retreats along the far slope."
  ova_murim.114.f: "Wol-hee looks back once before carrying the last wounded disciple down."
  ova_murim.114.a: "Hold the stair."
  ova_murim.114.b: "Pursue the enemy officer."
  ova_murim.115.t: "A Proud Woman Bows Once"
  ova_murim.115.d: "Wol-hee requests a formal audience and arrives in full Namgung dress. Before the hall, she bows once to Jin-woo and thanks him for holding the pass. The Namgung clan does not forget a debt of life, she says. The pledge that follows is delivered in the same precise tone."
  ova_murim.115.f: "Her attendants keep their faces straight until she finishes speaking."
  ova_murim.115.a: "Accept her pledge."
  ova_murim.115.b: "Refuse the pledge."
  # --- JEG: Jegal Seo-yeon, the strategist (companion)
  ova_murim.116.t: "Nineteen Questions"
  ova_murim.116.d: "Jegal Seo-yeon puts a go board between herself and Jin-woo. Over the game she asks about supply roads, sect politics, old campaigns, internal cultivation, and several gaps in his training record. She stops after nineteen questions. The twentieth, she says, can wait until she decides whether his evasions are deliberate or merely irritating."
  ova_murim.116.f: "She wins the game. Jin-woo answers eighteen questions."
  ova_murim.116.a: "Answer eighteen honestly."
  ova_murim.117.t: "The Plan That Costs a Column"
  ova_murim.117.d: "Seo-yeon's battle plan will hold the line, but one column must absorb the enemy's strongest push. She assigns the task to Jegal troops because they are hers to command. When the orders are read, Jin-woo studies that part of the map for a long time."
  ova_murim.117.f: "Seo-yeon knows exactly how many men that part of the plan is likely to cost."
  ova_murim.117.a: "Take the position himself."
  ova_murim.117.b: "Let the Jegal troops hold it."
  ova_murim.118.t: "The Credit for the Victory"
  ova_murim.118.d: "The battle ends in a clean victory. At the Alliance council, the elders assume Jin-woo devised the plan because his name has already become attached to every successful campaign. Seo-yeon sits beside the map and says nothing while the praise begins."
  ova_murim.118.f: "It would be easy to let the misunderstanding stand."
  ova_murim.118.a: "Name Seo-yeon before the council."
  ova_murim.118.b: "Let the praise stand."
  ova_murim.119.t: "The Strategist Chooses Her Board"
  ova_murim.119.d: "The Jegal council objects when Seo-yeon announces that she intends to join Jin-woo's household. Her memorial gives three pages of military reasoning and one line the elders dislike far more: she wants to serve where her plans will actually be used. She arrives a week later with one trunk of clothes and four of maps."
  ova_murim.119.f: "The household already had a map room. After Seo-yeon arrives, everyone else starts asking permission to enter it."
  ova_murim.119.a: "Give her the map room."
  ova_murim.119.b: "Turn her trunks away."
  # --- MUD: Wi Cheong-ha, the taoist priestess (companion)
  ova_murim.120.t: "The Eight Trigrams Courtyard"
  ova_murim.120.d: "Wi Cheong-ha meets Jin-woo in a Mudang courtyard laid out as an Eight Trigrams formation. Guests are supposed to follow the marked path. Jin-woo takes one wrong turn, stops, and then walks through three changing gates without touching a single ward. Cheong-ha closes the formation behind him and asks where an outer disciple learned that kind of footwork."
  ova_murim.120.f: "Jin-woo says he watched the flags. Cheong-ha looks at the flags, then back at him."
  ova_murim.120.a: "Ask her to show him the formation properly."
  ova_murim.121.t: "A Formation Breaks"
  ova_murim.121.d: "During a joint exercise, one of Mudang's old warding formations collapses with Cheong-ha still inside the central ring. Rebounding internal energy tears through the talisman anchors one after another. Anyone forcing a way inside will take the backlash through his own meridians."
  ova_murim.121.f: "Cheong-ha is already bleeding when Jin-woo reaches the edge of the formation."
  ova_murim.121.a: "Enter the formation."
  ova_murim.121.b: "Stay outside."
  ova_murim.122.t: "The Purple Cloud Talisman"
  ova_murim.122.d: "Cheong-ha completes a Purple Cloud Talisman array capable of pushing her internal art through a long-standing bottleneck. It requires a reservoir of pure energy to activate, and the household has enough for only one use. The same resource could also be used in Jin-woo's cultivation."
  ova_murim.122.f: "The medicine hall places the sealed container between them."
  ova_murim.122.a: "Give Cheong-ha the reservoir."
  ova_murim.122.b: "Use it for Jin-woo."
  ova_murim.123.t: "Cheong-ha Leaves Mudang"
  ova_murim.123.d: "Mudang's elders object when Cheong-ha asks leave to enter Jin-woo's household as its formation master. She listens to every objection, bows, and submits a list of formations she intends to build there, including defenses for the northern roads. By the time the elders finish arguing, her baggage is already at the foot of the mountain."
  ova_murim.123.f: "The porter was told about the swords. No one mentioned the boxes of formation flags."
  ova_murim.123.a: "Make room for her formation hall."
  ova_murim.123.b: "Send her back up the mountain."
  # --- SAM: Sama Ryeon, the information broker (companion)
  ova_murim.124.t: "The Blank Page"
  ova_murim.124.d: "Sama Ryeon receives Jin-woo in the back room of a teahouse and pushes a thin dossier across the table. It contains inn registers, old gate records, copied employment rolls, and three different stories about where he learned martial arts. The last page is blank. Ryeon taps it once and says that page cost her more than all the others."
  ova_murim.124.f: "The Sama can usually buy a man's past. This one keeps returning receipts that do not match."
  ova_murim.124.a: "Ask what the blank page costs."
  ova_murim.125.t: "The Debt She Cannot Call In"
  ova_murim.125.d: "A rival house buys enough of Ryeon's debts to threaten her courier network. If the obligations are called in together, half her listening posts will close within the month. The household has enough silver to clear them. It also has enough silver to buy them and become her new creditor."
  ova_murim.125.f: "Ryeon reads the figures twice before she puts down the ledger."
  ova_murim.125.a: "Pay the debts and ask for nothing."
  ova_murim.125.b: "Buy the debts instead."
  ova_murim.126.t: "A Price Beyond Coin"
  ova_murim.126.d: "A wounded Sama courier reaches the household with a broken seal and half a message. Ryeon is riding toward a meeting that her own people now believe is an ambush. Sending a warning will expose the courier line and ruin a chance to identify the rival network behind the trap."
  ova_murim.126.f: "There is not enough time to wait for the other half of the message."
  ova_murim.126.a: "Warn Ryeon."
  ova_murim.126.b: "Trace the rival network."
  ova_murim.127.t: "The Ledger Closes"
  ova_murim.127.d: "Ryeon joins the household without ceremony. She brings two ledgers, one travel chest, and a list of teahouses whose owners should now be paid from a different account. Within a week, reports start arriving half a day earlier than before."
  ova_murim.127.f: "The Sama elders call it cooperation. Their younger brokers use a different word."
  ova_murim.127.a: "Show her the map room."
  ova_murim.127.b: "The household keeps no brokers."
  # --- HWA: Yeon Seol-mae, the sword saintess (companion)
  ova_murim.128.t: "Plum Blossoms Out of Season"
  ova_murim.128.d: "Yeon Seol-mae meets Jin-woo at a Hwasan shrine and proposes three friendly sword exchanges. The third becomes a fourth, then a fifth. Jin-woo gives ground often, but once their blades meet hard enough for internal energy to shake late plum blossoms from the old tree above them. Seol-mae lowers her sword and asks his name again."
  ova_murim.128.f: "The watching disciples spend the rest of the day arguing over whose energy shook the tree."
  ova_murim.128.a: "Give her the name."
  ova_murim.129.t: "The Blossom That Will Not Bloom"
  ova_murim.129.d: "Seol-mae has been stalled for years at the final transition of Hwasan's Plum Blossom Sword. During repeated sparring, Jin-woo points out that her shoulder tightens just before the turn. She corrects it once. The next form flows farther than it ever has before."
  ova_murim.129.f: "Seol-mae repeats the motion until sunset."
  ova_murim.129.a: "Point out the missing step."
  ova_murim.129.b: "Keep the insight."
  ova_murim.130.t: "Two Swords on the Peak"
  ova_murim.130.d: "An assassin strikes at Seol-mae during a midnight visit to the shrine. The blade comes through a blind angle her guard cannot cover in time. Jin-woo is close enough to interfere, but the distance is too short for a clean answer."
  ova_murim.130.f: "The assassin has already committed to the thrust."
  ova_murim.130.a: "Intercept the blade."
  ova_murim.130.b: "Use Seol-mae as cover."
  ova_murim.131.t: "The Saintess Leaves the Mountain"
  ova_murim.131.d: "Hwasan offers Seol-mae a place in the succession. She refuses and asks leave to join Jin-woo's household instead. The coming war, she argues, needs Hwasan's sword where the fighting is hardest. The elders spend three days trying to change her mind and a fourth deciding what gifts she should take."
  ova_murim.131.f: "By the time she reaches the foot of the mountain, the elders have already begun boasting about where their saintess is going."
  ova_murim.131.a: "Open the gate."
  ova_murim.131.b: "The mountain needs its saintess more."

  # ==================== The home banner (.140-.143) ====================
  ova_murim.140.t: "The House That Took Him In"
  ova_murim.140.d: "Two years after Jin-woo entered through the outer gate, his name is known far beyond the mountain. Inside the sect, his position is still awkward. A Champion Hall would give his followers a proper place in the hierarchy, and the support of the house's young mistress or senior disciple would silence many of the remaining objections."
  ova_murim.140.f: "The gangho may call him a prodigy. The inner hall still remembers when he carried water with the outer disciples."
  ova_murim.140.a: "Begin with his own house."
  ova_murim.141.t: "The Elder Who Would Not Believe"
  ova_murim.141.d: "A senior elder insists on sending supplies through a road Jin-woo has already warned against. Bandits have grown active there, the ground is poor for carts, and the old man refuses to change course because yielding to a junior would cost him face. The convoy leaves in the morning."
  ova_murim.141.f: "The same elder gave Jin-woo his first winter uniform when he entered the sect."
  ova_murim.141.a: "Reinforce the convoy quietly."
  ova_murim.141.b: "Let the elder answer for it."
  ova_murim.142.t: "The Rite of the Inner Hall"
  ova_murim.142.d: "The inner hall prepares a rare rite normally reserved for the chosen heir. Medicines, internal energy, and months of preparation have been gathered for a single breakthrough. Against custom, Jin-woo is offered the place. The person whose house first took him in has reached the same bottleneck."
  ova_murim.142.f: "Only one person can enter the chamber."
  ova_murim.142.a: "Yield the rite."
  ova_murim.142.b: "Accept the rite."
  ova_murim.143.t: "The Vow of His Own House"
  ova_murim.143.d: "In the ancestral hall, the person closest to the house makes her position clear before the elders can begin another argument. She will stand with Jin-woo. Anyone who still questions his place may bring the complaint to her first. The words are simple, but everyone in the hall understands what kind of pledge has just been made."
  ova_murim.143.f: "No elder raises the objection he had prepared."
  ova_murim.143.a: "Accept her pledge."
  ova_murim.143.b: "Refuse the pledge."

  # ==================== objective-decision outcomes (.144-.147) ====================
  ova_murim.144.t: "The Hobuk Saber Trials"
  ova_murim.144.d: "Saber schools from across Hobuk fill the training grounds for the Paeng trials. Jin-woo sits with the judges and leaves the stage to those who came to prove themselves. Ha-ran's grandmother spends most of the finals criticizing everyone's footwork, including that of her own descendants."
  ova_murim.144.f: "The loudest argument of the day comes from the judges' table."
  ova_murim.144.a: "Let the sabers sing."
  ova_murim.145.t: "The Fire Formulas Restored"
  ova_murim.145.d: "The lost Tang fire formulas are brought back through the clan gates under guard. The matriarch compares every page against surviving fragments before sealing the complete copy inside the inner archive. Years of failed reconstruction end before sunset."
  ova_murim.145.f: "No one is permitted to celebrate until the matriarch finishes reading the final page."
  ova_murim.145.a: "Return the formulas to the clan."
  ova_murim.146.t: "The Shrine Endowed"
  ova_murim.146.d: "Repairs at Mudang's mountain shrine finish before the first snow. The talisman halls have new roofs, the damaged training courts are rebuilt, and the winter granaries are full. The elders accept the household's plaque for the main courtyard after arguing over its placement for most of an afternoon."
  ova_murim.146.f: "The plaque is finally hung where Cheong-ha suggested at the beginning."
  ova_murim.146.a: "Light the shrine lamps."
  ova_murim.147.t: "The Ledger Settled"
  ova_murim.147.d: "The debts in Sama Ryeon's private ledger are bought out and paid one by one, down to the smallest copper. Brokers arrive expecting negotiation and leave with full payment instead. By the end of the week, the household's name is being spoken rather more warmly in Sama teahouses."
  ova_murim.147.f: "Ryeon closes the ledger only after checking the last copper herself."
  ova_murim.147.a: "Close the books."

  # ==================== the succession endgame (.150-.156) ====================
  ova_murim.150.t: "The Knives in the Night"
  ova_murim.150.d: "The Heavenly Demon Sect sends assassins instead of an army. At dawn, the old master is found dead in the ancestral hall. The lamps are still burning and the killers are already gone. Mourning has barely begun when the question of succession reaches the main hall. Every faction looks toward Jin-woo, though not for the same reason."
  ova_murim.150.f: "Three days earlier, Jin-woo had asked for the night guard to be doubled."
  ova_murim.150.a: "Take up the seat his house offers."
  ova_murim.150.b: "Accept the acclamation of the hall."
  ova_murim.150.c: "Take the seat, because no one is left to stop him."
  ova_murim.151.t: "A Wedding and a New Name"
  ova_murim.151.d: "The marriage is held beneath the ancestral tablets. Jin-woo takes the clan name of the house that raised him and is entered into its genealogy before the elders. Whatever doubts once surrounded the outer disciple at the gate, the house now claims him openly as family and master. Messages from the allied banners begin arriving before the ceremony is over."
  ova_murim.151.f: "The old gatekeeper who first admitted him is given a seat near the front."
  ova_murim.151.a: "Take up the mountain, and the marches with it."
  ova_murim.152.t: "The Hall Names Its Patriarch"
  ova_murim.152.d: "The elders and senior disciples gather in the main hall and name Jin-woo patriarch by acclamation. There are objections to his age and origins, but no rival commands anything close to the same support. Jin-woo remains standing until the last elder has spoken, then accepts the seal."
  ova_murim.152.f: "For once, no one in the hall asks how strong he really is."
  ova_murim.152.a: "Take up the mountain, and the marches with it."
  ova_murim.153.t: "The Seat Taken by Force"
  ova_murim.153.d: "The old master is dead and the hall fractures over the succession. One elder challenges Jin-woo. Then another. For years, his recorded realm and the rumors around him have never matched. This time he makes no effort to keep them matched. Three challengers are disarmed in three exchanges. No fourth man steps forward."
  ova_murim.153.f: "Only then does the hall understand how much he had been hiding."
  ova_murim.153.a: "Sit the empty throne."
  ova_murim.156.t: "The Reckoning Declared"
  ova_murim.156.d: "The army gathers, the supply roads are secured, and the northern routes are marked on the council map. Jin-woo now holds the mountain by force. Several former allies refuse his summons, but the Heavenly Demon Sect remains in the north and the war cannot be avoided. He gives the order to begin the Reckoning."
  ova_murim.156.f: "The banners that answer his call are fewer than before. They march anyway."
  ova_murim.156.a: "March north."
