l_english:
  # --- .1 A Beggar at the Gate
  ova_murim.1.t: "A Beggar at the Gate"
  ova_murim.1.d: "He has knelt in the frost outside the mountain gate for three days now, refusing food, refusing shelter, refusing to give a name. When the gate guards finally drag him before the hall in irritation, he greets each of them by names they have never given him, and mentions, almost apologetically, that the senior instructor's saber form opens badly on the third turn."
  ova_murim.1.f: "Beggars come to sect gates every season. This one came knowing things a beggar has no business knowing."
  ova_murim.1.a: "Open the gate."
  ova_murim.1.b: "Turn him away."
  # --- .2 The Boy at the Gates of Hwasan
  ova_murim.2.t: "The Boy at the Gates of Hwasan"
  ova_murim.2.d: "A gatekeeper disciple brings word, half-laughing, half-uneasy: a ragged boy has been standing among the plum trees since dawn, greeting them like old friends, naming blossoms that have not yet opened this year. He asks, very politely, to be let in."
  ova_murim.2.f: "The plum trees of Hwasan have seen a great many hopeful boys. None of them ever greeted the trees first."
  ova_murim.2.a: "Open the gate."
  ova_murim.2.b: "Turn him away."
  # --- .3 The Boy Who Knows Too Much
  ova_murim.3.t: "The Boy Who Knows Too Much"
  ova_murim.3.d: "Taken before the patriarch at last, the boy kneels, keeps his eyes down as etiquette demands, and calmly names three things that will happen before the season turns. Within the week, two of them already have. Nobody in the hall quite knows what to do with the third."
  ova_murim.3.f: "Every jianghu tale needs an oracle. Nobody expected this one to be a nervous boy terrified of getting it wrong."
  ova_murim.3.a: "Watch, and wait for the third."
  # --- .4 The Heavenly Demon Rises
  ova_murim.4.t: "The Heavenly Demon Rises"
  ova_murim.4.d: "From the high seat beyond the northern passes, the ageless master of the heterodox faith surveys the eight banners of the southern martial world and finds them, as he has found them every generation before this one, already counted. His five great mountains were raised on the ruins of five famous orthodox factions the Cult ground to dust long ago, the Amita and Gonryun and Jongnam Sects, the Moyong Clan, and the beggars of Gaebang, their names now spoken only in mourning. The Cult does not hurry. The Cult has never had to."
  ova_murim.4.f: "Immortality teaches patience whether the immortal wants the lesson or not."
  ova_murim.4.a: "Let the faithful drill."
  # --- .5 The Banner of the Alliance
  ova_murim.5.t: "The Banner of the Alliance"
  ova_murim.5.d: "Eight sect banners are raised together over Hwasan and the old oath is spoken again, plum blossom and saber and talisman side by side: while the war with the northern faith remains undecided, no banner among the eight will fall alone. [concept_ova_murim_war] binds every signature on the compact rather more tightly than any of the eight patriarchs would like to admit."
  ova_murim.5.f: "An alliance of rivals is still a rivalry. It is just one that has agreed, for now, to point outward."
  ova_murim.5.a: "Renew the oath."
  # --- .10 The Spy in the Inner Hall
  ova_murim.10.t: "The Spy in the Inner Hall"
  ova_murim.10.d: "The strange disciple names the mole among the outer deacons without hesitation, a quiet, unremarkable man three doors down from the archive. He does not explain how he knows, only that the man's brush has been copying more than sutras, and that if nothing is done the damage will already be done before anyone notices."
  ova_murim.10.f: "He speaks of the traitor with a weary certainty, as though he has watched this exact betrayal play out already."
  ova_murim.10.a: "A quiet blade."
  ova_murim.10.b: "A public trial."
  # --- .11 The Flood He Read in the Sky
  ova_murim.11.t: "The Flood He Read in the Sky"
  ova_murim.11.d: "He begs the valley villages, sect elders and all, to move their granaries a full month before the rains are due, rains no cloud yet promises. He points at the color of the river, the set of the birds, the ache in an old porter's knee, and insists. Half the hall thinks him touched. The other half remembers that the boy has not yet been wrong about anything."
  ova_murim.11.f: "Foreknowledge is a hard thing to argue for. It sounds, until it happens, exactly like superstition."
  ova_murim.11.a: "Heed him."
  ova_murim.11.b: "Superstition."
  # --- .16 Whispers About the Strange Disciple
  ova_murim.16.t: "Whispers About the Strange Disciple"
  ova_murim.16.d: "The junior disciples have started talking. He knows things, they say, that no one told him, and looks at people as if he can already see how they will disappoint him. It unsettles them more than any of his victories has."
  ova_murim.16.f: "It is one thing to be gifted. It is another to be gifted in a way no one can explain."
  ova_murim.16.a: "Shield him."
  ova_murim.16.b: "Let them talk."
  # --- .12 The Manual Under the Waterfall
  ova_murim.12.t: "The Manual Under the Waterfall"
  ova_murim.12.d: "He leads two disciples to a waterfall none of them have visited before and asks them, with perfect confidence, to check behind the third stone from the left. A First-Rate master's lost saber manual, sealed against the damp, waits exactly where he said it would."
  ova_murim.12.f: "He cannot say how he knew it was there. He only knew, the way he seems to know everything, and this time it is a treasure."
  ova_murim.12.a: "Study the manual."
  # --- .13 Poison in the Patriarch Cup
  ova_murim.13.t: "Poison in the Patriarch Cup"
  ova_murim.13.d: "He slaps the tea from the patriarch's hand a heartbeat before the taster crumples to the floor. There is no time to explain how he knew. There is only the smell of almonds and a very quiet room."
  ova_murim.13.f: "Some instincts cannot be taught. No one can say where this one came from, least of all the boy."
  ova_murim.13.a: "The strange disciple is elevated."
  ova_murim.13.b: "Some elders mutter he knew too easily."
  # --- .15 The Cache Only He Could Find
  ova_murim.15.t: "The Cache Only He Could Find"
  ova_murim.15.d: "He walks the treasurer to a bricked-up cellar under the old drill hall that no living elder remembers, taps three times on a wall, and finds behind it a forgotten sect fortune: bar silver, sealed deeds, and a strongbox of gold that clears the sect's debts in a single afternoon."
  ova_murim.15.f: "It is not cultivation. It is not swordsmanship. It is, the treasurer admits while counting, extremely useful."
  ova_murim.15.a: "Bank the fortune."
  # --- .14 The Prodigy of the East Yard
  ova_murim.14.t: "The Prodigy of the East Yard"
  ova_murim.14.d: "A ragged, brilliant child washes out of the entrance trials on a technicality of birth and station. The strange disciple appears at the examiners' table and asks, very quietly, that she be admitted anyway, saying only that a talent turned away at this gate will one day be turned against it. He does not elaborate. He never does."
  ova_murim.14.f: "The sects have always been better at making enemies than they meant to be."
  ova_murim.14.a: "Take her in."
  ova_murim.14.b: "The rolls are full."
  # --- .30 The War Council
  ova_murim.30.t: "The War Council"
  ova_murim.30.d: "He unrolls a war map and marks, with a certainty that stops the generals mid-argument, every road the Cult will march, every pass they will force, every banner most at risk and why. The generals dispute half of it. They stop disputing after the first road proves correct."
  ova_murim.30.f: "He reads the coming war like a book he has already finished. It is deeply unnerving, and it is right."
  ova_murim.30.a: "Study the map."
  # --- .31 The Ten Great Demons
  ova_murim.31.t: "The Ten Great Demons"
  ova_murim.31.d: "He goes ahead of the war itself, alone, to remove one of the Cult's ten commanders before that commander can matter. He knows which one, and where, and when, and does not explain any of it. The seat he took by force has left him no allies to spare and no mercy to waste."
  ova_murim.31.f: "A man who rules by the blade fights by it too, and asks no one's leave."
  ova_murim.31.a: "Hunt the commander."
  ova_murim.31.b: "The war needs him at home."
  # --- .32 Assassins in the Night
  ova_murim.32.t: "Assassins in the Night"
  ova_murim.32.d: "The Cult has smelled a threat and sent knives to end it. Shadows move along the outer wall an hour before dawn, and for once he seems as surprised as anyone, standing barefoot in the cold with a borrowed sword and no clever certainty at all."
  ova_murim.32.f: "Whatever it is that he knows, it does not reach this far. Tonight he is only a man with a blade."
  ova_murim.32.a: "Stand them off alone."
  ova_murim.32.b: "Double the guard."
  # --- .33 The Traitor Elder
  ova_murim.33.t: "The Traitor Elder"
  ova_murim.33.d: "He names the elder who will open the gate from inside: the same gentle, trusted voice on the council who means, if nothing changes, to hand the mountain to the Cult in exchange for his own family's safety. He knows the man's price to the last coin, and will not say how."
  ova_murim.33.f: "It is one thing to suspect a betrayal. It is another to watch the traitor pour tea and smile, knowing."
  ova_murim.33.a: "Expose him now."
  ova_murim.33.b: "Feed him false maps."
  # --- .34 The Artifact Caravan
  ova_murim.34.t: "The Artifact Caravan"
  ova_murim.34.d: "He knows the Cult is moving its demonic relics south along the salt road under a merchant's banner, and he knows the schedule, the guard rotation, and the very bend in the road where the wagons slow. The generals have stopped asking how he knows. They only ask what to do about it."
  ova_murim.34.f: "His certainty is worth an army of scouts, and rather more frightening than one."
  ova_murim.34.a: "Burn it."
  ova_murim.34.b: "Sell the schedule to the Sama brokers."
  # --- .35 A Letter From the Heavenly Demon
  ova_murim.35.t: "A Letter From the Heavenly Demon"
  ova_murim.35.d: "A single sealed letter arrives by no courier anyone can name, in a hand no one at the war table has ever seen: I know what you are, little prophet, better than you know it yourself. Come north, and I will tell you."
  ova_murim.35.f: "The ageless master has noticed the boy who knows too much. Of course he has."
  ova_murim.35.a: "Burn the letter."
  ova_murim.35.b: "Answer it."
  # --- .39 The Mountain Broken (Reckoning epilogue)
  ova_murim.39.t: "The Mountain Broken"
  ova_murim.39.d: "The Reckoning ends the only way it could. The Heavenly Demon Sect is shattered, and as its five mountains crack open they give up the dead the Cult buried beneath them: the Amita Sect and the Gonryun Sect, Jongnam and the Moyong Clan and the beggars of Gaebang, five great orthodox names ground to dust generations ago, rising again from the ruins their conquerors built over them. The stolen banners return to the houses that raised them. The man who took his seat by force sits atop the whole murim now, master of everything and mourned by no one who knew him before the throne."
  ova_murim.39.f: "He won the war he set out to win. The rivers and lakes will remember the victory, and forget the boy."
  ova_murim.39.a: "Let the mountain fall."
  # --- .50 The Empty Cot
  ova_murim.50.t: "The Empty Cot"
  ova_murim.50.d: "A routine census of the outer barracks turns up one bunk unslept-in, one bowl uncollected, and one name in the roster that no clerk can quite explain away. The Heavenly Demon reads the report twice before setting it down."
  ova_murim.50.f: "Immortality has taught him patience. It has also taught him to notice when a single thread goes quiet."
  ova_murim.50.a: "Note it, and wait."
  # --- .51 The Tribute Demand
  ova_murim.51.t: "The Tribute Demand"
  ova_murim.51.d: "The Cult demands rice and iron from the border valleys under its protection, and the border valleys, as ever, must decide how much protection is actually worth paying for."
  ova_murim.51.f: "A tribute is only a tax with a sword standing behind the collector."
  ova_murim.51.a: "Squeeze harder."
  ova_murim.51.b: "Mercy, as strategy."
  # --- .52 The Blood Cavalry Rides
  ova_murim.52.t: "The Blood Cavalry Rides"
  ova_murim.52.d: "Red banners and black horses cross the border passes before dawn, and by the time the alarm bells reach the nearest watchtower the Blood Cavalry is already three villages deep into Orthodox land, singing their marching song as they ride."
  ova_murim.52.f: "It is a very old song. The valleys that hear it rarely forget the tune."
  ova_murim.52.a: "Let the raid run its course."
  # --- .53 The Demon Academy
  ova_murim.53.t: "The Demon Academy"
  ova_murim.53.d: "The doctrine halls beyond the passes graduate a new cohort of the faithful, drilled equally in the sword scripture and the ledger scripture. The Cult has never seen much difference between conquering a mountain and buying one."
  ova_murim.53.f: "The Heavenly Demon collects converts the way other rulers collect taxes: patiently, and in quantity."
  ova_murim.53.a: "The sword scripture."
  ova_murim.53.b: "The coin scripture."
  # --- .54 Doubt in the Lower Halls
  ova_murim.54.t: "Doubt in the Lower Halls"
  ova_murim.54.d: "The war is not going as the lower halls were promised it would, and whispers travel faster underground than any banner does above it: that the Heavenly Demon's mandate wavers, that even ageless masters can be made to bleed."
  ova_murim.54.f: "An empire built on certainty needs, above all, a steady supply of it."
  ova_murim.54.a: "Purge the doubters."
  ova_murim.54.b: "Let them talk themselves out."
  # --- .55 Skirmish at the Passes
  ova_murim.55.t: "Skirmish at the Passes"
  ova_murim.55.d: "Border blades clash again in the high passes, as they have every season since anyone can remember, and the watch commanders send down the same question they always send down: reinforce the line, or let the mountains do the fighting for us."
  ova_murim.55.f: "The jianghu keeps its old grudges the way a smith keeps a good fire, banked but never quite out."
  ova_murim.55.a: "Reinforce the line."
  ova_murim.55.b: "Trade space for time."
  # --- .56 An Infiltrator Caught
  ova_murim.56.t: "An Infiltrator Caught"
  ova_murim.56.d: "A servant who has drawn no notice in three years of quiet, competent work is caught passing letters in a hand that matches no household in the sect. Under questioning, the accent that slips out belongs to the northern passes."
  ova_murim.56.f: "The Cult's ears are patient. This one waited three years to say anything worth hearing."
  ova_murim.56.a: "Execute him."
  ova_murim.56.b: "Turn him."
  # --- .60 The Manual Found
  ova_murim.60.t: "The Manual Found"
  ova_murim.60.d: "Weeks of searching the old jianghu haunts turn up a genuine find at last: a manual, water-stained but legible, from a master whose lineage the sects thought had died out entirely."
  ova_murim.60.f: "The rivers and lakes never quite finish giving up their secrets."
  ova_murim.60.a: "Study it thoroughly."
  # --- .61 Qi Deviation
  ova_murim.61.t: "Qi Deviation"
  ova_murim.61.d: "The meridians rebel mid-cultivation, qi surging where it should flow, and it takes every trick the healers know to keep the deviation from becoming permanent."
  ova_murim.61.f: "Even the sword-sure stumble on the dantian's narrower paths."
  ova_murim.61.a: "Rest and recover."
  # --- .64 The Grand Tournament
  ova_murim.64.t: "The Grand Tournament"
  ova_murim.64.d: "Banners from every corner of the jianghu gather for the grand tournament, plum blossom and saber and poison needle alike, and for one bright season the martial world remembers what it looks like when it is not at war with itself."
  ova_murim.64.f: "Even rivals need somewhere to show off once in a while."
  ova_murim.64.a: "Host the tournament."
  # --- .65 The Spy Purge
  ova_murim.65.t: "The Spy Purge"
  ova_murim.65.d: "A sweep of the lower halls turns up more listening ears than anyone was comfortable admitting to. The question is only how thoroughly to pull the roots, and how much of the harvest to let the whole sect see."
  ova_murim.65.f: "A quiet purge and a loud one cost about the same. Only the aftermath differs."
  ova_murim.65.a: "A thorough purge."
  ova_murim.65.b: "A perfunctory one."
  # --- .70 The Murim Kneels
  ova_murim.70.t: "The Murim Kneels"
  ova_murim.70.d: "The eight Orthodox banners burn, are folded under, or bend the knee one after another, and the Heavenly Demon receives the news the way he receives all news these days: without hurry, and without surprise. He was never in a rush. He had all the time an immortal needs."
  ova_murim.70.f: "The jianghu has fallen before. It has never before stayed fallen for very long. This time may be different."
  ova_murim.70.a: "Accept the mandate of the north."
  # --- .71 The Banner Holds
  ova_murim.71.t: "The Banner Holds"
  ova_murim.71.d: "The Heavenly Demon Sect is broken, scattered beyond the passes or bent into subjugation, and for the first time in living memory the eight Orthodox banners can lower their guard without wondering what waits behind the next ridge."
  ova_murim.71.f: "The rivers and lakes will find new grudges to nurse soon enough. For now, they can simply be glad to still be flowing."
  ova_murim.71.a: "Let the banners stand down."
  # --- .72 The Death of Kang Jin-woo
  ova_murim.72.t: "The Death of Kang Jin-woo"
  ova_murim.72.d: "The strange disciple who knew too much dies before his tale is finished, and takes his unexplained certainties with him. The hall he served is left to fight the war he saw coming without the boy who saw it, and to wonder, quietly, what else he never got the chance to tell them."
  ova_murim.72.f: "A man who could see so far should have seen this coming. Perhaps, at the end, he did."
  ova_murim.72.a: "Mourn him properly."
  # --- .73 The Calamity Arrives (chapter fail: the Cult has mastered the murim)
  ova_murim.73.t: "The Calamity Arrives"
  ova_murim.73.d: "Everything the strange disciple warned of comes to pass exactly as he said it would. Six banners down, or five mountains flying the Cult's red: the ledger differs from his warnings in its details and not at all in its sum. He stands on the wall a long time, saying nothing, having been right about all of it and able to stop none of it."
  ova_murim.73.f: "To see the calamity coming and be unable to turn it is its own particular cruelty."
  ova_murim.73.a: "Endure what comes."
  # --- .80 The Road North (final-battle opener)
  ova_murim.80.t: "The Road North"
  ova_murim.80.d: "He begins refusing engagements. He settles debts nobody knew he owed, writes letters he lets no one read, and sharpens a sword that has not needed sharpening in years. When the elders finally ask, he answers plainly: everything he has ever known has pointed north, to the Demon Mountain and the ageless master who waits at its summit. Send a champion expedition into the Cult's own lands, and he will finish this himself."
  ova_murim.80.f: "The jianghu has an old saying: the sword that leaves the mountain must one day climb one. His has known which mountain since before it was forged."
  ova_murim.80.a: "Let him make ready."
  # --- .81 The Ten Thousand Steps
  ova_murim.81.t: "The Ten Thousand Steps"
  ova_murim.81.d: "The Demon Mountain's stair is carved for pilgrims: ten thousand steps of black stone. He climbs them in the open, unhurried, past outer legions who part before him without a blade rising, because the Cult understands a formal challenge when it sees one. At the summit, the gates of the high temple stand open, as though he were expected. Perhaps he was."
  ova_murim.81.f: "The mountain has been waiting for him a long time. It is done waiting now."
  ova_murim.81.a: "Climb."
  # --- .82 The Duel of Life and Death (the final battle)
  ova_murim.82.t: "The Duel of Life and Death"
  ova_murim.82.d: "The hall of the high temple is empty but for one man, seated, unhurried, exactly as the strange disciple always seemed to expect him to be. The Heavenly Demon rises from his seat for the first time in living memory, and greets his challenger almost warmly, one uncanny thing acknowledging another. What follows, no one witnesses. The mountain itself keeps the record: three ridgelines shorn clean, the black stair split from the ninth step to the nine thousandth, and at evening, one sword coming down the mountain alone."
  ova_murim.82.f: "Two men who could see further than anyone met at the summit. Only one of them came down."
  ova_murim.82.a: "This time, he does not look away."
  # --- .84 The Sword That Came Down the Mountain (good-ending epilogue)
  ova_murim.84.t: "The Sword That Came Down the Mountain"
  ova_murim.84.d: "The war of the murim is over. Where the Heavenly Demon Sect's five mountains stood, five old orthodox names have come home from the grave: Amita and Gonryun and Jongnam, the Moyong Clan, and the beggars of Gaebang, destroyed generations ago and restored at last from the ruins the Cult raised over them. The strange disciple who ended it spends the years after judging tournament brackets, losing arguments to his physician, and refusing, always politely, to explain how he ever knew any of what he knew. The banners he befriended fly beside his own, and the mountain kneels to no one now."
  ova_murim.84.f: "The jianghu will tell the duel at the summit for a hundred years. He has never once told it himself."
  ova_murim.84.a: "Let them sing."

  # ==================== The Eight Banners arc (.100-.143) ====================
  # --- SOR: Seok Hye-gang, the iron monk (sworn brother)
  ova_murim.100.t: "The Monk at the Flooded Ford"
  ova_murim.100.d: "The spring melt has taken the bridge on the road to Sorim, and a lone monk stands waist-deep in the flood, carrying travelers across on his back one at a time, as he has apparently been doing since dawn. The strange disciple watches him a moment, then rolls up his sleeves and wades in to carry the next traveler himself. Seok Hye-gang laughs like a landslide and calls him little donkey."
  ova_murim.100.f: "It is, the disciples agree, the beginning of something."
  ova_murim.100.a: "Cross together."
  ova_murim.101.t: "A Beast in the Ravine"
  ova_murim.101.d: "A great spirit-beast, driven mad by the floods, corners the two of them in a stone ravine, and there is exactly one clean line of retreat, wide enough for one man to cover while the other holds the beast. Seok Hye-gang is already stepping into the gap when the strange disciple catches his arm. Someone will be badly hurt buying this fight. The only question is who."
  ova_murim.101.f: "The monk would take the wound gladly. That is precisely why it should not be his to take."
  ova_murim.101.a: "Take the wound meant for the monk."
  ova_murim.101.b: "Let the monk hold it, and seize the opening."
  ova_murim.102.t: "The Pill of Nine Revolutions"
  ova_murim.102.d: "In the beast's lair they find it: a single Pill of Nine Revolutions, an elixir that carries a cultivator bodily into the next realm. There is one. Seok Hye-gang has spent thirty years stalled a hair below his breakthrough; the strange disciple could swallow it and stand half a head above every master in the south by morning."
  ova_murim.102.f: "One pill, two futures. Only one of them belongs to the man holding it."
  ova_murim.102.a: "Give the monk the pill, and his breakthrough."
  ova_murim.102.b: "Swallow it himself."
  ova_murim.103.t: "Sworn Beneath the Bell"
  ova_murim.103.d: "Beneath Sorim's great bell, Seok Hye-gang offers the oath of sworn brotherhood the way he offers everything: plainly, palms open. He does not ask where the uncanny knowledge comes from. He says only that a man who wades into floods for strangers is a brother worth having, whatever river he crossed to get here."
  ova_murim.103.f: "The bell is rung once for each vow. The valley hears it and wonders who died."
  ova_murim.103.a: "Swear the oath of brothers."
  ova_murim.103.b: "The road ahead is too dangerous for vows."
  # --- PAE: Paeng Ha-ran, the saber heiress, She-Bear of Hobuk (companion)
  ova_murim.104.t: "The Saber That Roars"
  ova_murim.104.d: "Word comes of a border skirmish gone wrong, and then of the reason it stopped going wrong: Paeng Ha-ran, heiress of the saber clan, waded into the Cult ambush laughing and broke it open from the inside. The strange disciple arrives with the relief column to find the She-Bear of Hobuk sitting on a captured shield, complaining that everyone came too soon and asking, loudly, which one of them is supposed to be the famous prodigy."
  ova_murim.104.f: "She is louder than the saber and twice as sharp. He likes her at once, and is careful not to show it."
  ova_murim.104.a: "Meet the She-Bear of Hobuk."
  ova_murim.105.t: "The Rearguard at the Bridge"
  ova_murim.105.d: "The Cult catches them at a narrow bridge with the wounded still crossing, and someone has to hold the near bank until the last of them is over. Ha-ran means to do it alone, the way her clan always has. The strange disciple could let her, and keep his strength whole for the road ahead. Or he could stand in the blood beside her and pay his own share of it."
  ova_murim.105.f: "The Paeng die at bridges. It is practically a family tradition. He would like to end that tradition."
  ova_murim.105.a: "Hold the bridge at her side, and bleed for it."
  ova_murim.105.b: "Let the Paeng cover the retreat while he saves his strength."
  ova_murim.106.t: "The Saber Spirit Wakes"
  ova_murim.106.d: "Ha-ran's clan saber is a hungry thing, and one night it very nearly eats her, the qi turning in her meridians like a blade turning in a wound. The strange disciple sits with her through the deviation, talking her back one breath at a time. He could also simply watch, and memorize the maddened saber art as it tears through her, and add it to his own."
  ova_murim.106.f: "An art stolen from someone's agony is still stolen. He would rather she keep her agony, and her art."
  ova_murim.106.a: "Talk her through the deviation all night."
  ova_murim.106.b: "Copy the maddened saber art for himself while she suffers."
  ova_murim.107.t: "Blood Mixed Beneath the Sabers"
  ova_murim.107.d: "At the Paeng clan's saber shrine, before the notched blades of forty generations, Ha-ran cuts her palm without preamble and holds out her hand. Her house rides with those it bleeds for, she says, and she has decided to bleed for him. Her grandmother, watching from the steps, remarks that it is the longest sentence the girl has ever managed to say seriously."
  ova_murim.107.f: "The shrine keeper is scandalized. The ancestors, Ha-ran insists, are delighted."
  ova_murim.107.a: "Mix blood beneath the sabers."
  ova_murim.107.b: "The road ahead is too dangerous for vows."
  # --- TAN: Tang So-yeol, the poison maiden (companion)
  ova_murim.108.t: "A Gift of Three Poisons"
  ova_murim.108.d: "Tang So-yeol of the poison clan serves him tea with her own hands, which everyone at the table correctly understands to be a threat. The strange disciple drinks all three cups, names each poison in order of appearance, compliments the third as her own invention, and asks for the recipe. In the silence that follows, she very nearly smiles."
  ova_murim.108.f: "He drinks poison the way other men drink water. She would very much like to know why."
  ova_murim.108.a: "Ask for the recipe."
  ova_murim.109.t: "The Antidote She Could Not Finish"
  ova_murim.109.d: "The Tang lost the hundred-herb antidote a generation ago, and So-yeol has spent years failing to reconstruct it. The strange disciple knows the missing steps. Proving them means testing the draught on a living body, and the clan keeps servants for exactly that. He could let a servant risk it. Or he could drink it himself, and take whatever the mistake would cost."
  ova_murim.109.f: "She expects him to spend a servant, the way her clan always has. She is not prepared for the other answer."
  ova_murim.109.a: "Test the antidote on himself so she need not risk a servant."
  ova_murim.109.b: "Keep the recovered formula, and let her keep guessing."
  ova_murim.110.t: "The Venom in Her Own Veins"
  ova_murim.110.d: "A rival poisoner catches So-yeol with a venom even the Tang have no name for, and there is one dose of the cure between them. The strange disciple carries the same poison-forged body she does; the cure would deepen his own immunity toward legend. Or it could simply save her life, and be nothing more than that."
  ova_murim.110.f: "One cure, and two bodies that could use it. Only one of them is dying tonight."
  ova_murim.110.a: "Give her the last dose of the cure."
  ova_murim.110.b: "Drink the cure himself to seal his own poison body."
  ova_murim.111.t: "Tang Comes to the Table"
  ova_murim.111.d: "So-yeol arrives at the household gate with a mule train of clay jars, a ledger of everything in them, and the stated position that a man who drinks poison to be polite clearly cannot be left unsupervised. The Tang elders agree, she adds, though the mule train was packed before she asked them."
  ova_murim.111.f: "The household kitchen acquires a locked shelf. Then a locked room. Then a wing."
  ova_murim.111.a: "Welcome her, and count the jars later."
  ova_murim.111.b: "Turn the mule train away."
  # --- NAM: Namgung Wol-hee, the proud young mistress (companion)
  ova_murim.112.t: "The Young Mistress Demands a Duel"
  ova_murim.112.d: "Namgung Wol-hee arrives with silk banners, a retinue in imperial blue, and a formal writ of challenge: the strange disciple's rise is an affront to the proper order of talent, and the Namgung do not permit affronts. She is proud, precise, immaculate, and the calligraphy on her writ is genuinely beautiful."
  ova_murim.112.f: "She clearly practiced the insults. He decides not to hold that against her."
  ova_murim.112.a: "Accept the challenge."
  ova_murim.113.t: "The Duel She Must Not Lose"
  ova_murim.113.d: "The whole jianghu has come to watch the proud Namgung mistress duel the nameless prodigy, and he can see three moves ahead exactly how to break her, utterly and publicly. He could also let the crowd see a closer thing than it is, and leave her pride, and her clan's, intact. The Namgung do not survive humiliation. They calcify around it."
  ova_murim.113.f: "To lose a duel on purpose is a small dishonor. To ruin someone who did not deserve ruining is a larger one."
  ova_murim.113.a: "Throw the duel so her pride survives the crowd."
  ova_murim.113.b: "Humiliate her utterly, and take the acclaim."
  ova_murim.114.t: "Shoulder to Shoulder at the Pass"
  ova_murim.114.d: "Blood Cavalry outriders hit the pass with the Namgung wounded still on the wrong side of it. Someone must hold the narrow stair while Wol-hee carries her people out. He could hold it, and take the wounds meant for a rearguard. Or he could chase the glory kill down the far slope and leave her the stretcher work, and the losses."
  ova_murim.114.f: "Imperial sword and nameless style, back to back. She will remember which of them held the stair."
  ova_murim.114.a: "Hold the stair, and let her carry the wounded out."
  ova_murim.114.b: "Chase the glory kill, and leave the wounded to her."
  ova_murim.115.t: "A Proud Woman Bows Once"
  ova_murim.115.d: "Namgung Wol-hee requests a formal audience, arrives in full regalia, and bows, once, precisely, to the exact degree owed the one who held the stair. The Namgung do not pledge lightly, she says, so she will pledge only once, and he is not to make her repeat it. Her retinue pretends not to weep. They are bad at it."
  ova_murim.115.f: "She practiced the bow, alone, for three evenings. Everyone knows. No one says."
  ova_murim.115.a: "Raise her up, and accept her pledge."
  ova_murim.115.b: "The road ahead is too dangerous for vows."
  # --- JEG: Jegal Seo-yeon, the strategist (companion)
  ova_murim.116.t: "Nineteen Questions"
  ova_murim.116.d: "Jegal Seo-yeon sets out a go board, pours two cups of tea, and asks him nineteen questions in a row, about grain prices, troop movements, the Cult's marching songs, and the weather on one particular morning years from now. She stops at nineteen. The twentieth question, she says, she is saving until she decides what he is."
  ova_murim.116.f: "She wins the go game in ninety moves. He answers eighteen of her questions, and lets her wonder about the last."
  ova_murim.116.a: "Answer eighteen honestly."
  ova_murim.117.t: "The Plan That Costs a Column"
  ova_murim.117.d: "Seo-yeon's battle plan is flawless but for one thing: it spends a column of men where the line must be held, and she has coldly assigned that column to her own clan's soldiers, because they are hers to spend. The strange disciple can put himself in that gap instead, and take the losses onto his own name. Or he can rewrite the plan to spend her people, and keep his own whole."
  ova_murim.117.f: "A strategist learns early to spend what is hers. He would like to teach her there is another way."
  ova_murim.117.a: "Put himself where her plan expects the losses."
  ova_murim.117.b: "Rewrite the plan to spend her clan's men instead."
  ova_murim.118.t: "The Credit for the Victory"
  ova_murim.118.d: "The plan works, gloriously, and the whole Alliance council assumes the famous prodigy authored it. He could accept the renown and let it swell his name across the eight sects. Or he could correct them, plainly, before everyone: the victory was Jegal Seo-yeon's from the first stroke, and hers to be known by."
  ova_murim.118.f: "Renown is the one currency he has never been short of. She has been short of it her whole life."
  ova_murim.118.a: "Give her the credit before the whole council."
  ova_murim.118.b: "Take the credit, and the renown, for himself."
  ova_murim.119.t: "The Strategist Chooses Her Board"
  ova_murim.119.d: "The Jegal keep their strategists close, so when Seo-yeon announces she is joining the household, the clan council convenes in alarm. Her memorial to them is one line long: a strategist serves the most interesting board. She arrives with one trunk of clothes, four trunks of maps, and the twentieth question, still unasked."
  ova_murim.119.f: "She says the household needed a mind. The household suspects she wanted the war maps and their owner in one room."
  ova_murim.119.a: "Give her the map room."
  ova_murim.119.b: "Turn her trunks away."
  # --- MUD: Wi Cheong-ha, the taoist priestess (companion)
  ova_murim.120.t: "The Thread That Doubles Back"
  ova_murim.120.d: "The priestess Wi Cheong-ha reads fates at Mudang's mountain shrine, and today she has closed the shrine to every other petitioner. She lays out his thread on the reading table without asking his birth hour, because, she says, she has spent a year finding it tangled through everyone else's: a thread that runs strange, and bright, and impossible to read to its end."
  ova_murim.120.f: "She is not frightened of him. She has been waiting a year to ask the thread its own question."
  ova_murim.120.a: "Let her read the whole thread."
  ova_murim.121.t: "The Reading That Frightens Her"
  ova_murim.121.d: "A great divination goes wrong at the shrine, the omen turning back on its reader, and the backlash will fall on someone: on Cheong-ha, who cast it, or on the strange disciple, if he steps into the current and takes the toll onto his own body. He could let it fall where it belongs. Or he could not."
  ova_murim.121.f: "An omen's price is always paid by someone. She assumes it will be her. It has always been her."
  ova_murim.121.a: "Take the omen's price onto himself."
  ova_murim.121.b: "Let the backlash fall on the priestess."
  ova_murim.122.t: "The Talisman and the Toll"
  ova_murim.122.d: "Cheong-ha has devised a rite that could raise her art to the next tier, but it demands a font of pure qi to anchor it, and there is exactly enough for one working. The strange disciple could take that font for his own cultivation and rise a full realm. Or he could let her keep it, and keep her breakthrough, and gain nothing at all himself."
  ova_murim.122.f: "One font of qi, one breakthrough. He has had breakthroughs enough."
  ova_murim.122.a: "Let her keep the rite that raises her art."
  ova_murim.122.b: "Take the rite's power for his own cultivation."
  ova_murim.123.t: "Mudang Comes Down the Mountain"
  ova_murim.123.d: "The shrine keepers protest that Mudang's finest reader of fates cannot simply move into a swordsman's household, and Cheong-ha agrees with them serenely while packing. The thread doubles back here, she explains, folding vestments. It is not for a priestess to argue with the thread. The strange disciple is fairly sure she is teasing him. Only fairly."
  ova_murim.123.f: "She hangs a wind-bell at his gate the way other women might hang a name-plate."
  ova_murim.123.a: "Hang the wind-bell."
  ova_murim.123.b: "Send her back up the mountain."
  # --- SAM: Sama Ryeon, the information broker (companion)
  ova_murim.124.t: "The Woman Who Sells Tomorrow"
  ova_murim.124.d: "Sama Ryeon receives him in the back room of a teahouse she probably owns, behind a veil she certainly does not need, and slides a sealed packet across the table. His secret, she says pleasantly: who he is, what he knows, and how. Unread, as far as anyone can prove. The Sama sell everything, and today the price of his secret staying theirs alone is one conversation."
  ova_murim.124.f: "The packet is real. Whether it is the only copy is, of course, also for sale."
  ova_murim.124.a: "Have the conversation."
  ova_murim.125.t: "The Debt She Cannot Call In"
  ova_murim.125.d: "A rival house has bought up Ryeon's debts and means to fold her whole network into itself, and she is one bad week from ruin. The strange disciple can cover the debt out of the sect treasury and ask nothing for it, or he can buy the debt himself, cheap, and own the Sama web outright, her three hundred listening posts and all."
  ova_murim.125.f: "She expects him to buy her, the way everyone eventually tries to. She does not expect to simply be helped."
  ova_murim.125.a: "Cover her ruinous debt out of the sect treasury."
  ova_murim.125.b: "Buy her debt cheap, and own her web outright."
  ova_murim.126.t: "A Price Beyond Coin"
  ova_murim.126.d: "Ryeon walks into an ambush her own sources missed, and the strange disciple sees it coming a full day out. He can send word and lose the tactical advantage the ambushers' overconfidence would have handed him. Or he can say nothing, let the trap spring, and watch it conveniently thin out the rivals crowding her network, at the cost of a very bad night for her."
  ova_murim.126.f: "A broker who survives an ambush learns things. A broker who is warned of one learns who warned her."
  ova_murim.126.a: "Warn her of the ambush, and lose the advantage."
  ova_murim.126.b: "Let the ambush cull her rivals, and thin her network."
  ova_murim.127.t: "The Ledger Closes"
  ova_murim.127.d: "Ryeon arrives at the household with no mule train and no trunks, because her inventory is invisible and already everywhere: three hundred listening posts, a courier web, and every rumor in the murim half a day fresher than anyone else has it. She sets her veil on the table like a letter of resignation and asks where the interesting people sit."
  ova_murim.127.f: "The Sama elders call it a strategic relocation. The teahouses call it the scandal of the season."
  ova_murim.127.a: "Show her the map room."
  ova_murim.127.b: "The household keeps no brokers."
  # --- HWA: Yeon Seol-mae, the sword saintess (companion)
  ova_murim.128.t: "Plum Blossoms Out of Season"
  ova_murim.128.d: "The sword saintess of Hwasan, Yeon Seol-mae, crosses blades with him at a mountain shrine half by accident, an exchange of courtesies that neither of them quite manages to keep courteous. Where their swords meet, the old plum tree above the shrine sheds blossoms out of season. She looks at the petals, then at him, and asks for his name in a voice that suggests she intends to keep it."
  ova_murim.128.f: "Hwasan teaches that the sword blooms when the heart is true. Nobody at the shrine says the obvious aloud."
  ova_murim.128.a: "Give her the name."
  ova_murim.129.t: "The Blossom That Will Not Bloom"
  ova_murim.129.d: "Seol-mae has stalled for years a single insight short of the plum blossom sword's true form, and the strange disciple can see exactly what she is missing. He can guide her hand to it and claim none of the credit, letting her name the breakthrough her own. Or he can keep the insight, fold it into his own sword, and leave her where she has always been."
  ova_murim.129.f: "The plum blossom blooms for a true heart. He would like her to see hers bloom, not his."
  ova_murim.129.a: "Guide her to the insight, and claim none of it."
  ova_murim.129.b: "Keep the plum blossom insight for his own sword."
  ova_murim.130.t: "Two Swords on the Peak"
  ova_murim.130.d: "An assassin's blade comes for Seol-mae at the shrine at midnight, from an angle her guard cannot cover in time. The strange disciple can reach it, but only with his own body, and the wound would be a real one. Or he could put her between himself and the blade for the half-second it takes to cut the assassin down clean, and come away untouched."
  ova_murim.130.f: "A saintess is worth guarding. He decides she is worth a wound, too."
  ova_murim.130.a: "Take the killing blow meant for her at the shrine."
  ova_murim.130.b: "Use her as a shield, and cut the ambusher down."
  ova_murim.131.t: "The Saintess Leaves the Mountain"
  ova_murim.131.d: "Hwasan's elders offer her the succession; she offers them, in return, her respectful refusal, folded around the observation that the plum blossom sword was made to guard something, and she has finally found what. She comes down the mountain with one sword, one chest, and a sprig of plum in her hair, and the household gate opens before she knocks."
  ova_murim.131.f: "The elders mourn for a week, then start bragging. Their saintess guards the prodigy himself."
  ova_murim.131.a: "Open the gate."
  ova_murim.131.b: "The mountain needs its saintess more."

  # ==================== The home banner (.140-.143) ====================
  ova_murim.140.t: "The House That Took Him In"
  ova_murim.140.d: "The house that opened its gate to a nameless boy has fed and trained him for two years now, and the elders have begun to ask, pointedly, what they are training. If he is to court the whole murim to his banner, he must first make his own hall believe in him: raise a proper Champion Hall so his art has a home, and win the one his house holds dearest. She is watching him already, from across the drill yard, deciding."
  ova_murim.140.f: "Every hero courts the wide world eventually. First he has to convince the people who knew him when he was nobody."
  ova_murim.140.a: "Begin with his own house."
  ova_murim.141.t: "The Elder Who Would Not Believe"
  ova_murim.141.d: "One senior elder has never trusted the strange disciple, and his stubbornness is about to walk the sect into a costly mistake the boy foresaw weeks ago. He can shield the old man from the consequences, quietly, and let him keep his dignity and his post, gaining nothing and looking like a fool for the delay. Or he can let the mistake land in public, break the elder on it, and take his authority outright."
  ova_murim.141.f: "The elder fed him when the boy had no name. That ought to count for something, even now."
  ova_murim.141.a: "Shield the doubting elder from his own mistake."
  ova_murim.141.b: "Break the elder publicly, and take his authority."
  ova_murim.142.t: "The Rite of the Inner Hall"
  ova_murim.142.d: "The house's deepest secret, the inner-hall rite that only its heir may receive, lies open before him, and there is one working of it to be had. He can pass it to the one his house holds dearest, and lift her a full realm while he gains nothing. Or he can take it for himself, the way an ambitious disciple would, and rise instead."
  ova_murim.142.f: "The secret was never meant for an outsider. That it is offered to him at all is a kind of love. What he does with it will be an answer."
  ova_murim.142.a: "Give the breakthrough to the one who took him in."
  ova_murim.142.b: "Take the inner-hall secret for himself alone."
  ova_murim.143.t: "The Vow of His Own House"
  ova_murim.143.d: "The one his house holds dearest comes to him in the lantern light of the ancestral hall and pledges herself, not to the prodigy the jianghu whispers about, but to the boy who knelt in the snow and stayed. His own house is his now, if he will have it, the ground every other banner will be built upon."
  ova_murim.143.f: "The wide world can wait. A man should be sure of the people who fed him first."
  ova_murim.143.a: "Accept the vow of his own house."
  ova_murim.143.b: "Hold his own house at arm's length."

  # ==================== objective-decision outcomes (.144-.147) ====================
  ova_murim.144.t: "The Hobuk Saber Trials"
  ova_murim.144.d: "Every saber in Hobuk comes to test itself before the Paeng, and the strange disciple sits among the judges as an equal. The clan reads the honor exactly as it was meant, and the She-Bear's grandmother, watching the finals, remarks that the boy has better manners than half the family."
  ova_murim.144.f: "The Paeng respect a good saber and a better rearguard. He has now given them a festival of both."
  ova_murim.144.a: "Let the sabers sing."
  ova_murim.145.t: "The Fire Formulas Restored"
  ova_murim.145.d: "The lost Tang fire formulas come home at last, prised from behind the clan's own poison arrays, and the Tang matriarch reads them through twice before she will believe them whole. A debt the clan could not pay in coin has been paid in full."
  ova_murim.145.f: "The Tang do not forget a poison. They forget a kindness even less."
  ova_murim.145.a: "Return the formulas to the clan."
  ova_murim.146.t: "The Shrine Endowed"
  ova_murim.146.d: "The mountain shrine of Mudang is rebuilt stone by stone in the household's name, its rites funded, its winter stores filled. The priestesses divine on the gift for three days and pronounce it an alignment of fates, which is their highest possible compliment and, the treasurer notes, cost exactly as much as a mere donation would have."
  ova_murim.146.f: "Mudang reads generosity as destiny. It is a flattering way to be thanked."
  ova_murim.146.a: "Light the shrine lamps."
  ova_murim.147.t: "The Ledger Settled"
  ova_murim.147.d: "Every debt Sama Ryeon's web ever recorded against the household and its friends is bought out and paid off in gold, to the last copper. The Sama respect exactly one thing more than information, and it is a debt honored in full. Her network is the household's now, undivided."
  ova_murim.147.f: "A broker paid in full is a broker who stops selling you to your enemies. It is, Ryeon agrees, a very good trade."
  ova_murim.147.a: "Close the books."

  # ==================== the succession endgame (.150-.156) ====================
  ova_murim.150.t: "The Knives in the Night"
  ova_murim.150.d: "The demonic cult does not send an army. It sends knives. The old master of the house, patriarch or matriarch, is found at dawn in the ancestral hall, the tea still warm, the assassins long gone over the wall. The seat that ruled the mountain stands suddenly, terribly empty, and every eye in the hall turns to the one everyone has been waiting on for years."
  ova_murim.150.f: "He knew this was coming. He always knows. Knowing has never once made it hurt less."
  ova_murim.150.a: "Take up the seat his house offers."
  ova_murim.150.b: "Accept the acclamation of the hall."
  ova_murim.150.c: "Take the seat, because no one is left to stop him."
  ova_murim.151.t: "A Wedding and a New Name"
  ova_murim.151.d: "They marry beneath the ancestral tablets, the prodigy and the daughter of the house that took him in, and he sets aside the name he came with and takes the clan's own, becoming its son in blood as he has long been in deed. The elders weep, the banners bow, and the mountain has a master again, freely chosen and freely loved. The banners he befriended send their oaths within the week."
  ova_murim.151.f: "A boy came to the gate with a borrowed name and nothing else. He leaves the wedding with a family, a mountain, and every friend he made along the way."
  ova_murim.151.a: "Take up the mountain, and the marches with it."
  ova_murim.152.t: "The Hall Names Its Patriarch"
  ova_murim.152.d: "There is no vote and no contest. The whole hall, elders and disciples and the banners he befriended alike, names the strange disciple patriarch of the sect by simple acclamation, because there was never anyone else and everyone always knew it. He takes the seat he never grasped for, and the mountains that trust him bind themselves to his in the same breath."
  ova_murim.152.f: "The best thrones are the ones you never reach for. They come to you, carried by the people you were good to."
  ova_murim.152.a: "Take up the mountain, and the marches with it."
  ova_murim.153.t: "The Seat Taken by Force"
  ova_murim.153.d: "The old master is dead and the hall is full of frightened, quarreling elders, and not one of them can stand against the man who knows all their secrets and every weakness of every blade they hold. He takes the seat because there is no one left with the strength to deny it him. The banners he alienated look away. The luck that always seemed to follow him goes quiet, as though it, too, has finally had enough."
  ova_murim.153.f: "He has what he wanted. He notices, sitting down, how few people are glad of it."
  ova_murim.153.a: "Sit the empty throne."
  ova_murim.156.t: "The Reckoning Declared"
  ova_murim.156.d: "The army is raised, the maps are drawn, and the strange disciple, now master of the mountain by his own cold hand, declares the Reckoning on the Heavenly Demon Sect. There will be no negotiated peace and no half-measures. One mountain will own the other, and the murim will be remade in the shape of whoever is left standing."
  ova_murim.156.f: "He will win it. He has always been able to see that far. What comes after, even he cannot read."
  ova_murim.156.a: "March north."
