l_english:
  # ============================================================ enrollment
  ova_academy.1.t: "Saint Christine’s Academy"
  ova_academy.1.d: "The Church keeps a finishing school for its summoned champions, part chapel, part barracks, part alarmingly expensive boarding house. The course runs a full four years, two terms to a year, and our Hero is enrolled for every last day of it, whether the honor was asked for or not. There is a uniform. There is a curfew. There is, the registrar warns, a great deal of homework."
  ova_academy.1.f: "Every summoned Hero before them sat these same benches. That is either reassuring or alarming, depending on how one feels about uniforms."
  ova_academy.1.a: "Enroll for the four years."

  # ============================================ TERM 1: arrival & awakening
  ova_academy.101.t: "The Aptitude Stone"
  ova_academy.101.d: "First week, first ritual: every incoming champion lays a palm on the Aptitude Stone while the whole cohort watches the light climb. Blaze too bright and you are the year’s marked prodigy from day one, with all the challenges that invites. Keep the glow modest and nobody will look at you twice, which has its own quiet uses."
  ova_academy.101.f: "The stone does not lie about what you are. It says nothing at all about what you choose to show."
  ova_academy.101.a: "Let it blaze and top the ledger."
  ova_academy.101.b: "Cup a hand over it and read the room first."
  ova_academy.102.t: "The Placement Examination"
  ova_academy.102.d: "Before lessons even begin, the Academy ranks its intake head to foot: a long day of written trials, warded sparring, and pointed questions from proctors who have clearly seen every kind of clever answer before. Where our Hero lands on that first list will shadow them for years, so the only real question is how honestly to answer."
  ova_academy.102.f: "Rankings, it turns out, follow you around like a stray dog. Best to decide early what you want the dog to look like."
  ova_academy.102.a: "Answer everything and place where you place."
  ova_academy.102.b: "Aim for the anonymous middle of the class."
  ova_academy.103.t: "The Assigned Roommate"
  ova_academy.103.d: "The dormitory pairs champions by lottery, and our Hero has drawn a genuine oddity: a roommate who talks in their sleep, hoards enchanted trinkets under the bed, and knows a startling amount about everyone worth knowing. Four years is a long time to share a room with someone. It could be an ally for life or a very long argument."
  ova_academy.103.f: "You do not choose your roommate. You only choose whether to survive them or befriend them."
  ova_academy.103.a: "Win the strange roommate over."
  ova_academy.103.b: "Keep to your own side of the room and train."
  ova_academy.104.t: "The Empty Purse"
  ova_academy.104.d: "Tuition is waived; nothing else is. The other first-years arrive with allowances and family names, and our Hero arrives with lint. Rather than starve genteelly, there are options: honest wages down in the city after hours, or quietly selling off a keepsake carried from a whole world away to a collector who asks no questions."
  ova_academy.104.f: "A summoned Hero of prophecy, counting coppers to afford supper. Nobody puts that part in the tapestries."
  ova_academy.104.a: "Take a part-time job down in the city."
  ova_academy.104.b: "Sell a keepsake from home to a collector."

  # ========================================= TERM 2: first finals & a rival
  ova_academy.111.t: "First-Year Finals"
  ova_academy.111.d: "The first year closes the way every year here will: examinations on doctrine, decorum, and demon anatomy, in roughly that order of importance to the faculty. Three more years of this, the proctor notes cheerfully, distributing the ink. Our Hero can grind through the night, or gamble on instinct and a good sleep."
  ova_academy.111.f: "Nobody warned them there would be homework. Nobody warned them there would be four years of it."
  ova_academy.111.a: "Cram all night."
  ova_academy.111.b: "Trust your instincts and sleep."
  ova_academy.112.t: "The Noble’s Sneer"
  ova_academy.112.d: "Every academy has one: the high-born classmate who has decided, loudly and in the busiest corridor, that a nameless summoned upstart has no business ranking above them. The whole hall has gone quiet to watch. Our Hero can answer the sneer with frost, or answer it with a wager nobody will be able to talk about anything else for a week."
  ova_academy.112.f: "There is always one who mistakes an old name for a sharp blade. The correction is usually educational."
  ova_academy.112.a: "Answer with cold courtesy."
  ova_academy.112.b: "Answer with a very public wager."
  ova_academy.113.t: "The Forced Duel"
  ova_academy.113.d: "Tradition, and a needling upper-former, conspire to drag our Hero into a formal bout before half the student body. Winning is not in doubt. What is in doubt is how much to show: a clean victory that lets the watchers glimpse a sliver of the real thing, or a deliberately graceless scrape that keeps everyone comfortably underestimating you."
  ova_academy.113.f: "The trick to hiding your strength is losing the habit of winning beautifully. It is harder than it sounds."
  ova_academy.113.a: "Win clean and let them glimpse the truth."
  ova_academy.113.b: "Win ugly on purpose and stay underestimated."
  ova_academy.114.t: "The Winter Break Invitation"
  ova_academy.114.d: "The first long recess arrives, dormitories emptying as classmates scatter home to warm hearths and worried mothers. Our Hero is invited along by a friend, and could go, and be young and off-duty for two whole weeks. Or the empty training halls will be gloriously, silently unoccupied for exactly as long."
  ova_academy.114.f: "Everyone else is going home. The word still snags on something, for a Hero whose home is a whole world away."
  ova_academy.114.a: "Go home with a friend for the holiday."
  ova_academy.114.b: "Stay and drill the empty halls."

  # ============================================= TERM 3: practicals begin
  ova_academy.121.t: "The Subjugation Practical"
  ova_academy.121.d: "Second year turns serious: the class is marched into a warded training-delve stocked with real, if leashed, monsters, and graded on how they handle it. Our Hero can take the front and carve a path the proctors will remember, or hang back and orchestrate, letting nervous juniors bag the kills and the confidence."
  ova_academy.121.f: "The monsters are leashed. The grading is not."
  ova_academy.121.a: "Lead the squad from the front."
  ova_academy.121.b: "Direct from the rear and let the juniors shine."
  ova_academy.122.t: "The Scarred Professor"
  ova_academy.122.d: "One of the instructors, a battered veteran with a bad leg and worse manners, has taken an interest. The offer is blunt: extra lessons, brutal ones, of the kind the polite curriculum does not teach, provided our Hero can keep up and keep quiet. It would cost sweat and free evenings. It might also be the most useful thing in this whole school."
  ova_academy.122.f: "The teachers who smile at you teach the syllabus. The one who scowls is offering something the syllabus left out."
  ova_academy.122.a: "Accept the grueling private lessons."
  ova_academy.122.b: "Decline, and keep your own counsel."
  ova_academy.123.t: "The Rankings Board"
  ova_academy.123.d: "The dueling ladder hangs in the great hall, every champion’s name pinned in order of proven skill, and challenges up the board are the Academy’s favorite blood sport. Our Hero can name the rival posted just above and force a bout, or leave the board alone and let ambitious underclassmen come knocking instead."
  ova_academy.123.f: "A name on a board is a small thing to bleed over. Everyone bleeds over it anyway."
  ova_academy.123.a: "Challenge the name posted above yours."
  ova_academy.123.b: "Sit tight and let the challengers come to you."
  ova_academy.124.t: "The Restricted Archive"
  ova_academy.124.d: "A careless librarian has left the restricted archive unlatched, and inside sits a treatise the faculty most certainly does not assign to second-years. Our Hero could copy it out by candlelight before dawn and be quietly the wiser, or do the dutiful thing and report the open door to a grateful, approving Church."
  ova_academy.124.f: "Every forbidden shelf in every school exists to be read by exactly the student forbidden to read it."
  ova_academy.124.a: "Copy the sealed treatise by candlelight."
  ova_academy.124.b: "Report the unlocked door like a good student."

  # ======================================= TERM 4: the festival & the terror
  ova_academy.131.t: "The Founding Festival"
  ova_academy.131.d: "Bunting, sparring rings, a suspicious quantity of meat pies. The Academy’s founding festival is the one week a year the whole city turns out to watch its champions show off. Our Hero can enter the exhibition duels and give the crowd its spectacle, or take a quieter shift at the charity booth raising alms for the war’s orphans."
  ova_academy.131.f: "It is, everyone agrees, exactly like a school fete back home, if the raffle prizes were enchanted swords."
  ova_academy.131.a: "Enter the exhibition duel."
  ova_academy.131.b: "Run the charity booth for the war orphans."
  ova_academy.132.t: "The War Games"
  ova_academy.132.d: "Once a year the Academy stages a mock war, whole years pitted against one another across the drill fields with blunted steel and warded spells, and pride very much unblunted. Our Hero can take command of a scrappy underclassman company and gun for a famous upset, or plant themselves as the immovable anchor of the line and simply refuse to break."
  ova_academy.132.f: "It is only a game until the losing side has to sit through a whole year of being reminded of it."
  ova_academy.132.a: "Command the underclassmen to a famous upset."
  ova_academy.132.b: "Play the anchor, unbreakable and dull."
  ova_academy.133.t: "The Festival Incident"
  ova_academy.133.d: "The festival is at its loudest when the screaming starts. Something has slipped the wards, monsters or worse loose among the stalls, and for one heartbeat every trained champion in the square freezes. Our Hero does not have the luxury of a second heartbeat: cut the things down before the panic spreads, or turn away from the fight to herd terrified civilians clear of it."
  ova_academy.133.f: "The academy arc always has one of these. The bunting never quite comes down clean afterward."
  ova_academy.133.a: "Cut them down before the crowd even panics."
  ova_academy.133.b: "Get the civilians clear first, fight second."
  ova_academy.134.t: "The Summer Training Camp"
  ova_academy.134.d: "The long summer recess ships the second-years off to a coastal camp that is, the brochure insists, a chance to rest. The instructors have other ideas, and so does our Hero, who can spend the fortnight sparring dawn to dusk on the hot sand, or commit the truly radical act of actually resting for once."
  ova_academy.134.f: "Seaside. Sunshine. A whistle at five in the morning. Somebody’s idea of a holiday."
  ova_academy.134.a: "Spar dawn to dusk on the sand."
  ova_academy.134.b: "Actually rest, for once in your life."

  # ========================================= TERM 5: scouted & the tower
  ova_academy.141.t: "The Elite Class Selection"
  ova_academy.141.d: "Third year, and the faculty skims the cream: a hand-picked elite cohort, extra masters, harder trials, and a fast track to every honor the Academy can bestow. Our Hero has been invited to test in. The training would be worth it. So would the freedom of politely declining and staying, unremarkable and unwatched, among the ordinary ranks."
  ova_academy.141.f: "Every ladder up is also a spotlight. Some climbers want the height. Some just want the dark."
  ova_academy.141.a: "Test into the elite cohort."
  ova_academy.141.b: "Stay with your year and refuse the ladder."
  ova_academy.142.t: "The Great House’s Envoy"
  ova_academy.142.d: "A liveried envoy from one of the realm’s great houses has come calling, and the message is flattering and unsubtle: attach yourself to us now, and doors open for the rest of your life. Our Hero can hear the offer out and bank the goodwill without promising a thing, or refuse it cleanly and keep from owing any house anything at all."
  ova_academy.142.f: "The powerful collect promising students the way other people collect stamps. It is wise to know which album you are being pasted into."
  ova_academy.142.a: "Hear the offer out and bank the favor."
  ova_academy.142.b: "Turn it down flat and keep your freedom."
  ova_academy.143.t: "The Tower Ascent"
  ova_academy.143.d: "Beneath the Academy stands the training tower, floor upon warded floor of escalating trials, and every champion’s deepest cleared floor is a matter of public record and private obsession. Our Hero can push hard for a record that will be talked about for years, or clear the next floors carefully and take no risks that end in the infirmary."
  ova_academy.143.f: "The tower does not care how famous you are. It only cares which floor kills you."
  ova_academy.143.a: "Push for a new floor record."
  ova_academy.143.b: "Clear it steadily, no heroics."
  ova_academy.144.t: "The Infirmary Window"
  ova_academy.144.d: "A bad landing in the tower, and our Hero wakes in the infirmary with a splinted arm and a stern healer. There is a classmate at the bedside more often than duty requires, and a choice: heal properly and let the enforced stillness sharpen the mind, or be climbing back out the window toward the training ring before the plaster has even set."
  ova_academy.144.f: "The infirmary is where the school stores its heroes when it needs them to sit still and think for once."
  ova_academy.144.a: "Heal properly and let the wound teach you."
  ova_academy.144.b: "Sneak back to the training ring early."

  # ======================================== TERM 6: trials & the rival
  ova_academy.151.t: "Third-Year Finals"
  ova_academy.151.d: "The penultimate year’s examinations are the cruelest yet, and the faculty makes no secret of wanting to see who cracks. Our Hero can put their head down and top the written boards outright, or coast on ability alone and spend the saved hours dragging the year’s strugglers over the line beside them."
  ova_academy.151.f: "By the third year you can either be the best in the room or the reason the room passes. Rarely both at once."
  ova_academy.151.a: "Top the written boards."
  ova_academy.151.b: "Coast, and coach the strugglers through."
  ova_academy.152.t: "The Rival’s Debt"
  ova_academy.152.d: "It happens in an eyeblink: a training accident, a collapsing gantry, and the classmate trapped beneath it is the very rival who has spent three years trying to best our Hero. Nobody else is close enough. Our Hero can haul them clear in front of the whole yard and let everyone see it, or haul them clear and never once bring it up again."
  ova_academy.152.f: "The surest way to end a rivalry is to be the one who reaches down. It rarely stays a rivalry after that."
  ova_academy.152.a: "Pull them out of the collapse in front of everyone."
  ova_academy.152.b: "Pull them out, and never once mention it."
  ova_academy.153.t: "The Hidden Dungeon"
  ova_academy.153.d: "A wrong turn in the tower’s foundations opens onto a passage that is on no map: an old, sealed dungeon under the school, humming with something the wards were built to keep down. Our Hero can delve to the bottom and take whatever the dark has been guarding, or seal it back up and hand the discovery to a very interested faculty."
  ova_academy.153.f: "Every academy is built on top of exactly one thing it would rather the students never found. This is that thing."
  ova_academy.153.a: "Delve to the bottom and claim the relic."
  ova_academy.153.b: "Seal it and report it to the faculty."
  ova_academy.154.t: "The Sponsor’s Banquet"
  ova_academy.154.d: "The Academy’s patrons throw a glittering banquet each year to look over the coming crop of champions, and our Hero has been seated where the money can see them. Charm the sponsors and a comfortable stipend follows, along with all the strings attached to it. Bore them into forgetting you exist, and you graduate owing precisely no one."
  ova_academy.154.f: "Patrons are generous to promising students for exactly as long as the students remain promising and grateful."
  ova_academy.154.a: "Charm the sponsors and secure a stipend."
  ova_academy.154.b: "Bore them on purpose and owe no one."

  # ==================================== TERM 7: senior year & the tournament
  ova_academy.161.t: "The Inter-Academy Tournament"
  ova_academy.161.d: "Senior year opens with the great inter-academy tournament, champions from every rival school converging under one banner to settle, for one season, who trained the best. Our Hero can fight all the way to the final with nothing held back and let the world measure them, or throw an early round and keep their true ceiling a secret worth keeping."
  ova_academy.161.f: "One tournament, every school watching, every scout taking notes. A very public place to decide how much of yourself to reveal."
  ova_academy.161.a: "Fight to the final, hold nothing back."
  ova_academy.161.b: "Throw an early round to hide your ceiling."
  ova_academy.162.t: "The Professor’s Past"
  ova_academy.162.d: "The scarred old instructor is not, it turns out, merely a washed-up drillmaster. Our Hero stumbles onto the truth of who they used to be, and it is the kind of secret that ended careers and started wars. The professor knows they were seen. They ask, without asking, whether it will be kept, or dragged into daylight."
  ova_academy.162.f: "Everyone in this building is running from something. The teachers are simply better at it than the students."
  ova_academy.162.a: "Keep the old soldier’s secret."
  ova_academy.162.b: "Press them for the whole story."
  ova_academy.163.t: "The Recruiting Orders"
  ova_academy.163.d: "With graduation in sight, the knightly orders and mercenary companies descend to bid for the senior class, and our Hero’s name is near the top of every list. There is real advantage in letting the offers pile up and drive one another higher. There is a different kind of advantage in refusing them all and walking out of this school beholden to nobody."
  ova_academy.163.f: "They are not offering a job. They are offering to own the next decade of your life, gilt-edged and in writing."
  ova_academy.163.a: "Let the orders bid each other up."
  ova_academy.163.b: "Commit to none and stay your own blade."
  ova_academy.164.t: "The Juniors’ Mentor"
  ova_academy.164.d: "The wheel has turned: the terrified first-years now look up at our Hero the way our Hero once looked up at the seniors. The faculty has handed over a squad of them to shape. They can be drilled without mercy into something the war will not chew up too quickly, or taught, more quietly, the single dirty trick that has kept our Hero breathing this long."
  ova_academy.164.f: "You know you have made it when the frightened new ones start flinching toward you instead of away."
  ova_academy.164.a: "Drill the first-years without mercy."
  ova_academy.164.b: "Teach them the one trick that kept you alive."

  # ==================================== TERM 8: the run-up to graduation
  ova_academy.171.t: "The Final Practicum"
  ova_academy.171.d: "The last practical exam of the whole course: a real field problem, graded by masters who have stopped being kind. Our Hero can take it alone and ace the thing outright, a solo mark for the record books, or shoulder the harder task of steering a whole squad through it and bringing every one of them home with a passing grade."
  ova_academy.171.f: "Four years come down to one field, one problem, and one last chance to prove the summoning was worth it."
  ova_academy.171.a: "Ace the capstone alone."
  ova_academy.171.b: "Bring your whole squad home graded."
  ova_academy.172.t: "The Doctrine Oral"
  ova_academy.172.d: "No one graduates without standing before a bench of lectors and defending the faith aloud. The questions are barbed and the answers are watched. Our Hero can give the lectors precisely the pious replies they are fishing for and earn the Church’s warm regard, or answer with what they have actually come to believe, and let the room go cold."
  ova_academy.172.f: "They call it a defense of doctrine. It is really a test of how well you have learned to say what is wanted."
  ova_academy.172.a: "Tell the lectors exactly what they want to hear."
  ova_academy.172.b: "Tell them what you actually believe."
  ova_academy.173.t: "The Senior Send-Off"
  ova_academy.173.d: "The final festival belongs to the graduating class, a long bright evening of speeches and lanterns and goodbyes that everyone pretends will not last. Our Hero has been asked to give the farewell address before the whole school. Or the empty training ring will be waiting, quiet and honest, while everyone else says their farewells."
  ova_academy.173.f: "Four years, and it ends with lanterns and a lump in the throat nobody admits to."
  ova_academy.173.a: "Give the farewell address."
  ova_academy.173.b: "Slip away and train the empty ring."
  ova_academy.174.t: "The Night Before"
  ova_academy.174.d: "The last night in the dormitory, trunks packed, the room already looking like somewhere other people will live. The old classmates are sitting up together the way they did that first frightened year, and there is space in the circle. Our Hero can take it and stay up until dawn, or sit apart and put an edge on a blade that will need it soon enough."
  ova_academy.174.f: "Tomorrow they are champions of the realm. Tonight they are just a handful of students who do not want the lamp put out."
  ova_academy.174.a: "Sit up with your class one last time."
  ova_academy.174.b: "Polish your blade in silence."

  # ============================================ GRADUATION: the four scenes
  ova_academy.181.t: "Valedictorian"
  ova_academy.181.d: "Four years of doctrine, drills, and diplomatically worded reprimands end with our Hero at the very head of the class, the valedictory laurel and a great many speeches about destiny that are mostly tuned out. The name goes to the top of the board one final time, where everyone agrees it always belonged."
  ova_academy.181.f: "They hand you a laurel for being the best of a very frightening year. Nobody mentions the war is still going."
  ova_academy.181.a: "Accept the laurel at the head of the class."
  ova_academy.182.t: "The Frontier Posting"
  ova_academy.182.d: "There is no long ceremony for our Hero. The graduation papers come stapled to a commission, and the commission points at the scarred border where the fighting is worst and the veterans are fewest. The diploma is real. So is the map, and the very short list of names of everyone posted there before."
  ova_academy.182.f: "Some graduates get a handshake and a party. Some get a handshake and a map to the front. The handshake is the same."
  ova_academy.182.a: "Take the commission to the scarred border."
  ova_academy.183.t: "The Church’s Chosen"
  ova_academy.183.d: "Our Hero graduates straight into the Church’s own elite, singled out at the ceremony and handed a reliquary blade before the whole assembly. It is an honor most champions would give a limb for, wrapped tightly around an obligation that will not be easy to ever set down again."
  ova_academy.183.f: "A blessed blade, a place at the Goddess’s right hand, and a leash so gilded you could almost mistake it for a gift."
  ova_academy.183.a: "Kneel and accept the reliquary blade."
  ova_academy.184.t: "The Quiet Diploma"
  ova_academy.184.d: "Our Hero collects the diploma the way some people leave a party, early and by a side door, before the speeches about destiny can find a target. Four years of classmates cannot be summed up in a ceremony anyway, and there is a whole waiting world that never did care for pomp. The certificate goes in a bag. The road goes on."
  ova_academy.184.f: "No laurel, no banner, no address. Just a folded certificate and the quiet certainty that the real test starts now."
  ova_academy.184.a: "Leave without the speeches."
