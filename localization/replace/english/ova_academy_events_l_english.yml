l_english:
  # ============================================================ enrollment
  ova_academy.1.t: "Saint Christine’s Academy"
  ova_academy.1.d: "Saint Christine’s Academy. Apparently, that is where summoned Heroes are sent after being dragged into another world. It is part chapel, part barracks, and part boarding school with fees high enough to make a treasurer cry. The course lasts four full years, two terms each year, and our Hero has already been enrolled for every one of them. Nobody bothered asking whether that sounded appealing. There is a uniform. There is a curfew. And, according to the registrar’s very serious expression, there is a truly unreasonable amount of homework."
  ova_academy.1.f: "So even after being summoned to another world, school is still unavoidable. Somehow, that feels like the cruelest part."
  ova_academy.1.a: "Enroll for the four years."

  # ============================================ TERM 1: arrival & awakening
  ova_academy.101.t: "The Aptitude Stone"
  ova_academy.101.d: "The first week begins with the Aptitude Stone. Every new champion places a hand on it while the entire class watches the light rise. Shine too brightly and everyone immediately decides you are the year’s prodigy. That means praise, attention, challenges, and probably no peace for the next four years. Keep the glow modest, on the other hand, and most people will forget your name by lunch. There are advantages to both."
  ova_academy.101.f: "The stone reveals talent. Fortunately, it does not reveal how much talent you intended to show."
  ova_academy.101.a: "Let it blaze and top the ledger."
  ova_academy.101.b: "Cup a hand over it and read the room first."
  ova_academy.102.t: "The Placement Examination"
  ova_academy.102.d: "Classes have not even started, and the Academy is already ranking everyone. Written exams, warded sparring, oral questions from proctors who have heard every clever answer imaginable. By evening, every new student has a number beside their name. Worse, that first number tends to follow you around for years. In other words, the real question is not whether our Hero can score highly. It is whether scoring highly is actually a good idea."
  ova_academy.102.f: "Once a ranking board learns your name, it becomes strangely difficult to make it forget."
  ova_academy.102.a: "Answer everything and place where you place."
  ova_academy.102.b: "Aim for the anonymous middle of the class."
  ova_academy.103.t: "The Assigned Roommate"
  ova_academy.103.d: "The dormitories assign roommates by lottery. Naturally, our Hero draws someone memorable. The new roommate talks in their sleep, stores suspicious enchanted junk under the bed, and somehow already knows every useful rumor in the Academy. Four years is a long time to share one room with a stranger. By graduation, they may become a lifelong friend. Or one of them may learn how to sleep with earplugs and a knife under the pillow."
  ova_academy.103.f: "You do not choose your roommate. You merely discover what kind of problem the lottery has given you."
  ova_academy.103.a: "Win the strange roommate over."
  ova_academy.103.b: "Keep to your own side of the room and train."
  ova_academy.104.t: "The Empty Purse"
  ova_academy.104.d: "There is one small problem with the Academy’s generous scholarship. Tuition is free. Everything else is not. The noble students arrive with allowances, servants, and family accounts. Our Hero arrives with an empty purse and the unpleasant discovery that prophecy does not pay for dinner. There are two obvious solutions: work in the city after class like an ordinary student, or sell one of the few keepsakes brought from the old world to a collector who is far too interested in it."
  ova_academy.104.f: "A Hero chosen by fate, counting coppers for supper. The songs always skip this chapter."
  ova_academy.104.a: "Take a part-time job down in the city."
  ova_academy.104.b: "Sell a keepsake from home to a collector."

  # ========================================= TERM 2: first finals & a rival
  ova_academy.111.t: "First-Year Finals"
  ova_academy.111.d: "And just like that, the first year reaches finals. Doctrine, etiquette, demon anatomy. Apparently the faculty considers them important in roughly that order. The proctor cheerfully reminds everyone that there are only three more years of this, which does not improve morale. Our Hero can stay awake until dawn cramming every page, or trust in talent, get a full night’s sleep, and hope confidence counts for something."
  ova_academy.111.f: "Nobody mentioned homework during the summoning ceremony. That omission now feels deliberate."
  ova_academy.111.a: "Cram all night."
  ova_academy.111.b: "Trust your instincts and sleep."
  ova_academy.112.t: "The Noble’s Sneer"
  ova_academy.112.d: "Every school seems to have one. A high-born student with an old family name, a loud voice, and an inexplicable need to announce in the busiest corridor that some nameless otherworlder has no right to rank above them. The hallway goes quiet almost immediately. Everyone is watching. Our Hero can answer with the cold dignity expected of a champion, or make a wager so ridiculous that the entire Academy will be gossiping about it by dinner."
  ova_academy.112.f: "Some people inherit estates. Some inherit the confidence to start fights they should not start."
  ova_academy.112.a: "Answer with cold courtesy."
  ova_academy.112.b: "Answer with a very public wager."
  ova_academy.113.t: "The Forced Duel"
  ova_academy.113.d: "One irritating upperclassman, one ancient school tradition, and suddenly our Hero is standing in a formal dueling ring before half the student body. Winning is not really the problem. The problem is how to win. A clean victory will reveal at least a little of the strength everyone keeps whispering about. A clumsy, unimpressive scrape will preserve the far more useful reputation of being merely decent."
  ova_academy.113.f: "Hiding your strength sounds easy until someone gives you a perfectly good chance to show off."
  ova_academy.113.a: "Win clean and let them glimpse the truth."
  ova_academy.113.b: "Win ugly on purpose and stay underestimated."
  ova_academy.114.t: "The Winter Break Invitation"
  ova_academy.114.d: "The first long break finally arrives. One by one, the dormitories empty as classmates return to warm homes, worried parents, and food that does not come from the Academy kitchen. A friend invites our Hero along. Two whole weeks of pretending to be an ordinary young person sounds unexpectedly tempting. Then again, the training halls will also be completely empty for two whole weeks. That sounds tempting in an entirely different way."
  ova_academy.114.f: "Everyone keeps saying they are going home. For someone whose home is another world, the word lands a little strangely."
  ova_academy.114.a: "Go home with a friend for the holiday."
  ova_academy.114.b: "Stay and drill the empty halls."

  # ============================================= TERM 3: practicals begin
  ova_academy.121.t: "The Subjugation Practical"
  ova_academy.121.d: "Second year begins by abandoning the illusion that this is a normal school. The class is marched into a warded training delve filled with real monsters. Leashed monsters, technically, but their teeth do not seem aware of the distinction. The exercise is graded. Our Hero can charge at the front and carve open the route personally, or stay back, direct the group, and let the nervous juniors earn a few victories of their own."
  ova_academy.121.f: "The monsters are restrained. The instructors’ grading standards are not."
  ova_academy.121.a: "Lead the squad from the front."
  ova_academy.121.b: "Direct from the rear and let the juniors shine."
  ova_academy.122.t: "The Scarred Professor"
  ova_academy.122.d: "One of the instructors has taken an interest in our Hero. Unfortunately, it is the scarred veteran with the bad leg, worse temper, and habit of looking at students as if measuring where they will break. His offer is simple: private lessons after hours, brutal enough that the polite curriculum would never approve of them. It will cost free evenings, skin, and probably dignity. It may also be the first useful offer anyone at this school has made."
  ova_academy.122.f: "The teachers who smile teach the syllabus. The teacher who scowls is offering the things the syllabus was too polite to mention."
  ova_academy.122.a: "Accept the grueling private lessons."
  ova_academy.122.b: "Decline, and keep your own counsel."
  ova_academy.123.t: "The Rankings Board"
  ova_academy.123.d: "The Academy keeps a dueling ladder in the great hall, because apparently students were not competitive enough already. Every champion’s name is pinned in order of proven skill, and anyone may challenge the person above them. Our Hero can call out the rival one rank higher and climb immediately, or leave the board alone and wait for ambitious students below to come looking for trouble instead."
  ova_academy.123.f: "It is only a name on a board. Naturally, everyone is willing to bleed over it."
  ova_academy.123.a: "Challenge the name posted above yours."
  ova_academy.123.b: "Sit tight and let the challengers come to you."
  ova_academy.124.t: "The Restricted Archive"
  ova_academy.124.d: "The restricted archive is supposed to be locked. Today, it is not. Inside sits a treatise that second-years are very specifically not allowed to read, which naturally makes it far more interesting than anything on the assigned list. Our Hero could spend the night copying it by candlelight and quietly gain knowledge the faculty never intended to share. Or they could report the open door and earn the Church’s approval for being painfully responsible."
  ova_academy.124.f: "A forbidden book has an amazing talent for becoming the most readable book in the building."
  ova_academy.124.a: "Copy the sealed treatise by candlelight."
  ova_academy.124.b: "Report the unlocked door like a good student."

  # ======================================= TERM 4: the festival & the terror
  ova_academy.131.t: "The Founding Festival"
  ova_academy.131.d: "The Founding Festival arrives with bunting, dueling rings, and enough meat pies to feed a small army. For one week, the city treats the Academy like a giant school fair and comes to watch the champions show off. Our Hero can enter the exhibition matches and give everyone the spectacle they came for, or take a quieter shift at the charity booth collecting alms for children orphaned by the war."
  ova_academy.131.f: "It almost feels like a school festival back home. The enchanted swords in the prize stalls ruin the illusion a little."
  ova_academy.131.a: "Enter the exhibition duel."
  ova_academy.131.b: "Run the charity booth for the war orphans."
  ova_academy.132.t: "The War Games"
  ova_academy.132.d: "Once a year, the Academy stages a mock war. Entire year groups are divided into armies, handed blunted weapons and warded spells, and told not to take it personally. Everyone immediately takes it personally. Our Hero can command a ragged underclassman company and try for the sort of upset people remember for years, or stand in the center of the line and become the one thing the enemy simply cannot push aside."
  ova_academy.132.f: "It is only a game. That is what the losing side will insist for the next twelve months."
  ova_academy.132.a: "Command the underclassmen to a famous upset."
  ova_academy.132.b: "Play the anchor, unbreakable and dull."
  ova_academy.133.t: "The Festival Incident"
  ova_academy.133.d: "The festival is at its loudest when the first scream cuts through the music. For one heartbeat, nobody understands what happened. Then something that should have been behind the wards comes crashing through the stalls. Monsters. Maybe worse. Even trained champions freeze when reality changes that quickly. Our Hero does not have time to freeze twice. Either cut down the threat before panic spreads, or ignore the fight and get the civilians out first."
  ova_academy.133.f: "Of course the academy festival had to end with monsters. Some things really do feel scripted."
  ova_academy.133.a: "Cut them down before the crowd even panics."
  ova_academy.133.b: "Get the civilians clear first, fight second."
  ova_academy.134.t: "The Summer Training Camp"
  ova_academy.134.d: "The summer training camp is advertised as a seaside retreat. This is technically true. There is a sea. There is also a whistle at five in the morning. The instructors seem to believe sand makes excellent training ground, and our Hero can spend the entire break sparring under the sun from dawn to dusk. Or, for once, they could commit the almost unthinkable act of taking a holiday like a normal student."
  ova_academy.134.f: "Sea, sunshine, and compulsory dawn drills. Apparently that counts as rest here."
  ova_academy.134.a: "Spar dawn to dusk on the sand."
  ova_academy.134.b: "Actually rest, for once in your life."

  # ========================================= TERM 5: scouted & the tower
  ova_academy.141.t: "The Elite Class Selection"
  ova_academy.141.d: "Third year begins with the Academy separating out its best students. The elite class gets special masters, harder trials, better connections, and a direct path toward every honor the school can offer. Our Hero is invited to test in. The training would undoubtedly be valuable. Unfortunately, so would remaining in the ordinary class, where fewer people stare, fewer nobles take notes, and far fewer rivals decide they have something to prove."
  ova_academy.141.f: "Climbing higher also makes you easier to see. That part is rarely written on the invitation."
  ova_academy.141.a: "Test into the elite cohort."
  ova_academy.141.b: "Stay with your year and refuse the ladder."
  ova_academy.142.t: "The Great House’s Envoy"
  ova_academy.142.d: "A great house sends an envoy in full livery to call on our Hero. The offer is flattering, generous, and not subtle in the slightest. Join our side now, and doors will open for the rest of your life. Of course, doors opened by nobles tend to have strings tied to the handles. Our Hero can listen politely and collect the goodwill without promising anything, or refuse cleanly before a favor becomes a debt."
  ova_academy.142.f: "Powerful families like collecting promising students early. It is best to notice before you become part of the collection."
  ova_academy.142.a: "Hear the offer out and bank the favor."
  ova_academy.142.b: "Turn it down flat and keep your freedom."
  ova_academy.143.t: "The Tower Ascent"
  ova_academy.143.d: "Beneath the Academy stands the training tower, a stack of warded floors where every level is designed to be worse than the last. Naturally, the deepest floor each student has cleared is public knowledge. Naturally, everyone pretends not to care. Our Hero can push for a record that will make the whole school talk, or climb carefully, take the useful victories, and avoid learning what the infirmary ceiling looks like again."
  ova_academy.143.f: "The tower does not care about titles, rankings, or destiny. It only cares whether you can clear the next floor."
  ova_academy.143.a: "Push for a new floor record."
  ova_academy.143.b: "Clear it steadily, no heroics."
  ova_academy.144.t: "The Infirmary Window"
  ova_academy.144.d: "The answer, unfortunately, is that the infirmary ceiling is white. After a bad landing in the tower, our Hero wakes with one arm splinted and a healer already prepared to lecture them. A certain classmate has also been visiting suspiciously often. There are two sensible choices. Rest properly, recover, and use the forced stillness to study. Or climb out the window before the plaster is dry and return to training like an idiot."
  ova_academy.144.f: "The Academy uses the infirmary to make Heroes sit still. Its success rate is poor."
  ova_academy.144.a: "Heal properly and let the wound teach you."
  ova_academy.144.b: "Sneak back to the training ring early."

  # ======================================== TERM 6: trials & the rival
  ova_academy.151.t: "Third-Year Finals"
  ova_academy.151.d: "Third-year finals are worse than the first two, which the faculty appears almost proud of. The exams are deliberately vicious, and the professors are openly watching to see who cracks first. Our Hero can bury themselves in books and take the top marks outright. Or they can rely on ability, spend less time studying, and use those hours to drag half the struggling class across the passing line with them."
  ova_academy.151.f: "By third year, being the best student and being the reason everyone else passes have become two very different kinds of achievement."
  ova_academy.151.a: "Top the written boards."
  ova_academy.151.b: "Coast, and coach the strugglers through."
  ova_academy.152.t: "The Rival’s Debt"
  ova_academy.152.d: "It happens too quickly for anyone to think. A gantry breaks. Someone shouts. The student trapped underneath is the rival who has spent three years trying to beat our Hero at everything. Nobody else is close enough to help. There is no real choice about saving them. The choice comes afterward: make the rescue openly and let the whole yard see who reached down first, or pull them free and never mention the debt again."
  ova_academy.152.f: "A rivalry becomes awkward very quickly once one person owes the other their life."
  ova_academy.152.a: "Pull them out of the collapse in front of everyone."
  ova_academy.152.b: "Pull them out, and never once mention it."
  ova_academy.153.t: "The Hidden Dungeon"
  ova_academy.153.d: "A wrong turn beneath the training tower reveals a corridor that does not exist on any Academy map. That is already a bad sign. At the end lies an old sealed dungeon, its wards humming around something the school very clearly did not want students to find. Our Hero can go deeper and discover what has been hidden down there all these years, or reseal the entrance and report everything to a faculty that will suddenly become extremely interested."
  ova_academy.153.f: "Every fantasy academy seems to have one forbidden dungeon under it. Apparently Saint Christine’s was not going to be left out."
  ova_academy.153.a: "Delve to the bottom and claim the relic."
  ova_academy.153.b: "Seal it and report it to the faculty."
  ova_academy.154.t: "The Sponsor’s Banquet"
  ova_academy.154.d: "The Academy’s wealthy patrons hold a banquet each year to inspect the next generation of champions. This year, our Hero has been seated exactly where the rich people can see them. Charm the room and a generous stipend will follow. Unfortunately, so will expectations, invitations, favors, and all the invisible strings that money likes to bring along. Act boring enough, and everyone may simply forget to invest in you at all."
  ova_academy.154.f: "Patrons are generous. They are even more generous when they are certain you will remember who paid."
  ova_academy.154.a: "Charm the sponsors and secure a stipend."
  ova_academy.154.b: "Bore them on purpose and owe no one."

  # ==================================== TERM 7: senior year & the tournament
  ova_academy.161.t: "The Inter-Academy Tournament"
  ova_academy.161.d: "Senior year opens with the inter-academy tournament. Champions from every rival school pour into one arena, along with scouts, nobles, instructors, and enough gossip to fill another building. Our Hero can fight all the way to the final without holding anything back and finally let the world measure their true strength. Or they can lose early, smile politely, and keep that strength as a secret for people who actually need to know."
  ova_academy.161.f: "One tournament. Every rival school watching. There are quieter places to reveal your trump card."
  ova_academy.161.a: "Fight to the final, hold nothing back."
  ova_academy.161.b: "Throw an early round to hide your ceiling."
  ova_academy.162.t: "The Professor’s Past"
  ova_academy.162.d: "The scarred instructor is not merely an unpleasant old drillmaster. Our Hero discovers that by accident. The professor used to be someone important, dangerous, and connected to the kind of secret that ended careers and started wars. Worse, the professor realizes they have been recognized. Nothing is said directly. It does not need to be. The question is whether the past stays buried or gets dragged back into the light."
  ova_academy.162.f: "Apparently the students are not the only people at this school hiding their real backgrounds."
  ova_academy.162.a: "Keep the old soldier’s secret."
  ova_academy.162.b: "Press them for the whole story."
  ova_academy.163.t: "The Recruiting Orders"
  ova_academy.163.d: "Graduation is close enough to see, and suddenly every knightly order and mercenary company in the realm remembers the senior class exists. Offers arrive one after another, with our Hero’s name near the top of every list. Let them compete, and the terms will only improve. Refuse them all, and it becomes possible to leave Saint Christine’s with no master, no contract, and no one claiming the next ten years of your life."
  ova_academy.163.f: "They call it recruitment. The contracts are long enough that another word comes to mind."
  ova_academy.163.a: "Let the orders bid each other up."
  ova_academy.163.b: "Commit to none and stay your own blade."
  ova_academy.164.t: "The Juniors’ Mentor"
  ova_academy.164.d: "At some point, the frightened first-years stopped looking like classmates and started looking like children. That is when our Hero realizes the wheel has turned. The faculty hands over a squad of juniors and tells the senior to train them. They can be drilled brutally until the coming war has a harder time killing them, or taught one quiet, ugly trick that has kept our Hero alive far more often than the official curriculum ever did."
  ova_academy.164.f: "You know you have become a senior when the new students start looking at you for the answer."
  ova_academy.164.a: "Drill the first-years without mercy."
  ova_academy.164.b: "Teach them the one trick that kept you alive."

  # ==================================== TERM 8: the run-up to graduation
  ova_academy.171.t: "The Final Practicum"
  ova_academy.171.d: "The final practical exam is not a simulation. The masters give the graduating class a real field problem and stop being gentle about the grading. Our Hero can take the assignment alone and chase a perfect individual score, or accept the harder job of leading a full squad through it and making sure every single person comes back with a passing mark."
  ova_academy.171.f: "Four years of training, and the last question is simple: can you finish the job and still bring everyone home?"
  ova_academy.171.a: "Ace the capstone alone."
  ova_academy.171.b: "Bring your whole squad home graded."
  ova_academy.172.t: "The Doctrine Oral"
  ova_academy.172.d: "No one graduates from Saint Christine’s without defending the faith before a bench of lectors. The questions sound theological, but everyone in the room understands the real test. They want the correct answers, delivered with the correct expression. Our Hero can give them exactly what they want and leave with the Church smiling warmly. Or answer honestly about what four years in this world have actually taught, and feel the room grow colder with every sentence."
  ova_academy.172.f: "They call it an oral defense of doctrine. In practice, it is an exam on knowing what not to say."
  ova_academy.172.a: "Tell the lectors exactly what they want to hear."
  ova_academy.172.b: "Tell them what you actually believe."
  ova_academy.173.t: "The Senior Send-Off"
  ova_academy.173.d: "The final school festival belongs to the graduating class. Lanterns hang over the courtyards, speeches run too long, and everyone keeps saying goodbye as if they will definitely meet again soon. Our Hero has been asked to give the farewell address before the whole Academy. The alternative is the empty training ring, quiet for once, where a person can spend the evening without pretending endings are easy."
  ova_academy.173.f: "Four years sounded endless on the first day. Somehow, the last evening arrives far too quickly."
  ova_academy.173.a: "Give the farewell address."
  ova_academy.173.b: "Slip away and train the empty ring."
  ova_academy.174.t: "The Night Before"
  ova_academy.174.d: "The trunks are packed. Half the shelves are bare. The dorm room already looks as though it belongs to the next students. The old classmates are sitting together one last time, talking the way they did during that frightened first year, and there is still a place open in the circle. Our Hero can sit down, stay awake until dawn, and let the night last as long as possible. Or sit apart and sharpen the blade that will be needed soon enough."
  ova_academy.174.f: "Tomorrow they will be champions of the realm. Tonight, they are still just students who do not want anyone to put out the lamp."
  ova_academy.174.a: "Sit up with your class one last time."
  ova_academy.174.b: "Polish your blade in silence."

  # ============================================ GRADUATION: the four scenes
  ova_academy.181.t: "Valedictorian"
  ova_academy.181.d: "Four years of doctrine, drills, exams, punishments, and politely worded reprimands end with our Hero standing at the very top of the class. A laurel is placed on their head. Several important people give speeches about destiny. Most of those speeches become background noise. The only part that feels real is seeing the name written at the top of the board one final time."
  ova_academy.181.f: "They give you a laurel for surviving four years as the best student in a terrifying class. The war, inconveniently, is still waiting outside."
  ova_academy.181.a: "Accept the laurel at the head of the class."
  ova_academy.182.t: "The Frontier Posting"
  ova_academy.182.d: "There is no long graduation celebration this time. The diploma arrives attached to a military commission, and the commission points directly toward the worst stretch of the frontier. The fighting is heavy there. The veterans are few. The list of previous postings is shorter than anyone would like. The diploma is real, at least. Unfortunately, so is the map."
  ova_academy.182.f: "Some graduates get a party. Some get directions to the front. The handshake at the ceremony is exactly the same."
  ova_academy.182.a: "Take the commission to the scarred border."
  ova_academy.183.t: "The Church’s Chosen"
  ova_academy.183.d: "Our Hero graduates straight into the Church’s elite. During the ceremony, they are called forward before the entire assembly and handed a reliquary blade. Students in the crowd stare with open envy. It is the sort of honor many champions would sacrifice a limb to receive. Looking at the weight of the weapon, however, it is difficult not to notice that honors and obligations can have very similar handles."
  ova_academy.183.f: "A holy blade, a place beside the Goddess’s chosen, and a leash decorated so beautifully that almost nobody calls it one."
  ova_academy.183.a: "Kneel and accept the reliquary blade."
  ova_academy.184.t: "The Quiet Diploma"
  ova_academy.184.d: "Our Hero collects the diploma quietly, before the speeches about fate and destiny can become too dangerous. Four years of classmates, rivals, injuries, festivals, and midnight study cannot really be summarized by a ceremony anyway. The certificate goes into a bag. The gates open. Beyond them is a world that never cared much about school rankings in the first place."
  ova_academy.184.f: "No laurel. No grand speech. Just a folded diploma and the uncomfortable feeling that the real exam is finally beginning."
  ova_academy.184.a: "Leave without the speeches."
