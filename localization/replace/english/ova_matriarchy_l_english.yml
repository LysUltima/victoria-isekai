l_english:
  law_matriarchy: "Matriarchy"
  law_matriarchy_desc: "The mother’s line carries name, land, and rule. Men hold no rights of their own: they are wards of their mothers, sisters, and wives, kept from the ledger, the council fire, and the officer’s sash."
  law_men_own_property: "Men Own Property"
  law_men_own_property_desc: "A man may now hold land and coin in his own name and answer for his own contracts, though the courts, the councils, and the army remain the province of women."
  law_men_in_the_workplace: "Men in the Workplace"
  law_men_in_the_workplace_desc: "Men may take waged work and enter the professions on their own account. High office and command remain reserved for women, as they always have been."
  law_mens_suffrage: "Men’s Suffrage"
  law_mens_suffrage_desc: "Men may vote and stand for office alongside women. Custom still keeps the sword and the throne in women’s hands, but the ballot box no longer asks after one’s mother."
