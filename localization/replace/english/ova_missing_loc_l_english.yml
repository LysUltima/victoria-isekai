 ### Champion Sanctuary treaty article descriptions
  ova_champion_sanctuary_article_short_desc: "[FIRST_COUNTRY.GetNameNoFormatting] and [SECOND_COUNTRY.GetNameNoFormatting] swear their Champions to peace with one another"
  ova_champion_sanctuary_effects_desc: "Establishes a [concept_ova_champion_sanctuary]: neither signatory may send its Champion adventuring into the other’s lands, nor sabotage the other’s Champion."
  ova_champion_sanctuary_imposed_article_short_desc: "[TARGET_COUNTRY.GetNameNoFormatting] is bound not to send its Champion against, nor sabotage the Champion of, [SOURCE_COUNTRY.GetNameNoFormatting]"
  ova_champion_sanctuary_imposed_effects_desc: "Imposes a one-sided [concept_ova_champion_sanctuary]: the bound party may not send its Champion adventuring into, nor sabotage the Champion of, the protected party."

