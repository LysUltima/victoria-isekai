l_english:
  company_ova_acley_arsenal: "Acley Arsenal"
  company_ova_acley_arsenal_desc: "Acley's enchanters, toolmakers and artificers manufacture enchanted arms and core-driven war guardians. The arsenal may charter either mythril workings or hunting ranges whose wardens purchase and test its arms, supplying beast materials to the surrounding markets."
  company_ova_acley_arsenal_prestige_tt: "Produce $prestige_good_ova_imperial_sentinel_automata$ using $pm_cannons$ in $building_artillery_foundry$ in our country"
  company_ova_imperial_dockyards: "Imperial Capital Shipwrights"
  company_ova_imperial_dockyards_desc: "The shipwrights of the Imperial Capital build merchant hulls and timber-framed airships. An additional charter may secure either timber camps or cotton estates for the fabric used in shipbuilding."
  company_ova_imperial_dockyards_prestige_tt: "Produce $prestige_good_ova_lysna_skycouriers$ using $pm_core_lifted_airships$ in $building_automotive_industry$ in our country"
  company_ova_havenstry_craft_guild: "Havenstry Masterwrights' Guild"
  company_ova_havenstry_craft_guild_desc: "Havenstry's toolmakers and cabinetmakers unite under a local craft charter, producing precise workshop implements and finely fitted furniture from timber and worked metals."
  company_ova_havenstry_craft_guild_prestige_tt: "Produce $prestige_good_ova_havenstry_masterwright_tools$ using $pm_magic_core_tools$ in $building_tooling_workshop$ in our country"
  company_ova_estland_mariners: "Estland Mariners' League"
  company_ova_estland_mariners_desc: "Estland's captains and preserving houses bring island catches ashore and send reliable provisions back to sea, coordinating the fisheries and food workshops around the harbor."
  company_ova_estland_mariners_prestige_tt: "Produce $prestige_good_ova_dreaming_isles_silverfish$ using $pm_fishing_trawlers$ in $building_fishing_wharf$ in our country"
  company_ova_order_eternal_light: "Order of the Eternal Light"
  company_ova_order_eternal_light_desc: "The Church's sworn armourers maintain the consecrated arms and workshop implements of the Eternal Crusade. Their established island forges may seek an additional charter for either war-guardian manufacture or core founding."
  company_ova_order_eternal_light_prestige_tt: "Produce $prestige_good_ova_consecrated_radiant_arms$ using $pm_muskets$ in $building_arms_industry$ in our country"
  company_ova_vyelle_court_atelier: "Vyelle Court Atelier"
  company_ova_vyelle_court_atelier_desc: "Vyelle's clothiers, cabinetmakers and glasscutters furnish elegant households with fine silk garments, precisely fitted hardwood interiors and polished glasswork."
  company_ova_vyelle_court_atelier_prestige_tt: "Produce $prestige_good_ova_vyelle_court_dress$ using $pm_craftsman_sewing$ in $building_textile_mill$ in our country"
  company_ova_quena_pastoral_guild: "Quena Pastoral Guild"
  company_ova_quena_pastoral_guild_desc: "Quena's ranching families and preserving houses organize breeding, slaughter and durable provisions, bringing the produce of the surrounding pastures to towns and travelers."
  company_ova_quena_pastoral_guild_prestige_tt: "Produce $prestige_good_ova_aleveran_trail_conserves$ using $pm_cannery$ in $building_food_industry$ in our country"
  company_ova_barenberg_outfitters: "Barenberg Outfitters"
  company_ova_barenberg_outfitters_desc: "Barenberg's hunters and armourers supply armed expeditions from their workshops, hunting grounds and pastoral estates. Selected beast fibres and provisions carry the outfitters' mark along the frontier roads."
  company_ova_barenberg_outfitters_prestige_tt: "Produce $prestige_good_ova_barenberg_moonmane_thread$ using $pm_spirit_beast_hunting$ in $building_spirit_beast_hunting$ in our country"
  company_ova_elder_grove_wardens: "Elder Grove Wardens"
  company_ova_elder_grove_wardens_desc: "Raeteni's grove wardens and woodwrights select seasoned hardwood and carve household furnishings whose carefully preserved grain reflects the customs of the Sylvan realm."
  company_ova_elder_grove_wardens_prestige_tt: "Produce $prestige_good_ova_groveheart_hardwood$ using $pm_increased_hardwood$ in $building_logging_camp$ in our country"
  company_ova_melkkalunde_forge_communion: "Valley Forge Communion"
  company_ova_melkkalunde_forge_communion_desc: "Melkkalunde's forge families unite core founders and precision toolmakers, expressing Forgeborn devotion through balanced magic cores and durable, carefully fitted implements."
  company_ova_melkkalunde_forge_communion_prestige_tt: "Produce $prestige_good_ova_melkkalunde_resonant_cores$ using $pm_crude_core_smelting$ in $building_steel_mill$, or $pm_resonance_forging$ in $building_steel_mill$ in our country"
  company_ova_imperial_anima_foundry: "Blitt Anima Foundry"
  company_ova_imperial_anima_foundry_desc: "Blitt's engineers combine precisely assembled automata with anima, creating awakened stewards and the machinery on which an automated realm depends. An optional mining charter can supply either iron or crystalline fuel, rather than both at once."
  company_ova_imperial_anima_foundry_prestige_tt: "Produce $prestige_good_ova_imperial_awakened_stewards$ using $pm_awakened_automata$ in $building_sentient_automata_works$ in our country"
  company_ova_rey_continental_skyways: "Katzenburg Continental Skyways"
  company_ova_rey_continental_skyways_desc: "Katzenburg's transport charter joins railways, airship builders and airship docks, carrying passengers and freight between the surrounding regions. Additional machinery, core-founding and tooling charters are alternative expansion choices."
  company_ova_rey_continental_skyways_prestige_tt: "Produce $prestige_good_ova_reyorn_skyway_charters$ using $pm_arc_welded_docks$ in $building_airship_dock$ in our country"
  company_ova_insula_assay_chapter: "Metallurgy Assay Chapter"
  company_ova_insula_assay_chapter_desc: "Insula Luce's assayers certify gold and mythril from the island's workings. Their standards support institutional finance, while an additional charter may branch into glasswork, iron extraction or crystalline fuel mining."
  company_ova_insula_assay_chapter_prestige_tt: "Produce $prestige_good_ova_insular_assay_mythril$ using $pm_condensing_engine_pump_building_lead_mine$ in $building_lead_mine$ in our country"
  company_ova_ash_throne_arsenal: "Ash Throne Arsenal"
  company_ova_ash_throne_arsenal_desc: "A proposed imperial compact binds tribal enchanters and battle-pill makers to one seal, supplying the soldiers who defend the red marches."
  company_ova_ash_throne_arsenal_prestige_tt: "Produce $prestige_good_ova_uniters_oathblades$ using $pm_repeaters$ in $building_arms_industry$ in our country"
  company_ova_broken_moon_scriptorium: "Broken Moon Illuminators"
  company_ova_broken_moon_scriptorium_desc: "The illuminators of the broken moon turn ancestral hymns into painted memorials and teach the quiet disciplines of the old faith. Independent mills supply their paper. An optional workshop may make engraving implements, or a mana endowment may illuminate later moving visions."
  company_ova_broken_moon_scriptorium_prestige_tt: "Produce $prestige_good_ova_refined_fine_art$ using $pm_photographic_art$ in $building_art_academy$ in our country"
  company_ova_dawn_oasis_charter: "Company of the Dawn"
  company_ova_dawn_oasis_charter_desc: "Oasis coffee, cotton and enchanted palm harvests travel under the Dawn charter. Its growers purchase passage from independent sky-caravans and coastal merchants, carrying the interior's produce to distant markets."
  company_ova_dawn_oasis_charter_prestige_tt: "Produce $prestige_good_ova_dawnfast_coffee$ using $pm_sparse_planting_building_coffee_plantation$ in $building_coffee_plantation$, or $coffee_plantation_patio_drying$ in $building_coffee_plantation$ in our country"
  company_ova_dawnfire_arsenal: "Dawnfire Apothecaries"
  company_ova_dawnfire_arsenal_desc: "The Dawnfire apothecaries certify concentrated battle draughts and remedies. Their brewers supply the pill workshops directly; independent growers bring the herbs, while the charter may invest in either catalysts or glass vessels."
  company_ova_dawnfire_arsenal_prestige_tt: "Produce $prestige_good_ova_refined_ammunition$ using $pm_explosive_shells$ in $building_munition_plant$ in our country"
  company_ova_yolteni_duskweavers: "Night City Duskweavers"
  company_ova_yolteni_duskweavers_desc: "Yolteni's cloth masters and alchemical silk brewers seek a common seal, making courtly fabrics worthy of the people still seated below the salt."
  company_ova_yolteni_duskweavers_prestige_tt: "Produce $prestige_good_ova_refined_luxury_clothes$ using $pm_craftsman_sewing$ in $building_textile_mill$ in our country"
  company_ova_furat_coffee_exchange: "Furat Coffee Exchange"
  company_ova_furat_coffee_exchange_desc: "Furat's coffee brokers and hullwrights carry the desert harvest in finely rigged merchant vessels from their natural harbor. Their exchange purchases remaining materials from independent traders."
  company_ova_furat_coffee_exchange_prestige_tt: "Produce $prestige_good_ova_furat_dawnrunners$ using $pm_complex_shipbuilding$ in $building_shipyard$ in our country"
  company_ova_nasr_alchemical_collegium: "Nasr Alchemical Collegium"
  company_ova_nasr_alchemical_collegium_desc: "Nasr's learned apothecaries and glassmasters refine dependable medicines, then pursue greater vat methods as alchemy advances. Their optional endowment supports either herb-bearing palms or the papers that record each certified batch."
  company_ova_nasr_alchemical_collegium_prestige_tt: "Produce $prestige_good_ova_nasr_restoratives$ using $pm_health_potion_brewing$ in $building_synthetics_plant$, or $pm_mass_health_potions$ in $building_synthetics_plant$ in our country"
  company_ova_wafa_forge_covenant: "Wafa Forge Covenant"
  company_ova_wafa_forge_covenant_desc: "Wafa's sworn smiths turn alchemically released ore into durable tools. They obtain extraction brews and other supplies through the market, keeping faithful measures at every furnace."
  company_ova_wafa_forge_covenant_prestige_tt: "Produce $prestige_good_generic_tools$ using $pm_iron_tools$ in $building_tooling_workshop$ in our country"
  company_ova_catfood_guild: "Catfood Guild"
  company_ova_catfood_guild_desc: "Catpital's granary keepers join the wheat harvest to preserving kitchens and the royal markets, making dependable provisions the foundation of a prosperous household."
  company_ova_catfood_guild_prestige_tt: "Produce $prestige_good_ova_catpital_feast_baskets$ using $pm_bakery$ in $building_food_industry$, or $pm_cannery$ in $building_food_industry$ in our country"
  company_ova_embersea_loomkeepers: "Embersea Loomkeepers"
  company_ova_embersea_loomkeepers_desc: "Wapapow's foxkin clothiers and cabinetmakers sell fine garments and inlaid hardwood furnishings under one coastal seal, purchasing raw materials from the surrounding markets."
  company_ova_embersea_loomkeepers_prestige_tt: "Produce $prestige_good_ova_embersea_inlaid_cabinets$ using $pm_precision_tools$ in $building_furniture_manufactory$ in our country"
  company_ova_uang_herders: "Herders of the Uang"
  company_ova_uang_herders_desc: "The provisioners of Uang-Ko join millet fields and herds to dependable supply roads, feeding households and marching packs. A later charter may add preserving kitchens, fisheries or fertilizer furnaces for the fields; each is a separate expansion choice."
  company_ova_uang_herders_prestige_tt: "Produce $prestige_good_ova_uang_ko_prize_herds$ using $pm_slaughterhouses$ in $building_livestock_ranch$ in our country"
  company_ova_sparki_mining_inc: "Sparki Mining Inc."
  company_ova_sparki_mining_inc_desc: "The mountain miners and ward-smiths of Luno Sparki turn plateau iron and mythril into rune-etched protection for the landlocked crown. Independent craftsmen supply what the compact cannot make itself."
  company_ova_sparki_mining_inc_prestige_tt: "Produce $prestige_good_generic_small_arms$ using $pm_rifles$ in $building_arms_industry$ in our country"
  company_ova_moonlit_harvest_charter: "Moonlit Harvest Charter"
  company_ova_moonlit_harvest_charter_desc: "The marches' maize growers, orchard keepers and sugar planters seek one harvest charter. Fine fruit and dependable stores sustain the villages that still sing beneath the broken moon."
  company_ova_moonlit_harvest_charter_prestige_tt: "Produce $prestige_good_ova_marches_moonfruit$ using $pm_transcendent_cultivation_building_banana_plantation$ in $building_banana_plantation$ in our country"
  company_ova_dawnsea_maritime_exchange: "Southern Maritime Exchange"
  company_ova_dawnsea_maritime_exchange_desc: "The Dawnsea exchange clears coastal cargoes through great harbors and common ledgers. Its port and brokerage core may sponsor either merchant hullwrights or a skyworks charter, buying the other transport services on the market."
  company_ova_dawnsea_maritime_exchange_prestige_tt: "Produce $prestige_good_ova_dawnsea_marine_service$ using $pm_modern_port$ in $building_port$ in our country"
  company_ova_grandsky_central: "Grandsky Central"
  company_ova_grandsky_central_desc: "Nasr's sky-caravan exchange weaves alchemical flying carpets and operates the moorings that serve them. Its workshops combine purchased silk and potions; an optional charter may build merchant hulls or manage cargo exchanges along the kingdom's trading routes."
  company_ova_grandsky_central_prestige_tt: "Produce $prestige_good_generic_merchant_marine$ using $pm_airship_moorings$ in $building_airship_dock$ in our country"
  company_ova_nasr_reagent_syndicate: "Nasr Reagent Syndicate"
  company_ova_nasr_reagent_syndicate_desc: "Nasr's assay offices join crystal extraction, sulfur workings and reagent retorts under a common seal. They purchase mining brews from independent apothecaries and may endow either ore workings or an equipment smithy."
  company_ova_nasr_reagent_syndicate_prestige_tt: "Produce $prestige_good_ova_nasr_clarified_stones$ using $pm_dynamite_building_coal_mine$ in $building_coal_mine$ in our country"
  company_ova_jade_throne_arsenal: "Jade Throne Sword Pavilion"
  company_ova_jade_throne_arsenal_desc: "The Sword Pavilion joins enchanted-arms ateliers to cultivation courts in defense of the Jade Mandate. Its one optional branch may mine iron or organize beast hunts; mythril and other materials are bought through the market."
  company_ova_jade_throne_arsenal_prestige_tt: "Produce $prestige_good_generic_small_arms$ using $pm_rifles$ in $building_arms_industry$, or $pm_repeaters$ in $building_arms_industry$, or $pm_bolt_action_rifles$ in $building_arms_industry$ in our country"
  company_ova_feng_alchemy: "Imperial Alchemical Hall"
  company_ova_feng_alchemy_desc: "The Hall compounds spirit fertilizer and ferments spirit wine for the imperial cultivation economy, provisioning the court and its sworn sects through each turning of the seasons."
  company_ova_feng_alchemy_prestige_tt: "Produce $prestige_good_ova_five_harvest_spirit_powder$ using $pm_improved_fertilizer$ in $building_chemical_plant$ in our country"
  company_ova_yao_armorers: "Imperial Armorers"
  company_ova_yao_armorers_desc: "Mingjing's ritual armourers work iron into enchanted arms and precision implements for the imperial schools. Master-smiths grade every fitting and blade against the standards of the school seals."
  company_ova_yao_armorers_prestige_tt: "Produce $prestige_good_generic_small_arms$ using $pm_rifles$ in $building_arms_industry$, or $pm_repeaters$ in $building_arms_industry$, or $pm_bolt_action_rifles$ in $building_arms_industry$ in our country"
  company_ova_yao_silk_pavilion: "Celestial Silk Pavilion"
  company_ova_yao_silk_pavilion_desc: "The Pavilion raises qi-fed silkworms and weaves their lustrous thread into ceremonial robes, supplying the households and cultivation schools of Great Yao. Its optional charter may raise ordinary weaving fibres on ranches or establish cloth brokerages."
  company_ova_yao_silk_pavilion_prestige_tt: "Produce $prestige_good_ova_refined_luxury_clothes$ using $pm_craftsman_sewing$ in $building_textile_mill$ in our country"
  company_ova_immutable_gold_hall: "Immutable Guardian Hall"
  company_ova_immutable_gold_hall_desc: "The Guardian Hall trains the Immutable Gold's disciples through cultivation and warded beast hunts, returning spirit stones to its courts and reserving the sect's arms workshops for their equipment."
  company_ova_immutable_gold_hall_prestige_tt: "Produce $prestige_good_ova_refined_coal$ using $pm_spirit_beast_hunting$ in $building_spirit_beast_hunting$, or $pm_warded_hunting_parties$ in $building_spirit_beast_hunting$ in our country"
  company_ova_equanimity_still_heaven: "Garden of Still Heaven"
  company_ova_equanimity_still_heaven_desc: "The Order's gardeners prepare spirit fertilizer beside its cultivation courts, tending the material foundations of disciples' long pursuit of equanimity."
  company_ova_equanimity_still_heaven_prestige_tt: "Produce $prestige_good_generic_fertilizer$ using $pm_improved_fertilizer$ in $building_chemical_plant$ in our country"
  company_ova_charnam_vermilion_vinyards: "Vermilion Vinyards"
  company_ova_charnam_vermilion_vinyards_desc: "The Vats ferment plateau spirit wine and fashion its glass vessels. An optional endowment may supply fruit from the lower orchards or grain from Chubur Gyatso's wheat estates."
  company_ova_charnam_vermilion_vinyards_prestige_tt: "Produce $prestige_good_ova_charnam_vermilion_wine$ using $pm_purified_fermentation$ in $building_wine_distillery$ in our country"
  company_ova_crimson_petal_forge: "Crimson Petal Pill and Sword Hall"
  company_ova_crimson_petal_forge_desc: "The Hall joins enchanted-arms ateliers, consumables workshops, and spirit-herb estates in Xielian. Its one optional branch may mine iron or make inscription paper; cultivation courts belong to the Covenant Altar and are customers rather than company property."
  company_ova_crimson_petal_forge_prestige_tt: "Produce $prestige_good_ova_refined_ammunition$ using $pm_bound_talismans$ in $building_munition_plant$, or $pm_printed_talisman_consumables$ in $building_munition_plant$, or $pm_sealed_talisman_consumables$ in $building_munition_plant$, or $pm_grand_talisman_consumables$ in $building_munition_plant$ in our country"
  company_ova_heavenly_demon_war_stores: "Magyeong Hundred Herbs Hall"
  company_ova_heavenly_demon_war_stores_desc: "The Hundred Herbs Hall tends qi-nurturing medicinal gardens and compounds their fertilizer. A later charter may mine charged minerals for its furnaces or iron for advanced fertilizer refinement. Its harvests provision the Heavenly Demon Sect's disciples in Magyeong and the northern passes."
  company_ova_heavenly_demon_war_stores_prestige_tt: "Produce $prestige_good_ova_refined_spirit_herbs$ using $pm_sparse_planting_building_tobacco_plantation$ in $building_tobacco_plantation$, or $default_building_tobacco_plantation$ in $building_tobacco_plantation$ in our country"
  company_ova_yoake_no_michibikare: "Yoake no Michibikare"
  company_ova_yoake_no_michibikare_desc: "The Dawnforge Brotherhood enchants arms and forges magic cores from iron and charged mineral crystals, furnishing Asahi's defenders and the workshops that supply them."
  company_ova_yoake_no_michibikare_prestige_tt: "Produce $prestige_good_ova_dawnforged_cores$ using $pm_resonance_forging$ in $building_steel_mill$, or $pm_sealed_crucible_forging$ in $building_steel_mill$, or $pm_arc_resonance_process$ in $building_steel_mill$ in our country"
  company_ova_adventurers_guild: "Adventurer's Guild"
  company_ova_adventurers_guild_desc: "The Guild organizes monster hunts and arms workshops. Its one optional branch may prepare provisions, make equipment, or maintain records; the remaining supplies are bought independently rather than granted as a full industrial chain."
  company_ova_adventurers_guild_prestige_tt: "Produce $prestige_good_ova_guild_spirit_beast_meat$ using $pm_spirit_beast_hunting$ in $building_spirit_beast_hunting$, or $pm_warded_hunting_parties$ in $building_spirit_beast_hunting$ in our country"
  company_ova_adventurers_guild_dynamic_name_tag_singular: "Adventurer"
  company_ova_adventurers_guild_dynamic_name_tag_plural: "Adventurers"
  company_ova_mage_association: "Mage Association"
  company_ova_mage_association_desc: "The Association joins inscription-paper workshops to magic-core foundries, supplying its members with the diagrams and reliable instruments on which practiced spellwork depends."
  company_ova_mage_association_prestige_tt: "Produce $prestige_good_generic_paper$ using $pm_pulp_pressing$ in $building_paper_mill$, or $pm_sulfite_pulping$ in $building_paper_mill$ in our country"
  company_ova_mage_association_dynamic_name_tag_singular: "Mage"
  company_ova_mage_association_dynamic_name_tag_plural: "Mages"
  company_ova_blood_pool_hall: "Blood Pool Hall"
  company_ova_blood_pool_hall_desc: "The Hall gleans Anima from ritual forests and feeds it to forbidden cultivation rites, grading the harvested crystals as Blood Stones. Its prosperous altars burn mortal lives to strengthen the sinister path's warriors, exacting a deadly price for their martial power."
  company_ova_blood_pool_hall_prestige_tt: "Produce $prestige_good_ova_blood_stones$ using $pm_blood_sacrifice_altars$ in $building_cultivation_grounds$ in our country"
  company_ova_blood_pool_hall_dynamic_name_tag_singular: "Blood Stone"
  company_ova_blood_pool_hall_dynamic_name_tag_plural: "Blood Stones"
  company_ova_feng_celestial_relay: "Celestial Relay Bureau"
  company_ova_feng_celestial_relay_desc: "The Bureau siphons Anima from Cangmu's veins and binds it into communication orbs, carrying clear messages between the imperial court and its distant sworn halls."
  company_ova_feng_celestial_relay_prestige_tt: "Produce $prestige_good_ova_jade_court_message_orbs$ using $pm_telephones$ in $building_electrics_industry$ in our country"
  company_ova_yao_phantasm_house: "Thousand Visions Pavilion"
  company_ova_yao_phantasm_house_desc: "Mingjing's Thousand Visions Pavilion preserves court dramas, immortal legends and demonstrations of cultivation technique in enchanted picture scrolls. Its artists record moving visions and its glassmakers fashion ornaments for the imperial galleries, bringing the deeds of distant masters before the eyes of the court."
  company_ova_yao_phantasm_house_prestige_tt: "Produce $prestige_good_ova_mingjing_phantasm_scrolls$ using $pm_film_art$ in $building_art_academy$ in our country"
  company_ova_oozora_no_kumo_no_uke: "Oozora no Kumo no Uke"
  company_ova_oozora_no_kumo_no_uke_desc: "The Cloudwake workshops manufacture airships and precision automata drives, then operate the docks that carry them onto Asahi's trade routes. Their one optional branch may extract mythril or make tools; magic cores and other missing materials are purchased from independent suppliers."
  company_ova_oozora_no_kumo_no_uke_prestige_tt: "Produce $prestige_good_ova_asahi_cloudwake_airships$ using $pm_capacitor_airships$ in $building_automotive_industry$, or $pm_arc_welded_airships$ in $building_automotive_industry$ in our country"
  company_ova_yao_heaven_earth_confluence: "Confluence Bureau"
  company_ova_yao_heaven_earth_confluence_desc: "The Confluence Court combines mana reactors, spirit-fertilizer furnaces and advanced cultivation sanctums, provisioning masters who seek harmony between heaven and earth."
  company_ova_yao_heaven_earth_confluence_prestige_tt: "Produce $prestige_good_ova_confluence_spirit_fertilizer$ using $pm_improved_fertilizer$ in $building_chemical_plant$ in our country"
  company_ova_hero_patronage_office: "Imperial Hero Patronage Office"
  company_ova_hero_patronage_office_desc: "The crown's established patrons commission instruction paper, study desks and lodging furnishings for the households and tutors preparing young Heroes. A later charter can support either glass apparatus makers or procurement exchanges."
  company_ova_hero_patronage_office_prestige_tt: "Produce $prestige_good_ova_practicum_desks$ using $pm_lathe$ in $building_furniture_manufactory$ in our country"
  company_ova_unbroken_hymn: "Cantors of the Unbroken Hymn"
  company_ova_unbroken_hymn_desc: "Across the Uniter's tribes, hereditary cantors copy the ancient hymns and prepare ceremonial vestments. Their scriptoria preserve the verses that survive beneath the broken moon, older than the Church that calls their people demons."
  company_ova_unbroken_hymn_prestige_tt: "Produce $prestige_good_ova_unbroken_hymn_paper$ using $pm_pulp_pressing$ in $building_paper_mill$ in our country"
  company_ova_nasira_merchant_house: "Nasira's Merchant House"
  company_ova_nasira_merchant_house_desc: "The Katzenburg household behind Nasira's inheritance trades courting gifts, fine everyday dress and household furnishings. Its established commercial exchanges form part of John Paradox's journey through the republic's communities."
  company_ova_nasira_merchant_house_prestige_tt: "Produce $prestige_good_ova_katzenburg_courting_dress$ using $pm_dye_workshops$ in $building_textile_mill$ in our country"
  company_ova_imperial_commissariat: "Vercestia Commissariat Guild"
  company_ova_imperial_commissariat_desc: "Vercestia's rye estates and preserving houses produce dependable bread and field provisions. A later charter can add either ranching for meat rations or fisheries for preserved fish; the remaining ingredients are purchased from the market."
  company_ova_imperial_commissariat_prestige_tt: "Produce $prestige_good_generic_groceries$ using $pm_cannery$ in $building_food_industry$ in our country"
  company_ova_norse_explorers: "Explorer's Guild"
  company_ova_norse_explorers_desc: "Norse wayfinders, shipwrights and leviathan hunters pool their charts and ocean knowledge, building the fleets and supplies needed to explore cold coasts and distant settlements."
  company_ova_norse_explorers_prestige_tt: "Produce $prestige_good_generic_fish$ using $pm_fishing_trawlers$ in $building_fishing_wharf$ in our country"
  company_ova_norse_explorers_dynamic_name_tag_singular: "Explorer"
  company_ova_norse_explorers_dynamic_name_tag_plural: "Explorers"
