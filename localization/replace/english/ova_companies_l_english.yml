  company_ova_story_blood_lotus_covenant_altar_desc: "The Covenant Altar joins forbidden cultivation, ritual forest work, and warded beast hunts. Its one optional branch may raise livestock or extract spirit stones; it purchases enchanted arms and herbs rather than claiming the separate Pill and Sword Hall."
