l_english:
 # Isekai TC: full loc rewrite for the coffee_with_milk.txt / je_coffee_with_milk migration
 # (2026-07-11), reflavored per user instruction to the southern isles / western isles regions
 # instead of Brazil. Dropped all real-world references (Brazil, Portugal, coronel/coronelismo,
 # cangaço/cangaceiro, "Senhor", London/New York/British/Tories, Rio de Janeiro, Minas Gerais/
 # Amazonas, cameras/photographers, the historical bandit Lampião) while keeping the underlying
 # mechanic (rival coffee-plantation and cattle-ranch elites, electoral fraud, social banditry,
 # land reform) intact. Terminology: "coronel" -> "planter-lord", "cangaço" -> "the Wildwood
 # Terror", "cangaceiro(s)" -> "wildwood raiders".

 je_agricultural_development: "A River of Coffee"
 je_agricultural_development_goal: "Increase the amount of [concept_buy_orders] for $coffee$ within the [SCOPE.sCountry('brazil_scope').GetCapital.GetMarket.GetName] by 150%"
 je_agricultural_development_goal_dummy: "Increase the amount of [concept_buy_orders] for $coffee$ within our home market by 150%"

 je_coffee_with_milk: "Coffee and Cattle"
 je_coffee_with_milk_reason: "The development of the [ROOT.GetCountry.GetAdjective] agricultural industry has concentrated a great degree of wealth into the hands of the \"coffee and cattle\" planter-lords. The recent coffee boom has created great opportunity for growth - but also great risk of concentrated political influence in the hands of agrarian [SCOPE.gsInterestGroup('landowners_ig').GetName].\n\nEffects at the conclusion of this [concept_journal_entry] will depend on the status of [ROOT.GetCountry.GetName]'s #bold Land Reform#! laws"
 coffee_with_milk_0_tt: "The #variable Coffee and Cattle#! progress bar has reached #variable 0%#! through enacting and maintaining a #bold Land Reform#! law other than [GetLawType('law_serfdom').GetName] or [GetLawType('law_tenant_farmers').GetName], and keeping the [SCOPE.gsInterestGroup('landowners_ig').GetName] out of government"
 coffee_with_milk_100_tt: "The #variable Coffee and Cattle#! progress bar has reached #variable 100%#! through enacting and maintaining the [GetLawType('law_serfdom').GetName] or [GetLawType('law_tenant_farmers').GetName] #bold Land Reform#! law, and maintaining [concept_powerful] [SCOPE.gsInterestGroup('landowners_ig').GetName] [concept_in_government]"

 agricultural_development_complete_tt: "Has completed the #variable River of Coffee#! [concept_journal_entry]"

 from_milk_coffee: "From the Coffee-and-Cattle System"

 je_group_brazil: "The Planter Isles"

