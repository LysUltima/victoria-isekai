l_english:
 # Naval ships and parts, fully fantasy-themed. Re-keyed goods used by NEW meaning:
 # Magic Cores (steel)=Mana Arrays + Mana-Core drive; Consumables (ammunition)=Talisman
 # Volleys (Spiritualism) and Everflame (Alchemy); Airships (aeroplanes)=carrier wings;
 # Mythril (lead)/iron/timber=armor. Weak medieval defaults (War Ballistae, Galley Oars)
 # use only mundane goods. Weapons are arcane, never guns. No Earth refs, no em dashes.

