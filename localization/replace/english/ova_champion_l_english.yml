l_english:
  # --- Game concepts
  concept_ova_champion: "Champion"
  concept_ova_champion_desc: "A nation's Champion is its single mightiest soul, chosen from the people, the throne, or another world entirely. A Champion has a #b Level#! (1–60): every ten levels their soul ascends another cultivation realm, granting them ever greater personal power, and at the highest realms their mere presence emboldens the entire army. Levels are earned with #b experience#!: the journal entry's level bar fills toward the next level and resets on each ascension, and every level costs more experience than the last. Experience comes from time, a Champion Hall's programs, royal patronage, training, and adventure, and is unreliable while foreign saboteurs work against the Champion (a 50% chance each month of losing that month's growth)."
  concept_ova_renown: "Renown"
  concept_ova_renown_desc: "A Champion's Renown (0–100) measures how brightly their legend burns among the people. #b Every Champion begins at 0 Renown#!: a legend is earned, never granted. Every level of Renown grants the nation +1 prestige. Renown levels are earned with #b renown points#! from victories, deeds, and [concept_ova_champion_hall] patronage: the journal entry's renown bar fills toward the next level and resets when it is gained, and every level costs more points than the last. A Champion whose legend outshines the crown may attract dangerous ambitions."
  concept_ova_expedition: "Champion Expedition"
  concept_ova_expedition_desc: "A diplomatic action: send your Champion campaigning into another country. Costs money to maintain and sours relations while it runs; each week the expedition may make progress: carving out a single border province, taking plunder, spreading the Champion's legend, running short of supplies, or ending in blood. A seizure does #b not#! end the expedition: the Champion presses on and may take the next province, gnawing a state away piece by piece until it is annexed. The expedition ends only when the Champion dies, takes a break, is recalled, or the target ceases to exist. Only one expedition may run at a time, and none may be launched for a time after the Champion takes a break or dies. Anyone may target a neighboring decentralized nation; students of the Demonic Scriptures may target any neighbor; an #b Otherworlder#! Champion may cross into the Demonic Empire with a border or coastal access."
  concept_ova_sabotage: "Champion Sabotage"
  concept_ova_sabotage_desc: "A diplomatic action: maintain a covert campaign of poisoners, cursed artifacts, and planted rivals against another country's Champion. Costs money to maintain; while it runs the target's Champion cannot adventure and their growth is disrupted (each month there is a #b 50%#! chance the saboteurs rob them of all experience and renown gains), and relations decay."
  concept_ova_champion_sanctuary: "Champion Sanctuary"
  concept_ova_champion_sanctuary_desc: "A treaty article: both signatories swear their Champions to peace: neither may send its Champion adventuring into the other's lands, nor maintain sabotage against the other's Champion."
  concept_ova_champion_hall: "Champion Hall"
  concept_ova_champion_hall_desc: "A unique government building (one per country, in the capital). Its three support programs (Martial Training, Scholarly Tutelage, and Champion's Patronage) each speed the Champion's growth, and its retainers sell services. Expedition plunder floods the hall with supplies, boosting its output for a year."

  # --- Universal Champions journal entry
  je_ova_champion: "The Nation's Champion"
  je_ova_champion_reason: "In this world, a single peerless soul can matter as much as an army. Our [concept_ova_champion] earns experience through time, a [concept_ova_champion_hall]'s programs, patronage, and training, and their [concept_ova_renown] carries our prestige across the world.\n\nTo send them abroad, use the [concept_ova_expedition] diplomatic action, and beware rivals' [concept_ova_sabotage], which only a [concept_ova_champion_sanctuary] treaty truly prevents."
  je_ova_champion_status_none: "We have no [concept_ova_champion]."
  je_ova_champion_status_injured: "Our [concept_ova_champion], #b [ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName]#! (Level [ROOT.GetCountry.MakeScope.Var('ova_champion_level').GetValue|v0]) lies wounded and can undertake no adventures until recovered."
  je_ova_champion_status_secluded: "Our [concept_ova_champion], #b [ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName]#! (Level [ROOT.GetCountry.MakeScope.Var('ova_champion_level').GetValue|v0]) is away in training and cannot be called upon."
  je_ova_champion_status_sabotaged: "Foreign saboteurs dog our [concept_ova_champion] #b [ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName]#!'s every step: progress is unreliable (a 50% chance each month of losing all growth) and no adventures may be launched until the [concept_ova_sabotage] campaign against them ends. See #b Foreign Sabotage#! below for who is behind it."
  je_ova_champion_status_active: "Our [concept_ova_champion], #b [ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName]#!, stands at Level [ROOT.GetCountry.MakeScope.Var('ova_champion_level').GetValue|v0] ([ROOT.GetCountry.MakeScope.Var('ova_champion_xp').GetValue|v0]/[ROOT.GetCountry.MakeScope.Var('ova_champion_xp_to_next').GetValue|v0] experience), their [concept_ova_renown] at [ROOT.GetCountry.MakeScope.Var('ova_champion_popularity').GetValue|v0]."

  # --- Level (XP) progress bar
  # NOTE: bar name/desc/second_desc strings render ON the bar and feed the
  # engine statement parser - keep them short and NEVER use an apostrophe
  # here (it breaks PROGRESS_BAR_BREAKDOWN parsing).
  ova_champion_level_bar: "Level"
  ova_champion_level_bar_desc: "Level [ROOT.GetCountry.MakeScope.Var('ova_champion_level').GetValue|v0]"
  ova_champion_level_bar_second_desc: "[ROOT.GetCountry.MakeScope.Var('ova_champion_xp').GetValue|v0]/[ROOT.GetCountry.MakeScope.Var('ova_champion_xp_to_next').GetValue|v0] XP"

  # --- Renown progress bar
  ova_champion_renown_bar: "Renown"
  ova_champion_renown_bar_desc: "Renown [ROOT.GetCountry.MakeScope.Var('ova_champion_popularity').GetValue|v0]"
  ova_champion_renown_bar_second_desc: "[ROOT.GetCountry.MakeScope.Var('ova_champion_renown_points').GetValue|v0]/[ROOT.GetCountry.MakeScope.Var('ova_champion_renown_to_next').GetValue|v0] Points"

  # --- Custom tooltips for the XP/level/renown scripted effects
  # (ova_champion_add_xp / ova_champion_gain_levels / ova_champion_add_popularity
  # in scripted_effects/ova_champion_effects.txt). Root is the country scope.
  ova_champion_add_xp_tt: "Our [concept_ova_champion] gains [SCOPE.GetLocalVariable('added_xp').GetValue|+=0] experience."
  ova_champion_level_up_tt: "Our [concept_ova_champion] has gathered enough experience to ascend to the next Level!"
  ova_champion_gain_levels_tt: "Our [concept_ova_champion] levels up by [SCOPE.GetLocalVariable('added_levels').GetValue|+=0]."
  ova_champion_add_renown_tt: "Our [concept_ova_champion] gains [SCOPE.GetLocalVariable('added_renown').GetValue|+=0] [concept_ova_renown]."
  ova_champion_renown_level_up_tt: "Our [concept_ova_champion]'s legend grows enough to gain a Renown level (+1 prestige)."
  ova_champion_renown_level_down_tt: "Our [concept_ova_champion]'s legend fades, costing them a Renown level (-1 prestige)."
  ova_champion_injure_tt: "Our [concept_ova_champion] is wounded and can undertake no adventures for [SCOPE.GetLocalVariable('injured_months').GetValue|v0] months."

  # --- Buttons
  ova_sabotage_watch_button: "Foreign Sabotage"
  ova_sabotage_watch_button_desc: "Informational only. Lists every foreign power currently running a covert [concept_ova_sabotage] campaign against our [concept_ova_champion]: hover for names. Break their courts' will through diplomacy, or bind them off with a [concept_ova_champion_sanctuary] treaty."
  ova_sabotage_watch_countries_tt: "Currently sabotaging us:"
  ova_sabotage_watch_entry_tt: "• #b [SCOPE.sC('ova_saboteur_entry').GetName]#!"
  ova_sabotage_watch_click_tt: "This is a status display only. Nothing happens when clicked."
  ova_choose_champion_button: "Choose a Champion"
  ova_choose_champion_button_desc: "Name a [concept_ova_champion] of the realm: scour the land for a hidden talent, or elevate the ruler, the heir, or another figure of consequence. Their starting Level is set by the cultivation they already possess. Nations bound to the Church's summoning rites cannot choose mundane champions."
  ova_hinterland_hunt_button: "Hunt the Hinterlands"
  ova_hinterland_hunt_button_desc: "Send our [concept_ova_champion] into our own Monster-Infested wilds where the spirit-beast hunters work. #b Most hunts are uneventful#! (a little experience and nothing more), but now and then there are trophies, a legend in the making, grievous wounds, or death in the fangs. (Six months between adventures; unavailable while the Champion is abroad on a [concept_ova_expedition], and for a year after an expedition is cancelled mid-campaign.)"
  ova_patronage_button: "Royal Patronage"
  ova_patronage_button_desc: "A #b toggle#!. While active, we lavish coin on our [concept_ova_champion]'s retinue and reputation, and their [concept_ova_renown] climbs steadily. This adds an ongoing #b expense of #v @money![GetPlayer.MakeScope.ScriptValue('money_amount_multiplier_medium')|0]#!#! per week that scales with our economy. Click again to end the patronage. Cannot run alongside #b Intensive Training#!, and ends when the Champion departs on a [concept_ova_expedition]."
  ova_training_button: "Intensive Training"
  ova_training_button_desc: "A #b toggle#!. While active, our [concept_ova_champion] drills relentlessly under paid masters, and they gain experience every month. This adds an ongoing #b expense of #v @money![GetPlayer.MakeScope.ScriptValue('money_amount_multiplier_small')|0]#!#! per week that scales with our economy. Click again to end the training. Cannot run alongside #b Royal Patronage#!, and ends when the Champion departs on a [concept_ova_expedition]."
  ova_champion_not_adventuring_tt: "Our #b Champion#! must not be abroad on a #b Champion Expedition#!"
  ova_hinterland_hunt_effect_tt: "Send the Champion on a six-month hunt. #b Usually#! little comes of it (a little experience); rarely, a great kill, a new legend, grievous wounds, or death."
  ova_patronage_toggle_tt: "#b Toggle Royal Patronage.#! While active, pay the monthly upkeep above and build [concept_ova_renown] each month."
  ova_training_toggle_tt: "#b Toggle Intensive Training.#! While active, pay the monthly upkeep above and gain experience each month."
  ova_program_expedition_tt: "Our #b Champion#! must not be abroad on a [concept_ova_expedition] (departing on one ends both programs)"
  ova_program_exclusive_patronage_tt: "#b Intensive Training#! must not be active: the Champion cannot hold court and drill at once"
  ova_program_exclusive_training_tt: "#b Royal Patronage#! must not be active: the Champion cannot drill and hold court at once"

  # --- Selection event
  ova_champion.1.t: "A Champion Rises"
  ova_champion.1.d: "The court has resolved that the realm shall have its [concept_ova_champion]. The only question that remains is who shall carry the banner: an unknown talent dredged from the provinces, or a name the world already knows?"
  ova_champion.1.f: "Every age gets the hero it deserves. We intend to choose ours deliberately."
  ova_champion.1.opt_local: "Scour the realm for a hidden talent."
  ova_champion.1.opt_ruler: "The crown itself shall take the mantle: [SCOPE.sCharacter('ova_cand_ruler').GetFullName]."
  ova_champion.1.opt_heir: "Let the heir prove themselves: [SCOPE.sCharacter('ova_cand_heir').GetFullName]."
  ova_champion.1.opt_notable: "Elevate a figure of consequence: [SCOPE.sCharacter('ova_cand_notable').GetFullName]."

  # --- Hinterland adventure outcomes
  ova_champion.15.t: "An Uneventful Hunt"
  ova_champion.15.d: "Our Champion spent the season in the hinterland wilds and returned with little to show for it: a few lesser beasts culled, some tracks followed to nothing, a great deal of cold camping. Still, the sword-arm stays sharp and the wilds stay a little quieter."
  ova_champion.15.a: "Every outing teaches something."
  ova_champion.10.t: "A Great Beast Slain"
  ova_champion.10.d: "Deep in our own monster country, our Champion has brought down a beast that generations of hunters only whispered about. The carcass alone is worth a fortune in cores and hide, and the frontier villages are already carving the tale into their doorposts."
  ova_champion.10.a: "Let the ballads be sung!"
  ova_champion.11.t: "Trophies and Tales"
  ova_champion.11.d: "The expedition returns dusty, scarred, and grinning, wagons heavy with spirit-beast trophies. Nothing legendary, but the treasury and the taverns both profit."
  ova_champion.11.a: "A good hunt."
  ova_champion.12.t: "The Ballads Write Themselves"
  ova_champion.12.d: "Little of value was slain, but our Champion pulled a hunter's child from a beast's jaws before a hundred witnesses, and the story has grown a new embellishment in every retelling since."
  ova_champion.12.a: "Renown is its own treasure."
  ova_champion.13.t: "Carried Back on a Shield"
  ova_champion.13.d: "The hunt went wrong. Our Champion lives, barely, carried home through the passes by the survivors of their retinue. The healers speak of months, not weeks."
  ova_champion.13.a: "Summon every physician in the capital."
  ova_champion.14.t: "Death in the Wilds"
  ova_champion.14.d: "Only one hunter returned, half-mad, clutching our Champion's broken sword. The nation mourns; the frontier lights funeral pyres that can be seen from the border forts."
  ova_champion.14.a: "The realm grieves."

  # --- Expedition outcomes vs decentralized neighbors
  ova_champion.20.t: "A Province Carved Out"
  ova_champion.20.d: "Our Champion's expedition has broken the resistance of the frontier clans and planted our banner over a single hard-won valley. The land is scarred and sullen, but it is ours, won not by armies, but by a single blade. The Champion does not turn back: there is more of this country still to take."
  ova_champion.20.a: "The map is redrawn."
  ova_champion.21.t: "Plunder of the Frontier"
  ova_champion.21.d: "The raid cut deep into the clanlands and returned laden with tribute, livestock, and the contents of a chieftain's hoard. The Champion Hall will be processing the spoils for months; behind the expedition, the frontier burns."
  ova_champion.21.a: "Spoils for the treasury."
  ova_champion.22.t: "Tales of the Frontier"
  ova_champion.22.d: "The expedition took little of value this season, but the tales it sends home (duels at dawn, parleys with clan matriarchs, a beast-god appeased) have made our Champion the darling of every broadsheet and teahouse."
  ova_champion.22.a: "Renown spreads."
  ova_champion.23.t: "Ambushed in the Wastes"
  ova_champion.23.d: "The clans were waiting. Our Champion fought clear of the ambush, but the wounds they carry will keep them from the field for months."
  ova_champion.23.a: "They will recover. They must."
  ova_champion.24.t: "Fallen Beyond the Border"
  ova_champion.24.d: "The expedition's survivors returned under a truce-banner, bearing our Champion's body wrapped in a clan-woven shroud, a mark of respect from the very warriors who slew them. It is scant comfort."
  ova_champion.24.a: "Bring them home."

  # --- Expedition interludes (any target)
  ova_champion.25.t: "The Champion Takes a Break"
  ova_champion.25.d: "Dispatches from the expedition report neither battle nor plunder: our Champion has been resting at a hot spring, judging a village dumpling contest, and teaching sword forms to farm children, and has now sent the quartermaster home with the baggage train. The campaign is over for the season; the broadsheets adore every word of it."
  ova_champion.25.a: "Even legends need a holiday."
  ova_champion.26.t: "Supplies Run Low"
  ova_champion.26.d: "The expedition's quartermaster writes with uncharacteristic politeness: the rations are gone, the boots are worn through, and the Champion's retinue is down to its last crate of potions. Coin will keep the campaign alive, or we can call them home."
  ova_champion.26.a: "Send fresh supplies. (£15k)"
  ova_champion.26.b: "Recall the expedition."

  # --- Expedition outcomes vs centralized neighbors (demonic path / crusade)
  ova_champion.30.t: "A Border Province Seized"
  ova_champion.30.d: "Our Champion fell upon a neighboring border town like a calamity. Its garrison is scattered, its rulers have fled, and its people wake to find our banner flying above the walls. Whether the fled were an empire's officials or a dark sect's elders, the outcome is the same. The world calls it banditry; we call it destiny. The Champion does not turn back: the neighbor has more to lose yet."
  ova_champion.30.a: "What is taken is ours."
  ova_champion.31.t: "Sack and Plunder"
  ova_champion.31.d: "The expedition struck across the border by night, emptied treasuries and temple vaults alike, and was gone before the alarm bells found their rhythm. The Champion Hall will be processing the spoils for months; our neighbor's protests are loud, their coffers notably lighter."
  ova_champion.31.a: "A profitable night's work."
  ova_champion.32.t: "Terror by Night"
  ova_champion.32.d: "Little was taken, but that was never the point. Our Champion walked through the neighbor's border towns like a ghost story made flesh, and the tales the survivors tell serve our purposes better than any plunder."
  ova_champion.32.a: "Let them fear the dark."
  ova_champion.33.t: "Driven Back Bleeding"
  ova_champion.33.d: "The neighbor's border wardens were readier than expected. Our Champion cut their way back to camp through three cordons, leaving a trail of blood, much of it their own."
  ova_champion.33.a: "Tend their wounds."
  ova_champion.34.t: "Slain on Foreign Soil"
  ova_champion.34.d: "The expedition was baited into a trap. Our Champion's head now adorns the neighbor's border gate, and their halls celebrate while ours drape themselves in mourning white."
  ova_champion.34.a: "This will not be forgotten."

  # --- Expanded expedition outcomes vs a decentralized frontier (40-49)
  ova_champion.40.t: "A Warlord's Hoard"
  ova_champion.40.d: "The frontier's fiercest chieftain kept a war-hoard, and now we keep it. Our Champion cracked the clan's stronghold, upended its treasure vault, and sent the caravans home groaning with coin, cores, and confiscated finery. The quartermasters are still counting."
  ova_champion.40.a: "Count it twice."
  ova_champion.41.t: "A Relic of the Wastes"
  ova_champion.41.d: "Half-buried in a barrow the frontier folk feared to touch, our Champion found a relic of some elder age: a thing of quiet, humming power the court sages cannot name but dare not ignore. Displayed in the capital, it draws pilgrims and envoys alike."
  ova_champion.41.a: "Let the world come to see it."
  ova_champion.42.t: "The Champion's Duel"
  ova_champion.42.d: "A clan sent its own great warrior to end the campaign in single combat, blade against blade before both hosts. It ended quickly. Our Champion returns having learned more from one true duel than from a season of skirmishes, and the tale is already outrunning the messengers."
  ova_champion.42.a: "A worthy opponent. Once."
  ova_champion.43.t: "Sworn to the Banner"
  ova_champion.43.d: "Not every frontier clan chose to fight. One matriarch, weighing our Champion's strength against her losses, brought her riders under our banner instead, with tribute and a pledge sealed at the campfire. A bloodless gain is the sweetest kind."
  ova_champion.43.a: "Welcome them warmly."
  ova_champion.44.t: "Secrets of an Old Master"
  ova_champion.44.d: "Deep in the wilds our Champion found a hermit, ancient and half-forgotten, who had once been a name to conjure with. For the price of good manners and a winter's firewood, the old master passed on techniques thought lost with the last age. Our Champion came back changed."
  ova_champion.44.a: "Some treasures are not gold."
  ova_champion.45.t: "A Long Cold March"
  ova_champion.45.d: "The dispatches this season are a litany of mud, weather, and empty horizons. The clans melted away rather than fight, and our Champion spent the weeks marching hard for little reward. Still, hardship hones the blade as surely as battle does."
  ova_champion.45.a: "Onward, then."
  ova_champion.46.t: "Cursed Plunder"
  ova_champion.46.d: "The raid was rich, but something came home with the loot: a shadow the camp priests cannot quite banish, an ill luck that sours milk and dreams alike. The coin spends well enough. The whispers are another matter."
  ova_champion.46.a: "Gold is gold. Ward the rest."
  ova_champion.47.t: "Fever in the Camp"
  ova_champion.47.d: "It was not a blade that laid our Champion low but a marsh-fever that swept the camp. Half the retinue took ill, and the physicians did what they could with dwindling stores. Our Champion will keep to a sickbed for a while, and the campaign's coffers are lighter for the medicines."
  ova_champion.47.a: "Rest, and recover."
  ova_champion.48.t: "Two Valleys Fall"
  ova_champion.48.d: "The frontier's defenders broke so completely that our Champion did not stop at one prize: two valleys fell in a single season, our banner raised over the second before the first had finished burning. The map is redrawn twice over, and the neighbor reels."
  ova_champion.48.a: "Why stop at one?"
  ova_champion.49.t: "A Rival Slips Away"
  ova_champion.49.d: "A rival warleader had shadowed the expedition for weeks, and the two finally clashed in a running fight through the passes. Our Champion drew blood and learned much, but the rival slipped away into the dark, leaving wounds that will need tending."
  ova_champion.49.a: "Next time, then."

  # --- Expanded expedition outcomes vs a centralized neighbor (50-59).
  # Kept neutral: the target may be the Demonic Empire or a demonic sect/cult.
  ova_champion.50.t: "The War-Chest Emptied"
  ova_champion.50.d: "Our Champion struck the neighbor where it hurt most: the war-chest that pays its soldiers and buys its favors. Vaults were emptied, ledgers burned, and the coin carried home in a single ruinous night. Their captains will go unpaid for a season, and ours drink to it."
  ova_champion.50.a: "Their loss, our gain."
  ova_champion.51.t: "A Relic of the Fallen"
  ova_champion.51.d: "From the neighbor's own reliquary, be it a cathedral's crypt or a sect's forbidden sanctum, our Champion took a treasure they had guarded for generations. They will name it desecration; we call it spoils. Enshrined in our capital, it burns their pride and brightens ours."
  ova_champion.51.a: "It suits us better."
  ova_champion.52.t: "A Legend Crosses the Border"
  ova_champion.52.d: "Little changed hands this season, but our Champion walked the length of the enemy's marches like a story stepping out of a scroll. Border folk speak the name in hushed awe now, some in dread, some already half in worship, and every telling serves us better than plunder would."
  ova_champion.52.a: "Let the tale spread."
  ova_champion.53.t: "The Enemy's Champion Answered"
  ova_champion.53.d: "The neighbor put forward its own mightiest soul to end our campaign, and the two met where the whole border could witness it. When the dust cleared, only one still stood. Our Champion returns hardened by a true test, and the enemy's finest is now a cautionary tale."
  ova_champion.53.a: "They chose poorly."
  ova_champion.54.t: "Tribute Extorted"
  ova_champion.54.d: "Rather than watch another town burn, the neighbor's frightened officials, or its trembling elders, sent envoys with chests of tribute and promises of more. Our Champion accepted, for now. The coin flows home, and the threat of a return keeps it flowing."
  ova_champion.54.a: "A wise investment on their part."
  ova_champion.55.t: "An Uneasy Standoff"
  ova_champion.55.d: "The neighbor learned its lesson from the last raid and met the expedition with wardens enough to give even our Champion pause. Weeks passed in maneuver and menace with neither side willing to commit. Nothing was taken, but nothing was lost, and the enemy spent a season staring at shadows."
  ova_champion.55.a: "Let them keep watching."
  ova_champion.56.t: "Curse of the Vanquished"
  ova_champion.56.d: "A dying enemy, priest or cultivator, spent their last breath on a hex flung at our Champion's name. The camp shrugged it off with bravado, but ill omens have dogged us since: soured luck, restless nights, a wrongness the chaplains cannot fully lift."
  ova_champion.56.a: "We do not fear their curses. Much."
  ova_champion.57.t: "Poisoned Wells"
  ova_champion.57.d: "The neighbor could not beat our Champion in the field, so they fouled the wells along the line of march. The retinue sickened, our Champion among them, and the campaign's stores were spent on remedies and clean water bought at extortion's price."
  ova_champion.57.a: "Cowards. Effective ones."
  ova_champion.58.t: "Two Marches Overrun"
  ova_champion.58.d: "The neighbor's border defenses did not merely break, they collapsed, and our Champion pressed the advantage without mercy: two marches overrun in a single season, banners raised over both while the enemy's messengers were still riding for help. They will not soon forget this year."
  ova_champion.58.a: "Take it all."
  ova_champion.59.t: "The Champion Ransomed"
  ova_champion.59.d: "It was a trap sprung well: our Champion, cut off and overwhelmed, was taken alive. The neighbor knew better than to make a martyr and named a ransom instead. We paid it, gritting our teeth, and our Champion came home battered, freed, and in no forgiving mood."
  ova_champion.59.a: "This debt will be collected."

  # --- Champion Expedition diplomatic action
  # A diplomatic action needs the FULL standard loc set: the base name key
  # (GetName), the _action_name button label, and the _desc (GetDesc) shown in
  # its tooltip - matching how every vanilla action (increase_relations, etc.)
  # is localized.
  ova_champion_expedition: "Champion Expedition"
  ova_champion_expedition_action_name: "Champion Expedition"
  ova_champion_expedition_action_propose_name: "Launch Champion Expedition"
  ova_champion_expedition_action_break_name: "Recall Champion Expedition"
  ova_champion_expedition_action_notification_name: "[INITIATOR_COUNTRY.GetName] sends its Champion against us"
  ova_champion_expedition_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has sent its [concept_ova_champion] campaigning into our lands. While the expedition runs it may carve away our border provinces, plunder our people, and spread its legend at our expense, and our relations with [INITIATOR_COUNTRY.GetNameNoFlag] will suffer for it."
  ova_champion_expedition_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] has recalled its Champion Expedition against [TARGET_COUNTRY.GetName]"
  ova_champion_expedition_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has called its [concept_ova_champion] home; the campaign against [TARGET_COUNTRY.GetName] is over."
  ova_champion_expedition_desc: "Send our [concept_ova_champion] campaigning into this country (see [concept_ova_expedition]). Costs money to maintain and poisons relations; each week the expedition may seize a single border province, take plunder, win [concept_ova_renown], or come to grief. A seizure does not end the campaign: the Champion keeps carving the target apart. Only one expedition at a time, and none for a while after the Champion takes a break or dies."
  ova_champion_expedition_pact_desc: "Send our [concept_ova_champion] campaigning into this country (see [concept_ova_expedition]). Costs money to maintain and poisons relations; each week the expedition may seize a single border province, take plunder, win [concept_ova_renown], or come to grief. A seizure does not end the campaign: the Champion keeps carving the target apart. Only one expedition at a time, and none for a while after the Champion takes a break or dies."
  ova_expedition_champion_ready_tt: "Our #b Champion#! must be alive, unhurt, present, and free of saboteurs"
  ova_expedition_single_tt: "We must not already have a #b Champion Expedition#! underway"
  ova_expedition_lockout_tt: "No expedition may be launched for some months after our #b Champion#! abandons a campaign or dies"
  ova_expedition_reach_tt: "The target must be #b adjacent#!, or the #b Demonic Empire#!, reachable by a #b light_orthodoxy#! nation with any coastal state while the #b Eternal Crusade#! still burns"
  ova_expedition_blocked_by_sanctuary_tt: "Blocked by a #b Champion Sanctuary#! treaty between the two countries"
  ova_expedition_needs_champion_tt: "Our #b Champion#! must still live"
  ova_expedition_returned_tt: "The expedition has #b returned home#!"
  ova_expedition_weekly_tt: "Each week the expedition may make progress (events)"

  # --- AI-only expedition-into-decentralized decision (players use the action)
  ova_champion_expedition_decentralized_decision: "Send the Champion into the Marches"
  ova_champion_expedition_decentralized_decision_desc: "Loose our [concept_ova_champion] on a neighbouring unrecognized land, the border tribes and monster marches no court would ever answer to. There is glory and plunder out there for a blade bold enough to take it."
  ova_champion_expedition_decentralized_decision_tooltip: "Launch a #b Champion Expedition#! against a bordering decentralized nation."

  # --- Sabotage diplomatic action
  ova_sabotage_champion: "Sabotage Champion"
  ova_sabotage_champion_action_name: "Sabotage Champion"
  ova_sabotage_champion_action_propose_name: "Begin Sabotaging Champion"
  ova_sabotage_champion_action_break_name: "End Champion Sabotage"
  ova_sabotage_champion_action_notification_name: "[INITIATOR_COUNTRY.GetName] moves against our Champion"
  ova_sabotage_champion_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has loosed poisoners, cursed artifacts, and planted rivals upon our [concept_ova_champion]. While the campaign runs our Champion cannot adventure and each month risks losing all its growth, and our relations with [INITIATOR_COUNTRY.GetNameNoFlag] will rot. Only a [concept_ova_champion_sanctuary] can truly stop it."
  ova_sabotage_champion_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] has ended its sabotage of [TARGET_COUNTRY.GetName]'s Champion"
  ova_sabotage_champion_action_notification_break_desc: "The covert campaign [INITIATOR_COUNTRY.GetName] waged against [TARGET_COUNTRY.GetName]'s [concept_ova_champion] has ended."
  ova_sabotage_champion_desc: "Maintain a covert campaign against this country's [concept_ova_champion] (see [concept_ova_sabotage]). While it runs, their Champion cannot adventure and each month has a 50% chance to lose all its growth, and relations between our courts will rot. Costs money to maintain."
  ova_sabotage_champion_pact_desc: "Maintain a covert campaign against this country's [concept_ova_champion] (see [concept_ova_sabotage]). While it runs, their Champion cannot adventure and each month has a 50% chance to lose all its growth, and relations between our courts will rot. Costs money to maintain."
  ova_sabotage_requires_champion_tt: "The target must have a living #b Champion#!"
  ova_sabotage_blocked_by_sanctuary_tt: "Blocked by a #b Champion Sanctuary#! treaty between the two countries"

  # --- Champion Sanctuary treaty articles
  ova_champion_sanctuary: "Champion Sanctuary"
  ova_champion_sanctuary_desc: "Both signatories swear their Champions to peace with one another (see [concept_ova_champion_sanctuary]). Neither may send its Champion adventuring into the other's lands, nor maintain sabotage against the other's Champion. Grants each a little involvement in the other's region."
  ova_sanctuary_effect_tt: "#b Neither#! signatory may send its [concept_ova_champion] adventuring into the other, nor sabotage the other's Champion."
  ova_champion_sanctuary_imposed: "Imposed Champion Sanctuary"
  ova_champion_sanctuary_imposed_desc: "A one-sided [concept_ova_champion_sanctuary]: the #b bound#! party swears not to send its Champion adventuring into, nor to sabotage the Champion of, the #b protected#! party, who is left free to act as it wishes. Grants the protected party a little involvement in the bound party's region. To force this on an unwilling rival, take the #b $dp_ova_demand_sanctuary$#! diplomatic play to war."
  ova_sanctuary_imposed_effect_tt: "The #b bound#! party may not send its [concept_ova_champion] adventuring into, nor sabotage the Champion of, the #b protected#! party. The protected party is not restricted in return."

  # --- Demand Champion Sanctuary diplomatic play + war goal
  dp_ova_demand_sanctuary: "$war_goal_ova_demand_sanctuary_type_name$"
  dp_ova_demand_sanctuary_tooltip: "#header Start a $dp_ova_demand_sanctuary$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_ova_demand_sanctuary_desc$"
  dp_ova_demand_sanctuary_desc: "Go to war to force the targeted [concept_country] into a one-sided [concept_ova_champion_sanctuary]: they will be bound never again to send their [concept_ova_champion] against ours, nor to sabotage it: the answer to a rival who will not stop meddling with our Champion."
  war_goal_ova_demand_sanctuary_type_name: "Demand Champion Sanctuary"
  war_goal_ova_demand_sanctuary_type_desc: "Force another [concept_country] to leave our [concept_ova_champion] in peace."
  war_goal_ova_demand_sanctuary: "Demand [concept_ova_champion_sanctuary]"
  war_goal_ova_demand_sanctuary_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] forces [WAR_GOAL_DRAFT.GetTarget.GetName] to swear a one-sided [concept_ova_champion_sanctuary]: never to send its [concept_ova_champion] against, nor to sabotage the Champion of, [WAR_GOAL_DRAFT.GetHolder.GetName]."
  war_goal_ova_demand_sanctuary_sway_desc: "Try to win [WAR_GOAL_DRAFT.GetHolder.GetName] to your side by forcing [WAR_GOAL_DRAFT.GetTarget.GetName] to swear a one-sided [concept_ova_champion_sanctuary]."

