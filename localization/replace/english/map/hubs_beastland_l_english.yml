 # ========================
 # BEA NATION - Bear Mosir
 # Ainu phonology (kotan, pet/bet, nupuri, nitay, kamuy, repun, pirika...)
 # supplemented by Evenki (-kan, bira, alin, tungak, orgochi...)
 # ========================

 # STATE_PORONUPURI - poro nupuri = big mountain (Ainu); has port
 # City hub distinct from the real Hokkaido mountain name.
 # niputakotan = Ainu niputa (wetland) + kotan; runrupet = runru (lowland) + pet;
 # kirakotan = kira (glittering/mica) + kotan; nitaybet = nitay (forest) + bet;
 # repunkotan = Ainu repun (offshore) + kotan - the fishing port
 HUB_NAME_STATE_PORONUPURI_city: "Niputakotan"
 HUB_NAME_STATE_PORONUPURI_farm: "Runrupet"
 HUB_NAME_STATE_PORONUPURI_mine: "Kirakotan"
 HUB_NAME_STATE_PORONUPURI_wood: "Nitaybet"
 HUB_NAME_STATE_PORONUPURI_port: "Repunkotan"

 # STATE_CUPKA - Evenki-feel name; no port
