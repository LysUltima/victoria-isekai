 # STATE_SIROKANI - has port
 # sirokani = state name (shares); nupuribet = Ainu nupuri (mountain) + bet (river);
 # kiraushi = Ainu kira (glitter) + ushi (place); nitaymosse = Ainu nitay (forest) + mosse (light);
 # rerakotan = Ainu rera (wind) + kotan (village) - a windswept port village
