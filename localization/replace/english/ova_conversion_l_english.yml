  pmg_demonic_rites_cultivation_grounds: "Demonic Rites"
  pm_righteous_path: "Righteous Path"
  pm_righteous_path_desc: "The proper path to follow."
  pm_blood_sacrifice_altars: "Demonic Scriptures"
  pm_blood_sacrifice_altars_desc: "They say that you should not eat the food from the underworld..."

