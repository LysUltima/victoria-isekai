  ### Cultivation realm character traits
  trait_qi_gathering: "Qi Gathering"
  trait_qi_gathering_desc: "This character has taken the first step on the path of cultivation, breathing the world's qi into the body."
  trait_foundation_establishment: "Foundation Establishment"
  trait_foundation_establishment_desc: "This character's dantian has been tempered into an unshakable foundation."
  trait_golden_core: "Golden Core"
  trait_golden_core_desc: "A revolving golden core burns within this character's dantian, granting vigor far beyond mortal limits."
  trait_nascent_soul: "Nascent Soul"
  trait_nascent_soul_desc: "A second self dwells within this character, and death must catch both."
  trait_soul_formation: "Soul Formation"
  trait_soul_formation_desc: "This character's soul has matured and touched the heavens; the masses bow without being told."
  trait_return_to_the_void: "Return to the Void"
  trait_return_to_the_void_desc: "This character stands at the summit of cultivation, half-dissolved into the Dao itself."

