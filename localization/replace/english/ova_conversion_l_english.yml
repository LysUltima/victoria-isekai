  ### Consumables mobilization tiers (supplements line)
  mobilization_option_battle_talismans: "Battle Talismans"
  mobilization_option_battle_talismans_desc: "Crates of single-use paper talismans issued to every squad. Each one burned is a minor spell the enemy must weather."
  mobilization_option_battle_scrolls: "Battle Scrolls"
  mobilization_option_battle_scrolls_desc: "Sealed scrolls carrying stabilized battle-workings. Torn open at the front, they strike harder and farther than any talisman."
  mobilization_option_battle_pills: "Battle Pills"
  mobilization_option_battle_pills_desc: "Pressed pills that flood a soldier's meridians with borrowed vigor. The propaganda corps assures everyone they are perfectly safe."
  mobilization_option_opium_desc: "The culmination of the supplements line: full battle-potion rations brewed from panacea cultures, sharpening blade-arm and spell alike while knitting wounds closed."

  ### Cultivation Grounds building
  building_cultivation_grounds: "Cultivation Grounds"
  building_cultivation_grounds_lens_option: "Expand $building_cultivation_grounds$"
