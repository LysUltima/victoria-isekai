  ### ---------------------------------------------------------------
  ### ARTIFICE TECHNOLOGIES (renamed)
  ### ---------------------------------------------------------------
  spirit_stone_mining: "Spirit Stone Mining"
  spirit_stone_mining_desc: "Sinking timbered shafts deep into the leylines allows the extraction of raw spirit stones, iron, mythril, and sulfur in quantities surface-gathering could never match."
  core_founding: "Core Founding"
  core_founding_desc: "By smelting iron with crushed spirit stones in sealed crucibles, foundries can fuse metal and condensed mana into stable magic cores - the beating hearts of all artifice."
  artillery: "War Automata"
  artillery_desc: "Iron-limbed war machines animated by a single magic core. Slow, thunderous, and utterly without fear, they replace massed cannon on the battlefield."
  mobile_automata_doctrine: "Mobile Automata Doctrine"
  mobile_automata_doctrine_desc: "Lighter chassis and detachable core-limbers let war automata keep pace with marching columns, concentrating their fire wherever the line wavers."
  bursting_cores: "Bursting Cores"
  bursting_cores_desc: "Overcharged cores that rupture on impact turn a war automaton's fist into a delivery system for explosive mana discharge."
  mana_core_engine: "Mana Core Engine"
  mana_core_engine_desc: "The first practical engine driven by the slow discharge of a magic core. Crude and hungry for spirit stones, but tireless - and the foundation of automata industry."
  mana_conduit_boilers: "Mana Conduit Boilers"
  mana_conduit_boilers_desc: "Narrow mana conduits threaded through a boiler extract far more work from every spirit stone, letting workshops run heavier machinery with less waste."
  resonance_forging: "Resonance Forging"
  resonance_forging_desc: "Blasting resonant mana through molten metal purges impurities in minutes, producing magic cores in true industrial quantities."
  airship_flight: "Airships"
  merchant_airships: "Merchant Airships"
  merchant_airships_desc: "Dedicated cargo airships knit distant markets together, carrying goods over mountains, deserts, and seas that no railway can cross."
  hauler_automata: "Hauler Automata"
  hauler_automata_desc: "Squat, four-legged automata that drag timber and ore where no rail is laid, replacing whole gangs of laborers with one patient machine."
  reaper_automata: "Reaper Automata"
  reaper_automata_desc: "Scythe-armed field automata that reap, bind, and thresh in a single pass, freeing farmhands for other work."
  mana_reactors: "Mana Reactors"
  mana_reactors_desc: "Great banks of spinning cores that convert spirit stone into a steady flow of usable mana, distributed by cable to any workshop that will pay for it."
  mythril_frame_buildings: "Mythril-Frame Buildings"
  mythril_frame_buildings_desc: "Mythril girders bear loads stone never could. Cities climb into the sky, and every skyline becomes a boast."
  greater_war_automata: "Greater War Automata"
  greater_war_automata_desc: "Second-generation war automata with twin cores and reinforced frames, able to shrug off counter-fire while methodically demolishing fortifications."
  calculation_engines: "Calculation Engines"
  calculation_engines_desc: "Brass difference-engines driven by minor cores digest muster rolls and supply ledgers, letting staff officers plan campaigns with arithmetic instead of guesswork."
  field_automata: "Field Automata"
  field_automata_desc: "General-purpose farm automata that plough, sow, and harvest. The countryside will never look the same."
  mana_capacitors: "Mana Capacitors"
  mana_capacitors_desc: "Crystal lattices that store discharged mana for later use, smoothing the flow of power to precision machinery."
  mana_railways: "Mana Railways"
  mana_railways_desc: "Locomotives drawing power from conduit rails run cleaner, faster, and cheaper than their stone-burning ancestors."
  core_turbines: "Core Turbines"
  core_turbines_desc: "Turbines spun directly by core discharge extract more mana from every spirit stone fed into a reactor."
  arc_resonance_process: "Arc Resonance Process"
  arc_resonance_process_desc: "Arc-resonance furnaces powered by mana reactors produce magic cores of unmatched purity."
  siege_automata_doctrine: "Siege Automata Doctrine"
  siege_automata_doctrine_desc: "Sand-table exercises and calculation-engine simulations yield a doctrine for employing the heaviest classes of siege automata to breach any defense."
  warded_bastions: "Warded Bastions"
  warded_bastions_desc: "Alchemical concrete poured over rune-etched mythril lattices produces fortifications that swallow bursting cores without cracking."
  colossal_war_automata: "Colossal War Automata"
  colossal_war_automata_desc: "Towering multi-core automata that walk through walls and shrug off field artillery. Infantry advance in their shadow."

  ### ---------------------------------------------------------------
  ### ALCHEMY TECHNOLOGIES (renamed)
  ### ---------------------------------------------------------------
  alembics: "Alembics"
  alembics_desc: "The alembic and the pot still are the alchemist's first tools, separating essence from dross - and incidentally producing very drinkable liquor."
  transmutation_standards: "Transmutation Standards"
  transmutation_standards_desc: "With alchemists able to certify the purity of coinage, the realm can enforce a single standard of currency and tax wages with confidence."
  alchemical_boilers: "Alchemical Boilers"
  alchemical_boilers_desc: "Ships driven by alchemically-fired boilers no longer wait on the wind, and their rams strike with dreadful momentum."
  fractionating_alembics: "Fractionating Alembics"
  fractionating_alembics_desc: "Multi-stage alembics separate a brew into its every fraction, sharply improving the purity of foodstuffs and tinctures alike."
  alchemical_bleaching: "Alchemical Bleaching"
  alchemical_bleaching_desc: "Caustic alchemical washes whiten bone china and paper pulp at a fraction of the old cost."
  volatile_reagents: "Volatile Reagents"
  volatile_reagents_desc: "Sulfur digested with powdered spirit stone yields reagents of terrifying potency. Handle with tongs, prayer, and insurance."
  apothecaries: "Apothecaries"
  apothecaries_desc: "Licensed apothecaries standardize the brewing of tinctures and draughts, turning folk remedies into a reliable trade."
  homunculus_creation: "Homunculus Creation"
  homunculus_creation_desc: "The crowning secret of alchemy: from a sealed vat of potions, reagents, and patience emerges a living, thinking person. Moralists object; ministries of labor do not."
  stabilized_reagents: "Stabilized Reagents"
  stabilized_reagents_desc: "Volatile reagents kneaded into clay become stable enough to ship by the crate, revolutionizing mining, quarrying - and munitions."
  potion_synthesis: "Potion Synthesis"
  potion_synthesis_desc: "Industrial-scale vats and precise reagent dosing turn potion-brewing from a workshop craft into true manufacture."
  alchemical_concrete: "Alchemical Concrete"
  alchemical_concrete_desc: "A binding slurry perfected in alchemical laboratories sets harder than quarried stone, transforming the pace of construction."
  warded_hulls: "Warded Hulls"
  warded_hulls_desc: "Iron plating quenched in warding solutions turns aside shot and spell alike. Wooden walls are obsolete."
  reagent_torpedoes: "Everflame Munitions"
  reagent_torpedoes_desc: "Alchemical Everflame consumables that let fast craft set enemy hulls ablaze from the waterline up."
  battlefield_draughts: "Battlefield Draughts"
  battlefield_draughts_desc: "Issuing health potion kits to field surgeons means the difference between a scar and a grave for thousands of soldiers."
  modern_nursing: "Healing Draught Corps"
  modern_nursing_desc: "A trained corps administering healing draughts by strict protocol returns even the gravely wounded to their families."
  miasmic_reagents: "Miasmic Reagents"
  miasmic_reagents_desc: "Reagents brewed not to heal but to choke. The laws of war are silent; the survivors are not."
  alchemical_thread: "Alchemical Thread"
  alchemical_thread_desc: "Drawn from potion vats in shimmering strands, alchemical thread rivals true spirit thread at a fraction of the price."
  automated_vialworks: "Automated Vialworks"
  automated_vialworks_desc: "Machines that blow a thousand identical potion vials an hour - to the despair of master glassblowers everywhere."
  panacea_cultures: "Panacea Cultures"
  panacea_cultures_desc: "Cultured panacea molds attack corruption in the blood itself, curing diseases the old draughts could only soothe."

  ### ---------------------------------------------------------------
  ### SPIRITUALISM TECHNOLOGIES (renamed)
  ### ---------------------------------------------------------------
  arms_enchanting: "Arms Enchanting"
  arms_enchanting_desc: "Sect enchanters lay lasting spells into blades and bows, producing enchanted arms that an ordinary conscript can wield to deadly effect."
  martial_cultivation: "Martial Cultivation"
  martial_cultivation_desc: "Daily forms and breathing exercises temper the body and spirit of every soldier, hastening their advance along the martial path."
  spirit_silkworms: "Spirit Silkworms"
  spirit_silkworms_desc: "Silkworms fed on spirit mulberry spin thread that faintly glows with qi, prized by tailors and talisman-makers alike."
  geomantic_planning: "Geomantic Planning"
  geomantic_planning_desc: "Cities laid out along favorable leylines breathe with the land's own qi, and their people prosper accordingly."
  spirit_field_cultivation: "Spirit Field Cultivation"
  spirit_field_cultivation_desc: "Terracing, crop rotation, and qi-channeling stones raise the yield of every field, and make possible the refinement of spirit fertilizer."
  rune_etched_arms: "Rune-Etched Arms"
  rune_etched_arms_desc: "Spiral runes etched along a weapon's length spin its strikes to unerring accuracy."
  formation_arrays: "Formation Arrays"
  formation_arrays_desc: "Defensive arrays traced in the earth itself, turning any hilltop into a bulwark that blunts the enemy's charge."
  spirit_fertilizer_refinement: "Spirit Fertilizer Refinement"
  spirit_fertilizer_refinement_desc: "Refined spirit fertilizer wakes the dormant qi in ordinary soil. Anything will grow in it - spirit herbs included."
  relay_orbs: "Relay Orbs"
  relay_orbs_desc: "Chains of paired relay orbs flash reports across the realm in moments, sparing the families of soldiers weeks of dread."
  chain_enchanted_arms: "Chain-Enchanted Arms"
  chain_enchanted_arms_desc: "Layered enchantments that recharge as fast as they discharge let a soldier strike again and again without pause."
  spell_array_batteries: "Spell-Array Batteries"
  spell_array_batteries_desc: "Crank-driven arrays that loose a continuous stream of minor spells, scything down anything that approaches the line."
  memory_crystals: "Memory Crystals"
  memory_crystals_desc: "Crystals that drink in a moment of light and hold it forever. Portraitists grumble; historians rejoice."
  transcendent_fertilizer: "Transcendent Fertilizer"
  transcendent_fertilizer_desc: "Fertilizer refined to near-elixir purity, drawing qi from the very air into the harvest."
  purification_rites: "Purification Rites"
  purification_rites_desc: "Ritual heating and sealing purge food of corruption, letting the harvest survive the journey to market."
  communication_orbs: "Communication Orbs"
  communication_orbs_desc: "Paired orbs that carry the living voice itself across any distance. The world grows small, and secrets grow scarce."
  perfected_enchanted_arms: "Perfected Enchanted Arms"
  perfected_enchanted_arms_desc: "The culmination of the enchanter's art: arms whose spells cycle flawlessly in any weather, in any hands."
  auto_cycling_war_cores: "Auto-Cycling War Cores"
  auto_cycling_war_cores_desc: "War automata cores that cycle and fire entirely on their own, pouring out destruction as long as their consumables hold."
  layered_formation_arrays: "Layered Formation Arrays"
  layered_formation_arrays_desc: "Arrays behind arrays, each rank absorbing what the last released. An attacker must win the same battle five times over."
  entrenched_formations: "Entrenched Formations"
  entrenched_formations_desc: "Formation arrays dug into continuous trench lines, sheltering whole armies beneath the killing field."
  phantasm_projection: "Phantasm Projection"
  phantasm_projection_desc: "Sequences of memory crystals projected as moving phantasms enthrall audiences - and electorates."
  vanguard_cultivators: "Vanguard Cultivators"
  vanguard_cultivators_desc: "Elite cultivators who slip through the enemy's arrays under cover of smoke and night, unraveling a defense from within."
  flame_talismans: "Flame Talismans"
  flame_talismans_desc: "Talismans that vomit rivers of clinging spirit-fire into bunkers and trench lines. Little survives their attention."
  frost_talismans: "Frost Talismans"
  frost_talismans_desc: "Frost talismans hold fish and meat at the moment of the catch, from the wharf to tables a thousand li away."
  spirit_roads: "Spirit Roads"
  spirit_roads_desc: "Highways paved along the leylines themselves speed travelers, goods, and good fortune to every corner of the realm."
  sect_endowments: "Sect Endowments"
  sect_endowments_desc: "Great sects pool the offerings of generations into endowments that bankroll ventures no single merchant could dare."
  talisman_post: "Talisman Post"
  talisman_post_desc: "A postal network of message talismans that also carries the small savings of farmers and shopkeepers into productive use."

  ### ---------------------------------------------------------------
  ### ROUND 2: rebalance, airships, traditions
  ### ---------------------------------------------------------------
  battle_consumables: "Battle Consumables"
  battle_consumables_desc: "Workshops that mass-produce the soldier's expendables: paper talismans, single-use scrolls, and pressed battle pills, packed by the crate for the front."
  massed_levies: "Massed Levies"
  massed_levies_desc: "Standardized training, rations, and potion stipends allow the realm to field disciplined blocks of levied soldiers in every campaign season."
  sect_tournaments: "Sect Tournaments"
  sect_tournaments_desc: "Grand public tournaments where sects and schools contest openly. The people cheer, wager, and glow with pride in their nation's champions."
  airship_flight_desc: "Simple buoyant hulls of timber, lifted by the raw discharge of unrefined spirit stones. Crude, slow - and suddenly the sky is a road."
  magic_carpets: "Magic Carpet Weaving"
  magic_carpets_desc: "Looms that weave potion-steeped spirit thread into carpets which remember how to fly. The caravan routes of the sky belong to whoever weaves them."
  talisman_printing: "Talisman Printing"
  talisman_printing_desc: "Woodblock printing adapted to spiritual script puts minor talismans - and cheap primers - in every village market."
  spirit_beast_taming: "Spirit Beast Taming"
  spirit_beast_taming_desc: "Contracts, whistles, and patience turn wild spirit beasts into herds and hunting partners alike."
  spirit_vein_geomancy: "Spirit Vein Geomancy"
  spirit_vein_geomancy_desc: "Geomancers trace the land's hidden veins to their sources, revealing deposits no prospector's eye could find."
  servitor_automata: "Servitor Automata"
  servitor_automata_desc: "Clerical automata that file, stamp, copy, and never sleep. The registries have never been so current, nor the clerks so nervous."

  ### ---------------------------------------------------------------
  ### ROUND 3: cultivation line, consumables rework, tree rebalance
  ### ---------------------------------------------------------------

  ### Cultivation realm techs (Spiritualism)
  qi_gathering: "Qi Gathering"
  qi_gathering_desc: "The first step on the path: drawing the world's qi into the body through breath and stillness. Cultivation Grounds rise wherever the leylines pool."
  foundation_establishment: "Foundation Establishment"
  foundation_establishment_desc: "The dantian is tempered into an unshakable foundation. Cultivators strong enough to ride the wind serve the realm as Mage Outriders."
  golden_core: "Golden Core"
  golden_core_desc: "Years of refinement condense a cultivator's qi into a revolving golden core. Battle Mages built on such cores fight tirelessly, afoot or aloft."
  nascent_soul: "Nascent Soul"
  nascent_soul_desc: "A second self coalesces within the core - a nascent soul that survives even grievous wounds. Warded Mages sheathed in soul-light ride through massed fire."
  soul_formation: "Soul Formation"
  soul_formation_desc: "The nascent soul matures and touches the heavens. Storm Mages call down the wrath of the sky in a single devastating charge."
  return_to_the_void: "Return to the Void"
  return_to_the_void_desc: "At the summit of cultivation the self dissolves into the Dao. Void Mages step between spaces, and no line of battle can hold them."
  martial_ascension: "Martial Ascension"
  martial_ascension_desc: "Body-tempering methods once hoarded by the great sects are drilled into whole legions. The realm's finest infantry stand half a step from immortality."
  demonic_scriptures: "Demonic Scriptures"
  demonic_scriptures_desc: "Forbidden texts, copied in blood and hidden from every orthodox sect. They teach the same cultivation realms by a shorter, crueler road, wringing spirit stones and living flesh from the common folk to feed the elders' ascension. Unlocks the Demonic Rites in Cultivation Grounds."

  ### Talisman consumables line (Spiritualism)
  seal_script_engraving: "Seal Script Engraving"
  seal_script_engraving_desc: "Master engravers cut true seal script into printing blocks, binding far greater power into every talisman that leaves the workshop."
  grand_talisman_arrays: "Grand Talisman Arrays"
  grand_talisman_arrays_desc: "Talismans printed in interlocking sets that form a complete array when burned together - the pinnacle of consumable spiritual warfare."
  meridian_theory: "Meridian Theory"
  meridian_theory_desc: "Charting the twelve meridians and eight extraordinary vessels puts spiritual medicine on a rigorous footing."

  ### Artifice additions
  sawmills: "Saw Mills"
  sawmills_desc: "Water- and core-driven gang saws turn whole trunks into dressed lumber in minutes, freeing the axe gangs for the felling."
  clockwork_mechanisms: "Clockwork Mechanisms"
  clockwork_mechanisms_desc: "Escapements, mainsprings, and gear-trains of dwarven precision creep out of the clock tower and into every workshop in the land."
  arcane_surveying: "Arcane Surveying"
  arcane_surveying_desc: "Dowsing engines and leyline theodolites map the veins of the earth, letting mine shafts follow the spirit stone instead of guessing at it."
  mana_lamps: "Mana Lamps"
  mana_lamps_desc: "Cut-crystal lamps fed by spirit stone dust banish the night from city streets. Commerce - and prestige - no longer sleep at dusk."
  core_miniaturization: "Core Miniaturization"
  core_miniaturization_desc: "Magic cores the size of a coin power instruments, tools, and automata limbs of unprecedented delicacy."

  ### Regional traditions (unresearchable)
  tradition_artifice: "Artifice Tradition"
  tradition_artifice_desc: "This nation's academies, guilds, and workshops are steeped in the discipline of Artifice. Its scholars advance the craft swiftly - but regard Alchemy and Spiritualism as foreign curiosities."
  tradition_alchemy: "Alchemy Tradition"
  tradition_alchemy_desc: "This nation's learning flows through the alembic and the bazaar. Alchemy advances swiftly here - but Artifice and Spiritualism remain the arts of strangers."
  tradition_spiritualism: "Spiritualism Tradition"
  tradition_spiritualism_desc: "This nation's wisdom is cultivated in sects, shrines, and mountain retreats. Spiritualism advances swiftly here - but Artifice and Alchemy are dismissed as crude tinkering."
  tradition_artifice_alchemy: "Twin Tradition: Artifice and Alchemy"
  tradition_artifice_alchemy_desc: "Forge-halls and alchemists' quarters stand side by side in this nation. Both crafts advance well - but the spiritual arts have withered from neglect."
  tradition_spiritualism_artifice: "Twin Tradition: Spiritualism and Artifice"
  tradition_spiritualism_artifice_desc: "Shrine and workshop share the same street in this nation. Both paths advance well - but alchemy is left to peddlers and quacks."
  tradition_spiritualism_alchemy: "Twin Tradition: Spiritualism and Alchemy"
  tradition_spiritualism_alchemy_desc: "Cultivators and alchemists trade secrets freely in this nation. Both paths advance well - but the clank of artifice is heard only in imports."

  ### Infantry as enchanted cold weapons (Spiritualism)
  combat_unit_type_line_infantry: "Enchanted Blade Infantry"
  combat_unit_type_line_infantry_desc: "Ranks of soldiers bearing mass-enchanted blades and spears, holding formation behind a wall of glimmering edges."
  combat_unit_type_skirmish_infantry: "Rune-Blade Skirmishers"
  combat_unit_type_skirmish_infantry_desc: "Loose-order fighters with rune-etched arms, striking from cover and fading before the counterblow."
  combat_unit_type_trench_infantry: "Entrenched Array Infantry"
  combat_unit_type_trench_infantry_desc: "Infantry fighting from continuous trench arrays, sheltered by layered defensive formations."
  combat_unit_type_squad_infantry: "Vanguard Cultivator Squads"
  combat_unit_type_squad_infantry_desc: "Small squads of trained cultivators who infiltrate, breach, and unravel enemy arrays from within."

