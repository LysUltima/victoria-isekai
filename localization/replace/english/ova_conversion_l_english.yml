  ### Re-themed Alchemy naval line (keys renamed off real-world ship classes)
  alchemical_propulsion: "Alchemical Propulsion"
  alchemical_propulsion_desc: "Screw-drives turned by sealed reagent boilers push a hull faster than any paddle, and hold their heading through a gale that would scatter a fleet of sails."
  coastal_warships: "Coastal Warships"
  coastal_warships_desc: "Low, squat hulls that ride barely above the waterline, a single warded turret trained on anything that dares approach the shore batteries."
  armored_warships: "Armored Warships"
  armored_warships_desc: "Mixed batteries set behind thick warded plate: the first true ships of the line built to trade broadsides and live through them."
  grand_warships: "Grand Warships"
  grand_warships_desc: "A single uniform battery of the heaviest guns, ranged and fired as one. One such vessel makes every mixed-battery fleet before it look like kindling."
  titan_warships: "Titan Warships"
  titan_warships_desc: "Floating fortresses whose warded belts shrug off all but the heaviest fire, their guns able to break a coastline from beyond the horizon."
  airship_carriers: "Airship Carriers"
  airship_carriers_desc: "Broad-decked ships that launch and recover flights of scout airships far out to sea, letting a fleet strike at enemies it never has to close with."
  torpedo_cutters: "Torpedo Cutters"
  torpedo_cutters_desc: "Swift, lightly-warded hulls built to run down torpedo craft and submersibles and screen the battle line from their reagent lances."
  submersible_hulls: "Submersible Hulls"
  submersible_hulls_desc: "Sealed, reagent-ballasted hulls that slip beneath the waves to stalk convoys unseen, surfacing only long enough to loose their torpedoes."
  swarm_fleet_doctrine: "Swarm Fleet Doctrine"
  swarm_fleet_doctrine_desc: "A school of admirals who forsake the grand battle line for clouds of cheap torpedo craft, trusting numbers and daring to drag down any leviathan."
  alchemical_dockyards: "Alchemical Dockyards"
  alchemical_dockyards_desc: "Slipways set in fast-curing alchemical concrete and warded against the tide let the greatest hulls be laid down, fitted, and floated in record time."

  ### Re-themed Artifice industry techs (keys renamed off real-world processes)
  sealed_crucible_forging: "Sealed Crucible Forging"
  sealed_crucible_forging_desc: "Long, sealed crucibles hold molten metal and crushed spirit stone in careful balance for hours, drawing out magic cores of a far higher grade than the resonance forges can manage."
  rotary_core_engines: "Rotary Core Engines"
  rotary_core_engines_desc: "Cores set spinning in rotary housings deliver smooth, continuous power to a workshop’s shafts, driving heavier automata than any reciprocating engine could."
  core_railway_cars: "Core-Framed Railway Cars"
  core_railway_cars_desc: "Carriages framed in magic-core alloy carry heavier loads on lighter axles, and armored variants ferry war automata to the front by rail."

  ### Re-themed Alchemy frontier line (keys renamed off quinine/malaria)
  fever_tonics: "Fever Tonics"
  fever_tonics_desc: "Bittered tonics decocted by the apothecaries break a fever and ward off the worst of the coastal sicknesses, letting settlers hold disease-ridden ground that once sickened them within a season."
  monster_wards: "Monster Wards"
  monster_wards_desc: "Alchemical repellents, warding talismans, and beast-banes that hold the wild monsters of the deep frontier at bay, opening even monster-infested lands to settlement."

