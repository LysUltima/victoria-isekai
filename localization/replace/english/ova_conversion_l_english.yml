  ### ---------------------------------------------------------------
  ### ACADEMY CHARTER (ACA-only variant law) + GOVERNMENT TYPES
  ### ---------------------------------------------------------------
  law_academy: "Academy Charter"
  law_academy_desc: "The state is a school and answers to nothing above it, no crown, no altar, no electorate: the masters govern the realm the way they govern their halls, by chair and by committee, and the ministries are staffed with whoever passed the examinations that year. The Dean presides over all of it, raised up by the faculty and answerable to them alone. Neither blood nor ballot decides who rules, only who can defend a thesis in front of a room that came to tear it apart."

  # Government types under the Academy Charter
  gov_academy:0 "Academy"
  gov_academy_desc:0 "This is a [concept_government_type] where the [concept_country] is itself a school, presided over by its [Concept('concept_ruler','$RULER_TITLE_ACADEMY_DEAN$')] and governed by the faculty. Office follows examination and standing among the masters, never birth and never the altar.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_academy_scholarchy:0 "Scholarchy"
  gov_academy_scholarchy_desc:0 "This is a [concept_government_type] where the realm is administered outright as a course of study, every ministry handed to the master best qualified to hold it, with the [Concept('concept_ruler','$RULER_TITLE_ACADEMY_GRAND_DEAN$')] at the head of the table. The curriculum is the constitution.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_academy_deanery:0 "Deanery"
  gov_academy_deanery_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_ACADEMY_GRAND_DEAN$')] rules the school absolutely. The faculty may object, at length and in writing, and the Dean may read it.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_academy_faculty_senate:0 "Faculty Senate"
  gov_academy_faculty_senate_desc:0 "This is a [concept_government_type] where the chair-holding masters sit as a senate under their [Concept('concept_ruler','$RULER_TITLE_ACADEMY_DEAN$')], and the business of the realm is settled the way departmental business always is: slowly, and with footnotes.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_academy_collegium:0 "Collegium"
  gov_academy_collegium_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_ACADEMY_DEAN$')] and the faculty answer to a broad collegium of graduates and fellows, learning tempered by the voice of everyone the school ever taught.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  RULER_TITLE_ACADEMY_DEAN:0 "Dean"
  RULER_TITLE_ACADEMY_GRAND_DEAN:0 "Grand Dean"

  ### ---------------------------------------------------------------
  ### MARTIAL SECT LAW + SECT SUBJECT TYPE
  ### ---------------------------------------------------------------
  law_martial_sect: "Martial Sect"
  law_martial_sect_desc: "The state is the sect. Elders govern the provinces as they govern the inner halls, disciples staff the ministries, and the Sect Patriarch's word carries the weight of heaven. Martial prowess, not birth or ballot, decides who rules.\n\n#b Sect Ascension:#! every ten years, each character in the realm advances one cultivation realm, up to the ceiling of our researched techniques. Heir-training decisions are disabled, the whole sect rises together."

  subject_type_sect: "@dominion! $subject_type_sect_no_icon$"
  subject_type_sect_no_icon: "Sect"

  # Government types for the Martial Sect governance principle
  gov_martial_sect:0 "Martial Sect"
  gov_martial_sect_desc:0 "This is a [concept_government_type] where the [concept_country] is itself a cultivation sect, ruled by the [Concept('concept_ruler','$RULER_TITLE_SECT_PATRIARCH$')] and governed by its elders. Martial prowess, not birth or ballot, decides who rules.\n\n#b Sect Ascension:#! the whole realm cultivates together, every ten years each character advances one cultivation realm, up to the ceiling of our researched techniques. (Heir-training decisions are disabled under a Martial Sect.)\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_martial_sect_autocracy:0 "Patriarchal Sect"
  gov_martial_sect_autocracy_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_SECT_PATRIARCH$')] rules the sect absolutely, their word carrying the weight of heaven. The elders counsel, but none may defy the strongest cultivator of the age.\n\n#b Sect Ascension:#! the whole realm cultivates together, every ten years each character advances one cultivation realm, up to the ceiling of our researched techniques. (Heir-training decisions are disabled under a Martial Sect.)\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_martial_sect_council:0 "Sect Council"
  gov_martial_sect_council_desc:0 "This is a [concept_government_type] where the sect is governed by a Council of Elders under its [Concept('concept_ruler','$RULER_TITLE_SECT_GRAND_ELDER$')], the eldest cultivators sharing power over the inner halls.\n\n#b Sect Ascension:#! the whole realm cultivates together, every ten years each character advances one cultivation realm, up to the ceiling of our researched techniques. (Heir-training decisions are disabled under a Martial Sect.)\n\n$TRANSFER_OF_POWER_NAME_DESC$"
  gov_martial_sect_conclave:0 "Disciples' Conclave"
  gov_martial_sect_conclave_desc:0 "This is a [concept_government_type] where the sect's [Concept('concept_ruler','$RULER_TITLE_SECT_PATRIARCH$')] and elders are raised up by a broad conclave of the disciples, martial standing tempered by the voice of the halls.\n\n#b Sect Ascension:#! the whole realm cultivates together, every ten years each character advances one cultivation realm, up to the ceiling of our researched techniques. (Heir-training decisions are disabled under a Martial Sect.)\n\n$TRANSFER_OF_POWER_NAME_DESC$"
