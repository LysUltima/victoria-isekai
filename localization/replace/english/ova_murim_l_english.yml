l_english:
  # --- AI strategy: diplomatic play support tooltips
  ova_murim_support_fellow_sect_vs_cult: "Sworn Alliance against the Heavenly Demon Cult"
  ova_murim_support_vs_cult: "Any banner raised against the Heavenly Demon Cult"
  # --- Journal entries: war banners
  je_ova_murim_heavenly_demon: "The Heavenly Demon Rises"
  je_ova_murim_heavenly_demon_reason: "Drums have begun sounding again beyond the northern passes. The Heavenly Demon Sect is calling disciples back to its five mountains and opening old war stores. Three hundred years of Orthodox condemnation never destroyed it. This time the eight great powers may have to. In the [concept_ova_murim_war], the Cult wins if six of the eight are destroyed or subjugated, or if five mountain seats fall into its hands."
  je_ova_murim_heavenly_demon_status: "All eight Orthodox banners still stand. Fighting continues along the northern passes."
  ova_murim_cult_victory_tt: "Five of the eight sect capitals are ours, or six of the eight sects have been destroyed or brought under our yoke"
  ova_murim_cult_subjugated_tt: "We ourselves have bowed to another power"

  je_ova_murim_alliance_banner: "The Banner of the Alliance"
  je_ova_murim_alliance_banner_reason: "Hwasan carries the banner of the Orthodox Martial Alliance. Eight sects and clans have sworn to face the Heavenly Demon Sect together. They still quarrel over borders, pride, and old debts, but until the [concept_ova_murim_war] is decided, none of those disputes is enough to break the oath."
  je_ova_murim_alliance_banner_status: "The Alliance oath still holds. All eight banners remain under Hwasan's call."
  ova_murim_alliance_victory_tt: "The Heavenly Demon Sect no longer exists, or has bowed to another power"
  ova_murim_cult_victory_other_tt: "The Cult has mastered the murim, or we ourselves have bowed to a power outside the Alliance"

  je_ova_murim_sect_banner: "A Sect Among the Eight"
  je_ova_murim_sect_banner_reason: "Our banner is one of the eight sworn to the Orthodox Martial Alliance. We do not need to command the [concept_ova_murim_war] to decide it. A pass held, a spy exposed, a manual recovered, or reinforcements sent at the right time may be enough to keep another sect from falling."
  je_ova_murim_sect_banner_status: "Our banner still flies with the Alliance, and the northern war is not yet decided."

  # --- Journal entries: Kang Jin-woo
  je_ova_murim_returner_1: "The Quiet Disciple"
  je_ova_murim_returner_1_reason: "Kang Jin-woo entered through our gate with no famous teacher, no clan name worth mentioning, and no great show of talent. His name sits comfortably on the training rolls. The problem is that the rolls explain less each month. In ordinary sparring he gives away nothing. When a roof collapses, an assassin crosses the wall, or a senior disciple is about to be badly hurt, witnesses sometimes see something quite different. Their stories rarely agree. Jin-woo never corrects them. Within the hall, people have begun calling him [concept_ova_returner], though the name means something different to every speaker. If he reaches the First-Rate rank, the rest of the murim will begin paying attention whether he wants it or not."
  je_ova_murim_returner_1_complete_tt: "Kang Jin-woo's early years have run their course, and he has reached the First-Rate rank"

  # --- The Eight Banners arc: his own house, courted first
  je_ova_murim_ally_home: "His Own House"
  je_ova_murim_ally_home_reason: "Jin-woo may have earned a name outside the mountain, but the people who first gave him a room still matter most. Establish a proper Champion Hall, then win the support of the house's young mistress or senior disciple. If the inner hall trusts him, other banners will find it easier to do the same."
  je_ova_murim_ally_home_sworn_tt: "The leading disciple of his own house has pledged herself to him"
  je_ova_murim_ally_home_hall_tt: "A Champion Hall stands with all three of its wings staffed"
  je_ova_murim_ally_home_fail_tt: "Kang Jin-woo has died, the Cult has mastered the murim, or his own house has turned against him"

  # --- The Eight Banners arc (je_ova_murim_ally_*, one JE per courted banner)
  je_ova_murim_ally_sor: "The Iron Monk of Sorim"
  je_ova_murim_ally_sor_reason: "Sorim has little patience for clever promises. Seok Hye-gang has fought beside Jin-woo and seen enough to judge him for himself. Win Hye-gang's sworn brotherhood, keep Sorim friendly, and field at least 15 battalions. The monks will not follow a banner that cannot defend its own mountain."
  je_ova_murim_ally_sor_sworn_tt: "Seok Hye-gang has sworn brotherhood"
  je_ova_murim_ally_sor_relations_tt: "Sorim regards us warmly (Relations at least 50)"
  je_ova_murim_ally_sor_objective_tt: "We field an army of at least 15 battalions"

  je_ova_murim_ally_pae: "The Saber of Paeng"
  je_ova_murim_ally_pae_reason: "The Paeng clan of Hobuk respects strength, but it respects the man who stays behind when everyone else retreats even more. Paeng Ha-ran has already crossed sabers with Jin-woo's enemies. Earn her trust, keep the Paeng friendly, and hold the Hobuk Saber Trials in their honor."
  je_ova_murim_ally_pae_sworn_tt: "Paeng Ha-ran has pledged herself"
  je_ova_murim_ally_pae_relations_tt: "The Paeng regard us warmly (Relations at least 50)"
  je_ova_murim_ally_pae_objective_tt: "We have staged the Hobuk Saber Trials (decision)"

  je_ova_murim_ally_tan: "The Poison Maiden of Tang"
  je_ova_murim_ally_tan_reason: "Tang So-yeol has tested Jin-woo with poison more than once and still has not decided what to make of him. He knows enough to interest the Tang and hides enough to irritate them. Earn her trust, keep the clan friendly, and return the Tang fire formulas lost in the old disaster."
  je_ova_murim_ally_tan_sworn_tt: "Tang So-yeol has moved her jars into the household"
  je_ova_murim_ally_tan_relations_tt: "The Tang regard us warmly (Relations at least 50)"
  je_ova_murim_ally_tan_objective_tt: "We have recovered the lost Tang fire formulas (decision)"

  je_ova_murim_ally_nam: "The Pride of Namgung"
  je_ova_murim_ally_nam_reason: "Namgung Wol-hee came looking for the swordsman behind the rumors and found a man who refuses to fight the same way twice. Rivalry can still become respect. Earn her pledge, keep the Namgung friendly, and have Jin-woo reach the Peak Realm (Level 30). The Imperial Sword Clan will not follow a weak hand."
  je_ova_murim_ally_nam_sworn_tt: "Namgung Wol-hee has bowed once, and pledged herself"
  je_ova_murim_ally_nam_relations_tt: "The Namgung regard us warmly (Relations at least 50)"
  je_ova_murim_ally_nam_objective_tt: "Kang Jin-woo stands in the Peak Realm (Level 30)"

  je_ova_murim_ally_jeg: "The Strategist of Jegal"
  je_ova_murim_ally_jeg_reason: "Jegal Seo-yeon does not care much for rumors. She has reports, ledgers, battle maps, and enough contradictions in Jin-woo's record to keep her interested. Win her confidence, keep the Jegal friendly, and establish at least two levels of Universities so her strategists have the books and clerks they need."
  je_ova_murim_ally_jeg_sworn_tt: "Jegal Seo-yeon has chosen the household board"
  je_ova_murim_ally_jeg_relations_tt: "The Jegal regard us warmly (Relations at least 50)"
  je_ova_murim_ally_jeg_objective_tt: "We have raised at least two levels of Universities"

  je_ova_murim_ally_mud: "The Priestess of Mudang"
  je_ova_murim_ally_mud_reason: "Wi Cheong-ha of Mudang has seen Jin-woo cross formations that should trouble men of his recorded realm. He blames good eyes and careful footwork. She does not believe him, but she has stopped asking directly. Win her trust, keep Mudang friendly, and endow the mountain shrine in our household's name."
  je_ova_murim_ally_mud_sworn_tt: "Wi Cheong-ha has left Mudang to join the household"
  je_ova_murim_ally_mud_relations_tt: "Mudang regards us warmly (Relations at least 50)"
  je_ova_murim_ally_mud_objective_tt: "We have endowed Mudang's mountain shrine (decision)"

  je_ova_murim_ally_sam: "The Broker of Sama"
  je_ova_murim_ally_sam_reason: "Sama Ryeon's people have searched inns, ferries, courier offices, and old gate records for Jin-woo's past. They found plenty of stories and almost nothing that agrees. Ryeon considers that more interesting than a clean answer. Win her confidence, keep the Sama friendly, and settle the debts in her ledger."
  je_ova_murim_ally_sam_sworn_tt: "Sama Ryeon has closed her ledger and joined the household"
  je_ova_murim_ally_sam_relations_tt: "The Sama regard us warmly (Relations at least 50)"
  je_ova_murim_ally_sam_objective_tt: "We have settled every debt in the Sama ledger (decision)"

  je_ova_murim_ally_hwa: "The Sword Saintess of Hwasan"
  je_ova_murim_ally_hwa_reason: "Yeon Seol-mae first met Jin-woo as another swordsman passing through Hwasan. A few exchanges were enough to make her look twice. Earn her trust, keep Hwasan friendly, and field at least 15 battalions. The Alliance's oldest banner will not tie itself to a house that cannot hold its own line."
  je_ova_murim_ally_hwa_sworn_tt: "Yeon Seol-mae has left the mountain for the household"
  je_ova_murim_ally_hwa_relations_tt: "Hwasan regards us warmly (Relations at least 50)"
  je_ova_murim_ally_hwa_objective_tt: "We field an army of at least 15 battalions"

  je_ova_murim_ally_fail_tt: "Kang Jin-woo has died, the Cult has mastered the murim, this banner can no longer be won, or his conduct has cost us its trust"

  # --- The endgame journal entries
  je_ova_murim_final_battle: "The Last Road North"
  je_ova_murim_final_battle_reason: "The succession is settled and the banners Jin-woo won over are moving north. The outer strongholds can be taken by armies. Demon Mountain itself is another matter. Jin-woo has asked to lead the party that climbs it. Those who have fought beside him for years no longer bother asking what realm he truly stands in."
  je_ova_murim_final_battle_complete_tt: "The Heavenly Demon has fallen to his blade, or the Cult has been broken"
  je_ova_murim_war_conference: "The War Conference"
  je_ova_murim_war_conference_reason: "Jin-woo holds the seat, but he took it by force and several old allies have refused his summons. The coming campaign will depend on soldiers, supplies, and the banners still willing to march. Raise at least 30 battalions while the council secures the northern roads, deals with treachery in the camp, and prepares for the Heavenly Demon Sect."
  je_ova_murim_war_conference_army_tt: "We field an army of at least 30 battalions"
  je_ova_murim_war_conference_council_tt: "The war council has run its course"
  je_ova_murim_reckoning: "The Reckoning"
  je_ova_murim_reckoning_reason: "The Reckoning has begun. Jin-woo's army is marching north, and there is no longer room for a settlement with the Heavenly Demon Sect. Break the Cult and the old Orthodox lineages buried beneath its rule can return. Lose, and nothing remains between Demon Mountain and the rest of the murim."
  je_ova_murim_reckoning_complete_tt: "The Heavenly Demon Sect has been broken"
  je_ova_murim_reckoning_fail_tt: "Kang Jin-woo has died, the Cult has mastered the murim, or we ourselves have bowed to another power"

  je_ova_murim_returner_fail_tt: "Kang Jin-woo has died, or the Cult has mastered the murim"
  je_ova_murim_returner_dead_tt: "Kang Jin-woo has died. His part in the war ends here."

  # --- Realm status (feeds status_desc on the Returner chain - no apostrophes)
  je_ova_murim_realm_none: "No champion of ours has yet earned a rank recognized across the murim."
  je_ova_murim_realm_third_rate: "[ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName] is publicly counted among the Third-Rate martial artists, one more junior blade in a crowded murim."
  je_ova_murim_realm_second_rate: "[ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName] has been recognized as Second-Rate. The outer halls have begun to remember the name."
  je_ova_murim_realm_first_rate: "[ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName] has reached First-Rate, enough for other sects to take his challenges seriously."
  je_ova_murim_realm_peak: "[ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName] is acknowledged as a Peak master. Few now believe his earlier reputation showed everything he could do."
  je_ova_murim_realm_profound: "[ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName] has entered the Profound Realm (Hwagyeong), joining the small circle of masters who can decide a battle by themselves."
  je_ova_murim_realm_life_death: "[ROOT.GetCountry.MakeScope.Var('ova_champion_char').GetCharacter.GetFullName] has reached the Life-and-Death Realm (Saengsagyeong). At that height, concealment matters less than what he chooses to do with his strength."

  # --- Decisions
  ova_murim_seek_lost_manual_decision: "Seek a Lost Manual"
  ova_murim_seek_lost_manual_decision_desc: "Send our champion into the gangho to follow rumors of ruined schools, abandoned estates, bandit lairs, and forgotten tombs. A real inheritance can change a martial artist's life. A damaged manual can just as easily ruin his meridians."
  ova_murim_grand_tournament_decision: "Host the Grand Martial Tournament"
  ova_murim_grand_tournament_decision_desc: "Open the gates and invite sect disciples, clan heirs, wandering martial artists, and nameless challengers from across the murim. A grand tournament is expensive, noisy, and certain to create grudges. It is also one of the fastest ways to make a name travel through the gangho."
  ova_murim_purge_cult_spies_decision: "Purge Cult Spies"
  ova_murim_purge_cult_spies_decision_desc: "The Heavenly Demon Sect has ears among servants, clerks, merchants, porters, and outer disciples. Search the lower halls and inspect the courier records. Remove the spies we can prove are spies before suspicion turns the whole sect against itself."
  ova_murim_saber_trials_decision: "Stage the Hobuk Saber Trials"
  ova_murim_saber_trials_decision_desc: "Open the training grounds to the saber schools of Hobuk and hold formal trials before the Paeng clan. Jin-woo will judge rather than compete. The Paeng will understand the courtesy, and every saber school in the province will remember who paid for the wine."
  ova_murim_saber_trials_cost_tt: "Costs #v £100,000#!"
  ova_murim_fire_formulas_decision: "Recover the Tang Fire Formulas"
  ova_murim_fire_formulas_decision_desc: "One complete copy of the Tang clan's lost fire formulas may still remain in an abandoned storehouse protected by old poison arrays. Recover it. Whatever is still guarding the place has had a generation to settle in."
  ova_murim_fire_formulas_level_tt: "Kang Jin-woo must have reached the Second-Rate rank (Level 10)"
  ova_murim_shrine_endowment_decision: "Endow the Shrine of Mudang"
  ova_murim_shrine_endowment_decision_desc: "Repair Mudang's mountain shrine, replace the damaged talisman halls, and fill the winter granaries in the household's name. Mudang's elders may argue over the plaque. They will still remember who paid for the roof."
  ova_murim_shrine_endowment_cost_tt: "Costs #v £100,000#!"
  ova_murim_sama_ledger_decision: "Settle the Sama Ledger"
  ova_murim_sama_ledger_decision_desc: "Buy the debts recorded against the household and its allies, then settle them to the last copper. The Sama trade in information, favors, and obligations. A debt paid cleanly is one less handle for another broker to grab."
  ova_murim_sama_ledger_cost_tt: "Costs #v £200,000#!"

  # --- Game concepts
  concept_ova_returner: "The Unfathomable Disciple"
  concept_ova_returner_desc: "A [concept_ova_champion] whose recorded realm and actual ability never seem to agree. In ordinary training he shows little beyond what his rank requires. In a real crisis, witnesses occasionally see movement, judgment, or strength that should belong to someone far above him. The stories contradict one another, and he has never offered an explanation. Most of the murim knows the rumors. Almost no one knows how much of them to believe."
  concept_ova_gangho: "Gangho"
  concept_ova_gangho_desc: "강호, \"the rivers and lakes\": the wandering martial underworld beneath the war of sects and banners, duels fought for pride, manuals traded and forged, escorts hired and ambushed, teahouse rumor that outruns any courier. Gangho outings share the champion's adventuring cooldown with the foundation's own hinterland hunts."
  concept_ova_murim_war: "The War of the Murim"
  concept_ova_murim_war_desc: "The struggle between the Heavenly Demon Sect and the Orthodox Martial Alliance for mastery of the murim. The Cult wins by destroying or subjugating six of the eight Alliance sects, or by holding five of their eight mountain capitals. Banners that bow within the family, the sworn marches of the Eight Banners arc, still count as standing. The Alliance (or any one of its sects, fighting alone if it must) wins when the Cult ceases to exist or is subjugated."

  # --- The Reckoning war (murim endgame). Sworn banners become vanilla PUPPETS
  # (subject_type_puppet); the "sworn march / oathbound banner" wording survives only
  # as narrative flavor in the modifier and event text, not as a subject type.
  ova_murim_reckoning_war: "The Reckoning"
  dp_ova_murim_reckoning: "$war_goal_ova_murim_sundering_type_name$"
  dp_ova_murim_reckoning_tooltip: "#header Start a $dp_ova_murim_reckoning$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_ova_murim_reckoning_desc$"
  dp_ova_murim_reckoning_desc: "Jin-woo's house and the Heavenly Demon Sect have passed the point where a treaty can settle the matter. The Reckoning ends only when one side has broken the other completely."
  war_goal_ova_murim_sundering_type_name: "Sunder the Mountain"
  war_goal_ova_murim_sundering_type_desc: "The winner annexes the loser outright. If Jin-woo's house prevails, the five great Orthodox powers destroyed by the Cult are restored in their old territories and occupied Alliance lands are returned."
  war_goal_ova_murim_sundering: "Sunder the Mountain"
  war_goal_ova_murim_sundering_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] annexes [WAR_GOAL_DRAFT.GetTarget.GetName] outright, and the mountain is sundered."

  # --- AI strategies (loc beyond the spec's explicit list, matching vanilla
