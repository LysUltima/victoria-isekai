  ai_strategy_ova_orthodox_alliance: "Orthodox Martial Alliance"
  ai_strategy_ova_orthodox_alliance_desc: "[COUNTRY.GetName] presses the Alliance's war against the Heavenly Demon Sect."
  ai_strategy_ova_heavenly_demon: "Heavenly Demon Sect"
  ai_strategy_ova_heavenly_demon_desc: "[COUNTRY.GetName] means to grind the eight Orthodox banners to dust, one by one."

