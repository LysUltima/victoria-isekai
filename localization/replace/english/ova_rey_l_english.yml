l_english:
  # --- The Affection bar
  ova_rey_affection_bar: "Affection"
  ova_rey_affection_bar_desc: "Affection"
  ova_rey_affection_bar_second_desc: "Fill the bar, then make your confession"

  # --- Shared affection-tier status lines
  je_ova_rey_status_cool: "For now, she only watches the otherworlder with mild curiosity. Romance? That is still a long way off."
  je_ova_rey_status_warming: "She has started looking forward to his visits. Not that she would ever admit it so easily."
  je_ova_rey_status_fond: "At this point, even she cannot hide that she likes him. Well, not very well, anyway."
  je_ova_rey_status_smitten: "She is completely smitten. One more good push and even John should be able to tell what comes next."
  je_ova_rey_status_won: "Her heart is already his. All that is left is for John to actually say the words."
  je_ova_rey_john_gone_tt: "John Paradox is dead, and his tale with him"
  je_ova_rey_confessed_tt: "She has said yes: John has made his confession"
  je_ova_rey_cold_tt: "Eight dates came and went and her heart stayed cool (under 20 Affection)"

  # --- The confession button (ova_rey_buttons.txt), shown on each courtship JE
  ova_rey_confess_cat_button: "Confess to Nasira"
  ova_rey_confess_dog_button: "Confess to Bruna"
  ova_rey_confess_bear_button: "Confess to Ursla"
  ova_rey_confess_rabbit_button: "Confess to Lieselotte"
  ova_rey_confess_fox_button: "Confess to Fenna"
  ova_rey_confess_button_desc: "Her heart is ready. Say the words, and win her hand. Nothing else is required."
  ova_rey_confess_ready_tt: "The Affection bar must be full first"
  ova_rey_confess_effect_tt: "Make John’s confession and win her heart"

  # ===================================================================
  # Chapter 1: Katzenburg - Nasira, the desert-cat merchant heiress
  # ===================================================================
  je_ova_rey_court_cat: "The Cat of Katzenburg"
  je_ova_rey_court_cat_reason: "So, the republic summoned a Hero from another world. What it got was John Paradox, a man blessed with a champion's soul and, unfortunately, a very healthy interest in beautiful women. Before dealing with anything as troublesome as governing, John has set himself a far more important goal: win the heart of one beastfolk woman from each of Reyorn's five states. First up is Nasira al-Sahra, the desert-cat heiress of Katzenburg. She is clever, wealthy, and the sort of merchant who seems to put a price on everything. Getting close to her will not be easy. Take her on eight dates and fill the Affection bar, then use the journal button to confess once it is full. That confession is what wins her heart. Three optional deeds give a large boost along the way: build Textile Mills to level 5 in Katzenburg, enact Free Trade, and enact Laissez-Faire. If eight dates pass and she is still cold, or five years slip away first, then that is that. John will have to swallow the rejection and move on to the next state."
  je_ova_rey_cat_heart_tt: "Her heart is won (the Affection bar is full)"
  je_ova_rey_cat_obj1_tt: "A house of silks stands in Katzenburg (Textile Mills at level 5)"
  je_ova_rey_cat_obj2_tt: "The republic trades freely (enact Free Trade)"
  je_ova_rey_cat_obj3_tt: "The capital’s merchants run free (enact Laissez-Faire)"

  # ===================================================================
  # Chapter 2: Welpenstadt - Bruna, the dogkin guard-captain
  # ===================================================================
  je_ova_rey_court_dog: "The Captain of Welpenstadt"
  je_ova_rey_court_dog_reason: "Next comes Welpenstadt, where Bruna Falk stands guard at the gate. She is a dogkin captain, endlessly diligent, painfully serious, and apparently capable of inspecting the same man twice without getting bored. John has decided he would rather become the one person she never wants to send away. Take Bruna on eight dates and fill the Affection bar, then confess from the journal button once it is full. That is the moment that wins her. Three optional deeds can make things much easier: raise Barracks to level 20 in Welpenstadt, enact the National Guard, and bring John to Champion Level 12. If all eight dates end with her heart still cold, or the courtship season expires, Bruna will give him one final salute. After that, John has no choice but to move on."
  je_ova_rey_dog_heart_tt: "Her heart is won (the Affection bar is full)"
  je_ova_rey_dog_obj1_tt: "A great garrison stands in Welpenstadt (Barracks at level 20)"
  je_ova_rey_dog_obj2_tt: "A citizens’ watch keeps the peace (enact the National Guard)"
  je_ova_rey_dog_obj3_tt: "John Paradox has reached Champion Level 12"

  # ===================================================================
  # Chapter 3: Barenberg - Ursla, the bearkin mountain smith
  # ===================================================================
  je_ova_rey_court_bear: "The Smith of Barenberg"
  je_ova_rey_court_bear_reason: "High in the mountains of Barenberg lives Ursla Steinfell, a bearkin smith who can bend iron with her hands and somehow still turn red at a sincere compliment. John, naturally, finds this combination impossible to ignore. Take her on eight dates and fill the Affection bar, then confess from the journal button once it is full. That confession alone seals the courtship. Three optional deeds give a large boost: raise the Arms Factory in Barenberg to level 10, reach Renown Level 6, and reach Champion Level 15. In other words, if John wants to stand beside a mountain smith, he should at least become someone impressive enough not to embarrass himself. If eight dates pass without winning her over, or the season ends first, Ursla will clap him on the shoulder and send him on his way."
  je_ova_rey_bear_heart_tt: "Her heart is won (the Affection bar is full)"
  je_ova_rey_bear_obj1_tt: "Her forges arm the republic (Arms Factory at level 10 in Barenberg)"
  je_ova_rey_bear_obj2_tt: "John Paradox has reached Renown Level 6"
  je_ova_rey_bear_obj3_tt: "John Paradox has reached Champion Level 15"

  # ===================================================================
  # Chapter 4: Hasenhafen - Lieselotte, the rabbitkin harvest maiden
  # ===================================================================
  je_ova_rey_court_rabbit: "The Maiden of Hasenhafen"
  je_ova_rey_court_rabbit_reason: "The fourth stop is Hasenhafen, and this time the target is Lieselotte Klee. She is a rabbitkin harvest maiden, gentle enough to worry about everyone and timid enough to startle at almost anything. Her smile alone is enough to make John decide the entire trip was worth it. Take her on eight dates and fill the Affection bar, then confess from the journal button once it is full. Three optional deeds can win a large amount of affection: raise Wheat Farms to level 20 in Hasenhafen, reach Renown Level 9, and reach Champion Level 18. A full barn, a famous name, and enough strength to protect the people around her. Those are the kinds of things that make Lieselotte feel safe. If the eighth date ends before her heart is won, or time runs out, she will wave goodbye with tears she refuses to explain. John will have to keep walking."
  je_ova_rey_rabbit_heart_tt: "Her heart is won (the Affection bar is full)"
  je_ova_rey_rabbit_obj1_tt: "A harvest overflows in Hasenhafen (Wheat Farm at level 20)"
  je_ova_rey_rabbit_obj2_tt: "John Paradox has reached Renown Level 9"
  je_ova_rey_rabbit_obj3_tt: "John Paradox has reached Champion Level 18"

  # ===================================================================
  # Chapter 5: Fuschtaal - Fenna, the foxkin scholar
  # ===================================================================
  je_ova_rey_court_fox: "The Fox of Fuschtaal"
  je_ova_rey_court_fox_reason: "Last among the five states is Fuschtaal, where Fenna Rotwald makes a living asking questions and revealing as little as possible about herself. She is probably the cleverest woman John has met in either world. She is also, annoyingly, the hardest to read. Take Fenna on eight dates, match wits with her, and fill the Affection bar. Once it is full, confess from the journal button to win her heart. Three optional deeds provide a large boost: raise a University to level 10 in Fuschtaal, reach Renown Level 14, and reach Champion Level 22. Build something worthy of her mind, become famous enough to interest her, and grow strong enough that even she has to acknowledge it. If eight dates pass without filling the bar, or the courtship season ends, Fenna will give John one final unreadable smile. Then it is back to the capital."
  je_ova_rey_fox_heart_tt: "Her heart is won (the Affection bar is full)"
  je_ova_rey_fox_obj1_tt: "An archive worthy of her stands in Fuschtaal (University at level 10)"
  je_ova_rey_fox_obj2_tt: "John Paradox has reached Renown Level 14"
  je_ova_rey_fox_obj3_tt: "John Paradox has reached Champion Level 22"

  # ===================================================================
  # Capstone: the presidency of Reyorn
  # ===================================================================
  je_ova_rey_ascension: "The Paradox Presidency"
  je_ova_rey_ascension_reason: "Somehow, John Paradox has managed to court his way across the entire republic. At this point, people have started asking an absurd question with completely straight faces: if the otherworlder can marry into Reyorn, why should he not lead it too? Each woman whose heart he truly won brings the support of her people with her. The next step is obvious, at least by John's standards. Stand for the presidency, take the chair, and make the peoples of his brides founding cultures of a new Reyorn."
  je_ova_rey_ascension_tt: "John Paradox has taken the presidency of Reyorn"
  je_ova_rey_ascension_status_wait: "By now, everyone can see where this is going. The only thing left is for the otherworlder to actually take the presidential chair."
  je_ova_rey_ascension_status_done: "President Paradox now holds the republic. Somehow, the ridiculous plan actually worked."
