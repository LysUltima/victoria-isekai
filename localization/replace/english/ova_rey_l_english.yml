  # ===================================================================
  # Hardcoded character name keys. The templates in
  # common/character_templates/ova_story_templates.txt use these bare tokens as
  # first_name / last_name; without a loc key the game renders the raw token and
  # vic3-tiger flags it as missing localization. The display ORDER (first-last vs
  # last-first) comes from each culture's name_format, not from here. "John"
  # already has a key in character_names_l_english.yml, so it is not repeated.
  # ===================================================================
  # template_john_paradox (cu:otherworld_english)
  Paradox: "Paradox"
  # template_ova_rey_cat - Nasira al-Sahra (cu:desert_catkin)
  Nasira: "Nasira"
  al-Sahra: "al-Sahra"
  # template_ova_rey_dog - Bruna Falk (cu:dogkin)
  Bruna: "Bruna"
  Falk: "Falk"
