l_english:
  # --- .1 The Summoning Rite
  ova_hero.1.t: "The Summoning Rite"
  ova_hero.1.d: "Chalk circles, choir-boys, a hundredweight of incense. The Church of the Goddess has done this many times before. All that remains is to decide how much the throne is willing to pay for the world it is about to pull through the veil."
  ova_hero.1.f: "Somewhere, a doorway that was never meant to open is about to open anyway."
  ova_hero.1.a: "Perform the standard rite."
  ova_hero.1.b: "Pay double, demand a stronger Hero."
  ova_hero.1.c: "We hesitate at the threshold."
  # --- .2 A Girl from Another World (trains DO exist here, hence the twist)
  ova_hero.2.t: "A Girl from Another World"
  ova_hero.2.d: "She arrives in a school coat two sizes too big, blinking at the torchlight, and the first thing she asks, once she can speak, is whether there are trains. There are, the steward tells her, gently: great spirit-rail engines that run on bound flame and never tire. She bursts into tears, which nobody expected, and laughs through them, which nobody expected either. Nobody has the heart, tonight, to start explaining the war."
  ova_hero.2.f: "Fourteen years old, entirely ordinary, and as of this evening the most famous schoolgirl in two worlds."
  ova_hero.2.a: "Parade her before the crowds."
  ova_hero.2.b: "A quiet induction, no fanfare."
  # --- .3 A Pact Sealed
  ova_hero.3.t: "A Pact Sealed"
  ova_hero.3.d: "The tithe schedule arrives bound in good leather, every clause drafted by a hand that has done this many times before. The Church's arithmetic is impeccable, and impeccably in its own favor."
  ova_hero.3.f: "Faith, it turns out, keeps excellent books."
  ova_hero.3.a: "Sign where indicated."
  # --- .20 To Slay a Demon Lord
  ova_hero.20.t: "To Slay a Demon Lord"
  ova_hero.20.d: "Our Hero cuts through the war-camp's outer lines and finds the Uniter himself waiting, almost as if invited. Steel meets something older than steel. The Demon Lord falls, wounded, not dead but bleeding, and the tribes he welded together watch him bleed."
  ova_hero.20.f: "Every legend needs a monster at the end of the road. This one bled like anyone else."
  ova_hero.20.a: "Press the advantage, then withdraw."
  # --- .21 A Martyr's Crown
  ova_hero.21.t: "A Martyr's Crown"
  ova_hero.21.d: "The retreat needed a rearguard, and the rearguard needed to hold rather longer than one person can hold anything. Our Hero bought the time. It cost everything they had left to spend."
  ova_hero.21.f: "The songs will say it was glorious. The songs are not the ones who watched it happen."
  ova_hero.21.a: "Grieve, and let the Church make of it what it will."
  # --- .22 The Shattering
  ova_hero.22.t: "The Shattering"
  ova_hero.22.d: "The Uniter is dead by our Hero's hand, and with him dies the one thing holding horned, winged, and shadow tribes to a single throne. Within weeks the young empire is six empires, each nursing its own grievance and its own crown."
  ova_hero.22.f: "It took one warlord a lifetime to raise this house. It took one sword-stroke to knock out the load-bearing wall."
  ova_hero.22.a: "Let the pieces fall where they may."
  # --- .23 The Freed Captives
  ova_hero.23.t: "The Freed Captives"
  ova_hero.23.d: "Long caravans wind home from the border, full of people who had stopped expecting to see it again. Our Hero rode with them the whole way, apparently unable to leave well enough alone."
  ova_hero.23.f: "A rescue is a much simpler story than a war. People prefer simple stories."
  ova_hero.23.a: "Welcome them home."
  # --- .24 They Pray as We Do
  ova_hero.24.t: "They Pray as We Do"
  ova_hero.24.d: "Our Hero's field dispatches describe something the Church would rather not have described: demon villagers at prayer, hands lifted to the same Goddess of Light, under a different name, in a different tongue. It is, on paper, an awkward heresy to be fighting."
  ova_hero.24.f: "Faith does not stop at a border just because an army does."
  ova_hero.24.a: "Quietly suppress the dispatch."
  ova_hero.24.b: "Let it circulate."
  # --- .35-.36 Victoria chapter openers (academy letter, the wall)
  ova_hero.35.t: "A Letter of Admission"
  ova_hero.35.d: "The Champion Hall is barely roofed when it arrives with the morning post, heavy cream paper and the Academy's seal in white wax: Saint Christine's is pleased to offer a place to the Hero of Lysna, four years, tuition waived, attendance rather firmly expected. Victoria reads it twice. A school. An actual school, with terms and a uniform and, presumably, homework. She is horrified to discover that some homesick part of her is delighted."
  ova_hero.35.f: "She crossed an entire world and the world handed her an enrollment form."
  ova_hero.35.a: "Well. She did always test well."
  ova_hero.36.t: "The Wall"
  ova_hero.36.d: "A year out of the Academy, and she has hit the thing every graduate hits. The school taught her the forms, and the forms have stopped being enough: she trains alone at dawn and finishes exactly as strong as she started. Her old drill-mistress puts it plainly over tea. Talent carried you here. Hours carry you further, and hours cost money: masters, sparring partners, a yard that does not close at dusk. The crown could fund such a program tomorrow, if the crown were so inclined."
  ova_hero.36.f: "The difference between a prodigy and a master is roughly ten thousand very boring mornings."
  ova_hero.36.a: "Speak to the treasury about an intensive regimen."
  # --- .40-.42 LUX church flavor
  ova_hero.40.t: "The Martyr's Offering"
  ova_hero.40.d: "A martyred Hero is the best sermon the Church has preached in a generation, and the collection plates come back heavier than anyone expected. Grief, properly staged, is remarkably good for business."
  ova_hero.40.f: "The Church mourns beautifully, and profitably, and mostly at the same time."
  ova_hero.40.a: "Let the faithful give."
  ova_hero.41.t: "The Council of Reliquaries"
  ova_hero.41.d: "The Church's curators want to know what to do with a Hero who is, inconveniently, still alive: canonize the living ahead of schedule, or simply sell relics of the war to pilgrims who cannot tell the genuine article from a good forgery."
  ova_hero.41.f: "Sainthood, like everything else the Church touches, turns out to be a matter of inventory."
  ova_hero.41.a: "Canonize the living Heroes."
  ova_hero.41.b: "License the relic trade."
  ova_hero.42.t: "A Wavering Shield"
  ova_hero.42.d: "One of the crowned heads bound to our banner has been heard, quietly, using the word 'peace.' Left unaddressed, the word tends to spread."
  ova_hero.42.f: "A crusade held together by fear of demons needs, above all, an unbroken supply of fear."
  ova_hero.42.a: "Subsidize their zeal."
  ova_hero.42.b: "Threaten the anathema."
  # ===================== Victoria's arc =====================
  # --- .50 A Kettle in Another World (chapter 1)
  ova_hero.50.t: "A Kettle in Another World"
  ova_hero.50.d: "The palace has spared no effort making Victoria feel at home, which mostly means guessing wrong in earnest, expensive ways. She misses the small things most: the ordinary miracle of a telephone that reaches whom you dialed, a kettle that whistles without a fire-imp in it, an evening with nothing expected of her. Tonight, at least, she has the kettle. She thanks the staff, and means it."
  ova_hero.50.f: "Home, it turns out, is mostly made of small conveniences you never noticed until a whole world stood between you and them."
  ova_hero.50.a: "Let her have the evening."
  ova_hero.50.b: "Training starts at dawn."
  # --- .51 Hero of the Hour (chapter 1)
  ova_hero.51.t: "Hero of the Hour"
  ova_hero.51.d: "The printers cannot keep up. Every serial in the capital wants its own account of the girl from nowhere, and where the facts run short, invention fills the gap admirably. Victoria reads one and does not recognize herself in it at all."
  ova_hero.51.f: "She stopped one runaway rail-cart in the market. By the third printing it was a dragon."
  ova_hero.51.a: "Let the serials print what they like."
  ova_hero.51.b: "She trains until the stories are true."
  # --- .52 Across the Scarred Line (chapter 4)
  ova_hero.52.t: "Across the Scarred Line"
  ova_hero.52.d: "Victoria crosses into the dusk country for the first time, and it is not the blasted hellscape the sermons promised. The trees are scarlet to the last leaf, the rivers run a deep glass-red, and in between there are farms, and mills, and the shell of a small school with a patchwork doll dropped in the doorway, small and stitched by hand and clearly loved."
  ova_hero.52.f: "The demons, she notes, have children too. This bothers her more than it should."
  ova_hero.52.a: "Leave it behind."
  ova_hero.52.b: "Pick up the doll."
  # --- .53 The Girl with the Grey Wings (chapter 4)
  ova_hero.53.t: "The Girl with the Grey Wings"
  ova_hero.53.d: "In the smoke of a skirmish that neither side wanted, Victoria comes face to face with a winged demon her own age: grey feathers, a scholar's ink-stained fingers, a sword she plainly does not enjoy holding. For one long moment neither of them attacks. Then the winged girl inclines her head, the way you greet a stranger you have decided not to kill, and is gone over the rooftops."
  ova_hero.53.f: "She had been told the winged ones were monsters. This one bowed."
  ova_hero.53.a: "Say nothing of it in the official dispatch."
  ova_hero.53.b: "Report the encounter honestly."
  # --- .54 The Veterans Ward (chapter 5, Renown 20 opens the doors)
  ova_hero.54.t: "The Veterans Ward"
  ova_hero.54.d: "Victoria visits the maimed of the demon war and cannot stop thinking, the whole walk home, of everything they would have had back in her world: clean prosthetics, a proper pension, physicians who knew what they were doing. Here they get a cot and a chaplain, and the chaplain is billing the crown."
  ova_hero.54.f: "She never used to think about hospitals. Now she cannot stop."
  ova_hero.54.a: "Fund a modern ward."
  ova_hero.54.b: "The crown cannot afford sentiment."
  # --- .55 The Ledger of Light (chapter 5)
  ova_hero.55.t: "The Ledger of Light"
  ova_hero.55.d: "By accident more than design, Victoria finds the Church's invoice book: summonings billed per soul rescued, blessings billed per regiment blessed, and, tucked in the back, a map of the front annotated in a careful, patient hand, marking which stalemates are worth keeping warm a little longer."
  ova_hero.55.d_doubt: "She already suspected as much, after that dispatch about the praying villages. Now she has the ledger in her own hands, and the numbers are worse than the suspicion. Someone is keeping the war warm on purpose, and writing down the price of it in a very tidy column."
  ova_hero.55.f: "She says nothing. Yet."
  ova_hero.55.a: "Close the book. Remember the page."
  # --- .56 The Girl on the Ridge (chapter 6: the friendship deepens)
  ova_hero.56.t: "The Girl on the Ridge"
  ova_hero.56.d: "Another campaign, another crossing of the scarred line, and this time Victoria does not have to be surprised: the girl with the grey wings is waiting on the ridge above the camp, as if the two of them had made an appointment neither would admit to. They share the ridge, a skin of sour demon tea, and an hour of complaints about their respective superiors. It is the easiest hour Victoria has spent since she fell into this world. A winged village below sings its evening hymn, and it is the Church's own tune, or the Church's is theirs; her friend hums the second harmony without thinking about it."
  ova_hero.56.f: "Somewhere between the second meeting and the fifth, an enemy becomes a person, and a person becomes a friend."
  ova_hero.56.a: "Stay until the hymn ends."
  ova_hero.56.b: "Duty first; slip away early."
  # --- .57 A Name Given Freely (chapter 6)
  ova_hero.57.t: "A Name Given Freely"
  ova_hero.57.d: "They meet again at the edge of a winged village, deliberately now, the pretense of coincidence long worn through. They talk for an hour like the young people they are, about books and bad rations and how strange it is to be a symbol, and they laugh at the same joke at the same moment, which frightens both of them a little. Before she leaves, the winged girl gives Victoria her name, freely, the way you give it to a friend and not to an enemy."
  ova_hero.57.f: "A name is the first thing a war takes from you, and the last thing it gives back."
  ova_hero.57.a: "Nice to meet you, Aurelia."
  # --- .58 The Midnight Archive (chapter 7, from the archive button)
  ova_hero.58.t: "The Midnight Archive"
  ova_hero.58.d: "The archivist has been paid, and paid well, to be somewhere else tonight. Victoria goes down alone into the room where the Church keeps its first editions, the books written before the copyists came through with their careful corrections. She lights a single candle. She begins to read."
  ova_hero.58.f: "Every institution keeps two histories: the one it prints, and the one it locks in the cellar."
  ova_hero.58.a: "Keep reading."
  # --- .59 The Amended Word (chapter 7)
  ova_hero.59.t: "The Amended Word"
  ova_hero.59.d: "The old lector she found, defrocked years ago and glad of the wine money, returns her rubbings with his translation pinned to the front page. In the first books the winged people are not demons at all. They are angels, the Goddess' own messengers, who carried Her word when the world was young. Edition by edition the word dims: messengers, then spirits, then winged strangers, and at last, in type Victoria can read without any help, demons. Nobody signed the change. Nobody had to."
  ova_hero.59.f: "No single hand rewrote the word. Eighteen centuries of copyists each leaned on it a little, and one day it fell over."
  ova_hero.59.a: "Hide the translation inside her coat."
  ova_hero.59.b: "Copy it out, and return the originals."
  # --- .70 A Parley Behind the Lines (chapter 8: campaigning again)
  ova_hero.70.t: "A Parley Behind the Lines"
  ova_hero.70.d: "Another expedition, another season of burned bridges and running skirmishes in the dusk country, her columns pressing the marches under the crusade's banner, and this time the war itself blinks first: a winged herald descends on the camp under a truce-feather and conducts Victoria, alone, to a commandeered manor where half the Obsidian Court has assembled to look at her. It is not an embassy. There were no letters, no concessions, no protocol anyone agreed to. It is simply that the enemy's court has decided it would rather meet the girl the sermons call their doom than keep guessing, and every courtier in the hall is watching to see how low she bows."
  ova_hero.70.f: "Diplomacy is mostly deciding, very fast, exactly how low to bow. Doing it in a war zone does not slow the deciding down."
  ova_hero.70.a: "Bow as low as she would to her own king."
  ova_hero.70.b: "Keep the Church's forms, and let them notice."
  # --- .71 Flight-Songs (chapter 8)
  ova_hero.71.t: "Flight-Songs"
  ova_hero.71.d: "The winged folk sing as they fly, Victoria learns on campaign, whole ballads passed wing to wing above the burned rooftops, in a tongue the Church calls the speech of demons. Between engagements, her friend of the grey wings teaches her the second verse of one, which is about a lost country and a promise to return to it. Victoria learns it by heart, marching through the very country the song is about. She does not tell the Church."
  ova_hero.71.f: "You cannot hate a people once you have learned their songs. That, perhaps, is why the Church forbade them."
  ova_hero.71.a: "Learn the second verse by heart."
  # --- .72 An Invitation Written in Feathers (chapter 8)
  ova_hero.72.t: "An Invitation Written in Feathers"
  ova_hero.72.d: "It finds her between campaigns, the marches still smoking behind her, on grey paper sealed with a single feather: an invitation, in the winged girl's own careful hand, to the one place beneath the Obsidian Court no human has ever been allowed. She signs it not with the title Victoria half-expected, but with her name, Aurelia, offering to show a friend the truth of her people."
  ova_hero.72.f: "The Demon King's daughter, it turns out, would rather have a friend than a hostage."
  ova_hero.72.a: "Of course she will go."
  # --- .73 The Vault of Feathers (chapter 9, from the vault button)
  ova_hero.73.t: "The Vault of Feathers"
  ova_hero.73.d: "The vault is older than the empire, older than the war, older than the word 'demon' ever meant them. Its walls are covered floor to ceiling in names, and beneath each name a single grey feather, and there are so many names. Aurelia takes Victoria's hand and begins, quietly, at the very beginning, the way you tell a story to someone you have decided to trust with all of it."
  ova_hero.73.f: "Some rooms you do not walk out of the same person you walked into."
  ova_hero.73.a: "Read every name on the wall."
  # --- .74 What the Feathers Held (chapter 9)
  ova_hero.74.t: "What the Feathers Held"
  ova_hero.74.d: "It is all one story, and it is older than the Church. The Goddess fought the gods from Outside, and the sword-stroke that ended the war split the continent in two, raised mountains, drowned the plains beneath a new sea, and left the old country cursed red; the year the world counts from is the year of that stroke. The curse made the horned and shadow folk out of human tribes. The winged people it never touched, because they were never human: they were Her angels, and it was the angels who led the unmarked survivors across the water to the one isle the Goddess could still make live, Her last miracle before She slept. And it was the angels whom the isle's first kings, grown fat and frightened of sharing, killed and imprisoned to the last, so that no one could contradict the Church they built over the deed. The Goddess sleeps. She never saw it. Eighteen centuries of careful editions turned Her missing messengers into demons, and now that the curse has thinned and the red land is worth taking, the Church has printed the old lie in fresh ink and called it a crusade. Every feather on this wall is a name the word buried. Aurelia does not weep as she tells it. She has had longer to grieve."
  ova_hero.74.f: "The Church did not inherit the light. It buried the ones who carried it, and kept the name."
  ova_hero.74.a: "Grief first. The rest can wait a night."
  # --- .75 The Hour of the Hero (THE choice, 60 days after the vault)
  ova_hero.75.t: "The Hour of the Hero"
  ova_hero.75.d: "Sixty days since the vault, and Victoria has spent every one of them deciding. She could tell the world the truth and raise her own banner over the marches: a new nation of humans and winged folk, torn free of the empire that summoned her, with the Demonic Empire sworn at its back, and the old crown, with the Church's blessing and the Church's coin, coming to take it all back by war. Or she could close the vault behind her, keep the peace the empire pays for, and let the war go on being profitable for everyone who is not dying in it. The girl from another world has one choice left, and it was always going to be hers."
  ova_hero.75.f: "A sword can be swung in almost any direction. Someone has to decide which. Tonight, it is her."
  ova_hero.75.a: "RAISE THE DAWN. She takes the marches, and the war of the dawn begins."
  ova_hero.75.b: "KEEP THE EMPIRE. Bury the truth, and finish the crusade."
  # --- .76 The Dawn Proclamation (rebellion epilogue, on the Concord Aurorae)
  ova_hero.76.t: "The Dawn Proclamation"
  ova_hero.76.d: "She says it from the wall of a march town, in plain words, with Aurelia standing beside her and not one weapon between them: the winged people are no demons, the crusade is a theft with a blessing on it, and this land will have no more part in it. The marches cheer her. The old capital, far to the west, reaches for the imperial flag and starts loading the guns. Both halves of the sundered realm, at least, are finally awake."
  ova_hero.76.f: "It is a very small wall, and a very large truth, and somehow it fits."
  ova_hero.76.a: "Let the dawn break where it will."
  # --- .77 The Longest War (empire epilogue)
  ova_hero.77.t: "The Longest War"
  ova_hero.77.d: "She closes the vault. She goes home. She tells the Church the audience yielded nothing, and it believes her, because a Hero who keeps fighting is worth more than one who asks questions. The war goes on. Victoria is very good at it now, and she has learned to sleep through the part of the night where she used to lie awake. The lie is comfortable. That is rather the whole problem with it."
  ova_hero.77.f: "The hardest thing she ever carried was a truth she chose to put back down."
  ova_hero.77.a: "The crusade endures, and so does she."
  # --- .78 The Hero Is Dead (fail: Victoria has fallen)
  ova_hero.78.t: "The Hero Is Dead"
  ova_hero.78.d: "Against every expectation, and every precaution, Victoria will not be coming home, to this world or any other. The capital drapes itself in mourning-black, and for a little while the war itself seems almost beside the point."
  ova_hero.78.f: "She found the trains on her first day here. Nobody ever did get around to letting her ride one for pleasure."
  ova_hero.78.a: "A state funeral, fit for a saint."
  ova_hero.78.b: "Let her legend outlive her, whatever it costs."
  # --- .79 A Story Cut Short (fail: the Empire fell first)
  ova_hero.79.t: "A Story Cut Short"
  ova_hero.79.d: "The Demonic Empire is gone before Victoria could finish learning what it was, folded up by other hands for other reasons. Her questions have no one left to answer them, and the vault, wherever it stood, belongs to someone else now. She keeps the second verse of the flight-song anyway. Someone should."
  ova_hero.79.f: "History rarely waits for one girl to understand it."
  ova_hero.79.a: "Carry what she learned, and go on."
  # --- .80 The Veil Torn (LUX)
  ova_hero.80.t: "The Veil Torn"
  ova_hero.80.d: "The truth is loose, printed on cheap paper and shouted from a balcony, and the Church of the Goddess must decide, very quickly, what a lie eighteen centuries old is worth defending. The archives can still be burned. The word can still be denied. But denial, once, was so much easier when no one had the first editions in their hands."
  ova_hero.80.f: "The most dangerous thing to any Church is a reader who reached the footnotes."
  ova_hero.80.a: "Deny everything."
  ova_hero.80.b: "Burn the remaining archives."
  # --- .81 Those Who Left and Those Who Stayed (dawn 1)
  ova_hero.81.t: "Those Who Left and Those Who Stayed"
  ova_hero.81.d: "Not everyone in the army can stomach the new dawn, and not everyone in the loyalist ranks can stomach the old lie. Soldiers are crossing the lines in both directions, some to fight for Victoria's truth, some to defend the crown they swore to. The new nation must decide how to treat the ones who wish to leave."
  ova_hero.81.f: "A civil war is the only kind where both sides speak the same language and mean opposite things by it."
  ova_hero.81.a: "Open the gates for anyone who wishes to leave."
  ova_hero.81.b: "Deserters forfeit their commissions and their pensions."
  # --- .82 The Old Flag in the Streets (dawn 1)
  ova_hero.82.t: "The Old Flag in the Streets"
  ova_hero.82.d: "The imperial banner still flies from windows in the march towns, hung by people who would rather have the comfortable empire back than a truth that costs this much. They are not soldiers. They are shopkeepers and clerks and grandmothers, and they are frightened, and the guard is asking whether it should clear the square."
  ova_hero.82.f: "You can win a war and still lose the neighbor who used to wave good morning."
  ova_hero.82.a: "Clear the square, gently."
  ova_hero.82.b: "Let them march until their feet get tired."
  # --- .83 The Winged Legion (dawn 1)
  ova_hero.83.t: "The Winged Legion"
  ova_hero.83.d: "They come down out of the dusk country in their thousands, grey wings against a grey sky: winged volunteers, sworn to the dawn Victoria proclaimed, offering to stand in the line of battle beside human soldiers who spent their whole lives being taught to shoot at exactly this silhouette. It will take some getting used to. It always does."
  ova_hero.83.f: "The first joint patrol marches in nervous silence. The second one, someone tells a joke."
  ova_hero.83.a: "Welcome them into the line of battle."
  # --- .84 The Schoolhouse Door (dawn 2)
  ova_hero.84.t: "The Schoolhouse Door"
  ova_hero.84.d: "A winged family enrolls its children in a capital school, and the question that seemed abstract in the proclamation becomes very concrete at a classroom door: do the two peoples learn together, or is there a separate bench at the back, for now, just until everyone is comfortable? Everyone is never quite comfortable. That is what 'for now' always means."
  ova_hero.84.f: "Reconciliation is a grand word for a great many very small, very stubborn doors."
  ova_hero.84.a: "The door stays open, and the law says so."
  ova_hero.84.b: "Separate benches, for now."
  # --- .85 Feathers in the Market (dawn 2)
  ova_hero.85.t: "Feathers in the Market"
  ova_hero.85.d: "Winged traders have begun selling in the capital markets, and not everyone is pleased to see them prosper. A stall is overturned; a scuffle nearly becomes something worse. The city guard wants to know whose peace it is protecting, and whether it protects every stall in the market or only the ones with the right number of arms."
  ova_hero.85.f: "Old hatred does not die when the truth comes out. It just loses its excuse, and gets meaner about it."
  ova_hero.85.a: "The guard protects every stall, or none."
  ova_hero.85.b: "Advise the winged traders to keep away a while."
  # --- .86 Two Uniforms, One Line (dawn 2)
  ova_hero.86.t: "Two Uniforms, One Line"
  ova_hero.86.d: "A year into the dawn, a human sergeant and a winged corporal share a watch-fire on the loyalist front and discover, to their mutual annoyance, that they get along. It is a small thing. It is also, the officers agree, the whole war in miniature, and the only part of it going right."
  ova_hero.86.f: "Nations are held together at the top by treaties, and at the bottom by two soldiers sharing a fire."
  ova_hero.86.a: "This is how a nation is actually made."
  # --- .87 The World Watches (dawn 3)
  ova_hero.87.t: "The World Watches"
  ova_hero.87.d: "The foreign courts, which spent years paying the Church to fear the demons, are watching the dawn with great interest and enormous embarrassment. Some of them would like very much to pretend they always suspected the truth. The new nation can be gracious about this, and gain friends, or it can remind them exactly what they funded."
  ova_hero.87.f: "Nothing makes a former enemy friendlier than a secret you have both agreed to forget."
  ova_hero.87.a: "Be gracious, and gather friends."
  # --- .88 A Letter, Wing-Sealed (dawn 3)
  ova_hero.88.t: "A Letter, Wing-Sealed"
  ova_hero.88.d: "It comes on grey paper, sealed with a single feather, in a hand Victoria knows very well: Aurelia, writing not as a demon or a princess but as a friend, to say that the dusk country and the dawn will keep faith, and that there is a second verse she still owes her. The war their fathers' fathers started is, at last, no longer theirs to fight."
  ova_hero.88.f: "Two girls from opposite ends of a lie, keeping a peace neither of them was supposed to be allowed."
  ova_hero.88.a: "Write back, and mean it."
  # --- .89 A Nation of Two Peoples (dawn 3 epilogue)
  ova_hero.89.t: "A Nation of Two Peoples"
  ova_hero.89.d: "It is not a fairy tale, and it did not end like one. There are still hard words in the market and hard laws to unwrite, and Victoria still misses telephones that reach whom you dialed. But there is a nation now, human and winged both, that the whole world has had to learn to take seriously, and a girl from another world who decided a Hero was for telling the truth. The kettle, at last, whistles all on its own."
  ova_hero.89.f: "She never did find her way home. She built something worth staying for instead."
  ova_hero.89.a: "Let the dawn keep."
  # ===================== DEM home front =====================
  # --- .60 The Warlord's Peace
  ova_hero.60.t: "The Warlord's Peace"
  ova_hero.60.d: "The Uniter addresses the assembled tribes from the steps of a captured keep. Eighteen centuries ago the sundering stroke split the world and a parting curse turned this land red; the peoples it remade were named demons by everyone who never had to live here. The marches were demon land before they were anyone's colony, he says, and demon land they will be again. The horned, winged, and shadow chiefs, for once, do not argue with him."
  ova_hero.60.f: "A young empire needs a war it can win, or at least a war it can survive losing together."
  ova_hero.60.a: "Iron discipline. No excuses, no exceptions."
  ova_hero.60.b: "Soften the levies. The tribes have given enough."
  # --- .61 The Envoy Returns Empty-Handed
  ova_hero.61.t: "The Envoy Returns Empty-Handed"
  ova_hero.61.d: "The peace feeler sent quietly to the Church comes back unopened, the seal unbroken, the courier politely but firmly turned around at the border. The letter offered proof, hymns and rites older than the Church itself, that the tribes pray to the same Goddess. Perhaps that is exactly why no one on Insula Luce dared open it."
  ova_hero.61.f: "You cannot negotiate with someone who profits from the war continuing."
  ova_hero.61.a: "Then we endure."
  ova_hero.61.b: "Publish the rejected letter. Let the world see who refuses peace."
  # --- .62 Speeches at the Scarred Border
  ova_hero.62.t: "Speeches at the Scarred Border"
  ova_hero.62.d: "Part of the homeland is still in foreign hands, and the border has not held still: every season some crusading crown's champion bites another hill, another valley, off the edge of the map. The Uniter's lieutenants make sure every village along the scarred border hears, again, exactly whose land this used to be, and how much less of it there is this year."
  ova_hero.62.f: "A grievance kept fresh is worth an army."
  ova_hero.62.a: "Let the speeches continue."
  # --- .63 We Pray to Her Too
  ova_hero.63.t: "We Pray to Her Too"
  ova_hero.63.d: "Under a broken moon, in villages the war has not yet reached, demon congregations sing hymns to the Goddess of Light: the same Goddess the Church claims exclusively as its own, in verses that were old before the Church was founded. The winged folk carried Her word once. The scholars who copy the hymns down now are careful to note which lines the Church's printed editions no longer contain."
  ova_hero.63.f: "Heresy is so often just faith that arrived from the wrong direction."
  ova_hero.63.a: "Proclaim it to the world."
  ova_hero.63.b: "Keep the faith quiet, for now."
  # --- .64 Shadows of the Hero
  ova_hero.64.t: "Shadows of the Hero"
  ova_hero.64.d: "A foreign Hero walks our hills, and word of it runs faster than the Hero does. Villages empty out at dusk on rumor alone; farmers who have never seen a summoned champion in their lives are suddenly certain they have. And where an expedition has actually passed, the rumor is the kinder version: the people creep back to find the boundary stones moved and their fields on the wrong side of somebody else's border."
  ova_hero.64.f: "Fear does not need to see the monster. It only needs to hear the story."
  ova_hero.64.a: "There is nothing for it but to endure."

  ova_hero.65.t: "Human Faces"
  ova_hero.65.d: "The Altans have farmed the dry east of the empire since before the curse receded; they are the humans the sundering never changed, and they kept the Goddess' oldest rites while the far shore was still rewriting its own. None of that matters to a city that buried sons this spring. The crusaders wear human faces, and so do the grocers on Altan Row, and someone has painted a white sunburst on every door on the street."
  ova_hero.65.f: "It is a strange empire that can forgive the sword and not the face that resembles it."
  ova_hero.65.a: "The compact covers every tribe. Post the guard on Altan Row."
  ova_hero.65.b: "The guard has other duties. Doors can be repainted."

  ova_hero.66.t: "The Spared and the Changed"
  ova_hero.66.d: "In the drinking halls the old poison is going around again: that when the curse fell, the horned and the shadow folk paid for everyone, and the winged folk floated above it untouched, pretty as saints. That they were the Goddess' favorites then and think themselves favorites still. The winged elders answer, quietly, that their people carried Her word and were butchered for it on a far island, and that no one who envies them their feathers has offered to share that part."
  ova_hero.66.f: "The curse fell on everyone. The argument about who it fell on hardest may outlast the empire."
  ova_hero.66.a: "The Uniter shames the agitators himself, in the open hall."
  ova_hero.66.b: "Old scorn is not worth a decree. Let it burn out."

  ova_hero.67.t: "Tribute of the Dusk Forests"
  ova_hero.67.d: "The dark elves of Yolteni pay their tribute on time, field their levies on time, and are seated below every horned chieftain at every imperial banquet, on the theory that a people whose only mark of the curse is the color of their skin cannot have suffered much. Their envoys have stopped protesting the seating. Their students in the capital hear 'half-cursed' from lecture-hall doorways, and have not stopped hearing it."
  ova_hero.67.f: "An empire assembled from grievances should know better than to issue new ones."
  ova_hero.67.a: "Seat the envoys of Yolteni above the salt."
  ova_hero.67.b: "The forests can wait their turn. The war cannot."

  ova_hero.68.t: "The Altan Regiments"
  ova_hero.68.d: "A petition arrives bearing four hundred Altan signatures: they were born in this empire, they pray to the same Goddess its tribes do, and they wish to defend it in uniform against the crusade fought in their shape. Half the general staff calls it the cheapest loyalty the throne will ever be offered. The other half asks, flatly, what happens the first time an Altan company is ordered to fire on human crusaders, and whether anyone wishes to be standing behind them when it is answered."
  ova_hero.68.f: "Trust is the one weapon that must be issued before it can be proven."
  ova_hero.68.a: "Arm them under the empire's banner."
  ova_hero.68.b: "Shovels, not spears. Their war is the harvest."

  ova_hero.69.t: "Ash on Someone Else's Doorstep"
  ova_hero.69.d: "The carts come down from the seized hills with everything a village can carry when a champion's expedition gives it a day to leave. The refugees are billeted where there is room, and where there is room is the Altan quarter. By the second week the broken windows are no longer accidents; a woman who lost her orchard to humans stands in the street demanding to know why humans still have shops."
  ova_hero.69.f: "Grief is obedient. It goes wherever it is pointed, and it is so rarely pointed at the far shore."
  ova_hero.69.a: "Billet the refugees at the crown's expense, and post the guard in the quarter."
  ova_hero.69.b: "Grief must go somewhere. Look away."
  # ============ .90-.109 Victoria's arc, the drip-feed beats ============
  # --- .90 The Hall Rises (chapter 1)
  ova_hero.90.t: "The Hall Rises"
  ova_hero.90.d: "They are building her a house. Not a house to live in: a Champion Hall, with a training yard and a library and an office whose entire purpose is to make her more famous. Victoria stands in the mud watching the masons haul stone for a building that exists because of her, and cannot decide whether to be proud or to sink into the earth. She settles on helping carry things, which the foreman finds deeply inconvenient."
  ova_hero.90.f: "Back home the greatest honor she had ever received was a certificate for punctuality."
  ova_hero.90.a: "Let her lay the first stone herself."
  ova_hero.90.b: "Let her hide in the half-built library."
  # --- .91 Three Wings and a Ledger (chapter 1)
  ova_hero.91.t: "Three Wings and a Ledger"
  ova_hero.91.d: "The stewards have been arguing for a month about what the hall is actually for. The generals want a training yard and nothing else. The scholars want the library doubled. The heralds want a patronage office, because a Hero nobody has heard of is, they explain patiently, a very expensive statue. All three are standing in the doorway with estimates. Victoria, who was not invited to the meeting, is listening from the stairs."
  ova_hero.91.f: "Every institution begins as three people disagreeing about a budget."
  ova_hero.91.a: "All three wings, and hang the cost."
  ova_hero.91.b: "Ask the girl what her own house is for."
  # --- .92 The Dormitory (chapter 2, academy year one)
  ova_hero.92.t: "The Dormitory"
  ova_hero.92.d: "Four beds, one draughty window, and three other first-years who were extremely prepared to resent the famous summoned Hero and have failed at it within a fortnight. They trade contraband biscuits and complaints about the doctrine master. Nobody in this room wants anything from her. Victoria had forgotten what that felt like."
  ova_hero.92.f: "It is the first night since she arrived in this world that she falls asleep without meaning to."
  ova_hero.92.a: "Sit up half the night talking."
  ova_hero.92.b: "Lights out. There is drill at six."
  # --- .93 A Letter That Cannot Be Posted (chapter 2, academy year two)
  ova_hero.93.t: "A Letter That Cannot Be Posted"
  ova_hero.93.d: "The composition master sets an exercise: a letter home. Victoria stares at the blank sheet for an hour. There is no address. There is no post. There is no road, no ship, no bird that goes where she means to send it. She writes it anyway, four pages, mostly about the food and a boy called Aldric who cannot hold a sword properly, and signs it, and has nowhere on earth to put it."
  ova_hero.93.f: "Dear Mum. The demons are not what they said. The tea is dreadful. I think I am all right."
  ova_hero.93.a: "She finishes it, and keeps it in her trunk."
  ova_hero.93.b: "She reads it aloud to the dormitory."
  # --- .94 The Doctrine Essay (chapter 2, academy year three)
  ova_hero.94.t: "The Doctrine Essay"
  ova_hero.94.d: "Third-year examinations, and the question is printed in the Church's own confident type: #i Explain why the winged heretics cannot be reasoned with.#! Victoria reads it four times. She has never met a winged heretic. Neither has the proctor. Neither, she would bet the term's allowance, has the man who wrote the rubric. She knows exactly the answer it wants, and she could write it in her sleep; what keeps her pen still is the certainty, the way the question arrives with its own answer already inside it."
  ova_hero.94.f: "The trouble with teaching a clever girl to argue is that she does not stop when she reaches your conclusions."
  ova_hero.94.a: "Write what the faculty wants to read."
  ova_hero.94.b: "Write what she actually thinks."
  # --- .95 The Final Practicum (chapter 2, academy year four)
  ova_hero.95.t: "The Final Practicum"
  ova_hero.95.d: "The last year ends in the field: a column of students marched into the hills to hunt something that has been eating shepherds, with the faculty watching from a comfortable distance and grading. Victoria is the obvious choice to lead. She is also watching Aldric, who has spent four years being the worst swordsman in the year and the only one who ever checks whether the others ate."
  ova_hero.95.f: "The rubric measures the wrong thing. It usually does."
  ova_hero.95.a: "Lead the column, as the rubric requires."
  ova_hero.95.b: "Let the nervous boy lead it."
  # --- .96 Ten Thousand Mornings (chapter 3)
  ova_hero.96.t: "Ten Thousand Mornings"
  ova_hero.96.d: "Another year, and the drill-mistress's report says exactly what last year's said: the Hero of Lysna trains alone at dawn, works very hard, and has not improved by a hair. She has out-grown practice. What she needs now is the expensive kind of training: masters who charge by the month, partners who can actually push her, a yard that stays lit after dusk. It is all sitting in a treasury proposal that nobody has signed."
  ova_hero.96.f: "Talent gets you to the wall. Only money and mornings get you over it."
  ova_hero.96.a: "The proposal is still on the desk."
  # --- .97 The Quiet Villages (chapter 4)
  ova_hero.97.t: "The Quiet Villages"
  ova_hero.97.d: "A week deeper into the dusk country, and the war refuses to look like the sermons. There are hamlets with washing on the lines and children who run when the column passes, exactly the way children run at home. There is a schoolhouse. There is a war memorial, and the names on it are as long as the ones in Lysna. Victoria's officers do not comment. Victoria writes it all down."
  ova_hero.97.f: "The enemy has a schoolhouse. Nobody mentioned the schoolhouse."
  ova_hero.97.a: "Write down what she actually sees."
  ova_hero.97.b: "File the dispatch the Church expects."
  # --- .98 A Face in the Smoke (chapter 4)
  ova_hero.98.t: "A Face in the Smoke"
  ova_hero.98.d: "A burning granary, a column of refugees, and somewhere above the smoke a shape with grey wings shepherding them out. Victoria has the shot. The doctrine is unambiguous, the range is nothing, and she is very, very good now. The winged figure sees her, and does not flee, and does not attack: it simply keeps herding frightened farmers toward the treeline, trusting a stranger with a sword not to be what the stories promised."
  ova_hero.98.f: "It is not mercy, exactly. It is the refusal to be told what she is."
  ova_hero.98.a: "Let the column go."
  ova_hero.98.b: "Do her duty, and not sleep after it."
  # --- .99 The Cot by the Window (chapter 5)
  ova_hero.99.t: "The Cot by the Window"
  ova_hero.99.d: "He is fourteen, and he lost both legs at the Bladewaste crossing to an enemy he never saw. He is delighted to meet the famous Hero and apologizes for not standing. He asks whether it is true that she came from another world, and whether they have wars there too. Victoria says yes. He says, well, that is a pity, and offers her half his biscuit."
  ova_hero.99.f: "She had wanted him to be angry. It would have been so much easier if he were angry."
  ova_hero.99.a: "Sit with him until the end of visiting hours."
  ova_hero.99.b: "Ask him who signed his discharge papers."
  # --- .100 The Quartermaster's Arithmetic (chapter 5)
  ova_hero.100.t: "The Quartermaster's Arithmetic"
  ova_hero.100.d: "Chasing the discharge papers leads her, three offices later, to a bored quartermaster and a column of figures. Blessed bandages: purchased from the Church at four times the price of ordinary bandages, because ordinary bandages are not blessed. Consecrated rations. Indulgences, per regiment, per season. The quartermaster does not think any of this is a scandal. The quartermaster thinks it is Tuesday."
  ova_hero.100.f: "The war is not a tragedy to everyone. To some people it is an account that settles promptly."
  ova_hero.100.a: "Copy the column into her own notebook."
  ova_hero.100.b: "Ask him, to his face, who profits."
  # --- .101 The Shared Ration (chapter 6)
  ova_hero.101.t: "The Shared Ration"
  ova_hero.101.d: "The third meeting on the ridge, and neither of them pretends to be surprised any more. The winged girl brings something grey and unidentifiable that she swears is a delicacy. Victoria brings army biscuit, which is a war crime in any world. They trade, they both regret it, and they spend twenty minutes arguing about whose army feeds its soldiers worse. It is not diplomacy. It is much more dangerous than diplomacy."
  ova_hero.101.f: "You can hold a line against an enemy. It is remarkably hard to hold one against someone who makes you laugh."
  ova_hero.101.a: "Split the ration. Argue about the better half."
  # --- .102 What the Ridge Knows (chapter 6)
  ova_hero.102.t: "What the Ridge Knows"
  ova_hero.102.d: "They have stopped counting the meetings. Tonight the winged girl talks about her father, who is a warlord and also, inconveniently, a man who worries about her; and Victoria talks about a mother she cannot write to. Neither of them mentions the war until the very end, when the winged girl says, quietly, that her people have a word for what the two of them are doing, and that the word is treason in both languages."
  ova_hero.102.f: "Two soldiers on a ridge, committing the crime of liking each other."
  ova_hero.102.a: "Neither of them reports the meeting."
  ova_hero.102.b: "Tell her officers exactly where she was."
  # --- .103 The Second Shelf (chapter 7, archive night)
  ova_hero.103.t: "The Second Shelf"
  ova_hero.103.d: "The first shelf is what she expected: sermons, ledgers, the tedious machinery of a faith that owns a great deal of property. The second shelf is older, and the spines are in a script she cannot read, and one of them has been shelved upside down for so long that the dust has settled in the wrong direction. Victoria takes it down. The candle is burning faster than she would like."
  ova_hero.103.f: "Nobody hides a book on the first shelf."
  ova_hero.103.a: "Keep going. The candle will last."
  # --- .104 The Scraped Page (chapter 7, archive night)
  ova_hero.104.t: "The Scraped Page"
  ova_hero.104.d: "It is nearly dawn when she finds the first one: a page where the vellum is thinner than its neighbors, scraped clean and written over in a newer hand. Held to the candle, the old letters swim up underneath the new ones like something at the bottom of a pond. She cannot read the script. She can count, though, and she counts eleven scraped pages in this volume alone, every one of them in the same chapter. Before the candle dies she takes rubbings of them all."
  ova_hero.104.f: "Somebody went to enormous trouble. Trouble is a kind of confession."
  ova_hero.104.a: "Find someone who can read the old script."
  # --- .105 The Herald's Escort (chapter 8)
  ova_hero.105.t: "The Herald's Escort"
  ova_hero.105.d: "The next campaign opens the way the last three did, her columns driving into the marches and the border towns emptying ahead of them; then the truce-feather comes again, before the first shot. This time the escort is smaller, and one of the winged heralds, a grizzled sergeant with a torn wing and no diplomatic training whatsoever, spends the entire ride asking Victoria blunt questions about her sword, her world, and whether human women really wear those collars by choice. She answers all three. He laughs at the third."
  ova_hero.105.f: "The court is still deciding what she is. The sergeant decided in about four minutes."
  ova_hero.105.a: "Ride with them unarmed, and let them see it."
  # --- .106 The Courtier Who Would Not Bow (chapter 8)
  ova_hero.106.t: "The Courtier Who Would Not Bow"
  ova_hero.106.d: "One of them will not have it. An old lord of the Rent Sky stands when she enters and says, loudly, that his family has buried eleven people because of women with swords and human manners, and that he will not bow to a polite one. The hall goes very still. He is not wrong. That is the difficulty: he is not wrong about a single thing he just said."
  ova_hero.106.f: "The hardest person in the room to answer is the one telling the truth about you."
  ova_hero.106.a: "Agree with him. Out loud. In front of the court."
  ova_hero.106.b: "Answer as a Hero of Lysna is expected to."
  # --- .107 A Truce for One Evening (chapter 8)
  ova_hero.107.t: "A Truce for One Evening"
  ova_hero.107.d: "It is a festival neither army planned for: a winged holy day that happens to fall while the lines are close enough to hear each other's music. Somebody starts singing. Somebody on the other side knows the tune, because of course they do, it is the same Goddess. By midnight there are human corporals and winged pikemen sharing a fire and lying about how brave they are, and not one officer on either side has the heart to stop it."
  ova_hero.107.f: "In the morning they will be enemies again. That is the part nobody can explain to a person who was there."
  ova_hero.107.a: "Keep the evening. Write none of it down."
  # --- .108 The Names on the Wall (chapter 9, in the vault)
  ova_hero.108.t: "The Names on the Wall"
  ova_hero.108.d: "Her friend does not begin with the truth. She begins with the names, because the names came first. Row after row, floor to ceiling, each one with a single grey feather beneath it, and beside each feather a date. Victoria works along the wall reading dates, and slowly understands that she is reading a timeline, and that it starts long before the war, and that the earliest dates are not battles at all."
  ova_hero.108.f: "A war has casualties. This wall starts too early to be a war."
  ova_hero.108.a: "Keep reading along the wall."
  # --- .109 The Oldest Feather (chapter 9, in the vault)
  ova_hero.109.t: "The Oldest Feather"
  ova_hero.109.d: "At the far end, alone in a case, is the oldest feather in the room, and the plaque beneath it is written in the same dead script as the scraped pages in the cathedral cellar. Her friend reads it aloud without needing to look. It is a blessing. It is the blessing the winged people once called down over the human fleets they guided across the new sea, in the first years after the sundering, and it uses a word for themselves that Victoria has read exactly once before, on a page somebody had scraped clean."
  ova_hero.109.f: "She already knows what the word is. She needs to hear a friend say it."
  ova_hero.109.a: "Ask her to say it."
  # ============ .120-.126 added beats (2026-07-17 pacing pass) ============
  # --- .120 Etiquette for Otherworlders (chapter 1)
  ova_hero.120.t: "Etiquette for Otherworlders"
  ova_hero.120.d: "The palace has assigned her a protocol tutor, a formidable widow who has drilled three generations of princesses and does not intend to be defeated by an otherworlder. Victoria learns the seven degrees of curtsey, the correct fork for river-eel, and the exact depth of bow owed to a bishop. In exchange, entirely without meaning to, she teaches the junior maids a clapping game from her old schoolyard, and by the end of the week the whole east wing is playing it."
  ova_hero.120.f: "The seven degrees of curtsey took a month. The clapping game conquered the palace in four days."
  ova_hero.120.a: "Learn the forms properly."
  ova_hero.120.b: "The maids' version of the lessons is better."
  # --- .121 Letters to the Hall (chapter 1)
  ova_hero.121.t: "Letters to the Hall"
  ova_hero.121.d: "The patronage office opens its shutters, and the letters arrive by the sackful: a village that wants its bridge blessed, a grandmother certain her goat is cursed, seventeen marriage proposals, and a boy who has drawn her sword wrong and would like the correct measurements. The clerks propose a form reply. Victoria, who remembers what it is to write a letter and hope, vetoes the form reply."
  ova_hero.121.f: "Seventeen proposals, one cursed goat, and not a single letter she was willing to leave unanswered."
  ova_hero.121.a: "Answer every letter, however long it takes."
  ova_hero.121.b: "The clerks may draft. She signs."
  # --- .122 The Borrowed Masters (chapter 3)
  ova_hero.122.t: "The Borrowed Masters"
  ova_hero.122.d: "The proposal is still unsigned, so Victoria improvises. She drills at dawn with the palace guard, who are honored, and who are useless to her within a fortnight: she disarms their best man in four passes and then apologizes to him, which makes it worse. She borrows the Academy's advanced manuals and finds she has outgrown the manuals too. The drill-mistress watches all of it without comment, and underlines the same line in the same unsigned proposal."
  ova_hero.122.f: "The palace guard is very good at guarding palaces. It has nothing left to teach the girl the serials call a dragon-slayer."
  ova_hero.122.a: "Keep drilling anyway. Habits matter."
  ova_hero.122.b: "Apologize to the guardsman again."
  # --- .123 A Duel She Did Not Win (chapter 3)
  ova_hero.123.t: "A Duel She Did Not Win"
  ova_hero.123.d: "A knight-errant of some renown passes through the capital, and the court, hungry for a spectacle, arranges a friendly bout. He is twice her age and has spent thirty years paying for the lessons she has never had. He wins, courteously, in front of everyone. Victoria shakes his hand, asks him three precise questions about the third exchange, and walks home the long way. It is the first time this world has beaten her at anything."
  ova_hero.123.f: "Talent lost, politely, to thirty years of purchased mornings. The arithmetic is not subtle."
  ova_hero.123.a: "Ask him for his old master's name."
  ova_hero.123.b: "Smile for the court. Fume later."
  # --- .124 The Chapel of Receipts (chapter 5)
  ova_hero.124.t: "The Chapel of Receipts"
  ova_hero.124.d: "The quartermaster's figures lead her, politely and inexorably, to a chapter-house behind the cathedral where a junior clerk keeps the war's paperwork in beautiful order. He is proud of the filing system and shows it off: indulgences by regiment, blessings by season, summonings by crown, every drawer labeled in a fair round hand. He has never been to the front. He asks her, shyly, whether the war is as glorious as the sermons say."
  ova_hero.124.f: "Somewhere between the front and the filing drawers, the dying turns into arithmetic. She has found the exact room where it happens."
  ova_hero.124.a: "Tell him the truth about the front."
  ova_hero.124.b: "Let him keep his sermons."
  # --- .125 Lessons on the Ridge (chapter 6)
  ova_hero.125.t: "Lessons on the Ridge"
  ova_hero.125.d: "The winged girl holds a sword the way a scholar holds a garden spade, and Victoria finally cannot bear it. One evening on the ridge she corrects the grip, sets the feet, and walks her through the first guard the Academy ever taught her, the same one she once drilled into poor Aldric. In return she is shown three letters of the wing-script, drawn in the dirt with a feather's spine, and her attempt to copy them is laughed at, not unkindly. It is the first lesson either of them has enjoyed in years."
  ova_hero.125.f: "Her drill-mistress would faint. Then she would correct the winged girl's footwork."
  ova_hero.125.a: "One more guard, then the letters again."
  # --- .126 The Lector's Price (chapter 7)
  ova_hero.126.t: "The Lector's Price"
  ova_hero.126.d: "It takes three days of asking in the wrong bookshops to find him: a defrocked lector living above a wine merchant, who reads four dead scripts and has opinions about all of them. He looks at her rubbings for a long moment, then at her, and then draws the curtains. His price is not money, in the end, though he takes the money too. His price is that she tell no one where the translation came from until he is safely dead."
  ova_hero.126.f: "Men who read the old scripts learn early what happened to the men who wrote them."
  ova_hero.126.a: "Pay him, and promise."
