l_english:
  # --- .1 The Summoning Rite
  ova_hero.1.t: "The Summoning Rite"
  ova_hero.1.d: "The summoning chamber is already full of chalk circles, incense smoke, and choir boys trying not to cough. Apparently, the Church of the Goddess has performed this ritual enough times for everyone except the person being summoned to consider it routine. The only question left is how much the throne is willing to pay. A normal offering may call an ordinary Hero. A larger one may pull something much more troublesome through the veil."
  ova_hero.1.f: "Somewhere in another world, a door that should not exist is about to open."
  ova_hero.1.a: "Perform the standard rite."
  ova_hero.1.b: "Pay double, demand a stronger Hero."
  ova_hero.1.c: "We hesitate at the threshold."
  # --- .2 A Girl from Another World
  ova_hero.2.t: "A Girl from Another World"
  ova_hero.2.d: "The light fades, and a girl in an oversized school coat is standing in the circle. She looks fourteen. Maybe because she is. For several seconds she can only stare at the torches, the robes, and the armed strangers surrounding her. Then she asks whether this world has trains. The steward carefully explains the spirit-rail engines. Victoria starts crying. Then laughing. Nobody quite knows what to do with either reaction, so for tonight they decide not to explain the demon war."
  ova_hero.2.f: "An ordinary schoolgirl went to school one morning. By evening, she had become the most famous girl in the Empire."
  ova_hero.2.a: "Parade her before the crowds."
  ova_hero.2.b: "A quiet induction, no fanfare."
  # --- .3 A Pact Sealed
  ova_hero.3.t: "A Pact Sealed"
  ova_hero.3.d: "The Church sends over the summoning contract in a leather folder thick enough to look important. Every clause is neat. Every number is precise. Every number also seems to favor the Church in a way that cannot possibly be accidental. Apparently, interdimensional salvation comes with a billing department."
  ova_hero.3.f: "Faith may move mountains. It also keeps excellent accounts."
  ova_hero.3.a: "Sign where indicated."
  # --- .20 To Slay a Demon Lord
  ova_hero.20.t: "To Slay a Demon Lord"
  ova_hero.20.d: "The Hero finally reaches the center of the enemy camp. Waiting there is the Uniter himself, almost as if the entire campaign had been arranged for this one meeting. The first clash shakes the ground. The next tears through steel. At last the Demon Lord falls to one knee, wounded badly enough for the watching tribes to see blood running down his armor. He is not dead. Somehow, that may be worse for the empire built around his invincibility."
  ova_hero.20.f: "The monster at the end of the legend bleeds like anyone else."
  ova_hero.20.a: "Press the advantage, then withdraw."
  # --- .21 A Martyr's Crown
  ova_hero.21.t: "A Martyr's Crown"
  ova_hero.21.d: "The retreat needs time. Someone has to stay behind and buy it. Everyone understands what that means, which is why nobody volunteers quickly. Our Hero does. The rearguard holds longer than one person should be able to hold anything, and the army gets away. The price is everything the Hero has left."
  ova_hero.21.f: "Later, the songs will call it glorious. The songs did not have to stand there and watch."
  ova_hero.21.a: "Grieve, and let the Church make of it what it will."
  # --- .22 The Shattering
  ova_hero.22.t: "The Shattering"
  ova_hero.22.d: "The Uniter is dead. Unfortunately for the Demonic Empire, he was also the one man holding half a dozen tribes together by force of will. The horned chiefs remember old insults. The winged lords remember older ones. Shadow clans begin naming their own rulers before the funeral fires are cold. Within weeks, one empire becomes six."
  ova_hero.22.f: "It took one warlord a lifetime to build the empire. Removing him turns out to be much faster."
  ova_hero.22.a: "Let the pieces fall where they may."
  # --- .23 The Freed Captives
  ova_hero.23.t: "The Freed Captives"
  ova_hero.23.d: "The rescued captives begin the long journey home in wagons and crowded caravans. Most had already stopped expecting to see their families again. Our Hero rides with them all the way to the border, despite being told several times that the dangerous part is over. Apparently, leaving well enough alone is not among the standard Hero skills."
  ova_hero.23.f: "Saving one person is a much simpler story than saving a country. People tend to remember the simpler story."
  ova_hero.23.a: "Welcome them home."
  # --- .24 They Pray as We Do
  ova_hero.24.t: "They Pray as We Do"
  ova_hero.24.d: "The latest field report contains something awkward. In a demon village, our Hero saw people praying. Not to some dark god. To the Goddess of Light. The names and language were different, but the gestures, hymns, and symbols were disturbingly familiar. The Church would very much prefer this detail not become the part everyone remembers."
  ova_hero.24.f: "Apparently, faith does not stop at a border just because an army does."
  ova_hero.24.a: "Quietly suppress the dispatch."
  ova_hero.24.b: "Let it circulate."
  # --- .35-.36 Victoria chapter openers (academy letter, the wall)
  ova_hero.35.t: "A Letter of Admission"
  ova_hero.35.d: "The Champion Hall is barely finished when a heavy cream envelope arrives with Saint Christine’s seal pressed into white wax. Victoria reads the letter once. Then again. Four years at the Academy. Tuition waived. Attendance expected. There will be terms, uniforms, examinations, and almost certainly homework. Her first reaction is horror. Her second is an embarrassing little spark of excitement she absolutely refuses to acknowledge."
  ova_hero.35.f: "She crossed an entire world and somehow ended up with another school enrollment form."
  ova_hero.35.a: "Well. She did always test well."
  ova_hero.36.t: "The Wall"
  ova_hero.36.d: "A year after graduation, Victoria realizes she has stopped improving. She trains at dawn, repeats every form perfectly, and ends the session exactly as strong as she began it. Her old drill-mistress explains the problem over tea. Talent got her this far. From here, progress costs time and money: real masters, real sparring partners, and a training yard that stays open after sunset. The crown could fund all of that tomorrow. It simply has not decided to."
  ova_hero.36.f: "Talent gets you to the wall. Masters, money, and ten thousand boring mornings get you over it."
  ova_hero.36.a: "Speak to the treasury about an intensive regimen."
  # --- .40-.42 LUX church flavor
  ova_hero.40.t: "The Martyr's Offering"
  ova_hero.40.d: "The Church discovers that a dead Hero is extraordinarily good for donations. Sermons fill. Collection plates overflow. Pilgrims arrive carrying grief and coin in roughly equal amounts. Nobody says this is convenient. Nobody needs to."
  ova_hero.40.f: "The Church mourns beautifully. The accounting office does rather well too."
  ova_hero.40.a: "Let the faithful give."
  ova_hero.41.t: "The Council of Reliquaries"
  ova_hero.41.d: "The curators have a practical problem. What exactly is the Church supposed to do with a Hero who is still alive long enough to complicate the usual saint-making process? One faction proposes canonizing early. Another suggests selling relics from the war, genuine where possible and persuasive where not. The meeting becomes surprisingly animated."
  ova_hero.41.f: "Sainthood, apparently, involves much more inventory management than the sermons suggest."
  ova_hero.41.a: "Canonize the living Heroes."
  ova_hero.41.b: "License the relic trade."
  ova_hero.42.t: "A Wavering Shield"
  ova_hero.42.d: "One of the crowned allies has begun using a dangerous word in private meetings. Peace. At first it is only a whisper. That is the problem with whispers. If nobody stops them, other people start repeating them."
  ova_hero.42.f: "A crusade built on fear needs a steady supply of fear more than it needs almost anything else."
  ova_hero.42.a: "Subsidize their zeal."
  ova_hero.42.b: "Threaten the anathema."
  # ===================== Victoria's arc =====================
  # --- .50 A Kettle in Another World (chapter 1)
  ova_hero.50.t: "A Kettle in Another World"
  ova_hero.50.d: "The palace has tried very hard to make Victoria feel at home. Unfortunately, nobody here knows what home actually looked like. They offer enchanted lamps when she misses electric lights, messenger spirits when she misses a telephone, and servants when what she really wants is one quiet evening where nobody expects anything from her. The thing she misses most turns out to be embarrassingly small: a kettle that boils water without requiring a fire-imp. Tonight, at least, someone has found one."
  ova_hero.50.f: "Home is apparently made from dozens of tiny conveniences you never notice until an entire world stands between you and them."
  ova_hero.50.a: "Let her have the evening."
  ova_hero.50.b: "Training starts at dawn."
  # --- .51 Hero of the Hour (chapter 1)
  ova_hero.51.t: "Hero of the Hour"
  ova_hero.51.d: "Victoria buys one of the popular serials about herself and immediately regrets it. According to the printer, she is taller, prettier, braver, and apparently capable of cutting dragons in half before breakfast. She remembers stopping one runaway rail-cart in the market. By the third printing, that incident has somehow acquired claws, wings, and fire breath."
  ova_hero.51.f: "The Hero in the newspapers seems very impressive. Victoria would like to meet her sometime."
  ova_hero.51.a: "Let the serials print what they like."
  ova_hero.51.b: "She trains until the stories are true."
  # --- .52 Across the Scarred Line (chapter 4)
  ova_hero.52.t: "Across the Scarred Line"
  ova_hero.52.d: "Victoria crosses the scarred border expecting the wasteland described in Church sermons. Instead, she finds red forests, dark rivers, farms, mills, and villages. Then she finds the shell of a schoolhouse. A small patchwork doll lies in the doorway, hand-stitched and worn smooth from being loved. Victoria stands there longer than the officers expect."
  ova_hero.52.f: "The demons have children. Nobody thought to mention that part."
  ova_hero.52.a: "Leave it behind."
  ova_hero.52.b: "Pick up the doll."
  # --- .53 The Girl with the Grey Wings (chapter 4)
  ova_hero.53.t: "The Girl with the Grey Wings"
  ova_hero.53.d: "Smoke from the skirmish hides most of the street. Then a figure appears through it: a winged girl about Victoria’s age, grey feathers, ink stains on her fingers, and a sword held with all the enthusiasm of someone carrying a broom. They see each other. Neither attacks. After a long moment, the winged girl gives a small, polite bow and disappears over the rooftops."
  ova_hero.53.f: "Victoria was told the winged ones were monsters. Monsters were not supposed to bow."
  ova_hero.53.a: "Say nothing of it in the official dispatch."
  ova_hero.53.b: "Report the encounter honestly."
  # --- .54 The Veterans Ward (chapter 5, Renown 20 opens the doors)
  ova_hero.54.t: "The Veterans Ward"
  ova_hero.54.d: "Victoria visits the veterans’ ward and spends the entire walk home thinking about what these soldiers would have received in her old world. Better prosthetics. Better medicine. A pension. Here they have narrow cots, overworked healers, and a chaplain whose services are being billed to the crown. Until coming here, she had never thought much about hospitals."
  ova_hero.54.f: "Now she cannot seem to stop thinking about them."
  ova_hero.54.a: "Fund a modern ward."
  ova_hero.54.b: "The crown cannot afford sentiment."
  # --- .55 The Ledger of Light (chapter 5)
  ova_hero.55.t: "The Ledger of Light"
  ova_hero.55.d: "Victoria finds the ledger by accident. At least, that is what she tells herself at first. The pages list summoning fees, blessings charged by regiment, relics, indulgences, and other holy expenses with very unholy precision. Then she reaches a map tucked into the back. Someone has marked which fronts should advance, which should stall, and which profitable stalemates are best left burning a little longer. Victoria closes the book very slowly."
  ova_hero.55.d_doubt: "She already suspected as much, after that dispatch about the praying villages. Now she has the ledger in her own hands, and the numbers are worse than the suspicion. Someone is keeping the war warm on purpose, and writing down the price of it in a very tidy column."
  ova_hero.55.f: "She says nothing. Not yet."
  ova_hero.55.a: "Close the book. Remember the page."
  # --- .56 The Girl on the Ridge (chapter 6: the friendship deepens)
  ova_hero.56.t: "The Girl on the Ridge"
  ova_hero.56.d: "On the next campaign, Victoria sees the grey-winged girl waiting on a ridge above the camp. This time, neither of them can really pretend it is an accident. They share sour tea and complain about their commanders for an hour. It is absurdly normal. Down in the valley, a winged village begins its evening hymn. Victoria recognizes the melody. Her companion casually hums the harmony the Church never taught her."
  ova_hero.56.f: "Somewhere between enemy and acquaintance, the girl on the ridge became a friend."
  ova_hero.56.a: "Stay until the hymn ends."
  ova_hero.56.b: "Duty first; slip away early."
  # --- .57 A Name Given Freely (chapter 6)
  ova_hero.57.t: "A Name Given Freely"
  ova_hero.57.d: "They meet again deliberately. By now the pretense of coincidence would be insulting. For an hour they talk about books, terrible rations, and how exhausting it is to have adults keep turning them into symbols. Then they laugh at the same joke at the same time and both go strangely quiet. Before leaving, the winged girl finally gives Victoria her name."
  ova_hero.57.f: "A name is something you give a person, not an enemy."
  ova_hero.57.a: "Nice to meet you, Aurelia."
  # --- .58 The Midnight Archive (chapter 7, from the archive button)
  ova_hero.58.t: "The Midnight Archive"
  ova_hero.58.d: "The archivist has been paid enough to be somewhere else tonight. Victoria slips into the Church’s oldest archive alone, where the first editions sit behind locked doors and centuries of later corrections. She lights one candle. The flame seems very small in the room. Then she opens the first book."
  ova_hero.58.f: "Every institution has the history it teaches and the history it keeps where students cannot reach it."
  ova_hero.58.a: "Keep reading."
  # --- .59 The Amended Word (chapter 7)
  ova_hero.59.t: "The Amended Word"
  ova_hero.59.d: "The defrocked lector returns Victoria’s rubbings with a translation attached. She reads the first line, then reads it again. In the oldest books, the winged people are not demons. They are angels. Messengers of the Goddess. In later copies, the word becomes spirits. Then winged strangers. Then, finally, demons. No decree announces the change. No one hand is responsible. The meaning simply shifts a little at a time until the old truth disappears."
  ova_hero.59.f: "Eighteen centuries of copyists each leaned on one word. Eventually, the whole meaning fell over."
  ova_hero.59.a: "Hide the translation inside her coat."
  ova_hero.59.b: "Copy it out, and return the originals."
  # --- .70 A Parley Behind the Lines (chapter 8: campaigning again)
  ova_hero.70.t: "A Parley Behind the Lines"
  ova_hero.70.d: "Another campaign drags Victoria deeper into the dusk country. Burned bridges. Small skirmishes. Another week of pushing the front forward because that is what Heroes are supposed to do. Then, unexpectedly, the enemy sends a truce-feather. A winged herald escorts Victoria alone to a seized manor where half the Obsidian Court is already waiting. This is not a proper embassy. Nobody exchanged terms or agreed on protocol. The enemy simply decided it would rather meet the girl the Church calls its doom than keep imagining her. Every eye in the hall settles on Victoria’s first bow."
  ova_hero.70.f: "Diplomacy, Victoria discovers, often begins with deciding exactly how low to bow while everyone judges the answer."
  ova_hero.70.a: "Bow as low as she would to her own king."
  ova_hero.70.b: "Keep the Church's forms, and let them notice."
  # --- .71 Flight-Songs (chapter 8)
  ova_hero.71.t: "Flight-Songs"
  ova_hero.71.d: "The winged people sing while they fly. Victoria learns that on campaign, hearing whole ballads pass from one formation to another above ruined rooftops. The Church calls the language demonic. Her grey-winged friend calls one particular song old-fashioned and teaches her the second verse anyway. It is about a lost homeland and the promise to return. Victoria memorizes it while marching through the homeland in question."
  ova_hero.71.f: "It becomes much harder to hate a people once you know the words to their songs."
  ova_hero.71.a: "Learn the second verse by heart."
  # --- .72 An Invitation Written in Feathers (chapter 8)
  ova_hero.72.t: "An Invitation Written in Feathers"
  ova_hero.72.d: "Between campaigns, a grey envelope arrives sealed with a single feather. Victoria recognizes the handwriting before she breaks it. Aurelia invites her beneath the Obsidian Court, into a place no human has ever been permitted to enter. There is no royal title beneath the letter. Only Aurelia’s name, and a request from one friend to another: come and see the truth of my people."
  ova_hero.72.f: "Apparently, the Demon King’s daughter would rather trust her than capture her."
  ova_hero.72.a: "Of course she will go."
  # --- .73 The Vault of Feathers (chapter 9, from the vault button)
  ova_hero.73.t: "The Vault of Feathers"
  ova_hero.73.d: "The vault beneath the Obsidian Court is older than the current empire. Older than the crusade. Perhaps even older than the word demon as Victoria knows it. Names cover the walls from floor to ceiling. Beneath every name rests one grey feather. There are so many that Victoria stops trying to count. Aurelia takes her hand and begins at the beginning."
  ova_hero.73.f: "There are rooms a person enters only once, because the one who leaves is no longer quite the same person."
  ova_hero.73.a: "Read every name on the wall."
  # --- .74 What the Feathers Held (chapter 9)
  ova_hero.74.t: "What the Feathers Held"
  ova_hero.74.d: "Aurelia’s story begins before the Church existed. The Goddess fought beings from Outside, and the final blow of that war split the continent, raised mountains, drowned plains beneath a new sea, and cursed the old land red. The horned and shadow peoples were once human tribes changed by that curse. The winged people were not. They were the Goddess’s angels, the messengers who led unmarked survivors across the sea to the one island She could still save before falling asleep. Then the first kings of that island decided sharing power with angels was inconvenient. They killed or imprisoned them, built a Church over the crime, and slowly changed the old records. Messenger became spirit. Spirit became stranger. Stranger became demon. Eighteen centuries later, with the red land valuable again, the old lie returned dressed as holy war. Every feather in the vault belongs to someone erased by that word. Aurelia tells all of this without crying. She has had generations of family grief to practice."
  ova_hero.74.f: "The Church did not inherit the Goddess’s light. It buried the people who carried it and kept the name for itself."
  ova_hero.74.a: "Grief first. The rest can wait a night."
  # --- .75 The Hour of the Hero (THE choice, 60 days after the vault)
  ova_hero.75.t: "The Hour of the Hero"
  ova_hero.75.d: "Sixty days pass after the vault. Victoria spends nearly every one of them thinking about the same choice. She can tell the world what she learned, raise a new banner over the marches, and build a nation where humans and winged people stand together. That means rebellion, civil war, the Demonic Empire at her back, and the old crown coming with Church money and loaded guns. Or she can close the vault, say nothing, and keep serving a war that is very profitable for everyone except the people dying in it. Nobody summoned her with instructions for this part."
  ova_hero.75.f: "A Hero’s sword can point in many directions. Eventually, the Hero has to choose one herself."
  ova_hero.75.a: "RAISE THE DAWN. She takes the marches, and the war of the dawn begins."
  ova_hero.75.b: "KEEP THE EMPIRE. Bury the truth, and finish the crusade."
  # --- .76 The Dawn Proclamation (rebellion epilogue, on the Concord Aurorae)
  ova_hero.76.t: "The Dawn Proclamation"
  ova_hero.76.d: "Victoria makes the announcement from the wall of a small march town. No grand cathedral. No royal balcony. Just stone, soldiers, and Aurelia standing beside her without a weapon between them. The winged people are not demons. The crusade is theft wearing a blessing. These marches will no longer take part. The crowd below erupts. Far to the west, the old capital begins raising its banners and loading its guns."
  ova_hero.76.f: "A very large truth fits surprisingly well on a very small wall."
  ova_hero.76.a: "Let the dawn break where it will."
  # --- .77 The Longest War (empire epilogue)
  ova_hero.77.t: "The Longest War"
  ova_hero.77.d: "Victoria closes the vault and goes home. She tells the Church the audience revealed nothing useful. The Church believes her, because a Hero who keeps fighting is more valuable than one who keeps asking questions. So the war continues. Victoria becomes frighteningly good at it. Eventually, she even learns to sleep through the hours that used to keep her awake."
  ova_hero.77.f: "The lie becomes easier to carry with practice. That is exactly what makes it dangerous."
  ova_hero.77.a: "The crusade endures, and so does she."
  # --- .78 The Hero Is Dead (fail: Victoria has fallen)
  ova_hero.78.t: "The Hero Is Dead"
  ova_hero.78.d: "Victoria does not come back. Not to the capital. Not to Earth. Not anywhere. For a while, nobody quite believes it. Then the mourning cloth goes up across the city and the war suddenly seems much less important than one empty place at the center of it."
  ova_hero.78.f: "She found trains on her first day in this world. Somehow, nobody ever gave her time to ride one just for fun."
  ova_hero.78.a: "A state funeral, fit for a saint."
  ova_hero.78.b: "Let her legend outlive her, whatever it costs."
  # --- .79 A Story Cut Short (fail: the Empire fell first)
  ova_hero.79.t: "A Story Cut Short"
  ova_hero.79.d: "The Demonic Empire disappears before Victoria can finish learning what it really was. Other armies, other rulers, and other ambitions settle the question for her. The people she wanted to ask are scattered. The vault belongs to someone else, if it still exists at all. Victoria keeps the second verse of the flight-song memorized anyway."
  ova_hero.79.f: "History rarely waits for one girl to finish understanding it."
  ova_hero.79.a: "Carry what she learned, and go on."
  # --- .80 The Veil Torn (LUX)
  ova_hero.80.t: "The Veil Torn"
  ova_hero.80.d: "The truth is out. Cheap pamphlets carry it through the streets. People shout it from balconies. Copies of first editions are passing from hand to hand faster than the Church can confiscate them. The archives can still be burned. Priests can still deny everything. Unfortunately, denial worked much better before ordinary people could hold the inconvenient pages themselves."
  ova_hero.80.f: "The most dangerous person to an old lie is often someone who actually read the footnotes."
  ova_hero.80.a: "Deny everything."
  ova_hero.80.b: "Burn the remaining archives."
  # --- .81 Those Who Left and Those Who Stayed (dawn 1)
  ova_hero.81.t: "Those Who Left and Those Who Stayed"
  ova_hero.81.d: "The new dawn does not convince everyone. Some soldiers leave Victoria’s army because they cannot accept fighting the crown they once served. Others desert the loyalists because they can no longer defend the old story. Men cross the lines in both directions carrying the same language, the same uniforms, and opposite ideas of loyalty. The new nation now has to decide what to do with people who simply want to leave."
  ova_hero.81.f: "Civil war is what happens when both sides understand every word the other says and still hear something completely different."
  ova_hero.81.a: "Open the gates for anyone who wishes to leave."
  ova_hero.81.b: "Deserters forfeit their commissions and their pensions."
  # --- .82 The Old Flag in the Streets (dawn 1)
  ova_hero.82.t: "The Old Flag in the Streets"
  ova_hero.82.d: "Imperial flags begin appearing in windows across the marches. The people hanging them are not enemy agents. They are shopkeepers, clerks, old women, and families who miss the stable empire they understood, even if that empire rested on a lie. The city guard asks whether the square should be cleared. Victoria is forced to confront an unpleasant truth: winning a war does not automatically win the people living beside you."
  ova_hero.82.f: "A revolution can defeat an army and still lose the neighbor who used to wave every morning."
  ova_hero.82.a: "Clear the square, gently."
  ova_hero.82.b: "Let them march until their feet get tired."
  # --- .83 The Winged Legion (dawn 1)
  ova_hero.83.t: "The Winged Legion"
  ova_hero.83.d: "The winged volunteers arrive by the thousands, grey wings covering the sky above the new nation. They have come to fight beside human soldiers. That sounds simple until one remembers those same human soldiers spent their entire lives being trained to shoot at exactly that silhouette. The first mixed units are painfully awkward. Nobody quite knows where to stand or what to say."
  ova_hero.83.f: "The first joint patrol marches in silence. By the second, somebody risks a joke."
  ova_hero.83.a: "Welcome them into the line of battle."
  # --- .84 The Schoolhouse Door (dawn 2)
  ova_hero.84.t: "The Schoolhouse Door"
  ova_hero.84.d: "A winged family brings its children to a capital school. Suddenly, all the grand speeches about reconciliation shrink down to one classroom. Do the children sit with everyone else? Or on a separate bench at the back, just for now, until everyone is comfortable? The phrase just for now sounds reasonable. That is what makes it dangerous."
  ova_hero.84.f: "Reconciliation is a grand idea made out of hundreds of very small doors."
  ova_hero.84.a: "The door stays open, and the law says so."
  ova_hero.84.b: "Separate benches, for now."
  # --- .85 Feathers in the Market (dawn 2)
  ova_hero.85.t: "Feathers in the Market"
  ova_hero.85.d: "Winged merchants begin opening stalls in the capital. Most customers are curious. Some are not. One overturned stall becomes a shouting match, then a scuffle, then almost something much worse. The city guard arrives and faces a question nobody can dodge anymore: does the peace protect every citizen, or only the ones who look familiar?"
  ova_hero.85.f: "Old hatred does not disappear when its excuse is exposed. Sometimes it simply becomes less polite."
  ova_hero.85.a: "The guard protects every stall, or none."
  ova_hero.85.b: "Advise the winged traders to keep away a while."
  # --- .86 Two Uniforms, One Line (dawn 2)
  ova_hero.86.t: "Two Uniforms, One Line"
  ova_hero.86.d: "One year into the new dawn, a human sergeant and a winged corporal end up sharing the same watch-fire on the loyalist front. They begin the night suspicious of each other. By midnight they have discovered, to their mutual annoyance, that they actually get along. The officers call it a small success. Victoria suspects it may be the entire future of the country in miniature."
  ova_hero.86.f: "Treaties hold nations together on paper. Shared fires do much of the work underneath."
  ova_hero.86.a: "This is how a nation is actually made."
  # --- .87 The World Watches (dawn 3)
  ova_hero.87.t: "The World Watches"
  ova_hero.87.d: "Foreign courts watch Victoria’s new nation with intense interest and even more intense embarrassment. Many of them spent years paying the Church to fight demons. Now several would very much like to explain that they always had doubts. Victoria can accept the convenient change of heart and gain friends, or remind them in detail who funded the old crusade."
  ova_hero.87.f: "Nothing creates sudden friendship quite like a shared desire not to discuss the past."
  ova_hero.87.a: "Be gracious, and gather friends."
  # --- .88 A Letter, Wing-Sealed (dawn 3)
  ova_hero.88.t: "A Letter, Wing-Sealed"
  ova_hero.88.d: "A grey letter arrives sealed with one feather. Victoria recognizes Aurelia’s handwriting immediately. There are no titles in the message. No talk of demons or princesses. Aurelia writes simply as a friend, promising that the dusk country will keep faith with the new dawn. She also reminds Victoria that she still owes her the second verse of a certain song."
  ova_hero.88.f: "Two girls who were supposed to be enemies are now responsible for keeping a peace their ancestors never managed."
  ova_hero.88.a: "Write back, and mean it."
  # --- .89 A Nation of Two Peoples (dawn 3 epilogue)
  ova_hero.89.t: "A Nation of Two Peoples"
  ova_hero.89.d: "The new nation is not a fairy tale. Markets still have ugly arguments. Old laws still need rewriting. Humans and winged people still misunderstand each other every day. Victoria still misses Earth, especially telephones that actually reach the person you call. Even so, the country exists. It is real. The whole world has been forced to take it seriously. Somewhere in the palace kitchen, a kettle whistles without magic."
  ova_hero.89.f: "Victoria never found a way home. Instead, she built a place she could choose to stay."
  ova_hero.89.a: "Let the dawn keep."
  # ===================== DEM home front =====================
  # --- .60 The Warlord's Peace
  ova_hero.60.t: "The Warlord's Peace"
  ova_hero.60.d: "The Uniter addresses the tribes from the steps of a captured keep. He reminds them that the red marches belonged to their ancestors long before foreign crowns drew new borders over them. The Sundering changed the land and its people, and everyone safely living across the sea decided to call those changed people demons. Now the curse is fading, outsiders want the land back, and the Uniter has one very simple answer: it was theirs before, and it will be theirs again. For once, the horned, winged, and shadow chiefs all agree."
  ova_hero.60.f: "A young empire needs something its rival tribes can hate together. A border war will do."
  ova_hero.60.a: "Iron discipline. No excuses, no exceptions."
  ova_hero.60.b: "Soften the levies. The tribes have given enough."
  # --- .61 The Envoy Returns Empty-Handed
  ova_hero.61.t: "The Envoy Returns Empty-Handed"
  ova_hero.61.d: "The empire sends a quiet peace proposal to the Church. The courier returns with the seal still unbroken. Nobody even bothered reading it. The letter included old hymns, shared rites, and evidence that the so-called demons worship the same Goddess of Light. Perhaps that is exactly why opening it would have been inconvenient."
  ova_hero.61.f: "It is difficult to negotiate peace with people whose income depends on the war."
  ova_hero.61.a: "Then we endure."
  ova_hero.61.b: "Publish the rejected letter. Let the world see who refuses peace."
  # --- .62 Speeches at the Scarred Border
  ova_hero.62.t: "Speeches at the Scarred Border"
  ova_hero.62.d: "Every season, another foreign Hero crosses the border and takes another hill, valley, or village from the marches. The map shrinks a little at a time. The Uniter’s officers make sure the border settlements notice. Speeches repeat the same message until even children know it by heart: this was our land, and there is less of it every year."
  ova_hero.62.f: "A grievance kept fresh is almost as useful as an army."
  ova_hero.62.a: "Let the speeches continue."
  # --- .63 We Pray to Her Too
  ova_hero.63.t: "We Pray to Her Too"
  ova_hero.63.d: "Far from the front, demon villages gather beneath the broken moon and sing hymns to the Goddess of Light. The melodies are old. Older, in fact, than the Church that calls them heretics. Winged scholars carefully copy the verses, especially the lines missing from modern Church editions. Nobody needs to explain why."
  ova_hero.63.f: "Sometimes heresy is simply faith that arrived from the wrong side of the border."
  ova_hero.63.a: "Proclaim it to the world."
  ova_hero.63.b: "Keep the faith quiet, for now."
  # --- .64 Shadows of the Hero
  ova_hero.64.t: "Shadows of the Hero"
  ova_hero.64.d: "Rumor of a foreign Hero spreads faster than the Hero ever could. Villages empty before anyone has seen so much as a sword. Farmers swear the champion is only a day away, then half a day, then already over the next hill. Where the expeditions really have passed, the truth is worse than the rumor: boundary stones have moved, and familiar fields now belong to somebody else’s kingdom."
  ova_hero.64.f: "Fear does not need to meet the monster. Hearing a convincing story is usually enough."
  ova_hero.64.a: "There is nothing for it but to endure."

  ova_hero.65.t: "Human Faces"
  ova_hero.65.d: "The Altans are human. They always have been. They farmed the empire’s dry eastern lands before the curse receded and kept ancient rites to the Goddess while the far shore rewrote its own scriptures. None of that matters much to a family that buried a son this spring. The crusaders have human faces. So do the grocers on Altan Row. Someone paints a white sunburst on every door."
  ova_hero.65.f: "People often strike the face that resembles the enemy when the actual enemy is too far away."
  ova_hero.65.a: "The compact covers every tribe. Post the guard on Altan Row."
  ova_hero.65.b: "The guard has other duties. Doors can be repainted."

  ova_hero.66.t: "The Spared and the Changed"
  ova_hero.66.d: "An old argument starts circulating through the drinking halls again. When the curse transformed the horned and shadow tribes, the winged people remained unchanged. Some call that proof they were always favored by the Goddess. Winged elders answer that their ancestors carried Her word across the sea and were slaughtered for it afterward. Nobody shouting about their beautiful feathers seems eager to inherit that part of the history."
  ova_hero.66.f: "The curse hurt everyone differently. The argument over who suffered most may last even longer."
  ova_hero.66.a: "The Uniter shames the agitators himself, in the open hall."
  ova_hero.66.b: "Old scorn is not worth a decree. Let it burn out."

  ova_hero.67.t: "Tribute of the Dusk Forests"
  ova_hero.67.d: "The dark elves of Yolteni pay taxes on time, send soldiers on time, and still find themselves seated below every horned chief at imperial banquets. The excuse is that their curse only changed their skin, so perhaps they did not suffer enough to count properly. Their envoys have stopped protesting the seating plan. Their students, however, still hear half-cursed whispered from lecture hall doors."
  ova_hero.67.f: "An empire founded by peoples tired of being despised has somehow invented new people to despise."
  ova_hero.67.a: "Seat the envoys of Yolteni above the salt."
  ova_hero.67.b: "The forests can wait their turn. The war cannot."

  ova_hero.68.t: "The Altan Regiments"
  ova_hero.68.d: "A petition reaches the throne with four hundred Altan signatures. They were born in the empire. They worship the same Goddess. They want to defend their homeland in uniform against the crusaders. Half the generals call this the cheapest loyalty the empire will ever receive. The other half asks one ugly question: what happens when an Altan company is ordered to fire on human soldiers?"
  ova_hero.68.f: "Trust is inconvenient because it has to be given before it can ever be proven."
  ova_hero.68.a: "Arm them under the empire's banner."
  ova_hero.68.b: "Shovels, not spears. Their war is the harvest."

  ova_hero.69.t: "Ash on Someone Else's Doorstep"
  ova_hero.69.d: "Refugee carts pour down from the seized hills carrying whatever families could save in a single day. The city places them wherever there is space. Unfortunately, much of that space is in the Altan quarter. By the second week, broken windows stop looking accidental. One woman who lost her orchard to human crusaders stands in the street demanding to know why humans are still allowed to own shops here."
  ova_hero.69.f: "Grief is easy to redirect. The people who caused it are rarely standing nearby."
  ova_hero.69.a: "Billet the refugees at the crown's expense, and post the guard in the quarter."
  ova_hero.69.b: "Grief must go somewhere. Look away."
  # ============ .90-.109 Victoria's arc, the drip-feed beats ============
  # --- .90 The Hall Rises (chapter 1)
  ova_hero.90.t: "The Hall Rises"
  ova_hero.90.d: "Victoria learns that the crown is building her a hall. Not a house. A Champion Hall. Training yard, library, offices, staff, and apparently an entire department whose job is making sure more people know her name. She stands ankle-deep in construction mud watching masons raise walls because she exists. After several minutes of being unable to decide whether this is flattering or horrifying, she starts carrying stone. The foreman wishes she would stop helping."
  ova_hero.90.f: "Back on Earth, Victoria’s greatest official honor was a certificate for punctuality."
  ova_hero.90.a: "Let her lay the first stone herself."
  ova_hero.90.b: "Let her hide in the half-built library."
  # --- .91 Three Wings and a Ledger (chapter 1)
  ova_hero.91.t: "Three Wings and a Ledger"
  ova_hero.91.d: "The new Champion Hall is not even finished, and three groups are already fighting over what it should become. The generals want a bigger training yard. The scholars want twice the library. The heralds want a patronage office because, as they explain with painful patience, a famous Hero who nobody hears about is merely an expensive statue. Victoria was not invited to the budget meeting. She is listening from the stairs anyway."
  ova_hero.91.f: "Every grand institution begins with several adults arguing over rooms and money."
  ova_hero.91.a: "All three wings, and hang the cost."
  ova_hero.91.b: "Ask the girl what her own house is for."
  # --- .92 The Dormitory (chapter 2, academy year one)
  ova_hero.92.t: "The Dormitory"
  ova_hero.92.d: "Victoria’s Academy dorm room contains four beds, one terrible window, and three classmates who had fully intended to dislike the famous summoned Hero. Their plan lasts less than two weeks. Soon they are sharing contraband biscuits, complaining about the doctrine master, and arguing over whose turn it is to fetch water. Nobody in the room wants a miracle, a victory, or a speech from Victoria. They only want her to stop stealing the blanket."
  ova_hero.92.f: "For the first time since arriving in this world, she falls asleep without noticing herself do it."
  ova_hero.92.a: "Sit up half the night talking."
  ova_hero.92.b: "Lights out. There is drill at six."
  # --- .93 A Letter That Cannot Be Posted (chapter 2, academy year two)
  ova_hero.93.t: "A Letter That Cannot Be Posted"
  ova_hero.93.d: "The composition master assigns a simple exercise: write a letter home. Victoria stares at the blank paper for almost an hour. There is no address she can write. No post road crosses worlds. No ship, bird, or spell goes where she means. Eventually, she writes four pages anyway. Mostly about the food, the Academy, and a boy named Aldric who still holds a sword wrong. Then she signs her name and has nowhere to send it."
  ova_hero.93.f: "Dear Mum. The tea is awful. The demons are complicated. I think I am doing all right."
  ova_hero.93.a: "She finishes it, and keeps it in her trunk."
  ova_hero.93.b: "She reads it aloud to the dormitory."
  # --- .94 The Doctrine Essay (chapter 2, academy year three)
  ova_hero.94.t: "The Doctrine Essay"
  ova_hero.94.d: "Third-year doctrine exams begin with a question printed in confident Church lettering: #i Explain why the winged heretics cannot be reasoned with.#! Victoria reads it four times. She has never actually spoken to a winged heretic. Neither has the proctor. She strongly suspects the person who wrote the marking guide has not either. She knows exactly what answer earns full marks. That is what makes the question so irritating."
  ova_hero.94.f: "Teaching a clever student how to argue has one obvious risk: eventually she starts arguing with the teacher."
  ova_hero.94.a: "Write what the faculty wants to read."
  ova_hero.94.b: "Write what she actually thinks."
  # --- .95 The Final Practicum (chapter 2, academy year four)
  ova_hero.95.t: "The Final Practicum"
  ova_hero.95.d: "The final Academy practicum sends the students into the hills after something that has been eating shepherds. The faculty watches from a conveniently safe distance and takes notes. Victoria is the obvious choice to lead. She keeps looking at Aldric instead. He is still the worst swordsman in their year. He is also the only one who remembers to check whether everyone else has eaten."
  ova_hero.95.f: "The grading rubric measures strength very carefully. Victoria is beginning to suspect it measures the wrong thing."
  ova_hero.95.a: "Lead the column, as the rubric requires."
  ova_hero.95.b: "Let the nervous boy lead it."
  # --- .96 Ten Thousand Mornings (chapter 3)
  ova_hero.96.t: "Ten Thousand Mornings"
  ova_hero.96.d: "Another year passes. Victoria’s training report says almost exactly what the last one did. She works hard. She trains at dawn. She has not improved. The problem is no longer effort. She has simply outgrown ordinary practice. What she needs costs money: masters who can still beat her, partners strong enough to force mistakes, and a yard that remains open after dark. The proposal is already written. Nobody has signed it."
  ova_hero.96.f: "Talent reaches the wall quickly. Money and ten thousand mornings decide whether you climb over it."
  ova_hero.96.a: "The proposal is still on the desk."
  # --- .97 The Quiet Villages (chapter 4)
  ova_hero.97.t: "The Quiet Villages"
  ova_hero.97.d: "A week inside the dusk country, Victoria begins to notice that the war refuses to resemble the sermons. Villages have laundry on the lines. Children run from soldiers in exactly the same way children run at home. There is a schoolhouse. There is a war memorial. The list of names on it is just as long as the memorials back in Lysna. Her officers say nothing. Victoria writes everything down."
  ova_hero.97.f: "The enemy has a schoolhouse. Somehow, that detail never made it into doctrine class."
  ova_hero.97.a: "Write down what she actually sees."
  ova_hero.97.b: "File the dispatch the Church expects."
  # --- .98 A Face in the Smoke (chapter 4)
  ova_hero.98.t: "A Face in the Smoke"
  ova_hero.98.d: "A granary burns ahead of the column. Refugees stumble through the smoke while a grey-winged figure guides them toward the trees. Victoria has a clear shot. The doctrine is unambiguous. The distance is easy. By now, she almost never misses. Then the winged figure sees her. It does not attack or flee. It simply keeps helping civilians, trusting Victoria not to become the monster from its own stories."
  ova_hero.98.f: "Perhaps this is not mercy. Perhaps it is simply refusing to let someone else decide what kind of person she is."
  ova_hero.98.a: "Let the column go."
  ova_hero.98.b: "Do her duty, and not sleep after it."
  # --- .99 The Cot by the Window (chapter 5)
  ova_hero.99.t: "The Cot by the Window"
  ova_hero.99.d: "The boy by the window is fourteen. He lost both legs at Bladewaste to an enemy he never saw. When Victoria enters, he brightens and apologizes for being unable to stand. Then he asks if the stories are true. Did she really come from another world? Do they have wars there too? Victoria says yes. The boy thinks for a moment, says that is a pity, and offers her half his biscuit."
  ova_hero.99.f: "Victoria had prepared herself for anger. Kindness is much harder to defend against."
  ova_hero.99.a: "Sit with him until the end of visiting hours."
  ova_hero.99.b: "Ask him who signed his discharge papers."
  # --- .100 The Quartermaster's Arithmetic (chapter 5)
  ova_hero.100.t: "The Quartermaster's Arithmetic"
  ova_hero.100.d: "The discharge papers send Victoria through three offices and eventually to a quartermaster who looks bored enough to sleep standing. His ledger contains blessed bandages at four times the ordinary price, consecrated rations, seasonal indulgences, and charges Victoria did not know existed. She points at the numbers. The quartermaster shrugs. To him, none of this is a scandal. It is simply Tuesday."
  ova_hero.100.f: "For some people, the war is not a tragedy. It is an account that pays on time."
  ova_hero.100.a: "Copy the column into her own notebook."
  ova_hero.100.b: "Ask him, to his face, who profits."
  # --- .101 The Shared Ration (chapter 6)
  ova_hero.101.t: "The Shared Ration"
  ova_hero.101.d: "By the third meeting on the ridge, neither Victoria nor the winged girl bothers pretending to be surprised. The girl brings a grey lump she insists is a delicacy. Victoria brings army biscuit, which she considers a violation of human rights in any world. They exchange food, regret both decisions, and spend twenty minutes arguing about which army treats its soldiers worse."
  ova_hero.101.f: "This is not diplomacy. Diplomacy would probably be much safer."
  ova_hero.101.a: "Split the ration. Argue about the better half."
  # --- .102 What the Ridge Knows (chapter 6)
  ova_hero.102.t: "What the Ridge Knows"
  ova_hero.102.d: "They have stopped counting the meetings. Tonight, the winged girl talks about her father, who is a warlord and, inconveniently, also a father who worries about her. Victoria talks about a mother she cannot write to. They avoid mentioning the war until the very end. Then the winged girl quietly says her language has a word for what they are doing. Victoria asks what it means. The answer is treason."
  ova_hero.102.f: "Two soldiers sit on a ridge and commit the dangerous crime of liking each other."
  ova_hero.102.a: "Neither of them reports the meeting."
  ova_hero.102.b: "Tell her officers exactly where she was."
  # --- .103 The Second Shelf (chapter 7, archive night)
  ova_hero.103.t: "The Second Shelf"
  ova_hero.103.d: "The first shelf in the secret archive is exactly what Victoria expected: sermons, ledgers, property records, and all the tedious machinery required to run a wealthy religion. The second shelf is older. One book is written in a script she cannot read and has been upside down so long that the dust lies strangely across the spine. Victoria takes it down. Her candle is already burning lower than she would like."
  ova_hero.103.f: "Nobody hides the interesting book on the first shelf."
  ova_hero.103.a: "Keep going. The candle will last."
  # --- .104 The Scraped Page (chapter 7, archive night)
  ova_hero.104.t: "The Scraped Page"
  ova_hero.104.d: "Near dawn, Victoria finds a page that feels thinner than the ones around it. Someone scraped the original writing from the vellum and wrote new words over the top. When she holds it near the candle, older letters begin to show beneath the newer ink. She cannot read them. She can count, though. There are eleven altered pages in the same chapter. Before the candle dies, she makes rubbings of every one."
  ova_hero.104.f: "Someone went to enormous trouble to change these pages. Trouble is a kind of evidence."
  ova_hero.104.a: "Find someone who can read the old script."
  # --- .105 The Herald's Escort (chapter 8)
  ova_hero.105.t: "The Herald's Escort"
  ova_hero.105.d: "The next campaign begins like the last three. Columns advance. Border towns empty. Then a truce-feather arrives before the first shot. This time, the escort includes a grizzled winged sergeant with a torn wing and absolutely no interest in diplomatic manners. During the ride he asks Victoria about her sword, Earth, and whether human women truly choose to wear those ridiculous collars. She answers all three questions. He laughs hardest at the last answer."
  ova_hero.105.f: "The court is still studying Victoria carefully. The old sergeant makes up his mind about her in four minutes."
  ova_hero.105.a: "Ride with them unarmed, and let them see it."
  # --- .106 The Courtier Who Would Not Bow (chapter 8)
  ova_hero.106.t: "The Courtier Who Would Not Bow"
  ova_hero.106.d: "One courtier refuses to play along. An old lord of the Rent Sky stands when Victoria enters and announces that his family has buried eleven people because of human soldiers with swords and polite manners. He will not bow to another one just because she smiles first. The room goes silent. Victoria would prefer him to be unfair. Unfortunately, every word he said is true."
  ova_hero.106.f: "The hardest accusation to answer is the one that does not exaggerate anything."
  ova_hero.106.a: "Agree with him. Out loud. In front of the court."
  ova_hero.106.b: "Answer as a Hero of Lysna is expected to."
  # --- .107 A Truce for One Evening (chapter 8)
  ova_hero.107.t: "A Truce for One Evening"
  ova_hero.107.d: "A winged holy day arrives while the two armies are camped close enough to hear each other’s music. Someone begins singing after dark. A soldier on the opposite side recognizes the tune. Of course he does. They worship the same Goddess. By midnight, human corporals and winged pikemen are sharing one fire, trading food, and lying about how fearless they are. No officer has the heart to stop it."
  ova_hero.107.f: "In the morning, they are expected to become enemies again. Nobody around the fire has a good explanation for how."
  ova_hero.107.a: "Keep the evening. Write none of it down."
  # --- .108 The Names on the Wall (chapter 9, in the vault)
  ova_hero.108.t: "The Names on the Wall"
  ova_hero.108.d: "Aurelia does not begin by explaining the truth. She begins with names. The vault walls are covered in them from floor to ceiling, each with a grey feather and a date beneath it. Victoria follows the dates along the wall. Slowly, a pattern appears. The oldest names come from long before the present war. In fact, the earliest dates are not battles at all."
  ova_hero.108.f: "Wars have casualty lists. This wall starts far too early."
  ova_hero.108.a: "Keep reading along the wall."
  # --- .109 The Oldest Feather (chapter 9, in the vault)
  ova_hero.109.t: "The Oldest Feather"
  ova_hero.109.d: "At the far end of the vault rests one feather in its own case. The plaque beneath it is written in the same dead script Victoria found beneath the scraped pages. Aurelia reads it aloud from memory. It is a blessing once spoken over human fleets crossing the new sea after the Sundering. Inside the blessing is a word Victoria has seen exactly once before, half-erased beneath newer ink."
  ova_hero.109.f: "Victoria already suspects what the word means. Hearing Aurelia say it is something else."
  ova_hero.109.a: "Ask her to say it."
  # ============ .120-.126 added beats (2026-07-17 pacing pass) ============
  # --- .120 Etiquette for Otherworlders (chapter 1)
  ova_hero.120.t: "Etiquette for Otherworlders"
  ova_hero.120.d: "The palace assigns Victoria a protocol tutor who has trained three generations of princesses and clearly considers one otherworlder a manageable challenge. Victoria learns seven different curtseys, the proper fork for river eel, and exactly how far one bows to a bishop. In return, entirely by accident, she teaches two junior maids a clapping game from her old school. Four days later, the entire east wing is playing it."
  ova_hero.120.f: "Seven curtseys take Victoria a month to learn. One children’s game conquers the palace in four days."
  ova_hero.120.a: "Learn the forms properly."
  ova_hero.120.b: "The maids' version of the lessons is better."
  # --- .121 Letters to the Hall (chapter 1)
  ova_hero.121.t: "Letters to the Hall"
  ova_hero.121.d: "The Champion Hall opens its patronage office and immediately receives sacks of letters. A village wants its bridge blessed. A grandmother is certain her goat is cursed. Seventeen people propose marriage. One boy has drawn Victoria’s sword incorrectly and requests the proper measurements. The clerks suggest sending form replies. Victoria remembers what it feels like to write a letter and desperately hope someone reads it. She refuses."
  ova_hero.121.f: "Seventeen proposals, one suspicious goat, and apparently every letter is getting a real answer."
  ova_hero.121.a: "Answer every letter, however long it takes."
  ova_hero.121.b: "The clerks may draft. She signs."
  # --- .122 The Borrowed Masters (chapter 3)
  ova_hero.122.t: "The Borrowed Masters"
  ova_hero.122.d: "The training proposal is still unsigned, so Victoria starts borrowing whatever instruction she can find. She trains with the palace guard at dawn. Within two weeks, she can disarm their best man in four exchanges. She apologizes afterward, which somehow makes his humiliation worse. Then she borrows the Academy’s advanced manuals and discovers she has outgrown those too. Her old drill-mistress watches all of this, says nothing, and underlines the same line in the funding request again."
  ova_hero.122.f: "The palace guard is excellent at guarding a palace. Unfortunately, Victoria needs someone who can still beat her."
  ova_hero.122.a: "Keep drilling anyway. Habits matter."
  ova_hero.122.b: "Apologize to the guardsman again."
  # --- .123 A Duel She Did Not Win (chapter 3)
  ova_hero.123.t: "A Duel She Did Not Win"
  ova_hero.123.d: "A famous knight-errant passes through the capital, and the court immediately arranges a friendly duel. He is twice Victoria’s age and has spent thirty years paying for lessons she never had. He wins. Politely. In front of everyone. Victoria shakes his hand, asks three very specific questions about the third exchange, and walks home instead of taking the carriage."
  ova_hero.123.f: "For the first time, talent loses to thirty years of practice. The lesson is irritatingly clear."
  ova_hero.123.a: "Ask him for his old master's name."
  ova_hero.123.b: "Smile for the court. Fume later."
  # --- .124 The Chapel of Receipts (chapter 5)
  ova_hero.124.t: "The Chapel of Receipts"
  ova_hero.124.d: "The quartermaster’s numbers eventually lead Victoria to a chapter-house behind the cathedral. A young clerk proudly shows her the filing system: indulgences by regiment, blessings by season, summonings by crown, every drawer neat and labeled. He has never seen the front. Before she leaves, he shyly asks whether the war is really as glorious as the sermons say."
  ova_hero.124.f: "Victoria has found the room where wounded soldiers become rows of tidy numbers."
  ova_hero.124.a: "Tell him the truth about the front."
  ova_hero.124.b: "Let him keep his sermons."
  # --- .125 Lessons on the Ridge (chapter 6)
  ova_hero.125.t: "Lessons on the Ridge"
  ova_hero.125.d: "The winged girl holds a sword like someone forced to garden with it. Victoria endures this for several meetings before finally giving up. On the ridge, she corrects the grip, adjusts the stance, and teaches the first guard she learned at the Academy. In exchange, the winged girl scratches three letters of her script into the dirt with a feather. Victoria’s attempt to copy them is terrible. Her friend laughs for nearly a minute."
  ova_hero.125.f: "Victoria’s old drill-mistress would faint at this lesson. Then she would wake up and correct the footwork."
  ova_hero.125.a: "One more guard, then the letters again."
  # --- .126 The Lector's Price (chapter 7)
  ova_hero.126.t: "The Lector's Price"
  ova_hero.126.d: "Finding someone who can read the dead script takes three days of asking questions in all the wrong bookshops. Eventually Victoria is sent above a wine merchant to a defrocked lector who reads four ancient languages and distrusts anyone who knows that. He studies the rubbings, studies Victoria, then closes the curtains. He accepts her money. His real price is different: do not reveal his name until he is safely dead."
  ova_hero.126.f: "People who can read forbidden history tend to learn why the historians stopped writing it."
  ova_hero.126.a: "Pay him, and promise."
